<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>귀환 — 이세계 표류기</title>
<style>
  :root { --bg:#0d0d1a; --panel:#16162a; --line:#2a2a4a; --fg:#dcd9f5; --dim:#8481ad; --acc:#b9a4ff; --bad:#ff7d7d; --warn:#ffd27d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.65 "Malgun Gothic",ui-monospace,monospace; }
  #app { max-width:680px; margin:0 auto; padding:16px; }
  h1 { font-size:14px; letter-spacing:.2em; color:var(--dim); margin:0 0 12px; font-weight:normal; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:14px 16px; margin-bottom:12px; }
  .stats { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; text-align:center; }
  .stat small { display:block; color:var(--dim); font-size:12px; }
  .stat { position:relative; }
  .stat b { font-size:20px; }
  .low b { color:var(--bad); }
  .diff { position:absolute; left:0; right:0; top:-2px; font-size:12px; font-style:normal; animation:rise 1.4s ease-out forwards; pointer-events:none; }
  .up .diff { color:#8fe3a0; }
  .down .diff { color:var(--bad); }
  .up b, .down b { animation:pulse .6s ease-out; }
  @keyframes rise { from { opacity:1; transform:translateY(0); } to { opacity:0; transform:translateY(-14px); } }
  @keyframes pulse { 40% { transform:scale(1.25); } }
  .people { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .chip { border:1px solid var(--line); border-radius:12px; padding:1px 10px; font-size:13px; color:var(--dim); }
  .chip.hero { color:var(--acc); border-color:var(--acc); }
  .chip.sick { color:var(--warn); border-color:var(--warn); }
  h2 { margin:0 0 6px; font-size:18px; color:var(--acc); }
  p { margin:0 0 10px; }
  button { display:block; width:100%; text-align:left; background:transparent; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:10px 14px; margin-top:8px; font:inherit; cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--acc); background:#1d1d38; }
  button:disabled { opacity:.35; cursor:not-allowed; }
  button.on { border-color:var(--acc); color:var(--acc); }
  .tag { font-size:12px; color:var(--warn); margin-left:6px; }
  .cost { font-size:12px; color:var(--dim); margin-left:6px; }
  .delta { color:var(--warn); font-size:14px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .row button { margin-top:0; }
  .dim { color:var(--dim); font-size:13px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="game.js"></script>
<script src="inventory-manager.js"></script>
<script src="event-manager.js"></script>
<script>
let S = newState();
let view = 'intro', result = null, night = null;
const $app = document.getElementById('app');
const esc = (t) => String(t).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

// 직전 화면에 표시한 스탯 값. 새로 그릴 때 비교해 증감을 표시한다.
let shown = null;

function statCell(k) {
  const def = STATS[k];
  const v = S[k];
  const diff = shown ? v - shown[k] : 0;
  const cls = [def.low && v <= def.low(S) ? 'low' : '', diff > 0 ? 'up' : diff < 0 ? 'down' : ''].join(' ');
  const badge = diff ? `<i class="diff">${diff > 0 ? '+' : ''}${diff}</i>` : '';
  return `<div class="stat ${cls}"><small>${def.label}</small><b>${v}${def.max ? '/' + def.max : ''}</b>${badge}</div>`;
}

function header() {
  const html = `
  <h1>귀환 · ${S.day}일차 / ${MAX_DAY}</h1>
  <div class="panel">
    <div class="stats">${STAT_KEYS.map(statCell).join('')}</div>
    <div class="people">${S.people.map((p) =>
      `<span class="chip ${p.sick ? 'sick' : ''} ${p.role === 'hero' ? 'hero' : ''}">${p.role === 'hero' ? '★ ' : ''}${esc(p.name)} ${p.role === 'hero' ? '' : ' · ' + ROLES[p.role]}${p.sick ? ' (병)' : ''}</span>`).join('')}</div>
    <div class="dim" style="margin-top:8px">소지품: ${Inventory.summary(S) ? esc(Inventory.summary(S)) : '없음'}</div>
  </div>`;
  shown = Object.fromEntries(STAT_KEYS.map((k) => [k, S[k]]));
  return html;
}

function render() {
  if (S.over) return renderEnd();
  if (view === 'intro') {
    $app.innerHTML = `<h1>귀환 · 이세계 표류기</h1><div class="panel">${INTRO.map((l) => `<p>${esc(l)}</p>`).join('')}
      <button data-a="begin" style="margin-top:14px;border-color:var(--acc)">1일차를 시작한다 →</button></div>`;
    return;
  }
  let html = header();
  if (view === 'plan') {
    const keep = S.ration; S.ration = 'full'; const nFull = rationNeed(S); S.ration = 'half'; const nHalf = rationNeed(S); S.ration = keep;
    html += `<div class="panel">
      <h2>오늘의 계획</h2>
      ${MILESTONES[S.day] ? `<p>${esc(MILESTONES[S.day])}</p>` : ''}
      <p class="dim">밤마다 결계 유지에 마력석 1이 든다. 귀환 의식은 마력석 1을 더 쓰고 의식을 올린다(대학원생은 2).<br>의식이 ${RESCUE_SIGNAL}에 도달하면 균열이 열려 집으로 돌아간다.</p>
      <div class="row">
        <button class="${S.ration === 'full' ? 'on' : ''}" data-a="ration-full">정량 배급<span class="cost">식량 ${nFull}</span></button>
        <button class="${S.ration === 'half' ? 'on' : ''}" data-a="ration-half">절반 배급<span class="cost">식량 ${nHalf} · 사기 회복 없음</span></button>
      </div>
      <button class="${S.forage ? 'on' : ''}" data-a="forage">수색 파견 ${S.forage ? 'ON' : 'OFF'}<span class="cost">식량 +2 · 마력석 +1 · 20% 확률로 병자 발생</span></button>
      <button class="${S.broadcast ? 'on' : ''}" data-a="broadcast">귀환 의식 ${S.broadcast ? 'ON' : 'OFF'}<span class="cost">마력석 +1 소모 · 의식 +1</span></button>
      <button data-a="start" style="margin-top:14px;border-color:var(--acc)">하루를 시작한다 →</button>
    </div>`;
  } else if (view === 'event') {
    html += EventManager.render(S, esc);
  } else if (view === 'result') {
    html += `<div class="panel"><p>${esc(result.text)}</p>` +
      (result.delta.length ? `<p class="delta">${result.delta.join(' · ')}</p>` : '') +
      `<button data-a="night">밤이 된다 →</button></div>`;
  } else if (view === 'night') {
    html += `<div class="panel"><h2>밤</h2>` +
      night.notes.map((n) => `<p>${esc(n)}</p>`).join('') +
      (night.delta.length ? `<p class="delta">${night.delta.join(' · ')}</p>` : '') +
      `<button data-a="next">${S.over ? '결과 보기' : '다음 날 →'}</button></div>`;
  }
  $app.innerHTML = html;
}

function renderEnd() {
  const [title, text] = ENDINGS[S.over];
  $app.innerHTML = header() + `<div class="panel"><h2>${title}</h2><p>${text}</p>
    <p class="dim">동료 ${S.people.length - (heroAlive(S) ? 1 : 0)}명 · ${S.day}일차 · 의식 ${S.signal}/${RESCUE_SIGNAL}</p>
    <button data-a="restart">다시 시작</button></div>`;
}

$app.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b || b.disabled) return;
  const a = b.dataset.a;
  if (a === 'begin') view = 'plan';
  else if (a === 'ration-full') S.ration = 'full';
  else if (a === 'ration-half') S.ration = 'half';
  else if (a === 'forage') S.forage = !S.forage;
  else if (a === 'broadcast') S.broadcast = !S.broadcast;
  else if (a === 'start') { EventManager.load(S); view = 'event'; }
  else if (a === 'choice') { result = EventManager.choose(S, +b.dataset.i); view = 'result'; }
  else if (a === 'night') { night = endDay(S); view = 'night'; }
  else if (a === 'next') { view = 'plan'; }
  else if (a === 'restart') { S = newState(); shown = null; view = 'intro'; }
  render();
});
render();
</script>
</body>
</html>
