<script>/* js/incidents/herb_shortage.js */
// 첫 지역 사건 「약재 부족」 (herb_shortage) — 시작마을.md 8절. 공통 사건 상태(sim/incidents.js)의 첫 사례.
// 결정: D8 첫 지역 사건 · D9 노파의 상처 · D13 노파는 managed → unsteady → bedridden, 병상이 끝이고 죽음 없음, 회복 가능
//       D14 방치하면 리아가 위험한 곳까지 원정 채집 — 다칠 수 있어도 죽지 않는다 (파생 사건의 내용은 [미확정], 범위와 일정까지만)
//       D15 해결 방식 7가지. 수치·일수는 RULES.herbShortage [임시], 화면 문장은 [임시]
// 세계 값: herb_supply = 약초집 비축(노파 + 리아) + 시장의 약초 / forest_danger = W.regions.forest.threat
//          tutor_state = 노파의 상처 단계(npc/condition.js) / lia_range = W.npcs.lia.flags.range (near · edge · inner → 일정)
const HerbShortage = (() => {
  const ID = 'herb_shortage';
  const R = () => RULES.herbShortage;
  const J = (w, t) => w + Text.josa(w, t);
  const K = (t) => ({ t, cls: 'know' });
  const day = (W) => Time.day(W.time.t);
  const tutor = (W) => W.npcs.herbalist;
  const lia = (W) => W.npcs.lia;
  const alive = (n) => !!(n && n.alive);
  const sum = (o) => Object.values(o || {}).reduce((a, b) => a + b, 0);
  const STARTABLE = ['DISCOVERED', 'IGNORED', 'FAILED', 'ESCALATED'];

  // ---------- 세계 값 ----------
  function supply(W) {
    const m = W.economy.markets.village_square;
    const stock = (alive(tutor(W)) ? tutor(W).inventory.herb || 0 : 0) + (alive(lia(W)) ? lia(W).inventory.herb || 0 : 0);
    return Math.min(100, stock * R().perHerb + ((m && m.stock.herb) || 0) * R().perMarketHerb);
  }
  const danger = (W) => W.regions.forest.threat;

  // 리아의 채집 범위 → 일정. 안쪽(원정)에서는 다칠 수 있어도 죽지 않는다 [D14]
  function applyRange(l) {
    const range = l.flags.range || 'edge';
    l.schedule = JSON.parse(JSON.stringify(SCHEDULES[R().liaSchedule[range]]));
    if (range === 'inner') l.flags.noDeath = true;
    else delete l.flags.noDeath;
  }
  function setRange(S, range) {
    const l = lia(S.W);
    if (!alive(l) || (l.flags.range || 'edge') === range) return;
    l.flags.range = range;
    applyRange(l);
    Behavior.interrupt(l);
  }

  // 리아와의 첫 만남에서 위협하거나 공격했다면 리아를 거치는 길은 닫힌다 (8-10절)
  const liaClosed = (W) => (W.player.life.choices || []).some((c) => c.id === 'lia_first_meeting' && ['threatened', 'attacked'].includes(c.outcome));

  // ---------- 상태가 바뀔 때 ----------
  const RESPONSE = { by_gather: 'gather', by_lia: 'with_lia', by_buy: 'buy', by_ask: 'ask', by_order: 'request', by_guild: 'request', by_learn: 'learn' };

  function open(S, st) {
    Object.assign(st.data, { deadline: day(S.W) + R().deadlineDays, needed: R().needed, contrib: {}, held: {}, asked: {}, orders: [], guild: null, failures: [], learned: false, after: 0 });
    Incidents.set(S, ID, 'AVAILABLE', 'supply');
    setRange(S, 'near');
    // 노파가 약초가 모자라다고 말하기 시작한다 (플레이어에게는 알리지 않는다. 마을에 소문으로 퍼진다)
    if (alive(tutor(S.W))) Rumor.create(S, ['herbalist'], { type: 'herb_scarce', place: 'village_herbhouse', importance: 35 });
  }

  // 해결 방식을 시작한다 → IN_PROGRESS. 처음 대한 방식은 중요한 선택으로 남는다 [D5]
  function start(S, st, method) {
    const W = S.W;
    if (st.state === 'IN_PROGRESS') { LifeLog.choose(S, 'herb_shortage_response', RESPONSE[method]); return true; }
    if (!STARTABLE.includes(st.state) || !Incidents.known(st)) return false;
    const from = st.state;
    // 악화된 뒤에 시작하면 더 많이 필요하다 (8-4절)
    if (from === 'ESCALATED') st.data.needed = Math.ceil(st.data.needed * (1 + (R().escalatedExtra[Condition.stageOf(tutor(W))] || 0)));
    // 외면했다가 다시 도우면 관계가 조금 돌아온다. 악화 단계는 그대로 둔다
    if (from === 'IGNORED') ['lia', 'herbalist'].forEach((id) => { if (alive(W.npcs[id])) Rel.change(S, id, 'player', { trust: 3 }, 'came_back', true); });
    st.data.contrib = {};
    Incidents.set(S, ID, 'IN_PROGRESS', method);
    LifeLog.choose(S, 'herb_shortage_response', RESPONSE[method]);
    return true;
  }

  // 시도했지만 아무것도 얻지 못했다 (짐승에 쫓김 / 돈이 모자람 / 부탁이 거절됨)
  function attemptFailed(S, st, reason) {
    st.data.failures.push(reason);
    if (STARTABLE.includes(st.state) && Incidents.known(st)) {
      Incidents.set(S, ID, 'IN_PROGRESS', 'tried:' + reason);
      st.data.contrib = st.data.contrib || {};
    }
    LifeLog.choose(S, 'herb_shortage_response', 'failed');
  }

  // 약재를 보탠다. 사건이 끝난 뒤(EXPIRED)에는 마을의 상시 상태를 조금씩 고친다
  function contribute(S, st, method, n) {
    if (n <= 0) return;
    const W = S.W;
    if (st.state === 'EXPIRED') {
      st.data.after += n;
      if (st.data.after >= st.data.needed) { st.data.after = 0; Condition.shift(S, tutor(W), -1); }
      return;
    }
    if (st.state === 'RESOLVED' || st.state === 'LOCKED') return;
    if (st.state !== 'IN_PROGRESS' && !start(S, st, method)) return;
    st.data.contrib[method] = (st.data.contrib[method] || 0) + n;
    if (sum(st.data.contrib) >= st.data.needed && day(W) <= st.data.deadline) resolve(S, st);
  }

  function resolve(S, st) {
    const W = S.W;
    const by = Object.entries(st.data.contrib).filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1]).map(([m]) => m);
    st.resolvedBy = by;
    Incidents.set(S, ID, 'RESOLVED', by.join('+'));
    Condition.shift(S, tutor(W), -1); // 한 단계 돌아온다. 병상이었다면 다음 날 또 한 단계 (daily)
    st.data.recoveredAt = W.time.t;
    setRange(S, danger(W) >= R().dangerNear ? 'near' : 'edge');
    W.worldFlags.herbScarce = false;
    traces(S, by[0]);
    if (R().helpedRumor.includes(by[0])) {
      const holders = ['herbalist', 'lia'].filter((id) => alive(W.npcs[id]));
      if (holders.length) Rumor.create(S, holders, { type: 'herb_helped', subject: 'player', target: 'herbalist', importance: 55 });
    }
    W.worldFlags.feed.push('', '약초집의 약초 통이 다시 채워져 간다.', K('……노파의 숨이 조금 편해진 것 같다.'));
  }

  // 해결 방식별 흔적 (8-9절)
  function traces(S, method) {
    const W = S.W;
    const rel = (id, d) => { if (alive(W.npcs[id])) Rel.change(S, id, 'player', d, 'herb:' + method); };
    if (method === 'by_gather') { rel('herbalist', { trust: 10, respect: 6 }); rel('lia', { trust: 6, respect: 4 }); }
    else if (method === 'by_lia') { rel('lia', { trust: 12, affection: 6, familiarity: 8 }); rel('herbalist', { trust: 6 }); }
    else if (method === 'by_buy') { rel('herbalist', { trust: 4 }); rel('lia', { trust: 2 }); rel('merchant', { trust: 5, familiarity: 4 }); }
    else if (method === 'by_ask') Object.keys(W.events.states[ID].data.asked).forEach((id) => rel(id, { trust: 4, familiarity: 4 }));
    else if (method === 'by_order') rel('peddler', { trust: 8, familiarity: 6 });
    else if (method === 'by_learn') { rel('herbalist', { trust: 14, respect: 10, affection: 4 }); rel('lia', { respect: 6 }); }
  }

  function fail(S, st, reason) {
    const W = S.W;
    st.data.failedBy = reason;
    // 기한 안에 오지 못한 주문: 치른 돈의 절반을 돌려받는다
    st.data.orders.filter((o) => !o.done).forEach((o) => { o.done = true; W.player.money += Math.floor(o.paid / 2); LifeLog.money(S, Math.floor(o.paid / 2), 'refund', { with: 'peddler' }); });
    Incidents.set(S, ID, 'FAILED', reason);
    LifeLog.choose(S, 'herb_shortage_response', 'failed');
  }

  function ignore(S, st, why, byId) {
    const W = S.W;
    Incidents.set(S, ID, 'IGNORED', why);
    if (byId && alive(W.npcs[byId])) Rel.change(S, byId, 'player', { trust: -4, affection: -2 }, 'let_down');
    setRange(S, 'inner'); // 리아가 혼자 더 먼 곳으로 채집을 나간다
    LifeLog.choose(S, 'herb_shortage_response', 'ignored');
  }

  function escalate(S, st) {
    const W = S.W;
    Incidents.set(S, ID, 'ESCALATED', 'supply');
    Condition.shift(S, tutor(W), 1);
    st.data.worsenedAt = W.time.t;
    setRange(S, 'inner');
    W.worldFlags.herbScarce = true;
    const holders = ['herbalist', 'lia', 'merchant'].filter((id) => alive(W.npcs[id]));
    if (holders.length) Rumor.create(S, holders, { type: 'herb_scarce', place: 'village_herbhouse', importance: 50 });
  }

  function expire(S, st) {
    const W = S.W;
    Incidents.set(S, ID, 'EXPIRED', 'deadline');
    // 그때까지 모자랐다면 약재 부족이 마을의 상시 상태로 굳는다: 값은 높고, 노파는 지금 단계에 머문다.
    // 리아는 가장자리 이하에서만 캔다 (원정은 끝난다)
    W.worldFlags.herbScarce = supply(W) <= R().supplyOpen;
    setRange(S, danger(W) >= R().dangerNear ? 'near' : 'edge');
  }

  // ---------- 하루마다 (새벽 6시) ----------
  function daily(S, st) {
    const W = S.W;
    st.data.supply = supply(W);
    // 사건과 상관없이 세계는 흐른다: 숲이 위험해지면 리아는 가까운 곳에서만 캔다 (공급이 줄어든다)
    if (['LOCKED', 'RESOLVED', 'EXPIRED'].includes(st.state)) setRange(S, danger(W) >= R().dangerNear ? 'near' : 'edge');
    if (st.state === 'LOCKED') {
      const arr = Incidents.arrivalDay(W);
      if (arr != null && day(W) >= arr + R().openAfter && danger(W) >= R().dangerOpen && st.data.supply <= R().supplyOpen && Incidents.canOpen(S, ID)) open(S, st);
      return;
    }
    if (st.state === 'RESOLVED') {
      if (Condition.stageOf(tutor(W)) !== 'managed' && day(W) > Time.day(st.data.recoveredAt)) { Condition.shift(S, tutor(W), -1); st.data.recoveredAt = W.time.t; }
      return;
    }
    if (st.state === 'EXPIRED') return;
    if (day(W) > st.data.deadline) {
      if (st.state === 'IN_PROGRESS') fail(S, st, st.data.failures.slice(-1)[0] || 'deadline');
      else expire(S, st);
      return;
    }
    if (st.state === 'DISCOVERED' && Incidents.daysIn(W, st) >= R().ignoreAfter) ignore(S, st, 'silence');
    if (['IGNORED', 'AVAILABLE', 'DISCOVERED'].includes(st.state) && st.data.supply <= R().supplyEscalate && Incidents.daysIn(W, st) >= R().escalateAfter) escalate(S, st);
    // 악화된 뒤에도 약재가 모자란 채면 사흘마다 한 단계씩 나빠진다 (병상에서 멈춘다 [D13]).
    // 리아의 원정으로 공급이 돌아와 있으면 더 나빠지지 않는다 [임시 판단]
    else if (st.state === 'ESCALATED' && day(W) - Time.day(st.data.worsenedAt) >= R().worsenEvery && st.data.supply <= R().supplyOpen
      && Condition.shift(S, tutor(W), 1)) st.data.worsenedAt = W.time.t;
  }

  // ---------- 매시간: 도착하는 약재, 플레이어가 알게 되는 길 ----------
  function hourly(S, st) {
    const W = S.W;
    if (st.state === 'LOCKED') return;
    arrivals(S, st);
    if (Incidents.known(st) || Incidents.done(st)) return;
    const me = W.player, here = me.loc, h = Time.hour(W.time.t);
    const T = tutor(W), L = lia(W);
    const atHerb = here === 'village_herbhouse';
    if (atHerb && Npc.present(W, T) && (Player.bleeding(W) || me.surv.injuries.length)) return discover(S, 'via_injury');
    if (atHerb && Npc.present(W, T) && Rel.get(W, 'herbalist', 'player').trust >= 30) return discover(S, 'via_tutor');
    if ((atHerb || here === 'edge') && Npc.present(W, L) && Rel.get(W, 'lia', 'player').trust >= 40 && !liaClosed(W)) return discover(S, 'via_lia');
    const gathering = (here === 'village_square' && h >= 18 && h < 20) || here === 'village_inn';
    if (gathering && heardScarce(W) >= 2) return discover(S, 'via_rumor');
    return null;
  }
  // 약재가 모자라다는 소문을 아는 마을 사람 수
  const heardScarce = (W) => Object.values(W.npcs).filter((n) => n.alive && n.role !== 'visitor'
    && Object.keys(n.knowledge.rumors).some((id) => W.rumors[id] && W.rumors[id].type === 'herb_scarce')).length;

  const FOUND = {
    via_lia: ['리아가 바구니 속 약초를 세고 또 센다. 한 줄기도 허투루 쓰지 않으려는 손길이다.'],
    via_tutor: ['노파가 약초 통 뚜껑을 열었다가 닫는다. 통 바닥이 보인다.'],
    via_rumor: ['사람들 사이에서 같은 이야기가 오가는 것 같다. 다들 약초집 쪽을 흘끔거린다.'],
    via_witness: ['늘 풀이 우거졌을 자리가 듬성듬성 비어 있다.', '흙 위에 큰 짐승의 발자국이 찍혀 있다.'],
    via_market: ['천막 가게의 약초 칸이 거의 비어 있다. 상인이 빈 칸을 가리키며 고개를 젓는다.'],
    via_work: ['일하는 내내, 다들 약초를 아끼는 손길이 눈에 들어온다.'],
    via_injury: ['노파가 내 상처를 보더니 약초 통을 뒤적인다. 남은 것이 거의 없다.'],
  };
  function discover(S, via) {
    const ok = Incidents.discover(S, ID, via, ['', ...FOUND[via], K('……이 마을은 약초가 모자란다.')]);
    if (ok) {
      if (!S.P.knowledge.herb_short) S.P.knowledge.herb_short = S.W.time.t;
      Clues.gain(S, 'herb_short', 'incident:' + ID);
    }
    return ok;
  }

  // 부탁한 사람·행상·길드가 가져온 약재가 약초집에 닿는다
  function arrivals(S, st) {
    const W = S.W;
    const T = tutor(W);
    const bring = (method, n) => { if (alive(T)) T.inventory.herb = (T.inventory.herb || 0) + n; contribute(S, st, method, n); };
    Object.entries(st.data.asked || {}).forEach(([id, a]) => {
      if (a.done || W.time.t < a.at) return;
      a.done = true;
      if (alive(W.npcs[id])) bring('by_ask', a.herbs);
    });
    if (st.data.guild && !st.data.guild.done && W.time.t >= st.data.guild.at) { st.data.guild.done = true; bring('by_guild', st.data.guild.herbs); }
  }
  // 행상이 다음에 마을에 올 때 주문한 약재를 가져온다
  Bus.on('NPC_MOVED', (S, e) => {
    if (e.npcId !== 'peddler' || e.to !== 'village_square') return;
    const st = S.W.events.states && S.W.events.states[ID];
    if (!st || !st.data.orders) return;
    st.data.orders.filter((o) => !o.done && S.W.time.t - o.t >= 360).forEach((o) => {
      o.done = true;
      const T = tutor(S.W);
      if (alive(T)) T.inventory.herb = (T.inventory.herb || 0) + o.herbs;
      contribute(S, st, 'by_order', o.herbs);
    });
  });

  // ---------- 다른 시스템에서 알려 오는 것 ----------
  function notice(S, st, kind, data) {
    if (st.state === 'LOCKED' || Incidents.done(st)) return;
    if (kind === 'market') {
      // 알고서 약초를 사면 "사서 구하기"를 시작한 것이다 (약초집에 건넬 때 쌓인다)
      if (data.item === 'herb' && data.bought) { st.data.held.by_buy = (st.data.held.by_buy || 0) + 1; if (Incidents.known(st)) start(S, st, 'by_buy'); }
      if (data.item === 'herb' && data.noMoney && Incidents.known(st)) attemptFailed(S, st, 'no_money');
      if (!Incidents.known(st)) discover(S, 'via_market');
    }
    if (kind === 'work' && ['village_herbhouse', 'village_field', 'village_inn'].includes(data.at) && !Incidents.known(st)) discover(S, 'via_work');
    if (kind === 'rumor' && data.type === 'herb_scarce' && data.understanding >= 0.5 && !Incidents.known(st)) discover(S, 'via_rumor');
  }
  Bus.on('PLAYER_WORKED', (S, e) => Incidents.notice(S, 'work', { job: e.job, at: RULES.jobs[e.job] ? RULES.jobs[e.job].at : null }));

  // 채집지·밭 가장자리를 살펴본다 (장소 행동, village.js) — 약재가 모자란 흔적을 직접 본다
  function look(S, where) {
    const st = Incidents.get(S.W, ID);
    const base = where === 'edge'
      ? ['풀숲을 헤치며 채집지를 살펴본다.']
      : ['밭 가장자리 풀숲을 살펴본다.'];
    if (st.state === 'LOCKED' || Incidents.done(st)) return [...base, where === 'edge' ? '쓴 냄새가 나는 풀이 군데군데 자라 있다.' : '이랑 사이에 잡초가 듬성하다.'];
    if (!Incidents.known(st)) { discover(S, 'via_witness'); return base; }
    return [...base, '풀이 뜯겨 나간 자리가 여전하다.'];
  }

  // ---------- 선택지 (해결 방식) ----------
  function options(S, st, pass) {
    const W = S.W;
    const me = W.player;
    if (!Incidents.known(st) || st.state === 'RESOLVED') return [];
    const opts = [];
    const T = tutor(W), L = lia(W);
    const here = me.loc;
    const live = !Incidents.done(st);
    const add = (label, run, hint) => opts.push({ label, hint: hint || null, life: true, run });

    // 직접 채집 (혼자, 숲 가장자리)
    if (live && here === 'edge' && !Time.dark(W.time.t) && !Player.bleeding(W) && me.surv.fatigue < 85) add('약초를 찾아 풀숲을 뒤진다', () => gather(S, st, pass));
    // 리아와 함께 채집
    if (live && Npc.present(W, L) && L.currentAction && L.currentAction.type === 'gather' && !liaClosed(W)
      && Rel.get(W, 'lia', 'player').trust >= R().withLia.minTrust) add('리아의 채집을 거든다', () => withLia(S, st, pass));
    // 약초를 약초집에 건넨다 (산 것·캔 것)
    if (here === 'village_herbhouse' && (me.inv.herb || 0) > 0 && (Npc.present(W, T) || Npc.present(W, L))) add('약초를 약초집에 건넨다', () => deliver(S, st, pass));
    // 다른 사람에게 부탁한다
    if (live) R().ask.targets.forEach((id) => {
      const n = W.npcs[id];
      if (!Npc.present(W, n) || st.data.asked[id] || !Memory.has(n, 'player', 'met')) return;
      add(`${Narrative.who(S, n)}에게 약초를 구해 달라고 부탁한다`, () => ask(S, st, n, pass));
    });
    // 행상에게 주문한다
    const P_ = W.npcs.peddler;
    if (live && Npc.present(W, P_) && Places.regionOf(here) === 'village') add('행상에게 약초를 주문한다', () => order(S, st, pass), `동전 ${R().order.price}닢`);
    // 길드 연락소에 의뢰한다 (연락소가 열린 뒤)
    if (live && here === 'village_guild' && W.worldFlags.guildOpen && !st.data.guild) add('약초 채집 의뢰를 맡긴다', () => guild(S, st, pass), `동전 ${R().guild.fee}닢`);
    // 약재를 덜 쓰는 법을 배운다
    if (live && here === 'village_herbhouse' && Npc.present(W, T) && !st.data.learned && S.P.knowledge.herb_heals
      && Rel.get(W, 'herbalist', 'player').trust >= R().learn.minTrust) add('약초를 아껴 쓰는 법을 배운다', () => learn(S, st, pass));
    // 도와 달라는 눈치를 모른 척한다 (명시적으로 외면)
    if (st.state === 'DISCOVERED' && here === 'village_herbhouse' && (Npc.present(W, T) || Npc.present(W, L))) {
      add('도와 달라는 눈치를 모른 척한다', () => {
        ignore(S, st, 'refused', Npc.present(W, L) ? 'lia' : 'herbalist');
        return ['눈을 피한다. 약초 통 쪽은 보지 않는다.', '방 안에 짧은 침묵이 흐른다.', ...pass(5)];
      });
    }
    return opts;
  }

  function gather(S, st, pass) {
    const W = S.W;
    LifeLog.act(S, 'explore', { min: R().gather.min });
    const lines = ['허리를 굽혀 풀숲을 헤친다. 쓴 냄새를 따라간다.', ...pass(R().gather.min, { work: 0.3 })];
    // 숲이 위험할수록 짐승과 마주칠 수 있다
    if (Rng.chance(W, danger(W) * R().gather.chase)) {
      Player.hurt(S, 2, '채집하다 짐승에게 쫓겼다', 'beast');
      if (!S.P.knowledge.edge_beasts) S.P.knowledge.edge_beasts = W.time.t;
      attemptFailed(S, st, 'chased');
      return [...lines, '', '덤불 너머에서 낮은 숨소리가 들린다.', '돌아볼 새도 없이 뛴다. 가시덤불에 팔이 긁힌다.', '', '……빈손이다.'];
    }
    const n = R().gather.base + (S.P.knowledge.herb_heals ? R().gather.knowBonus : 0) + (Rng.chance(W, 0.5) ? 1 : 0);
    for (let i = 0; i < n; i++) Player.give(W.player, 'herb');
    st.data.held.by_gather = (st.data.held.by_gather || 0) + n;
    start(S, st, 'by_gather');
    return [...lines, '', `쓴 냄새가 나는 풀을 ${n}줌 모았다.`];
  }

  function withLia(S, st, pass) {
    const W = S.W;
    const L = lia(W);
    const n = R().withLia.herbs + (S.P.knowledge.herb_heals ? 1 : 0);
    LifeLog.act(S, 'help', { min: R().withLia.min });
    const lines = ['리아 곁에 쪼그려 앉는다. 그녀가 어떤 풀을 뜯는지 보고 따라 한다.', '그녀가 가끔 손을 뻗어 내 손의 풀을 골라낸다.',
      ...pass(R().withLia.min, { work: 0.3 })];
    L.inventory.herb = (L.inventory.herb || 0) + n;
    Memory.add(S, L, { type: 'worked_with', subject: 'player', detail: 'gather' });
    Rel.change(S, 'lia', 'player', { trust: 3, familiarity: 4 }, 'gathered_together', true);
    contribute(S, st, 'by_lia', n);
    return [...lines, '', '바구니가 제법 무거워졌다. 리아가 짧게 고개를 끄덕인다.'];
  }

  function deliver(S, st, pass) {
    const W = S.W;
    const me = W.player;
    const T = tutor(W), L = lia(W);
    const to = Npc.present(W, T) ? T : L;
    const n = me.inv.herb || 0;
    for (let i = 0; i < n; i++) Player.take(me, 'herb');
    to.inventory.herb = (to.inventory.herb || 0) + n;
    LifeLog.act(S, 'help');
    // 어디서 온 약초인가: 산 것, 캔 것 (나머지는 내가 숲에서 가져온 것)
    let left = n;
    ['by_buy', 'by_gather'].forEach((m) => {
      const k = Math.min(left, st.data.held && st.data.held[m] || 0);
      if (!k) return;
      st.data.held[m] -= k;
      left -= k;
      contribute(S, st, m, k);
    });
    if (left) contribute(S, st, 'by_gather', left);
    Rel.change(S, to.id, 'player', { trust: 2, gratitude: 4 }, 'brought_herbs', true);
    const who = Narrative.who(S, to);
    return [`가져온 풀을 ${who}에게 내민다.`, `${J(who, '이가')} 한 줌씩 들어 냄새를 맡아 보고, 약초 통에 옮겨 담는다.`, ...pass(10)];
  }

  function ask(S, st, n, pass) {
    const W = S.W;
    const who = Narrative.who(S, n);
    const lines = ['쓴 풀을 흉내 내어 보이고, 약초집 쪽을 가리킨다.'];
    if (Rel.get(W, n.id, 'player').trust < R().ask.minTrust) {
      Rel.change(S, n.id, 'player', { trust: -1 }, 'asked_too_much', true);
      attemptFailed(S, st, 'refused');
      st.data.asked[n.id] = { refused: true, done: true };
      return [...lines, `${J(who, '은는')} 난처한 얼굴로 고개를 젓는다.`, ...pass(5)];
    }
    st.data.asked[n.id] = { at: W.time.t + R().ask.delayMin, herbs: R().ask.herbs, done: false };
    W.player.debts.push({ npc: n.id, kind: 'herbs', t: W.time.t });
    Memory.add(S, n, { type: 'asked_favor', subject: 'player', detail: 'herbs' });
    start(S, st, 'by_ask');
    return [...lines, `${J(who, '이가')} 잠시 생각하더니, 숲 쪽을 가리키며 고개를 끄덕인다.`, ...pass(10)];
  }

  function order(S, st, pass) {
    const W = S.W;
    const me = W.player;
    const price = R().order.price;
    if (me.money < price) { attemptFailed(S, st, 'no_money'); return ['주머니를 뒤져 본다. 모자라다.', ...pass(5)]; }
    me.money -= price;
    W.npcs.peddler.money += price;
    LifeLog.money(S, -price, 'order', { with: 'peddler', item: 'herb' });
    st.data.orders.push({ t: W.time.t, paid: price, herbs: R().order.herbs, done: false });
    start(S, st, 'by_order');
    return [`동전 ${price}닢을 내밀고, 쓴 풀을 흉내 내어 보인다.`, '행상이 손가락으로 날짜를 세어 보이고, 고개를 끄덕인다.', ...pass(10)];
  }

  function guild(S, st, pass) {
    const W = S.W;
    const me = W.player;
    if (me.money < R().guild.fee) { attemptFailed(S, st, 'no_money'); return ['의뢰비가 모자라다.', ...pass(5)]; }
    me.money -= R().guild.fee;
    LifeLog.money(S, -R().guild.fee, 'order', { with: 'guild', item: 'herb' });
    st.data.guild = { at: W.time.t + R().guild.delayMin, herbs: R().guild.herbs, done: false };
    start(S, st, 'by_guild');
    return ['게시판에 약초 채집 의뢰를 꽂는다.', ...pass(15)];
  }

  function learn(S, st, pass) {
    const W = S.W;
    const before = st.data.needed;
    st.data.needed = Math.ceil(before * R().learn.factor);
    st.data.learned = true;
    if (!S.P.knowledge.herb_thrift) S.P.knowledge.herb_thrift = W.time.t;
    const lines = ['노파 곁에 앉아 손을 지켜본다.', '같은 풀을 반으로 갈라 쓰고, 찌꺼기를 다시 우려낸다.', ...pass(R().learn.min)];
    // 필요량을 낮춘 만큼이 이 방식의 몫이다 (분량 대신 필요량을 줄인다)
    if (!start(S, st, 'by_learn')) return lines;
    st.data.contrib.by_learn = (st.data.contrib.by_learn || 0) + (before - st.data.needed);
    if (sum(st.data.contrib) >= st.data.needed) resolve(S, st);
    return [...lines, K('……약초를 아껴 쓰는 법을 하나 배웠다.')];
  }

  // 저장 파일을 불러온 뒤: 리아의 채집 범위에 맞춰 일정을 다시 둔다
  function restore(W) { if (W.npcs.lia && W.npcs.lia.flags.range) applyRange(W.npcs.lia); }

  Incidents.register(ID, { order: 8, daily, hourly, notice, options, restore });
  return { ID, supply, danger, setRange, look, discover: (S, via) => discover(S, via), contribute: (S, m, n) => contribute(S, Incidents.get(S.W, ID), m, n) };
})();

if (typeof module !== 'undefined') module.exports = { HerbShortage };

</script>
<script>/* js/play/lifelog.js */
// 삶의 기록 — 지시문 4의 23절 "플레이어의 삶을 하나의 스토리 변수로". 흩어진 기록을 한곳에서 읽는다: LifeLog.read(S).
// 새로 쌓는 것 (W.player.life): 돈의 흐름, 활동, 장소 방문, 일, 거처 이력, 지역 이동, 중요한 선택.
// 이미 있는 곳에서 읽어 오는 것: 지식(P), 관계(Rel·NPC 기억), 평판(플레이어에 관한 소문), 지금 거처, 직업 경향.
// 수치는 사건 조건과 엔딩 판정용이다. 플레이어에게 숫자로 보여 주지 않는다.
const LifeLog = (() => {
  const LEDGER_MAX = 300;
  const create = () => ({ activity: {}, work: {}, ledger: [], sums: {}, places: {}, lodgings: [], nights: {}, trips: [], choices: [] });
  const life = (S) => S.W.player.life || (S.W.player.life = create());

  // ---------- 쌓기 ----------
  // 활동. kind: explore(살펴보기·듣기) | work | trade | talk | help | fight | rest | travel
  function act(S, kind, o = {}) {
    const a = life(S).activity;
    const x = a[kind] || (a[kind] = { count: 0, min: 0, first: S.W.time.t, last: null });
    x.count++;
    x.min += o.min || 0;
    x.last = S.W.time.t;
  }

  // 돈의 흐름. amount: 들어오면 +, 나가면 -. kind: wage | buy | sell | rent
  function money(S, amount, kind, o = {}) {
    if (!amount) return;
    const L = life(S);
    L.ledger.push({ t: S.W.time.t, amount, kind, with: o.with || null, item: o.item || null });
    if (L.ledger.length > LEDGER_MAX) L.ledger.shift();
    const s = L.sums[kind] || (L.sums[kind] = { in: 0, out: 0, count: 0 });
    if (amount > 0) s.in += amount; else s.out -= amount;
    s.count++;
  }

  // 한 일 (품삯 일, 잠자리 값으로 한 일)
  function worked(S, job, giver, min) {
    const w = life(S).work;
    const x = w[job] || (w[job] = { count: 0, min: 0, giver, first: S.W.time.t, last: null });
    x.count++;
    x.min += min;
    x.last = S.W.time.t;
    act(S, 'work', { min });
  }

  // 중요한 선택 [결정 D5]: RULES.choices에서 important로 표시된 것만 기록한다. 같은 선택은 처음 것만 남는다
  function choose(S, id, outcome, detail) {
    const d = RULES.choices[id];
    if (!d || !d.important || !d.outcomes[outcome]) return false;
    const L = life(S);
    if (L.choices.some((c) => c.id === id)) return false;
    L.choices.push({ id, outcome, t: S.W.time.t, detail: detail || null });
    return true;
  }

  // ---------- 이벤트에서 쌓이는 것 ----------
  Bus.on('PLAYER_MOVED', (S, e) => {
    const L = life(S);
    const p = L.places[e.to] || (L.places[e.to] = { visits: 0, first: S.W.time.t, last: null });
    p.visits++;
    p.last = S.W.time.t;
    act(S, 'travel');
    const a = e.from ? Places.regionOf(e.from) : null, b = Places.regionOf(e.to);
    if (a && b && a !== b) {
      L.trips.push({ from: a, to: b, t: S.W.time.t, with: (S.W.player.companions || []).slice() });
      if (L.trips.length > 200) L.trips.shift();
    }
  });
  Bus.on('PLAYER_WORKED', (S, e) => {
    worked(S, e.job, e.giver, RULES.jobs[e.job] ? RULES.jobs[e.job].min : 0);
    money(S, e.paid, 'wage', { with: e.giver });
  });
  Bus.on('PLAYER_HELPED_NPC', (S) => act(S, 'help'));
  Bus.on('LODGING_CHANGED', (S, e) => {
    const L = life(S);
    L.lodgings.push({ id: e.lodging, via: e.via, t: S.W.time.t });
    if (L.lodgings.length > 100) L.lodgings.shift();
  });
  Bus.on('PLAYER_SLEPT', (S, e) => { const n = life(S).nights; n[e.lodging] = (n[e.lodging] || 0) + 1; });

  // ---------- 읽기 ----------
  // 즐겨 하는 일: 길을 걷는 것(수단)은 빼고, 들인 시간과 횟수로 [임시 규칙 RULES.life]
  function favorite(S) {
    const a = life(S).activity;
    const score = (k) => a[k].min + a[k].count * RULES.life.countWeight;
    const ks = Object.keys(a).filter((k) => k !== 'travel' && a[k].count > 0).sort((x, y) => score(y) - score(x));
    const total = ks.reduce((s, k) => s + a[k].count, 0);
    if (!ks.length || total < RULES.life.minActs) return null;
    return { main: ks[0], second: ks[1] && score(ks[1]) >= score(ks[0]) * RULES.life.mixedRatio ? ks[1] : null };
  }

  // 삶의 방식: 즐겨 하는 일 → 지시문 4의 7~16절 갈래 [임시 규칙]. 일이면 가장 오래 한 경향을 덧붙인다
  function style(S) {
    const f = favorite(S);
    if (!f) return null;
    const T = S.W.player.tendency || {};
    const top = Object.keys(T).sort((a, b) => T[b] - T[a])[0] || null;
    const of = (k) => RULES.life.styles[k] || null;
    return { main: of(f.main), second: f.second ? of(f.second) : null, mixed: !!(f.second && of(f.second) !== of(f.main)), tendency: top };
  }

  // 평판 [결정 D6]: 지역(마을) 단위만. 그 지역에 사는 사람이 나에 대해 들은 소문과 나를 대하는 마음
  function reputation(S) {
    const { W } = S;
    const out = {};
    Object.values(W.npcs).forEach((n) => {
      if (!n.alive || n.role === 'visitor') return; // 방문하는 사람(행상)은 그 지역의 평판에 세지 않는다
      const reg = Places.regionOf(n.location.home);
      const R = out[reg] || (out[reg] = { people: 0, heard: 0, met: 0, rumors: {}, standing: 0 });
      R.people++;
      const about = Object.keys(n.knowledge.rumors).map((id) => W.rumors[id]).filter((r) => r && (r.subject === 'player' || r.target === 'player'));
      about.forEach((r) => { R.rumors[r.type] = (R.rumors[r.type] || 0) + 1; });
      if (about.length) R.heard++;
      if (Memory.has(n, 'player', 'met')) R.met++;
      const rel = Rel.peek(W, n.id, 'player');
      if (rel && (about.length || Memory.has(n, 'player', 'met'))) R.standing += (rel.trust + rel.affection + rel.respect - rel.hostility - rel.suspicion - rel.fear) / 3;
    });
    Object.values(out).forEach((R) => {
      const known = Math.max(R.heard, R.met);
      R.standing = known ? Math.round(R.standing / known) : 0;
      R.word = !known ? 'unknown' : R.standing >= RULES.life.goodStanding ? 'good' : R.standing <= RULES.life.badStanding ? 'bad' : 'mixed';
    });
    return out;
  }

  function read(S) {
    const { P, W } = S;
    const me = W.player;
    const L = life(S);
    const met = Object.values(W.npcs).filter((n) => Memory.has(n, 'player', 'met') || P.found.npcs[n.id]);
    return {
      life_style: style(S),
      occupation_history: { jobs: L.work, tendency: Object.assign({}, me.tendency) },
      favorite_activity: favorite(S),
      activity: L.activity,
      exploration_history: Object.entries(P.found.locations).map(([loc, state]) => Object.assign({ loc, state }, L.places[loc] || { visits: 0 })),
      relationship_history: met.map((n) => ({
        id: n.id, alive: n.alive,
        first: P.found.npcs[n.id] ? P.found.npcs[n.id].first : null,
        memories: n.memories.filter((m) => m.subject === 'player').map((m) => ({ type: m.type, t: m.timestamp })),
        now: Object.assign({}, Rel.peek(W, n.id, 'player') || {}),
      })),
      economic_history: { money: me.money, debts: (me.debts || []).slice(), sums: L.sums, ledger: L.ledger },
      reputation: reputation(S),
      knowledge: {
        facts: Object.assign({}, P.knowledge), clues: Object.assign({}, P.clues), threads: Object.assign({}, P.threads),
        words: LangKnowledge.heardWords(S, Lang.AVER).filter((x) => x.confidence >= LangKnowledge.KNOWN).length,
        places: Object.keys(P.found.locations).length,
      },
      major_choices: L.choices.slice(),
      settlement: { now: me.lodging ? me.lodging.id : null, since: me.lodging ? me.lodging.since : null, history: L.lodgings, nights: L.nights },
      travel_history: { trips: L.trips, companions: met.filter((n) => n.memories.some((m) => m.type === 'travelled_with' && m.subject === 'player')).map((n) => n.id) },
    };
  }

  return { create, act, money, worked, choose, favorite, style, reputation, read };
})();

if (typeof module !== 'undefined') module.exports = { LifeLog };

</script>
<script>/* js/play/life.js */
// 생활 선택지 모음 — 지금 이 자리에서 할 수 있는 일(품삯), 잠자리, 잠, 가게, 동행과 헤어지기.
// 탐색 화면(engine.js)이 장소의 행동 다음에 붙인다. pass(min, opt)는 시간을 흘리고 그 사이의 줄을 돌려준다.
const Life = (() => {
  const J = (w, t) => w + Text.josa(w, t);

  function options(S, pass) {
    const { W } = S;
    const opts = [];
    Work.available(S).forEach(({ id, job }) => opts.push({ label: job.label, hint: '품삯', life: true, run: () => Work.perform(S, id, pass) }));
    // 잠자리: 어느 길이 나은지 알려 주지 않는다 (값만 적는다)
    // 값과 결과는 적지 않는다 (어느 쪽이 나은지 보이지 않게 — 스토리설계.md 단계 5 장면 문장 D)
    Lodging.offers(S).forEach(({ id, l }) => opts.push({
      label: Lodging.label(id), life: true,
      run: () => { const lines = Lodging.take(S, id, pass); return l.work ? lines : [...lines, ...pass(5)]; },
    }));
    if (Lodging.canSleep(S)) opts.push({ label: '잠을 잔다', kw: ['잔다', '잠', '자자', '눕'], life: true, run: () => Lodging.sleep(S, pass) });
    if (Shop.open(S)) opts.push({ label: '가게를 둘러본다', kw: ['가게', '사', '팔', '물건'], life: true, scene: 'shop' });
    opts.push(...Incidents.options(S, pass)); // 마을 사건의 해결 방식 (약재 부족 등)
    Companion.list(W).filter((n) => Npc.present(W, n)).forEach((n) => {
      const who = Narrative.who(S, n);
      opts.push({ label: `${J(who, '과와')} 헤어진다`, life: true, run: () => {
        Companion.leave(S, n.id, 'parted');
        return [`${who}에게 손을 들어 보인다.`, `${J(who, '은는')} 고개를 끄덕이고 제 갈 길로 간다.`, ...pass(5)];
      } });
    });
    return opts;
  }

  return { options };
})();

if (typeof module !== 'undefined') module.exports = { Life };

</script>
<script>/* js/play/order.js */
// 장면 우선순위 (지시문 5의 20절). 매 턴 이 표의 위에서부터 조건이 맞는 장면 하나만 띄운다.
// 순서는 표로 빼기 전 엔진(engine.js nextScene)의 순서 그대로다 — 지시문: "기존 시스템에 다른 우선순위가 있으면 기존 우선".
// kind는 지시문의 분류에 맞춘 이름이다:
//   story  = 1. 강제 스토리 이벤트       npc = 3. NPC 핵심 이벤트 (먼저 다가오는 사람)
//   danger = 기존 시스템의 위험(생존 우선). 지시문의 분류에는 없고, 짐승이 빛 장면보다 앞선다
//   2. 플레이어가 직접 발생시킨 이벤트는 표를 거치지 않는다: 고른 행동은 그 자리에서 처리된다.
//   region = 4. 지역 사건(sim/incidents.js)이 띄우는 장면. 대부분의 지역 사건은 장면 없이 화면 아래 덧붙는 줄(feed)과
//            소문으로 흘러들고, 장면이 필요할 때만 이 줄로 온다. 정해진 시각의 이야기보다 앞서지 않도록 맨 끝에 둔다.
//   5·6. 일상·반복 이벤트는 장면이 아니라 화면 아래 덧붙는 줄과 소문이다.
// 새 사건 종류(첫 지역 사건 등)는 이 표에 줄을 끼운다. pick(S, peek): 장면 이름 또는 null. peek이면 대기열을 건드리지 않는다.
const SceneOrder = (() => {
  const liaAtHollow = (W) => Npc.at(W, 'lia', 'hollow');
  const TWILIGHT_PLACES = ['clearing', 'deep', 'stream', 'downstream'];

  const TABLE = [
    { id: 'scheduled', kind: 'story', note: '정해진 시각의 이야기가 예약한 장면 (밤의 목소리, 상태창). 마법 장면은 리아 장면 안에서 열린다',
      pick(S, peek) {
        const pend = S.W.worldFlags.pending;
        const i = pend.findIndex((p) => !p.startsWith('magic'));
        if (i < 0) return null;
        return peek ? pend[i] : pend.splice(i, 1)[0];
      } },
    { id: 'girl', kind: 'story', note: '움푹한 곳의 리아',
      pick: (S) => (S.W.player.loc === 'hollow' && liaAtHollow(S.W) ? 'girl' : null) },
    { id: 'arrival', kind: 'story', note: '숲 가장자리에 처음 닿음',
      pick: (S) => (S.W.player.loc === 'edge' && !S.W.worldFlags.seen.arrival ? 'arrival' : null) },
    // 처음 보는 사람, 누군가를 찾는 사람, 나를 적대하는 사람은 먼저 다가온다 (만난 지 60분 안이면 다시 오지 않는다).
    // 이미 아는 사람에게는 내가 다가간다 (선택지)
    { id: 'approach', kind: 'npc', note: '먼저 다가오는 사람',
      pick(S) {
        const { W } = S;
        const loc = W.player.loc;
        const n = Npc.here(W, loc).find((x) => !x.location.hidden && !(x.id === 'lia' && loc === 'hollow')
          && (!Memory.has(x, 'player', 'met') || Goals.get(x, 'search') || Rel.get(W, x.id, 'player').hostility >= 50)
          && !(x.flags.metAt != null && W.time.t - x.flags.metAt < 60));
        return n ? 'meet:' + n.id : null;
      } },
    { id: 'beast', kind: 'danger', note: '짐승이 덤벼듦',
      pick: (S) => (Creatures.engages(S) ? 'beast' : null) },
    { id: 'light', kind: 'story', note: '해 질 녘의 빛 (한 번)',
      pick: (S) => (!S.W.worldFlags.seen.light && Time.band(S.W.time.t) === 'evening' && TWILIGHT_PLACES.includes(S.W.player.loc) ? 'light' : null) },
    { id: 'teaser', kind: 'story', note: '둘째 날 아침, 바람에 실린 피 냄새 (리아를 아직 만나지 않았을 때)',
      pick: (S) => (liaAtHollow(S.W) && S.W.worldFlags.day2Acts >= 3 && !S.W.worldFlags.seen.teaser && !S.W.npcs.lia.flags.met ? 'teaser' : null) },
    { id: 'incident', kind: 'region', note: '지역 사건이 띄우는 장면 (시작마을.md 8~12절)',
      pick: (S, peek) => Incidents.nextScene(S, peek) },
  ];

  // 지금 띄울 장면 하나 (예약된 장면은 꺼낸다)
  function next(S) {
    for (const row of TABLE) {
      const sc = row.pick(S, false);
      if (sc) return sc;
    }
    return null;
  }

  // 지금 조건이 맞는 줄 전부, 표의 순서대로 (디버그·테스트용. 아무것도 바꾸지 않는다)
  const candidates = (S) => TABLE.map((row) => ({ id: row.id, kind: row.kind, scene: row.pick(S, true) })).filter((x) => x.scene);

  return { TABLE, next, candidates };
})();

if (typeof module !== 'undefined') module.exports = { SceneOrder };

</script>
<script>/* js/core/world.js */
// 세계 상태 (통합 명세 3절)와 월드 틱 (5절). 세계 상태가 곧 진실이다: 모든 시스템은 여기를 바꾼다.
const World = (() => {
  // 씨앗이 늘 같다: 새로 시작하면 같은 세계, 같은 하늘이다. 달라지는 것은 플레이어의 선택뿐이다.
  const SEED = 20260929;

  function create() {
    const W = {
      v: 2, seq: 0, rng: SEED,
      time: { t: Time.START },
      weather: Weather.create(SEED ^ 0x5bd1e995),
      player: Player.create(),
      npcs: Npc.createAll(),
      creatures: Creatures.createAll(),
      locations: Places.createState(),
      regions: Regions.create(),
      factions: Factions.create(),
      politics: Factions.createPolitics(),
      relationships: {},
      events: { log: [], active: {}, scheduled: WorldEvents.initialSchedule(), states: {} },
      rumors: {},
      economy: Economy.create(),
      // 장면 진행 표시: seen(한 번만 나오는 장면), counts(반복 행동 횟수), done(장소에서 해 본 일),
      // pending(곧 벌어질 장면), notes(몸의 알림), feed(곁에서 벌어진 일), end(1장의 끝)
      worldFlags: { seen: {}, counts: {}, done: {}, pending: [], notes: [], feed: [], end: null, day2Acts: 0 },
      history: [],
    };
    Rel.seed(W);
    return W;
  }

  // min분 동안 세계를 흘린다. opt: { rest, sleep, move, fight, story }
  // 결과: { spent, lines(대본 사건), body(몸의 느낌) }. 밤의 목소리처럼 대본 사건이 시간을 멈추면 spent < min
  function tick(S, min, opt = {}) {
    const { W } = S;
    const from = W.time.t;
    let to = from + Math.max(0, min);
    const story = opt.story === false ? { lines: [], stopAt: null } : Story.clock(S, from, to);
    if (story.stopAt != null) to = story.stopAt;
    Regions.updateLevels(S);
    const body = [];
    let t = from;
    while (t < to) {
      const prev = t;
      t = Math.min(to, t + Regions.STEP.active);
      W.time.t = t;
      Weather.update(S, prev);                       // updateWeather
      body.push(...Player.update(S, t - prev, opt)); // updatePlayer
      Regions.simulate(S, t);                        // updateNPCs, updateCreatures (지역마다 정밀도가 다르다)
      WorldEvents.process(S, prev);                  // processEvents
      if (Math.floor(prev / 60) !== Math.floor(t / 60)) hourly(S);
      if (Time.crossed(prev, t, 6)) daily(S);
    }
    W.time.t = to;
    return { spent: to - from, lines: story.lines, body };
  }

  // 한 시간마다: 관계의 감정이 가라앉고(processRelationships), 흔적이 사라지고(updateLocations), 마력이 돌아온다
  function hourly(S) {
    Rel.process(S);
    Places.update(S);
    Magic.regen(S);
    Incidents.hourly(S); // 마을 사건: 도착하는 것, 플레이어가 알게 되는 길
  }

  // 하루마다 (새벽 6시): 지역의 위협, 세력(updateFactions), 경제(updateEconomy), 기억과 소문의 망각, 기록(recordHistory)
  function daily(S) {
    Regions.daily(S);
    Factions.daily(S);
    Economy.daily(S);
    Condition.daily(S); // 노파의 상처를 약초로 관리한다 [D9]
    Incidents.daily(S); // 마을 사건의 상태 (열림·악화·시한)
    Memory.decay(S);
    Rumor.daily(S);
    recordHistory(S);
  }

  function recordHistory(S) {
    const { W } = S;
    const v = W.economy.markets.village_square;
    W.history.push({
      day: Time.day(W.time.t),
      dead: Object.values(W.npcs).filter((n) => !n.alive).map((n) => n.id),
      events: W.events.log.length,
      rumors: Object.keys(W.rumors).length,
      villageThreat: Math.round(W.regions.village.threat),
      bread: v.price.bread,
      tension: Math.round(W.politics.tension),
    });
    if (W.history.length > 60) W.history.shift();
  }

  return { SEED, create, tick, hourly, daily };
})();

if (typeof module !== 'undefined') module.exports = { World };

</script>
<script>/* js/state.js */
// 플레이어가 아는 것 (P)과 저장/불러오기.
// P: 이름, 쓰러진 횟수, 기억 조각, 알아낸 사실, 발견한 장소·사람·사건·소문, 단서, 언어, 마법에 대한 이해 — 모두 쌓인다
// W: 세계 상태 (core/world.js). 둘 다 저장된다. (되감기는 폐기되었다: 스토리_재설계.md 0절)
const Persist = (() => {
  function create() {
    return {
      v: 2,
      name: null,
      collapses: 0, // 쓰러진 횟수 (엔딩 변수로 쓸 수 있다)
      memory: {
        identity: true, name: false, family: 'unknown',
        previousLocation: 'unknown', lastMoment: 'unknown', worldKnowledge: 0,
      },
      knowledge: {},              // 알아낸 사실 (수첩). world.js의 KNOW
      found: Knowledge.create(),  // 발견한 장소·사람·사건·소문 (통합 명세 19·20절)
      lang: LangStore.create(),   // 언어 지식 (언어 시스템 35절)
      magic: { understanding: {} },
      clues: {},                  // 모은 단서 { id: { t, from } } (play/clues.js)
      threads: {},                // 열린 단서 갈래 { thread: t }
    };
  }
  return { create };
})();

// 저장 (통합 명세 32절): P와 W를 통째로. 불러오면 같은 세계가 이어진다 (난수 씨앗도 W 안에 있다).
// 칸: 'auto'(장면 밖에서 다음 행동을 고를 때마다 저절로)와 손으로 저장하는 1~SLOTS.
// 손 저장은 엔진이 안전하다고 할 때만 된다 (Avernia.save). "처음부터"는 자동 칸만 지운다.
const Save = (() => {
  const KEY = 'avernia_save_v2';
  const OLD = 'avernia_save_v1';
  const SLOTS = 3;
  const keyOf = (slot) => (slot == null || slot === 'auto' ? KEY : `${KEY}:${slot}`);
  const plain = (o) => o && typeof o === 'object' && !Array.isArray(o);

  // 저장한 뒤에 코드가 새 칸을 더했어도 비어 있지 않게 채운다 (없는 칸만. 있는 값은 건드리지 않는다)
  function fill(target, defaults) {
    Object.keys(defaults).forEach((k) => {
      if (target[k] === undefined) target[k] = JSON.parse(JSON.stringify(defaults[k]));
      else if (plain(target[k]) && plain(defaults[k])) fill(target[k], defaults[k]);
    });
    return target;
  }

  // 저장했으면 true
  function write(S, slot) {
    try { localStorage.setItem(keyOf(slot), JSON.stringify({ v: 2, P: S.P, W: S.W, savedAt: Date.now() })); return true; } catch (e) { return false; /* 저장할 수 없는 환경 */ }
  }

  // { P, W, migrated } 또는 null
  function read(slot) {
    try {
      const s = JSON.parse(localStorage.getItem(keyOf(slot)));
      if (s && s.v === 2 && s.P && s.W) return load(s);
      if (keyOf(slot) !== KEY) return null;
      const old = JSON.parse(localStorage.getItem(OLD));
      if (old && old.v === 1 && old.P) return fromV1(old);
    } catch (e) { /* 깨진 저장 파일은 없는 것으로 본다 */ }
    return null;
  }

  // 없는 칸만 더한다. 안으로 들어가지 않는다.
  function shallow(target, defaults) {
    if (!plain(target) || !plain(defaults)) return;
    Object.keys(defaults).forEach((k) => { if (target[k] === undefined) target[k] = JSON.parse(JSON.stringify(defaults[k])); });
  }

  // 세계는 "구조"만 채운다. 소지품·관계·소문·흔적 같은 목록은 채우지 않는다
  // (먹어 없앤 빵이나 잊힌 소문이 되살아나면 안 된다)
  function fillWorld(W) {
    const d = World.create();
    shallow(W, d);
    ['time', 'weather', 'worldFlags', 'events', 'economy', 'politics'].forEach((k) => shallow(W[k], d[k]));
    shallow(W.player, d.player);
    ['surv', 'acc', 'status', 'magic', 'life'].forEach((k) => shallow(W.player[k], d.player[k]));
    Object.keys(d.npcs).forEach((id) => {
      if (!W.npcs[id]) { W.npcs[id] = d.npcs[id]; return; } // 새로 생긴 사람
      shallow(W.npcs[id], d.npcs[id]);
      ['physical', 'mental', 'needs', 'location', 'knowledge'].forEach((k) => shallow(W.npcs[id][k], d.npcs[id][k]));
      Npc.refresh(W.npcs[id], NPC_DEFS[id]); // 이름·역할·집·일정은 지금의 데이터를 따른다
    });
    Object.keys(d.creatures).forEach((id) => { if (!W.creatures[id]) W.creatures[id] = d.creatures[id]; else shallow(W.creatures[id], d.creatures[id]); });
    Object.keys(d.regions).forEach((id) => { if (!W.regions[id]) W.regions[id] = d.regions[id]; else shallow(W.regions[id], d.regions[id]); });
    Object.keys(d.locations).forEach((id) => { if (!W.locations[id]) W.locations[id] = d.locations[id]; });
    return W;
  }

  // 이름이 바뀐 사실: 예전 저장 파일의 것을 새 이름으로 옮긴다
  const RENAMED_FACTS = { voice_kills: 'voice_lost' };
  function migrateP(P) {
    Object.entries(RENAMED_FACTS).forEach(([from, to]) => {
      if (P.knowledge[from] && !P.knowledge[to]) P.knowledge[to] = P.knowledge[from];
      delete P.knowledge[from];
    });
  }

  function load(s) {
    fill(s.P, Persist.create());
    migrateP(s.P);
    LangStore.migrate(s.P);
    fillWorld(s.W);
    Incidents.restore(s.W);
    return { P: s.P, W: s.W, migrated: false };
  }

  // 예전 저장 파일: 이름·지식·배운 말은 옮기고, 세계는 처음 눈을 뜬 순간부터 다시 시작한다 (구조가 달라 이어 붙일 수 없다)
  function fromV1(old) {
    const P = fill(old.P, Persist.create());
    migrateP(P);
    LangStore.migrate(P);
    P.v = 2;
    return { P, W: World.create(), migrated: true };
  }

  // slot을 주면 그 칸만, 안 주면 자동 칸(과 예전 파일)을 지운다
  function clear(slot) {
    try {
      if (slot != null && slot !== 'auto') { localStorage.removeItem(keyOf(slot)); return; }
      localStorage.removeItem(KEY); localStorage.removeItem(OLD);
    } catch (e) { /* 무시 */ }
  }

  // 칸마다 요약: { slot, empty } 또는 { slot, name, t, loc, savedAt }. 세계를 다시 짓지 않고 읽기만 한다
  function list() {
    return ['auto', ...Array.from({ length: SLOTS }, (_, i) => i + 1)].map((slot) => {
      try {
        const s = JSON.parse(localStorage.getItem(keyOf(slot)));
        if (s && s.v === 2 && s.P && s.W) return { slot, name: s.P.name, t: s.W.time.t, loc: s.W.player.loc, savedAt: s.savedAt || null };
      } catch (e) { /* 깨진 칸은 빈 칸으로 */ }
      return { slot, empty: true };
    });
  }

  return { KEY, SLOTS, fill, write, read, load, clear, list };
})();

if (typeof module !== 'undefined') module.exports = { Persist, Save };

</script>

// 각 행동의 run(g)은 출력할 줄 배열을 반환한다.
// g = { W(세계), P(플레이어가 아는 것), me(플레이어의 몸), period(시간대), dark(어두운가), first, give, know, use }

const KNOW = {

  light_watches: '해 질 녘 숲에 떠 있는 빛은, 나를 보고 있었다.',

// 어느 장소에서나 할 수 있는 행동
const GLOBAL_ACTIONS = {
  listen: { label: '소리를 듣는다', kw: ['소리', '듣', '귀'], min: 10 },
  bag: { label: '소지품을 확인한다', kw: ['소지품', '가방', '주머니'], min: 0 },
  rest: { kw: ['쉰', '쉬', '앉', '기다', '눕', '잔다'] },
};

function listenLines(g) {
  const p = g.period;
  if (g.me.loc === 'deep') return ['숲이 숨을 죽인 것 같다.', '내 숨소리가 가장 크다.'];
  if (g.dark) {
    g.use('sen');
    return ['귀를 기울인다.', '나무 사이를 지나는 바람. 그 너머로 무언가 발밑을 스치는 소리.', '가만히 있으면, 숲이 나를 듣고 있는 것 같다.'];
  }
  if (p === 'evening') return ['새 소리가 줄어 있다.', '그 자리를 벌레 소리가 채우고 있다.'];
  return [
    '귀를 기울인다. 물소리. 바람에 스치는 잎. 새 소리.',
    '그 사이로 무언가 작게 움직이는 소리가 지나간다.',
    '그러다 멎는다.',
  ];
}

function bagLines(S) {
  const me = S.W.player;
  const list = Object.entries(me.inv).filter(([, n]) => n > 0);
  if (!list.length && !me.money) return ['주머니를 뒤져 본다. 비어 있다.', '아무것도 없다.'];
  const lines = ['가진 것을 확인한다.', ...list.map(([k, n]) => `· ${Player.label(k, S.P)} ${n > 1 ? '× ' + n : ''}`.trim())];
  if (me.money) lines.push(`· 동전 ${me.money}닢`);
  if (Player.weight(me) > Player.carryLimit(me)) lines.push('……짐이 무겁다. 걸을 때마다 어깨가 짓눌린다.');
  return lines;
}

// 시계가 넘어가는 순간의 사건 (저녁, 밤, 새벽). 월드 틱이 시간을 흘리기 전에 부른다.
// 첫날 밤 23시의 목소리는 무엇을 하든 그 시각에 끼어든다 (시간이 거기서 멈추고 장면이 열린다).
// 둘째 날 새벽의 리아 습격은 이야기가 아니라 세계 사건이다 (sim/events.js).
const Story = (() => {
  function clock(S, from, to) {
    const { W, P } = S;
    const seen = W.worldFlags.seen;
    const lines = [];
    const events = [];
    for (let d = Math.max(0, Time.day(from) - 2); d <= Time.day(to) - 1; d++) {
      const b = d * Time.DAY;
      events.push({ at: b + 18 * 60, id: 'evening', d });
      events.push({ at: b + 20 * 60, id: 'night', d });
      events.push({ at: b + 23 * 60, id: 'call', d });
      events.push({ at: b + Time.DAY + 6 * 60, id: 'dawn', d });
    }
    events.sort((a, b) => a.at - b.at);
    for (const e of events) {
      if (!(from < e.at && to >= e.at)) continue;
      if (e.id === 'evening') {
        lines.push(...(seen.evening
          ? ['해가 기울고 있다.']
          : ['해가 지기 시작한다.', '숲의 색이 달라진다.', '새들의 소리가 줄어든다.']));
        seen.evening = true;
      } else if (e.id === 'night') {
        if (!seen.night) {
          lines.push('완전히 어두워졌다.', '그리고……', '낮에는 듣지 못했던 소리가 들리기 시작한다.',
            '멀리서 무언가가 운다. 길고 낮은 소리다.', '짐승의 것 같기도, 사람의 것 같기도 하다.');
          if (!P.knowledge.night_cry) P.knowledge.night_cry = e.at;
        } else lines.push('다시 밤이 왔다.');
        seen.night = true;
      } else if (e.id === 'call') {
        if (e.d === 0 && !seen.call) {
          seen.call = true;
          W.worldFlags.pending.push('call');
          return { lines, stopAt: e.at }; // 여기서 시간이 멈춘다
        }
      } else if (e.id === 'dawn') {
        if (!seen.dawn) {
          lines.push('새벽이 밝아 온다.', '숲은 다시 조용해졌다.', '어젯밤의 일이 꿈이었던 것처럼 느껴진다.',
            '하지만……', '손에 묻은 흙은 그대로다.');
          W.worldFlags.pending.push('status');
        } else lines.push('동이 튼다.');
        seen.dawn = true;
      }
    }
    return { lines, stopAt: null };
  }
  return { clock };
})();

if (typeof module !== 'undefined') {
  module.exports = { SKY, LOCS, KNOW, GLOBAL_ACTIONS, listenLines, bagLines, Story };
}

<script>/* js/village.js */
// 마을 하르넨의 장소 [결정 D7]. 구성은 시작마을.md 1-4절 (장소 8곳). 묘사 문장은 [임시] — 스토리 담당이 쓰면 이 파일을 바꾼다.
// 첫인상 세 가지(처마의 약초 다발 · 광장의 오래된 우물 · 울타리의 짐승 자국)는 [D7 확정], 문장은 [임시].
// 일·거처·가게 선택지는 여기 적지 않는다. 시스템(play/life.js)이 장소와 사람을 보고 붙인다.
// 형식은 world.js의 LOCS와 같다. g = { W, P, me, period, dark, first, give, know, use }

// [임시] 마을의 하늘 (숲의 SKY는 나무 그늘을 말하므로 따로 둔다)
const VSKY = {
  dawn: '동쪽 하늘이 희끄무레하다.',
  morning: '햇빛이 낮은 지붕들 위로 쏟아진다.',
  afternoon: '해가 기울어 울타리 그림자가 길다.',
  evening: '하늘이 붉다. 굴뚝마다 연기가 오른다.',
  night: '불 켜진 창 몇 개 말고는 어둡다.',
  late_night: '불 켜진 창 몇 개 말고는 어둡다.',
};

// 숲의 가장자리: 숲과 마을 사이
LOCS.edge = {
  name: '숲의 가장자리',
  desc: (g) => ['나무가 듬성해지고 앞이 트인다.', '낮은 울타리와 지붕 몇 개가 보인다.', '바람에 쓴 풀 냄새가 섞여 온다.', SKY[g.period]],
  exits: [
    { to: 'village_gate', label: '울타리 쪽으로 간다', min: 20, kw: ['울타리', '마을'], text: ['울타리를 향해 걷는다.'] },
    { to: 'hill', label: '숲으로 돌아간다', min: 240, kw: ['숲', '돌아'], use: 'vit',
      text: ['왔던 숲으로 다시 들어간다.', '비탈 위까지는 한참이다.'],
      block: (g) => (g.dark ? { min: 5, lines: ['밤의 숲으로 들어갈 자신은 없다.'] } : null) },
  ],
  actions: [],
};

// 울타리를 지키는 사람이 나를 믿지 못하면 들여보내 주지 않는다 (리아가 함께 있거나, 나를 아는 사람이 보증하면 들어갈 수 있다)
function gateBlock(g) {
  const gk = g.W.npcs.gatekeeper;
  if (!gk || !Npc.present(g.W, gk) || g.dark) return null;
  const r = Rel.get(g.W, 'gatekeeper', 'player');
  if (r.suspicion < 60 && r.hostility < 30) return null;
  if (g.W.player.companions.some((id) => Npc.present(g.W, g.W.npcs[id]))) return null;

<script>/* js/scenes.js */
// 장면: 선택이 여러 번 오가는 사건들. 화면 도구(ui)를 받아 진행하고 결과를 돌려준다.
// 결과: 'ok' (탐색으로 돌아감) | 'die' | 'end:with' (그녀와 함께 숲을 나섬) | 'leave' (그녀를 두고 떠남)
// ui = { S, P, W, me, page(lines), say(lines), choose(opts) -> { idx, manner }, more(), pass(min, opt) -> lines,
//        speak(str, by), learn(word), knows(word), know(id), use(k), chance(p), pick(arr), hurt(n, cause, by),
//        npc(id), rel(id), relate(id, delta, cause) }
// 장면은 결과만 정한다. 관계·기억·소문은 Social(돕기·위협·공격)과 이벤트 버스를 거쳐 세계에 남는다.

const Scenes = (() => {
  const K = (t) => ({ t, cls: 'know' }); // 지식으로 알아챈 줄
  const J = (w, t) => w + Text.josa(w, t);

  function movePlayer(ui, to) {
    const from = ui.me.loc;
    ui.me.loc = to;
    Bus.emit(ui.S, 'PLAYER_MOVED', { from, to });
  }

  // ---------- 첫 번째 위험: 풀숲의 짐승 ----------
  async function beast(ui) {
    const { S, W, P, me } = ui;
    W.worldFlags.seen.beast = true;
    const B = W.creatures.thornback; // 짐승의 몸(체력, 두려움)은 세계에 남는다
    const F = { looked: 0, noticed: true, climbed: 0 }; // 이번 싸움의 형편
    const atWater = Places.has(me.loc, 'water');
    const lines = ['……', '풀숲이 움직인다.'];
    if (P.knowledge.beast_seen) lines.push(K('……이 움직임을 안다.'));
    if (me.stats.sen >= 5 || P.knowledge.beast_seen) {
      F.noticed = false;
      lines.push('이번에는 내가 먼저 알아챘다. 그것은 아직 나를 보지 못했다.');
    } else {
      lines.push('바람이 아니다. 무언가가 낮게, 풀을 가르며 다가온다.', '풀숲 사이로 눈이 번뜩인다.');
    }
    await ui.page(lines);
    WorldEvents.record(S, 'beast_encounter', { loc: me.loc, actors: [B.id, 'player'], data: { subject: B.id, target: 'player' } });

    while (true) {
      const weapon = Combat.weaponOf(me);
      const wname = weapon ? ITEM_DEFS[weapon].name : null;
      const opts = [
        { id: 'look', label: '관찰한다' },
        { id: 'hit', label: weapon ? `${J(wname, '으로')} 공격한다` : '맨손으로 덤빈다' },
      ];
      if (me.inv.stone) opts.push({ id: 'throw', label: '돌을 던진다' });
      if (atWater) opts.push({ id: 'water', label: '물속으로 들어간다', hint: P.knowledge.beast_water ? '안다' : null });
      if (Places.has(me.loc, 'rocks')) opts.push({ id: 'climb', label: '바위 위로 올라간다' });
      opts.push({ id: 'hide', label: '숨는다' });
      opts.push({ id: F.noticed ? 'flee' : 'sneak', label: F.noticed ? '도망친다' : '조용히 물러난다' });
      const { idx } = await ui.choose(opts);
      const a = opts[idx].id;
      const out = [];
      let done = false, counter = F.noticed, hurtIt = false;
      const str = me.stats.str - 3;
      // 성공 가능성은 몸 상태, 어둠, 날씨, 지형, 그것의 두려움이 정한다 (play/combat.js)
      const can = (act) => ui.chance(Combat.chance(S, act, B, { noticed: F.noticed }));

      if (a === 'look') {
        F.looked++;
        if (F.looked === 1) {
          ui.use('sen');
          out.push('숨을 죽이고 본다.', '', { t: '[???]', cls: 'sys' }, '작은 짐승처럼 보인다.', '하지만…… 뭔가 이상하다.');
          if (!F.noticed) counter = false;
        } else if (F.looked === 2) {
          ui.use('sen');
          ui.know('beast_seen');
          out.push('개만 한 몸집. 털 대신, 가시 같은 것이 등에 빽빽하게 돋아 있다.', '눈이…… 셋이다.', '가운데 눈만 깜빡이지 않는다.');
          if (!F.noticed && ui.chance(0.5)) { F.noticed = true; out.push('', '가운데 눈이 나를 향한다.'); }
          counter = false;
        } else {
          ui.use('int');
          ui.know('beast_water');
          out.push('그것은 나를 노리면서도, 젖은 자갈이나 물웅덩이는 한 번도 밟지 않는다.', '돌아서 온다. 일부러.', '……물을 싫어하는 걸까.');
        }
      } else if (a === 'hit') {
        ui.use('str');
        const dmg = (weapon ? 1 : ui.chance(0.5) ? 1 : 0) + (str >= 2 ? 1 : 0) + (F.noticed ? 0 : 1);
        if (!F.noticed || can('hit')) {
          B.hp -= dmg;
          out.push(weapon ? `${J(wname, '을를')} 힘껏 내리친다.` : '주먹을 휘두른다.',
            dmg > 0 ? '둔한 감촉. 그것이 날카롭게 운다.' : '가시에 손이 찢긴다. 그것은 꿈쩍도 하지 않는다.');
          if (!weapon && dmg === 0) ui.hurt(1, '풀숲의 짐승에게 당했다', B.id);
          if (weapon && Player.wear(me, weapon)) out.push(`……${J(wname, '이가')} 뚝 부러진다.`);
          if (dmg > 0) { hurtIt = true; Combat.scare(B, 25); }
        } else out.push('헛손질이다. 그것이 옆으로 튄다.');
        F.noticed = true;
      } else if (a === 'throw') {
        ui.use('agi');
        Player.take(me, 'stone');
        if (can('throw')) {
          B.hp -= 1;
          hurtIt = true;
          Combat.scare(B, 20);
          out.push('돌이 그것의 옆구리에 맞는다.', '그것이 움찔 물러선다.');
          if (ui.chance(0.5)) counter = false;
        } else out.push('돌이 빗나가 풀숲에 떨어진다.');
        F.noticed = true;
      } else if (a === 'water') {
        ui.know('beast_water');
        me.surv.wet = 100;
        out.push('개울로 뛰어든다. 차가운 물이 무릎까지 차오른다.', '', '그것이 물가에서 멈춘다.',
          '낮게 으르렁거리며 물가를 따라 몇 번이고 오간다.', '하지만 발을 들이지 않는다.', '', '……이윽고 그것은 풀숲으로 사라진다.');
        done = true; counter = false;
      } else if (a === 'climb') {
        ui.use('agi');
        if (can('climb')) {
          F.climbed++;
          out.push('이끼 낀 바위를 기어오른다. 손톱이 들린다.', '그것이 바위 아래를 맴돈다. 뛰어오르려다, 미끄러진다.');
          if (F.climbed >= 2 || ui.chance(0.5)) { out.push('', '한참을 맴돌던 그것이 흥미를 잃은 듯 돌아선다.'); done = true; }
          counter = false;
        } else out.push('이끼에 손이 미끄러진다. 바위에서 떨어진다.');
      } else if (a === 'hide') {
        ui.use('sen');
        if (can('hide')) {
          out.push('고목 뒤에 몸을 붙이고 숨을 참는다.', '킁킁거리는 소리가 바로 옆을 지나간다.', '……멀어진다.');
          done = true; counter = false;
        } else {
          out.push('덤불 뒤로 몸을 숨긴다.', '킁킁거리는 소리가 멈춘다.', '그리고 덤불이 갈라진다.');
          F.noticed = true; counter = true;
        }
      } else if (a === 'flee' || a === 'sneak') {
        ui.use('agi');
        if (can(a)) {
          const exit = LOCS[me.loc].exits[0];
          out.push(a === 'sneak' ? '발끝으로 한 걸음씩 물러난다. 그것은 끝내 돌아보지 않는다.' : '돌아서서 달린다. 가지가 얼굴을 할퀸다. 뒤를 돌아보지 않는다.');
          if (a === 'flee') { movePlayer(ui, exit.to); out.push('', `정신을 차려 보니 ${LOCS[exit.to].name}이다. 따라오는 소리는 없다.`); }
          done = true; counter = false;
        } else {
          out.push('달리려는 순간 뿌리에 발이 걸린다.');
          F.noticed = true; counter = true;
        }
      }

      if (B.hp <= 0 && !done) {
        ui.know('beast_seen');
        out.push('', '그것이 비틀거린다.', '찢어지는 소리를 내지르며 풀숲 속으로 달아난다.', '',
          '풀 위에 검은 피가 점점이 떨어져 있다.', '……피에서, 희미하게 빛이 난다.');
        Places.addTrace(W, me.loc, 'blood', { quiet: true });
        done = true; counter = false;
      } else if (B.fear >= 80 && !done) {
        // 겁을 먹으면 싸움을 그만둔다
        out.push('', '그것이 멈칫한다.', '가시를 곤두세운 채 뒷걸음질 치더니, 풀숲 속으로 사라진다.');
        done = true; counter = false;
      }
      if (counter && !done && can('counter')) {
        if (can('dodge')) out.push('', '그것이 뛰어든다. 몸을 비틀어 겨우 피한다.');
        else {
          ui.hurt(2, '풀숲의 짐승에게 당했다', B.id);
          Player.injure(S, 'bite', 30);
          out.push('', ui.pick(['그것이 뛰어든다. 종아리에 이빨이 박힌다.', '가시가 팔을 긁고 지나간다. 뜨거운 것이 흘러내린다.', '어깨를 물린다. 비명이 새어 나온다.']));
        }
      }
      out.push(...ui.pass(5, { fight: true }));
      if (me.hp <= 0) {
        await ui.page([...out, '', '다리에 힘이 빠진다.', '풀 위로 쓰러진다. 흙 냄새가 난다.', '가시 돋친 그림자가, 천천히 다가온다.']);
        await ui.more();
        return 'die';
      }
      const f = Player.hpFeeling(me);
      if (f && !done) out.push('', f);
      await ui.page(out);
      if (done) {
        // 다치거나 겁을 먹은 짐승은 이 낯선 것을 피해 다닌다. 제 영역 깊은 곳으로 물러난다.
        if (hurtIt || B.hp <= 0 || B.fear >= 80 || F.climbed) { B.shy = true; B.loc = 'deep'; }
        B.hp = Math.max(1, B.hp);
        await ui.more();
        return 'ok';
      }
    }
  }

  // ---------- 첫 번째 이상현상: 떠 있는 빛 ----------
  async function light(ui) {
    const { S, W, P } = ui;
    W.worldFlags.seen.light = true;
    const lines = ['나무 사이에 무언가 떠 있다.', '빛이다. 작고, 희미하게 푸르다.',
      '반딧불처럼 보인다. 하지만 반딧불은 저렇게 움직이지 않는다.',
      '그것은 흔들리지도 않고 한 자리에 가만히 떠서……', '……나를 바라보는 것 같다.'];
    if (P.knowledge.light_watches) lines.push(K('……또 만났다.'));
    await ui.page(lines);
    let watched = false, near = 0;
    while (true) {
      const opts = [{ id: 'near', label: '다가간다' }, { id: 'watch', label: '가만히 지켜본다' }];
      if (watched || P.knowledge.light_watches) opts.push({ id: 'touch', label: '손을 뻗는다' });
      opts.push({ id: 'away', label: '눈을 돌린다' });
      const { idx } = await ui.choose(opts);
      const a = opts[idx].id;
      let out, done = true;
      if (a === 'near') {
        near++;
        if (near === 1) { out = ['한 걸음 다가선다.', '빛이 스르르 물러난다. 꼭 내가 다가선 만큼.']; done = false; }
        else out = ['다시 다가선다.', '빛은 꺼지듯 사라진다.', '눈을 깜빡이는 사이, 그것은 어디에도 없다.'];
      } else if (a === 'watch') {
        ui.use('sen');
        ui.know('light_watches');
        watched = true; done = false;
        out = ['숨을 고르고, 가만히 지켜본다.', '빛이 천천히 맥동한다. 숨을 쉬는 것처럼.',
          '내가 숨을 들이쉬면 밝아지고, 내쉬면 어두워진다.', '……나를 따라 하고 있다.'];
      } else if (a === 'touch') {
        ui.use('wil');
        ui.know('light_touched');
        Lang.sense(S, 'spirit', 5);
        Magic.observe(S, 'light', 2);
        out = ['손을 천천히 뻗는다.', '빛이 머뭇거리다가, 손끝에 내려앉는다.', '……따뜻하다.',
          '귓가에서, 소리가 아닌 무언가가 스친다.', '「……○△…… ○○……」',
          '무슨 뜻인지는 모른다. 싫은 느낌은 아니었다.', '', '빛은 사라졌다. 손끝에 온기가 남아 있다.'];
      } else {
        out = ['눈을 돌린다.', '다시 봤을 때, 빛은 없다.'];
      }
      out.push(...ui.pass(5));
      await ui.page(out);
      if (done) { await ui.more(); return 'ok'; }
    }
  }

  // ---------- 첫날 밤, 이름을 부르는 목소리 ----------
  async function call(ui) {
    const lines = ['……어디선가 목소리가 들린다.', '「……{이름}……」', '바람 소리였을까.', '',
      '아니다. 다시 들린다. 이번엔 조금 더 가깝다.', '「……{이름}.」', '그 소리는 분명, 내 이름의 모양을 하고 있다.'];
    await ui.page(lines);
    ui.know('name_call');
    const opts = [
      { id: 'answer', label: '「……누구야?」 대답한다' },
      { id: 'look', label: '소리가 나는 쪽을 본다' },
      { id: 'ears', label: '귀를 막고 웅크린다' },
    ];
    const { idx } = await ui.choose(opts);
    const a = opts[idx].id;
    // 목소리를 따라간다 [결정 #6]: 쓰러지지도 죽지도 않는다. 정신을 잃었다가 새벽 직전, 낯선 자리에서 깨어난다.
    // 목소리의 정체는 [미확정 설정 #7]이라 아무것도 보여 주지 않는다 (스토리설계.md 단계 0~4 장면 문장 B)
    const follow = async (pre) => {
      ui.know('voice_lost');
      await ui.page([...pre, '', '몇 걸음. 몇 걸음 더.', '목소리가 멎는다.', '', '뒤에서 누군가 내 어깨에 손을 얹는다.',
        '차갑다.', '돌아본다.', '', '아무도 없다.', '',
        '어깨 위의 차가운 감촉만, 그대로 남아 있다.', '그 감촉이 천천히 목덜미를 타고 올라온다.', '숨을 쉬려는데, 숨이 쉬어지지 않는다.']);
      await ui.more();
      ui.lose();
      await ui.page(['……', '', '……', '', '흙냄새.', '',
        '눈을 뜬다. 얼굴이 젖은 흙에 닿아 있다.', '몸을 일으키려다 다시 주저앉는다. 팔다리에 힘이 없다.', '',
        '처음 보는 나무들이다. 길은 없다.', '낮에 없던 그 길도, 이제는 없다.', '',
        '하늘이 희끄무레하다.', '……얼마나 지난 거지?', '',
        '목소리를 따라 몇 걸음 걸었다.', '그것밖에 기억나지 않는다.']);
      await ui.more();
      return 'shaken';
    };
    if (a === 'answer') {
      await ui.page(['「……누구야?」', '', '목소리가 멎는다.', '그리고, 아주 가까이에서.', '「이쪽이야, {이름}.」', '', '……내 목소리다.']);
      const r = await ui.choose([{ label: '목소리 쪽으로 간다' }, { label: '뒤로 물러선다' }]);
      if (r.idx === 0) return follow(['나무 사이로 발을 옮긴다.', '낮에 없던 길이 나 있다. 희미하게 빛나는 길이다.']);
      ui.use('wil');
      await ui.page(['뒷걸음질 친다. 발밑에서 가지가 부러진다.', '목소리가 뚝 끊긴다.', '',
        '그 뒤로 한참 동안, 아무 소리도 없다.', '무언가가 어둠 속에서 나를 보고 있다는 느낌만 남는다.',
        ...ui.pass(30)]);
    } else if (a === 'look') {
      ui.know('night_path');
      await ui.page(['어둠 속, 나무 사이에 길이 하나 나 있다.', '낮에는 분명 없던 길이다.',
        '길 끝에서 희미한 빛이 흔들린다.', '목소리는 그 끝에서 들린다.', '「{이름}. 이리 와.」']);
      const r = await ui.choose([{ label: '길을 따라간다' }, { label: '눈을 질끈 감는다' }]);
      if (r.idx === 0) return follow(['홀린 듯 발을 옮긴다.', '길은 발밑에서 부드럽게 빛난다.']);
      ui.use('wil');
      await ui.page(['눈을 감는다. 숫자를 센다. 하나, 둘, 셋……', '백을 넘겼을 때 눈을 뜬다.', '길은 없다. 원래 그랬던 것처럼.', ...ui.pass(30)]);
    } else {
      ui.use('wil');
      await ui.page(['귀를 막는다.', '목소리는 손가락 사이로 스며든다.', '「{이름}…… {이름}……」', '이를 악문다. 대답하지 않는다.', '',
        '……얼마나 지났을까.', '목소리는 사라졌다.', ...ui.pass(40)]);
    }
    await ui.more();
    return 'ok';
  }

  // ---------- 상태창 해금 (첫 밤을 넘긴 새벽) ----------
  async function status(ui) {
    const { P, me } = ui;
    Player.unlockStatus(me);
    const again = P.knowledge.status_seen;
    if (!again) P.knowledge.status_seen = ui.W.time.t;
    await ui.page(again
      ? ['몸을 일으킨다.', '……또 이 감각이다.', '내 몸의 상태가, 숫자로 느껴진다.', '']
      : ['몸을 일으킨다. 밤새 굳은 팔다리가 삐걱거린다.', '손을 쥐었다, 편다.', '', '……이상하다.',
        '분명 처음 보는 몸인데……', '내 몸의 상태가, 숫자로 느껴진다.', '']);
    await ui.say(Player.statusLines(me, P.name));
    await ui.say(['', '대부분은 아직 흐릿하다.', '하지만 어딘가에 힘을 더 실을 수 있을 것 같다.'], { pace: 700 });
    const { idx } = await ui.choose([{ label: '지금 정한다' }, { label: '나중에 정한다', hint: '언제든 몸 상태를 확인할 수 있다' }]);
    if (idx === 0) await allocate(ui);
    return 'ok';
  }

  // 능력치 배분.
  async function allocate(ui) {
    const { P, me } = ui;
    while (me.status.points > 0) {
      await ui.page(['현재 능력치를 확인한다.', '', ...Player.statusLines(me, P.name)], { pace: 60 });
      const opts = STAT_KEYS.map((k) => ({
        k, label: `${STAT_KO[k]}에 힘을 싣는다`, disabled: me.stats[k] >= STAT_MAX,
        hint: me.status.known[k] ? String(me.stats[k]) : '?',
      }));
      opts.push({ k: null, label: '여기까지만 한다', sep: true });
      const { idx } = await ui.choose(opts);
      const k = opts[idx].k;
      if (!k) break;
      me.stats[k]++;
      me.status.points--;
      if (k === 'vit') Player.heal(me, 1);
    }
    await ui.page(me.status.points > 0
      ? ['남은 힘은 아껴 둔다.', '']
      : ['몸 안에서 무언가가 자리를 잡는다.', '']);
    await ui.say(Player.statusLines(me, P.name), { pace: 60 });
    await ui.more();
  }

  // 만난 사람을 떠올린다. 관계는 숫자가 아니라 인상으로.
  function peopleLines(ui) {
    const { S, W, P } = ui;
    return Object.keys(P.found.npcs).filter((id) => W.npcs[id]).map((id) => {
      const n = W.npcs[id];
      const name = P.found.npcs[id].name || n.identity.desc;
      const sawDeath = !n.alive && W.events.log.some((e) => e.type === 'death_witnessed' && e.data.target === id && e.witnesses.includes('player'));
      if (sawDeath) return { t: `· ${name} — ……죽었다.`, cls: 'note' };
      const r = Rel.peek(W, id, 'player');
      const word = !r ? '잘 모르겠다' : r.hostility >= 50 ? '나를 미워한다' : r.fear >= 50 ? '나를 두려워한다'
        : r.trust >= 40 ? '나를 조금 믿는 것 같다' : r.gratitude >= 20 ? '고마워하는 것 같다' : r.suspicion >= 60 ? '나를 경계한다' : '잘 모르겠다';
      return { t: `· ${name} — ${word}`, cls: 'note' };
    });
  }

  // 몸 상태를 확인한다 (상태창이 열린 뒤 언제든). 능력치, 언어, 아는 곳, 만난 사람 (통합 명세 37절)
  async function checkBody(ui) {
    const { S, P, me } = ui;
    const f = Player.hpFeeling(me);
    const lines = ['눈을 감고 몸에 집중한다.', '', ...Player.statusLines(me, P.name), '', f || '몸은 아직 괜찮다.'];
    const langs = LangUI.languageLines(S);
    if (langs.length) lines.push('', ...langs);
    const places = Explore.mapLines(S);
    if (places.length) lines.push('', '아는 곳', ...places);
    const people = peopleLines(ui);
    if (people.length) lines.push('', '만난 사람', ...people);
    // 생활: 손에 익은 일, 잠자리, 함께 다니는 사람
    const work = Work.tendencyLines(S);
    if (work.length) lines.push('', '해 본 일', ...work);
    if (me.lodging) lines.push('', { t: `잠자리 — ${RULES.lodgings[me.lodging.id].label}`, cls: 'note' });
    const comp = Companion.list(ui.W).filter((n) => n.alive);
    const nameOf = (n) => (P.found.npcs[n.id] && P.found.npcs[n.id].name) || n.identity.desc;
    if (comp.length) lines.push({ t: `함께 다니는 사람 — ${comp.map(nameOf).join(', ')}`, cls: 'note' });
    await ui.page(lines);
    if (me.status.points > 0) {
      const { idx } = await ui.choose([{ label: '남은 힘을 싣는다' }, { label: '그만둔다' }]);
      if (idx === 0) await allocate(ui);
    } else await ui.more();
  }

  // ---------- 첫 번째 인간: 다친 여자 ----------
  function girlLook(ui, G) {
    const r = Rel.get(ui.W, 'lia', 'player');
    const l = [];
    if (G.physical.bleed === 0) l.push('팔에 짓이긴 풀이 덮여 있다. 피는 멎었다.');
    else if (G.physical.health >= 30) l.push('그녀는 나무에 기대어 앉아 있다. 팔을 감싼 손가락 사이로 피가 배어 나온다.');
    else l.push('그녀의 얼굴이 창백하다. 숨이 얕고 빠르다. 팔에서 피가 계속 흐른다.');
    if (G.flags.close) l.push('그녀는 이제 나보다 숲 쪽을 더 살핀다.');
    else if (G.mental.fear >= 50 || r.suspicion >= 60) l.push('손은 여전히 단검 자루 위에 있다.');
    else l.push('단검은 무릎 옆에 내려놓여 있다.');
    return l;
  }

  async function magicScene(ui) {
    const { W, P } = ui;
    const G = W.npcs.lia;
    G.flags.magicSeen = true;
    ui.know('magic_seen');
    P.memory.worldKnowledge++;
    await ui.page(['그녀가 눈을 감는다. 다친 팔 위에 다른 손을 얹는다.', '입술이 무언가를 낮게 중얼거린다.', '',
      '……손끝이 빛난다.', '희미한, 물빛 같은 빛.', '빛이 닿은 자리에서, 찢어진 살이 천천히 오므라든다.', '',
      '숨을 쉬는 것도 잊는다.', '「……방금, 뭐 한 거예요?」', '', '그녀가 눈을 뜬다.', ui.speak('「[[뭐:20]]가?」', 'lia'),
      '내 얼굴을 한참 들여다보더니, 무언가 알겠다는 듯 눈을 가늘게 뜬다.', ui.speak('「[[마법:45]]…… [[처음:30]] [[봐:30]]?」', 'lia'), '',
      '뜻은 모른다.', '하지만 그 눈빛은, 이상한 것을 보는 눈빛이다.', '이 세계에서 이상한 건, 나다.']);
    await ui.more();
  }

  async function invite(ui) {
    const { S, W, P } = ui;
    const G = W.npcs.lia;
    G.flags.invited = true;
    const lines = ['그녀가 나무를 짚고 일어선다. 휘청이지만 쓰러지지 않는다.', '단검을 칼집에 꽂고, 숲 저편을 가리킨다.'];
    if (P.knowledge.smoke) lines.push('……비탈 위에서 봤던, 연기가 오르던 쪽이다.');
    lines.push(ui.speak('「[[마을:20]].」', 'lia'), '그녀가 걷는 시늉을 하고, 나를 가리키고, 다시 저편을 가리킨다.',
      // 스승의 병을 한마디 비친다 [결정 #1 · D9]. 뜻은 모른 채 지나간다 (learn을 걸지 않는다)
      '그녀가 허리춤의 풀 다발을 한 번 만진다.', ui.speak('「[[할머니:45]]…… [[아파:35]].」', 'lia'),
      '혼잣말처럼 작은 소리다.', '무슨 뜻인지는 모른다. 그녀는 더 말하지 않는다.', '',
      ui.speak('「[[같이:30]]…… [[가:30]].」', 'lia'));
    if (ui.learn('마을')) lines.push('', K('……"마을". 사람이 모여 사는 곳을 말하는 것 같다.'));
    ui.know('village');
    await ui.page(lines);
    const { idx } = await ui.choose([{ label: '그녀를 따라간다' }, { label: '고개를 젓는다' }]);
    if (idx === 0) return 'travel'; // 그녀와 함께 마을까지 걷는다 (arriveWith)
    // 그녀는 혼자 마을로 간다. 기다려 주지 않는다.
    G.physical.shock = Math.min(G.physical.shock, 15);
    Goals.add(G, { id: 'return_home', type: 'personal', priority: 90 }, W.time.t);
    Npc.startMove(S, G, G.location.home);
    await ui.page(['고개를 젓는다.', '그녀는 잠시 나를 보더니, 어깨를 으쓱한다.', '그리고 걸어간다.', '돌아보지 않는다.']);
    W.worldFlags.feed.length = 0;
    await ui.more();
    return 'ok';
  }

  // 그녀에게서 들은 말 가운데 따라 해 볼 만한 것 (뜻을 어렴풋이라도 짐작하는 말)
  function sayable(ui) {
    const w = LangKnowledge.heardWords(ui.S, Lang.AVER).find((x) => x.confidence >= LangKnowledge.GUESS);
    return w ? { id: w.id, sound: LangRegistry.sound(w.id, w.id) } : null;
  }

  // 리아와의 첫 만남은 중요한 선택으로 삶의 기록에 남는다 [결정 D5]. 첫 장면이 끝날 때, 그 장면에서 한 일로 정한다
  async function girl(ui) {
    const G = ui.W.npcs.lia;
    const first = !G.flags.met;
    const did = new Set();
    const r = await girlScene(ui, did);
    if (first) {
      LifeLog.choose(ui.S, 'lia_first_meeting', firstMeeting(G.flags, did, r),
        { water: !!G.flags.gotWater, herb: !!G.flags.gotHerb, named: !!G.flags.named, together: r === 'travel', liaAlive: G.alive });
    }
    return r;
  }
  function firstMeeting(F, did, r) {
    if (did.has('attack')) return 'attacked';
    if (did.has('threat')) return 'threatened';
    if (F.gotWater || F.gotHerb || r === 'travel') return 'helped';
    if (F.named || F.close || did.has('talk') || did.has('say')) return 'talked';
    if ([...did].some((a) => a !== 'leave')) return 'kept_distance';
    return 'passed_by';
  }

  async function girlScene(ui, did) {
    const { S, W, P, me } = ui;
    const G = W.npcs.lia;

    const R = () => Rel.get(W, 'lia', 'player');

      G.flags.heardStop = (G.flags.heardStop || 0) + 1;
      Social.meet(S, 'lia');
      ui.know('girl_hollow');
      const l = ['나무뿌리가 엉킨 움푹한 곳.', '거기, 사람이 있다.', '',

        '마른 가지가 발밑에서 부러진다.', '그녀의 고개가 번쩍 들린다.', '팔을 쥐고 있던 손이, 허리춤의 단검으로 향한다.', '',

    } else {
      await ui.page(['그녀는 아직 그 자리에 있다.', ...girlLook(ui, G)]);
    }

    let unread = false; // 방금 보여 준 결과를 아직 넘기지 않았다
    while (true) {
      const pi = W.worldFlags.pending.indexOf('magic:lia');
      const inviteReady = !G.flags.invited && G.flags.magicSeen && R().trust >= 40 && G.physical.health >= 15;
      // 다음 장면이 화면을 지우기 전에, 방금 일어난 일을 읽을 틈을 준다
      if (unread && (!G.alive || !Npc.present(W, G) || pi >= 0 || inviteReady)) await ui.more();
      unread = false;
      if (!G.alive) {
        await ui.page(['그녀가 더는 움직이지 않는다.', '몇 번을 불러도, 대답이 없다.']);
        await ui.more();
        return 'ok';
      }
      if (!Npc.present(W, G)) return 'ok';
      if (pi >= 0) { W.worldFlags.pending.splice(pi, 1); await magicScene(ui); }
      if (!G.flags.invited && G.flags.magicSeen && R().trust >= 40 && G.physical.health >= 15) {
        const r = await invite(ui);
        if (r !== 'ok') return r;
        continue;
      }

      Save.write(S);
      const F = G.flags;
      const weapon = Combat.weaponOf(me);
      const wname = weapon ? ITEM_DEFS[weapon].name : null;
      const word = sayable(ui);
      const opts = [];
      if (ui.knows('멈춰') && !F.stopped && !F.close && !F.named && R().trust < 25) opts.push({ id: 'stop', label: '멈춰 선다. 두 손을 펴 보인다', hint: '말을 안다' });
      if (!F.close) opts.push({ id: 'near', label: '다가간다' });
      if (!F.gotWater) opts.push({ id: 'water', label: '개울물을 떠다 건넨다' });
      opts.push({ id: 'wound', label: '상처를 살펴본다' });
      opts.push({ id: 'talk', label: '말을 걸어 본다' });
      if (word) opts.push({ id: 'say', label: '들은 말을 되풀이해 본다' });
      if (F.talked >= 2 && !F.named) opts.push({ id: 'name', label: '나를 가리키며 이름을 말한다' });
      if (me.inv.herb && !F.gotHerb) {
        opts.push(P.knowledge.herb_heals
          ? { id: 'herb', label: '쓴 풀을 짓이겨 상처에 대어 준다', hint: '안다' }

      }
      if (me.inv.berry && !F.sawBerry) opts.push({ id: 'berry', label: '붉은 열매를 건넨다' });
      opts.push({ id: 'wait', label: '거리를 두고 기다린다' });
      opts.push({ id: 'threat', label: me.inv.stone ? '돌을 쥐고 위협한다' : '주먹을 쥐고 위협한다' });

      opts.push({ id: 'leave', label: '그냥 지나간다', sep: true });
      const { idx, manner } = await ui.choose(opts);
      const a = opts[idx].id;

      // 삶의 기록: 사람을 대한 일 (물·풀을 건넨 것은 도움으로 따로 쌓인다)
      if (a !== 'leave' && a !== 'water' && a !== 'herb') LifeLog.act(S, a === 'threat' || a === 'attack' ? 'fight' : 'talk', { min: 5 });

          if (F.heardStop >= 2 && ui.learn('멈춰')) {

            Player.injure(S, 'cut', 20);
            ui.relate('lia', { hostility: 10 }, 'cornered');
            out.push('', '한 걸음 더 내딛는 순간, 칼끝이 팔을 스친다.', '뜨겁다. 피가 흐른다.', '그녀는 숨을 몰아쉬며 나를 노려본다.');

      } else if (a === 'water') {

        F.gotWater = true;
        me.surv.thirst = 0; // 개울에 간 김에 나도 마신다
        Social.help(S, 'player', 'lia', 'water', { trust: 10, suspicion: -5 }); // 그녀의 갈증과 충격은 도움 이벤트가 덜어 준다
        out = ['개울까지 가서, 넓은 잎을 접어 물을 담아 온다.', '돌아오는 사이 반은 흘렀다.', '',
          '그녀 앞 땅바닥에 잎을 내려놓고, 뒤로 물러선다.', '그녀는 한참 나를 노려보다가…… 잎을 집어 든다.', '단숨에 마신다.', '',
          ui.speak('「……[[물:10]].」'), '그녀가 빈 잎을 들어 보이며 같은 소리를 한 번 더 낸다.', '그리고 개울 쪽을 가리킨다.'];
