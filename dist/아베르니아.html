          ui.hurt(3, '그녀를 위협했다가 되레 쓰러졌다', 'lia');
          out = [me.inv.stone ? '돌을 쥐고 그녀를 노려본다.' : '주먹을 쥐고 한 걸음 내딛는다.', '',
            '그녀가 먼저 움직인다. 다친 사람의 움직임이 아니다.', '단검 자루가 명치에 꽂힌다. 숨이 막힌다.',
            ui.speak('「[[오지:30]] [[마:30]]!」'), '', '고개를 들었을 때, 그녀는 이미 숲 속으로 사라진 뒤다.'];
        } else {
          out = ['한 걸음 내딛는다.', '그녀의 눈에 공포가 스친다.', '그녀는 다친 팔을 끌어안고, 기다시피 숲 속으로 달아난다.',
            '핏자국이 풀 위로 길게 이어진다.'];
          Places.addTrace(W, me.loc, 'blood', { quiet: true });
        }
        Behavior.force(S, G, 'flee');
        W.worldFlags.feed.length = 0;
        out.push(...ui.pass(5));
        await ui.page(out);
        await ui.more();
        return me.hp <= 0 ? 'die' : 'ok';
      } else if (a === 'attack') {
        // 공격: 정답도 오답도 아니다. 다만 세계는 그것을 기억한다.
        const strong = G.physical.health >= 25;
        ui.use('str');
        Social.attack(S, 'player', 'lia', { weapon });
        const res = Combat.playerVsNpc(S, G, weapon);
        out = [weapon ? `${J(wname, '을를')} 치켜들고 달려든다.` : '주먹을 쥐고 달려든다.', ''];
        if (!res.hit) out.push('그녀가 몸을 비튼다. 허공을 가른다.');
        else if (res.killed) out.push('……둔한 소리.', '그녀의 몸이 나무뿌리 위로 무너진다.', '단검이 손에서 미끄러진다.', '', '움직이지 않는다.');
        else out.push('손에 둔한 감촉이 전해진다. 그녀가 비틀거린다.');
        if (G.alive) {
          if (strong) {
            ui.hurt(4, '그녀에게 달려들었다가 칼에 찔렸다', 'lia');
            Player.injure(S, 'stab', 40);
            out.push('', '그녀의 단검이 번뜩인다.', '옆구리가 뜨겁다. 무릎이 꺾인다.');
          }
          Behavior.force(S, G, 'flee');
          Places.addTrace(W, me.loc, 'blood', { quiet: true });
          out.push('', '고개를 들었을 때, 그녀는 피를 흘리며 숲 속으로 사라지고 있다.');
        }
        W.worldFlags.feed.length = 0;
        out.push(...ui.pass(5, { fight: true }));
        await ui.page(out);
        await ui.more();
        return me.hp <= 0 ? 'die' : 'ok';
      } else if (a === 'leave') {
        G.flags.lastSawPlayer = W.time.t;
        movePlayer(ui, 'stream');
        return 'leave';
      }

      out.push(...ui.pass(min));
      if (me.hp <= 0) { await ui.page([...out, '', '눈앞이 어두워진다.']); await ui.more(); return 'die'; }
      if (Npc.present(W, G) && G.alive) out.push('', ...girlLook(ui, G));
      await ui.page(out);
      unread = true;
    }
  }

  // ---------- 마을에 닿다 (이어서 마을 생활로) ----------
  // 마을이 어떤 모습인지는 그사이 세계에서 벌어진 일에 달려 있다 (소문, 리아의 생사와 위치, 문지기의 인상)
  function villageLines(ui) {
    const { S, W } = ui;
    const lia = W.npcs.lia;
    const gate = W.npcs.gatekeeper;
    const onDuty = gate && gate.alive && Npc.at(W, 'gatekeeper', 'village_gate');
    const heard = (type) => gate && Object.keys(gate.knowledge.rumors).some((id) => W.rumors[id] && W.rumors[id].type === type && (W.rumors[id].subject === 'player' || W.rumors[id].target === 'lia'));
    const r = gate ? Rel.get(W, 'gatekeeper', 'player') : null;
    const liaIn = lia.alive && Places.regionOf(lia.location.loc) === 'village';
    if (!lia.alive && (heard('died') || W.regions.village.alert >= 60)) {
      return ['울타리 앞에 사람이 여럿 서 있다. 모두 손에 무언가를 들고 있다.', '그중 하나가 나를 가리키며 무언가 외친다.',
        ui.speak('「[[거기:15]] [[서:10]]! [[누구:20]]야!」', 'gatekeeper'), '', '알아들을 수 없다.', '……무언가가, 이미 벌어진 뒤다.'];
    }
    if (!onDuty) {
      return ['울타리 앞에는 아무도 없다.', Time.dark(W.time.t) ? '집들 사이로 불빛 몇 개가 새어 나온다.' : '어디선가 개 짖는 소리가 들린다.'];
    }
    if (r && (r.hostility >= 30 || heard('threatened') || heard('attacked'))) {
      return ['울타리 앞의 남자가 나를 보자마자 창끝을 겨눈다.', ui.speak('「[[가:30]]! [[오지:30]] [[마:30]]!」', 'gatekeeper'),
        '', '알아들을 수 없다.', '……그런데 그 눈빛은, 나를 알고 있는 눈빛이다.'];
    }
    // 그녀가 먼저 마을에 닿아 있고 나를 믿는다면, 울타리의 소란을 듣고 나온다
    if (liaIn && Rel.get(W, 'lia', 'player').trust >= 30) {
      Npc.place(S, lia, 'village_gate');
      Rel.change(S, 'gatekeeper', 'player', { suspicion: -30, trust: 10 }, 'vouched');
      W.worldFlags.vouched = true;
      return ['울타리 앞의 남자가 나를 보더니, 뒤를 돌아보며 무언가 외친다.', '……집들 사이에서, 팔에 천을 감은 여자가 나온다.',
        '리아다.', '그녀가 나를 보고, 아주 조금 웃는다.'];
    }
    return ['울타리 앞의 남자가 나를 보고 무언가 외친다.', '「……!」', '', '알아들을 수 없다.', '……대체, 이 세계는 뭐지?'];
  }

  // 혼자 숲의 가장자리에 닿았다
  async function arrival(ui) {
    const { S, W } = ui;
    W.worldFlags.seen.arrival = true;
    const lia = W.npcs.lia;
    const liaIn = lia.alive && Places.regionOf(lia.location.loc) === 'village';
    const lines = ['몇 시간을 걸었다.', '다리가 후들거리고, 목이 탄다.', '', '나무 사이가 성겨진다.', '숲이 끝나는 곳에 낮은 울타리와 지붕들이 보인다.',
      '사람이 있다.', '', ...(lia.flags.met && !liaIn ? ['……그녀는 어디로 갔을까.', ''] : [])];
    movePlayer(ui, 'village_gate');
    lines.push(...villageLines(ui));
    await ui.page(lines);
    await ui.more();
    return 'ok';
  }

  // 리아를 따라 마을까지 걷는다 (동행). 울타리에서 그녀가 나를 보증해 준다.
  async function arriveWith(ui) {
    const { S, W, me } = ui;
    const G = W.npcs.lia;
    W.worldFlags.seen.arrival = true;
    W.worldFlags.cameWithLia = true;
    Companion.join(S, 'lia');
    const route = Places.route(me.loc, 'village_gate');
    await ui.page(['그녀를 따라 걷는다.', '그녀는 몇 걸음마다 뒤를 돌아본다. 내가 따라오는지 확인하는 것처럼.']);
    // 숲을 빠져나가는 동안 (둘 다 숲의 가장자리 쪽에 있는 것으로 둔다)
    movePlayer(ui, 'edge');
    Npc.place(S, G, 'edge');
    const walk = ui.pass(route ? route.min - 20 : 200, { move: true });
    movePlayer(ui, 'village_gate');
    Npc.place(S, G, 'village_gate');
    const lines = [...walk.filter((l) => l !== ''), '',
      Time.band(W.time.t) === 'evening' ? '해가 기울 무렵, 나무 사이가 성겨진다.' : '나무 사이가 성겨진다.',
      '숲이 끝나는 곳에 낮은 울타리와 지붕들이 보인다.', '굴뚝에서 연기가 오른다.', '',
      '리아가 걸음을 멈추고 나를 돌아본다.', ui.speak('「[[어서:40]] [[와:40]]. [[여기가:60]] [[마을:20]]이야.」', 'lia'), '',
      '그녀가 무슨 말을 했는지, 전부는 모른다.', '하지만 언젠가는 알게 될 것이다.'];
    // 울타리를 지키는 사람에게 나를 보증한다
    const gk = W.npcs.gatekeeper;
    if (gk && gk.alive && Npc.at(W, 'gatekeeper', 'village_gate')) {
      Rumor.exchange(S, G, gk);
      Rel.change(S, 'gatekeeper', 'player', { suspicion: -30, trust: 10 }, 'vouched');
      W.worldFlags.vouched = true;
      lines.push('', '울타리 앞의 남자가 리아를 보고 달려온다.', '둘이 빠르게 말을 주고받는다. 남자가 나를 한 번 훑어본다.', '……그리고 길을 비켜 준다.');
    }
    // 그녀는 집으로 간다. 함께 다니고 싶으면 다시 청해야 한다.
    Companion.leave(S, 'lia', 'home');
    Goals.add(G, { id: 'return_home', type: 'personal', priority: 90 }, W.time.t);
    lines.push('', '리아가 집들 쪽을 가리키더니, 먼저 걸어 들어간다.', '처마 밑에 마른 풀을 잔뜩 매단 집으로 들어간다.');
    Npc.startMove(S, G, G.location.home);
    W.worldFlags.feed.length = 0;
    await ui.page(lines);
    await ui.more();
    return 'ok';
  }

  return { beast, light, call, status, allocate, checkBody, girl, peopleLines, arrival, arriveWith, villageLines };
})();

if (typeof module !== 'undefined') module.exports = { Scenes };

</script>
<script>/* js/engine.js */
// 화면과 게임 흐름: 시작 연출 → 기억 → 이름 → 숲 자유 탐색.
// 게임 상태는 S = { P, W } 하나다. P는 플레이어가 아는 것, W는 세계다. 둘 다 계속 쌓이고 함께 저장된다.
(() => {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const app = $('#app'), story = $('#story'), choicesEl = $('#choices'), hudEl = $('#hud'), barEl = $('#bar');
  const freeRow = $('#freeRow'), freeInput = $('#free');

  const S = { P: Persist.create(), W: World.create(0) };
  const DIE = { die: true }; // 장면 도중 개발용 강제 죽음
  let skip = false, wake = null, cancelChoice = null;
  let resting = null; // 숲·마을에서 다음 행동을 고르는 중이면 { opts } (장면 한가운데가 아니다)

  const fmt = (s) => Text.fmt(s, { 이름: S.P.name });
  const me = () => S.W.player;
  const flags = () => S.W.worldFlags;

  // ---------- 출력 ----------
  function wait(ms) {
    return new Promise((res) => {
      const t = setTimeout(() => { wake = null; res(); }, ms);
      wake = () => { clearTimeout(t); wake = null; res(); };
    });
  }

  // who: 말하는 NPC의 id (대사 줄에만). 화면이 이름표를 붙인다 (디자인_가이드.md 9절 요청 7)
  // parts: 낯선 소리 조각 — <span class="foreign">으로 감싼다. 글자(textContent)는 text와 같다
  function addLine(text, cls, who, parts) {
    const p = document.createElement('p');
    p.className = 'line' + (text === '' ? ' gap' : '') + (cls ? ' ' + cls : '');
    if (who) p.dataset.who = who;
    if (parts) {
      parts.forEach((x) => {
        if (!x.foreign) { p.appendChild(document.createTextNode(fmt(x.s))); return; }
        const sp = document.createElement('span');
        sp.className = 'foreign';
        sp.textContent = x.s;
        p.appendChild(sp);
      });
    } else p.textContent = fmt(text);
    story.appendChild(p);
    void p.offsetWidth; // 강제 리플로우: 다음 줄에서 클래스를 붙여도 전환 효과가 난다
    p.classList.add('in');
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }

  // 줄을 하나씩 보여 준다. 클릭/Space/Enter로 나머지를 한 번에 보여 줄 수 있다.
  async function say(lines, { pace = 520, cls = '' } = {}) {
    skip = false;
    const stop = () => { skip = true; if (wake) wake(); };
    const onKey = (e) => {
      if ((e.key === 'Enter' || e.key === ' ') && document.activeElement.tagName !== 'INPUT') stop();
    };
    app.addEventListener('pointerdown', stop);
    document.addEventListener('keydown', onKey);
    try {
      for (let i = 0; i < lines.length; i++) {
        const o = typeof lines[i] === 'string' ? { t: lines[i] } : lines[i];
        addLine(o.t, o.cls || cls, o.who, o.parts);
        if (!skip && o.t !== '' && i < lines.length - 1) await wait(o.pause || pace);
      }
    } finally {
      app.removeEventListener('pointerdown', stop);
      document.removeEventListener('keydown', onKey);
    }
  }

  // 클릭이나 Space/Enter를 기다린다.
  function more() {
    return new Promise((res) => {
      const hint = document.createElement('div');
      hint.className = 'more';
      hint.textContent = '▾';
      story.appendChild(hint);
      const armAt = performance.now() + 300;
      const done = (e) => {
        if (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;
        if (performance.now() < armAt) return;
        app.removeEventListener('click', done);
        document.removeEventListener('keydown', done);
        hint.remove();
        res();
      };
      app.addEventListener('click', done);
      document.addEventListener('keydown', done);
    });
  }

  function clearPage() {
    story.innerHTML = '';
    choicesEl.innerHTML = '';
    freeRow.hidden = true;
    window.scrollTo(0, 0);
  }

  // 선택지를 띄우고 고른 결과를 반환한다. { idx } | { text } | { die } | { refresh } | { reload }
  // 고른 버튼에는 .picked가 붙고, 잠깐(PICK_MS) 보인 뒤에 진행한다 (디자인_가이드.md 9절 요청 2)
  const PICK_MS = 250;
  function choose(options, { free = false } = {}) {
    return new Promise((res) => {
      choicesEl.innerHTML = '';
      const armAt = performance.now() + 300;
      const buttons = [];
      let done = false;
      const finish = (v) => {
        if (done) return;
        done = true;
        document.removeEventListener('keydown', onKey);
        freeRow.onsubmit = null;
        cancelChoice = null;
        const end = () => { choicesEl.innerHTML = ''; freeRow.hidden = true; res(v); };
        const b = v.idx != null ? buttons[v.idx] : null;
        if (b) { b.classList.add('picked'); setTimeout(end, PICK_MS); } else end();
      };
      options.forEach((o, i) => {
        if (o.sep) { const s = document.createElement('div'); s.className = 'sep'; choicesEl.appendChild(s); }
        const b = document.createElement('button');
        b.className = 'choice';
        b.disabled = !!o.disabled;
        const n = document.createElement('span'); n.className = 'num'; n.textContent = i + 1;
        const l = document.createElement('span'); l.className = 'lbl'; l.textContent = fmt(o.label);
        b.append(n, l);
        if (o.hint) { const h = document.createElement('span'); h.className = 'hint'; h.textContent = '· ' + o.hint; b.append(h); }
        b.onclick = () => { if (performance.now() >= armAt) finish({ idx: i }); };
        buttons.push(b);
        choicesEl.appendChild(b);
      });
      choicesEl.classList.remove('in');
      void choicesEl.offsetWidth;
      choicesEl.classList.add('in');
      const onKey = (e) => {
        if (document.activeElement.tagName === 'INPUT') return;
        const i = e.key === '0' ? 9 : parseInt(e.key, 10) - 1;
        if (i >= 0 && i < options.length && !options[i].disabled) finish({ idx: i });
      };
      document.addEventListener('keydown', onKey);
      cancelChoice = finish;
      if (free) {
        freeRow.hidden = false;
        freeInput.value = '';
        freeRow.onsubmit = (e) => {
          e.preventDefault();
          const text = freeInput.value.trim();
          if (text) finish({ text });
        };
      }
    });
  }

  // 장면 안의 선택: 자유 입력도 받는다 (통합 명세 34절). 알아듣지 못한 입력은 다시 묻는다.
  async function sceneChoose(opts) {
    while (true) {
      const r = await choose(opts, { free: true });
      if (r.die) throw DIE;
      if (r.refresh) continue;
      if (r.idx != null) return { idx: r.idx, manner: null };
      const m = Intent.match(opts, r.text);
      if (m) return { idx: opts.indexOf(m.option), manner: m.manner };
      await say(['……어떻게 해야 할지 모르겠다.'], { cls: 'dim' });
    }
  }

  // 이름 입력
  function askName() {
    return new Promise((res) => {
      choicesEl.innerHTML = '';
      const form = document.createElement('form');
      form.className = 'nameRow';
      const input = document.createElement('input');
      input.maxLength = 8;
      input.placeholder = '이름';
      input.autocomplete = 'off';
      const btn = document.createElement('button');
      btn.className = 'choice go';
      btn.textContent = '이 이름이다';
      const err = document.createElement('p');
      err.className = 'err';
      form.append(input, btn, err);
      choicesEl.appendChild(form);
      choicesEl.classList.add('in');
      input.focus();
      form.onsubmit = (e) => {
        e.preventDefault();
        const v = input.value.replace(/\s+/g, ' ').trim();
        if (!/^[가-힣a-zA-Z0-9 ]{1,8}$/.test(v)) {
          err.textContent = '……이름이 흐릿하다. (한글·영문·숫자 1~8자)';
          return;
        }
        choicesEl.innerHTML = '';
        res(v);
      };
    });
  }

  // 위: 날과 시간대, 장소 / 아래: 몸 상태를 느낌으로 (통합 명세 37절)
  function setHud() {
    const t = S.W.time.t;
    const d = Time.day(t);
    hudEl.textContent = `${d > 1 ? Time.dayLabel(t) + ' ' : ''}${Time.KO[Time.band(t)]} · ${Places.name(me().loc)}`;
    barEl.textContent = Player.barWords(S.W).map(([k, v]) => `${k} ${v}`).join('　·　');
    document.body.dataset.band = Time.band(t); // 시간대 색 연출 (style.css)
  }
  function clearHud() { hudEl.textContent = ''; barEl.textContent = ''; delete document.body.dataset.band; }

  // ---------- 시작 연출 ----------
  async function blackout(lines, pace) {
    document.body.classList.add('black');
    clearHud();
    clearPage();
    await say(lines, { pace, cls: 'center' });
    await more();
    clearPage();
    await say(['눈을 뜬다.'], { cls: 'center' });
    await wait(1400);
    document.body.classList.remove('black');
    clearPage();
    await wait(1600);
  }

  async function intro() {
    // 개발용: 주소 끝에 ?dev 를 붙이면 연출과 이름 입력을 건너뛴다
    if (/[?&]dev\b/.test(location.search)) { S.P.name = '민준'; S.P.memory.name = true; return; }
    await blackout([
      '어둡다.', '', '춥다.', '', '몸이 젖어 있다.', '', '흙 냄새가 난다.', '',
      '그리고 어디선가 물 흐르는 소리가 들린다.',
    ], 1100);
    await say([
      '나무가 있다. 아주 높다.',
      '가지 사이로 조각난 하늘이 보인다.',
      '풀 사이로 작은 계곡의 물빛이 어른거린다.',
      '이끼 낀 바위. 이름을 모르는 식물들.',
      '',
      '……',
    ], { pace: 800 });
    await more();
    clearPage();
    await memoryScene();
  }

  async function memoryScene() {
    const P = S.P;
    await say(['……여기가 어디지?', '나는……', '……어떻게 여기에 왔지?'], { pace: 900 });
    const used = new Set();
    const menu = [
      { id: 'name', label: '내 이름을 떠올린다.' },
      { id: 'last', label: '마지막으로 기억나는 순간을 떠올린다.' },
      { id: 'family', label: '가족을 떠올린다.' },
      { id: 'place', label: '내가 있던 장소를 떠올린다.' },
      { id: 'none', label: '아무것도 생각하지 않는다.' },
    ];
    const fragments = {
      last: ['마지막으로 기억나는 순간을 더듬는다.', '……문이 닫히는 소리. 어딘가로 가고 있었다. 누군가에게 무언가를 말하려 했다.', '거기서, 뚝 끊겨 있다.'],
      family: ['가족을 떠올린다.', '……누군가의 얼굴이 스친다. 얼굴만. 이름은 나오지 않는다.', '그런데 이상하게, 가슴이 먹먹하다.'],
      place: ['내가 있던 곳을 떠올린다.', '……익숙한 방. 창으로 들어오는 아침빛. 멀리서 들리던 소음.', '하지만 어디였는지는 떠오르지 않는다.'],
    };
    while (true) {
      const opts = menu.filter((m) => !used.has(m.id));
      const { idx } = await choose(opts);
      const id = opts[idx].id;
      clearPage();
      if (id === 'name' || id === 'none') {
        if (id === 'none') {
          await say(['눈을 감고 머리를 비운다.', '바람 소리. 물소리. 내 숨소리.', '……조금 진정된다.', '그래도, 이름은 떠올려야 한다.']);
        } else {
          await say(['이름을 떠올려 본다.', '……그래.']);
        }
        await say(['내 이름은……'], { pace: 600 });
        P.name = await askName();
        P.memory.name = true;
        clearPage();
        await say([
          `……{이름}.`, '적어도 이것 하나는 기억난다.', '내 이름.', '',
          '주변에는 아무도 없다.', '혼자다.', '', '일단, 움직여야 한다.',
        ], { pace: 800 });
        await more();
        return;
      }
      used.add(id);
      if (id === 'last') P.memory.lastMoment = 'fragment';
      if (id === 'family') P.memory.family = 'fragment';
      if (id === 'place') P.memory.previousLocation = 'fragment';
      await say(fragments[id], { pace: 750 });
      await say(['', '……여기까지다. 더는 떠오르지 않는다.'], { pace: 700 });
    }
  }

  // 쓰러진다 (체력 0). 죽지 않는다: 구조되거나 깨어나고, 대가가 남는다 (play/collapse.js, RULES.collapse [임시])
  async function collapse() {
    clearPage();
    clearHud();
    await say(['다리에서 힘이 빠진다.', '눈앞이 어두워진다.'], { pace: 1000 });
    document.body.classList.add('black');
    await wait(1200);
    clearPage();
    const met = (n) => Memory.has(n, 'player', 'met');
    const r = Collapse.resolve(S, me().cause);
    await say([{ t: '……', cls: 'center' }], { pace: 900 });
    await more();
    document.body.classList.remove('black');
    clearPage();
    setHud();
    const lines = [];
    if (r.again) lines.push({ t: '……또 쓰러졌다. 몸이 버텨 주지 않는다.', cls: 'dim' }, '');
    if (r.rescuer) {
      const w = Narrative.who(S, r.rescuer, !met(r.rescuer));
      const hi = Dialogue.process(S, { speakerId: r.rescuer.id, listenerId: 'player', dialogueId: 'are_you_ok' });
      lines.push('누군가 나를 흔드는 느낌에 눈을 뜬다.', `${w}${Text.josa(w, '이가')} 곁에 앉아 있다.`, '상처에 무언가가 감겨 있다.', Lang.line(hi, r.rescuer.id));
      if (hi.tone && !hi.fullyUnderstood) lines.push(hi.tone);
    } else {
      lines.push('눈을 뜬다.', '얼마나 누워 있었는지 모르겠다.', Time.dark(S.W.time.t) ? '주위가 캄캄하다.' : '빛의 기울기가 달라져 있다.');
      if (r.lost) { const l = Player.label(r.lost, S.P); lines.push(`주머니가 가볍다. ${l}${Text.josa(l, '이가')} 없다.`); }
    }
    const f = Player.hpFeeling(me());
    if (f) lines.push('', f);
    Save.write(S);
    await say(lines);
    await more();
  }

  // 첫날 밤 보호 중에 장면이 죽음으로 끝났다 (밤의 목소리 등) [결정 #6]: 쓰러지지 않는다.
  // 정신이 아득해졌다가 돌아오고, 탈진과 시간만 남는다. [임시] 문장 — 장면의 결말은 스토리가 다시 쓴다
  async function shaken() {
    const R = RULES.protection;
    clearPage();
    await say(['눈앞이 하얘진다.', '……'], { pace: 900 });
    World.tick(S, R.shakenMin, { unconscious: true });
    flags().feed.length = 0;
    const m = me();
    m.hp = Math.max(m.hp, R.minHp);
    m.surv.fatigue = Math.min(100, m.surv.fatigue + R.shakenFatigue);
    Save.write(S);
    await say(['', '정신을 차리니 차가운 흙바닥 위다.', '온몸이 떨린다. 무슨 일이 있었는지 제대로 떠오르지 않는다.'], { pace: 800 });
    await more();
  }

  // 예전 저장 파일에서 이름만 가져와 새로 시작할 때
  async function wakeAgain() {
    await blackout(['젖은 흙.', '', '물 흐르는 소리.'], 1100);
  }

  // ---------- 장면 도구 ----------
  const ui = {
    get S() { return S; },
    get P() { return S.P; },
    get W() { return S.W; },
    get me() { return S.W.player; },
    talker: null, // 지금 마주한 NPC (말을 하는 사람)
    async page(lines, opt) { clearPage(); setHud(); await say(lines, opt); },
    say: (lines, opt) => say(lines, opt),
    choose: (opts) => sceneChoose(opts),
    more: () => more(),
    pass: (min, opt) => passTime(min, opt),
    lose: () => Collapse.lose(S), // 정신을 잃었다가 새벽 직전 낯선 자리에서 깨어난다 (밤의 목소리)
    // 대사 줄 { t, cls: 'speech', who } — 말하는 사람은 by, 없으면 지금 마주한 사람
    speak(str, by) { const who = by || ui.talker; return Lang.line(Dialogue.process(S, { speakerId: who, listenerId: 'player', text: str }), who); },
    // 새 단어의 뜻을 알아내면 이해도가 오른다. 이미 알던 단어면 false.
    learn: (word, o) => Lang.learn(S, word, o),
    guess: (word) => Lang.guess(S, word),
    knows: (word) => Lang.knows(S, word),
    // 알아낸 사실은 처음 알아낸 시각을 남긴다 (기록 화면이 날짜별로 묶는다. 디자인_가이드.md 9절 요청 6)
    know(id) { if (!S.P.knowledge[id]) S.P.knowledge[id] = S.W.time.t; Explore.onFact(S, id); Clues.onFact(S, id); },
    use(k) { Player.use(S, k); },
    chance: (p) => Rng.chance(S.W, p),
    pick: (a) => Rng.pick(S.W, a),
    hurt: (n, cause, by) => Player.hurt(S, n, cause, by),
    npc: (id) => S.W.npcs[id],
    rel: (id) => Rel.get(S.W, id, 'player'),
    relate: (id, d, cause) => Rel.change(S, id, 'player', d, cause),
  };

  // ---------- 숲 탐색 ----------
  const ctx = () => {
    const W = S.W, t = W.time.t;
    return {
      W, P: S.P, me: W.player, period: Time.band(t), dark: Time.dark(t),
      first(key) { if (W.worldFlags.seen[key]) return false; W.worldFlags.seen[key] = true; return true; },
      give(item, cap) {
        const n = W.worldFlags.counts[item] || 0;
        if (n >= cap) return false;
        W.worldFlags.counts[item] = n + 1;
        Player.give(W.player, item);
        return true;
      },
      know(id) { ui.know(id); },
      use(k) { Player.use(S, k); },
    };
  };

  // 지금 있는 곳: 장소 묘사 + 날씨 + 보지 못한 사이 남은 흔적 + 곁에 있는 사람
  function placeLines() {
    const W = S.W;
    const loc = me().loc;
    const lines = LOCS[loc].desc(ctx());
    const extra = Weather.SKY_EXTRA[W.weather.kind];
    if (extra) lines.push(extra);
    const tr = Narrative.traceLines(S, loc);
    if (tr.length) lines.push('', ...tr);
    return lines;
  }

  // 시간이 흐른다: 세계 전체가 함께 움직인다 (월드 틱)
  function passTime(min, opt = {}) {
    if (min <= 0) return takeNotes();
    const W = S.W;
    const r = World.tick(S, min, opt);
    if (Time.day(W.time.t) >= 2 && Time.clock(W.time.t) >= 6 * 60) flags().day2Acts++;
    return [...(r.lines.length ? ['', ...r.lines] : []), ...(r.body.length ? ['', ...r.body] : []), ...takeNotes()];
  }

  function takeNotes() {
    const f = flags();
    const out = [];
    if (f.feed.length) out.push('', ...f.feed.splice(0));
    if (f.notes.length) out.push('', ...f.notes.splice(0));
    return out;
  }

  function doAction(a) {
    const lines = a.run(ctx());
    Explore.didAction(S, me().loc, a.id);
    return [...lines, ...passTime(a.min)];
  }

  // 자리를 옮긴다. 함께 다니는 사람도 따라온다 (따라오지 않으면 그 줄을 돌려준다)
  function moveTo(to) {
    const from = me().loc;
    me().loc = to;
    Bus.emit(S, 'PLAYER_MOVED', { from, to });
    return Companion.onMove(S, from, to);
  }

  function doMove(e) {
    const g = ctx();
    const blocked = e.block && e.block(g);
    if (blocked) return [...blocked.lines, ...passTime(blocked.min)];
    const lines = [...e.text];
    // 밤에 돌아다니면 어둠 속의 무언가와 마주칠 수 있다 (그것이 지나는 곳을 밟으면)
    if (Creatures.nightStrike(S, me().loc, e.to)) {
      Player.hurt(S, 2, '어둠 속의 무언가에게 당했다', 'shade');
      Player.injure(S, 'scratch', 25);
      Player.use(S, 'sen');
      lines.push('', '어둠 속에서 무언가가 발목을 스친다.', '날카로운 통증. 돌아봤을 때는 아무것도 없다.');
    }
    if (e.use) Player.use(S, e.use);
    lines.push(...moveTo(e.to));
    lines.push(...passTime(e.min, { move: true }));
    // 그녀보다 먼저 도착하면, 그녀가 올 때까지 기다린다
    const lia = S.W.npcs.lia;
    if (e.to === 'hollow' && lia.alive && lia.location.transit && lia.location.dest === 'hollow' && lia.location.nextAt > S.W.time.t) {
      lines.push('', '아직 아무도 없다.', '뿌리 사이에 몸을 낮추고 기다린다.', ...passTime(Math.ceil(lia.location.nextAt - S.W.time.t)),
        '', '……발소리. 누군가 비틀거리며 다가온다.');
      return lines;
    }
    lines.push('', ...placeLines());
    return lines;
  }

  function eatBerry() {
    const P = S.P, m = me();
    Player.take(m, 'berry');
    m.surv.hunger = Math.max(0, m.surv.hunger - 25);
    const knew = P.knowledge.berry_poison;
    m.ateBerry = true;
    ui.know('berry_poison');
    Player.hurt(S, 3, '붉은 열매의 독에 당했다', 'berry');
    Player.sicken(S, 'poison', 180);
    return [
      knew ? '먹으면 안 된다는 걸 알면서도, 허기를 이기지 못한다.' : '열매를 하나 입에 넣는다. 달다. 하나 더.',
      '……얼마 지나지 않아 배 속이 뒤틀린다.',
      '무릎을 꿇고 전부 게워 낸다. 식은땀이 흐른다.',
      '한참을 그렇게 웅크려 있었다.',
      ...(knew ? [] : [{ t: '……이건 먹으면 안 되는 거였다.', cls: 'know' }]),
      ...passTime(60),
    ];
  }

  function chewHerb() {
    const m = me();
    Player.take(m, 'herb');
    m.surv.hunger = Math.max(0, m.surv.hunger - 3);
    return ['쓴 풀을 씹어 본다.', '혀가 오그라들 만큼 쓰다. 삼키지 못하고 뱉는다.', ...passTime(5)];
  }

  // 아는 것을 쓴다: 피를 멎게 하는 풀 (지식이 새 선택지를 연다)
  function treatSelf() {
    Player.take(me(), 'herb');
    Player.treat(S);
    return ['쓴 풀을 두 손으로 비벼 짓이긴다.', '상처에 꾹 누른다. 눈앞이 하얘질 만큼 쓰라리다.', '……피가 멎는다.', ...passTime(10)];
  }

  function notebookLines() {
    const P = S.P;
    const known = Object.keys(KNOW).filter((k) => P.knowledge[k]);
    return ['알고 있는 것을 하나씩 되짚는다.', '', ...known.map((k) => ({ t: '· ' + KNOW[k], cls: 'note' })), ...Clues.lines(S)];
  }

  const liaWounded = () => S.W.events.scheduled.some((e) => e.type === 'lia_wounded' && e.done);

  // 둘째 날, 그녀가 있는 곳으로 가는 길
  function girlExit() {
    if (!liaWounded()) return null;
    if (!['clearing', 'stream', 'deep'].includes(me().loc)) return null;
    if (flags().seen.teaser) return { to: 'hollow', label: '피 냄새가 나던 쪽으로 간다', min: 20, kw: ['피', '냄새'], text: ['피 냄새를 기억하며 걷는다.'] };
    if (S.P.knowledge.girl_hollow) {
      return { to: 'hollow', label: '뿌리가 엉킨 움푹한 곳으로 간다', hint: '안다', min: 20, kw: ['움푹', '그녀', '여자'],
        text: ['이 숲에서 어디로 가야 하는지, 나는 안다.'] };
    }
    return null;
  }

  function buildOptions() {
    const P = S.P, m = me();
    const L = LOCS[m.loc];
    const g = ctx();
    const opts = [];
    L.actions.forEach((a) => opts.push({ label: a.label, kw: a.kw, run: () => doAction(a) }));
    opts.push(...Life.options(S, passTime)); // 일, 잠자리, 잠, 가게, 동행과 헤어지기
    // 이미 아는 사람이 곁에 있으면 내가 다가갈 수 있다
    // 부르는 말이 겹치면("남자"와 "남자") 겉모습 전체로 부른다 ("창을 든 남자", "앞치마를 두른 남자")
    const near = Npc.here(S.W, m.loc).filter((n) => !n.location.hidden && Memory.has(n, 'player', 'met') && !(n.id === 'lia' && m.loc === 'hollow'));
    const short = near.map((n) => Narrative.who(S, n));
    near.forEach((n, i) => {
      const w = short.indexOf(short[i]) !== short.lastIndexOf(short[i]) ? Narrative.who(S, n, true) : short[i];
      opts.push({ label: `${w}에게 다가간다`, kw: [w], scene: 'meet:' + n.id });
    });
    const exits = L.exits.filter((e) => !e.show || e.show(g));
    const ge = girlExit();
    if (ge) exits.push(ge);
    Explore.seeExits(S, exits);
    exits.forEach((e, i) => {
      const h = typeof e.hint === 'string' ? e.hint : e.hint && P.knowledge[e.hint[0]] ? e.hint[1] : null;
      opts.push({ label: e.label, hint: h, kw: e.kw, sep: i === 0, to: e.to, min: e.min, run: () => doMove(e) });
    });
    const G = GLOBAL_ACTIONS;
    opts.push({ label: G.listen.label, kw: G.listen.kw, sep: true,
      run: () => { LifeLog.act(S, 'explore', { min: G.listen.min }); return [...listenLines(ctx()), ...passTime(G.listen.min)]; } });
    opts.push({ label: G.bag.label, kw: G.bag.kw, run: () => bagLines(S) });
    if (m.inv.berry) opts.push({ label: '붉은 열매를 먹는다', kw: ['먹', '열매'], hint: P.knowledge.berry_poison ? '독이다' : null, run: eatBerry });
    if (m.inv.herb && Player.bleeding(S.W) && P.knowledge.herb_heals) opts.push({ label: '쓴 풀을 짓이겨 상처에 댄다', kw: ['상처', '풀'], hint: '안다', run: treatSelf });
    else if (m.inv.herb) opts.push({ label: '쓴 풀을 씹어 본다', kw: ['씹'], run: chewHerb });
    if (m.status.unlocked) opts.push({ label: '몸 상태를 확인한다', kw: ['상태', '몸'], scene: 'body' });
    if (LangUI.hasAny(S)) opts.push({ label: '들은 말을 되뇐다', kw: ['말', '단어', '언어'], run: () => LangUI.notebook(S) });
    if (Object.keys(KNOW).some((k) => P.knowledge[k]) || Object.keys(P.clues).length) {
      opts.push({ label: '기억을 되짚는다', kw: ['기억', '되짚', '수첩'], run: notebookLines });
    }
    if (g.dark) {
      opts.push({ label: '밤이 지나가기를 기다린다', kw: G.rest.kw, run: () => [
        '나무에 등을 기대고 웅크린다.',
        '잠은 오지 않는다. 눈을 감아도 숲의 소리가 들린다.',
        '몇 번이고 눈을 뜨고, 다시 감는다.',
        ...passTime(Time.untilDawn(S.W.time.t), { rest: true }),
      ] });
    } else {
      opts.push({ label: '잠시 쉰다', kw: G.rest.kw, run: () => {
        LifeLog.act(S, 'rest', { min: 30 });
        return ['나무에 등을 기대고 잠시 숨을 고른다.', '심장이 천천히 가라앉는다.', ...passTime(30, { rest: true })];
      } });
    }
    return opts;
  }

  // 지금 벌어져야 할 장면: 우선순위 표(play/order.js)의 위에서부터 하나
  const nextScene = () => SceneOrder.next(S);

  async function runScene(sc) {
    if (sc.startsWith('meet:')) return Encounter.run(ui, sc.slice(5));
    if (sc.startsWith('incident:')) return Incidents.runScene(ui, sc);
    return Scenes[sc](ui);
  }

  async function explore() {
    Knowledge.location(S, me().loc, 'visited'); // 눈을 뜬 곳
    let carry = placeLines();
    let lastHp = me().hp;
    while (true) {
      clearPage();
      setHud();
      if (me().hp < lastHp) { const f = Player.hpFeeling(me()); if (f) carry = [...carry, '', f]; }
      lastHp = me().hp;
      await say(carry);
      if (me().hp <= 0) {
        await say(['', '더는 몸을 가눌 수 없다.', '흙바닥이 뺨에 닿는다.'], { pace: 900 });
        await more();
        return 'die';
      }
      const sc = nextScene();
      // 둘째 날 아침: 바람에 피 냄새가 실려 온다 (표의 마지막 줄)
      if (sc === 'teaser') {
        flags().seen.teaser = true;
        await say(['', '바람에 실려 무언가가 코끝을 스친다.', '……피 냄새다.'], { pace: 1200 });
        const { idx } = await choose([{ label: '냄새를 따라간다' }, { label: '모른 척한다' }]);
        if (idx === 0) {
          moveTo('hollow');
          carry = ['냄새를 따라 걷는다. 비릿한 냄새가 점점 짙어진다.', ...passTime(20, { move: true })];
          continue;
        }
        carry = ['냄새가 나는 쪽에서 등을 돌린다.', '……신경 쓰이지 않는다면 거짓말이다.'];
        continue;
      }
      if (sc) {
        if (carry.length) await more();
        let res;
        try {
          res = await runScene(sc);
          // 리아를 따라 마을까지 함께 걷는다
          if (res === 'travel') res = await Scenes.arriveWith(ui);
        } catch (e) { if (e === DIE) return 'die'; throw e; }
        ui.talker = null;
        if (res === 'die' || me().hp <= 0) return 'die';
        carry = res === 'leave'
          ? ['그녀를 두고 자리를 뜬다.', ...passTime(15), '', ...placeLines()]
          : placeLines();
        lastHp = me().hp;
        continue;
      }

      Save.write(S);
      const opts = buildOptions();
      resting = { opts }; // 장면 밖에서 선택을 기다린다: 저장·불러오기·지도 이동이 안전한 때
      const pick = await choose(opts, { free: true });
      resting = null;
      if (pick.reload) return 'reload';
      if (pick.die) return 'die';
      if (pick.refresh) { carry = placeLines(); continue; }
      let o = pick.idx != null ? opts[pick.idx] : null;
      if (!o && pick.text) { const m = Intent.match(opts, pick.text); o = m && m.option; }
      if (!o) { carry = ['……어떻게 해야 할지 모르겠다.']; continue; }
      if (o.scene) {
        try {
          if (o.scene === 'body') await Scenes.checkBody(ui);
          else if (o.scene === 'shop') await Shop.run(ui);
          else { const r = await runScene(o.scene); ui.talker = null; if (r === 'die') return 'die'; }
        } catch (e) { if (e === DIE) return 'die'; throw e; }
        if (me().hp <= 0) return 'die';
        carry = placeLines();
        continue;
      }
      carry = o.run();
    }
  }

  // ---------- 흐름 ----------
  // title: 시작 화면(UITitle)이 고른 것 — 'continue' | 'new' | { slot } | null (시작 화면이 없으면 여기서 묻는다)
  async function titleMenu(title) {
    const slot = title && title.slot != null ? title.slot : null;
    const s = Save.read(slot);
    if (!s) return false;
    let fresh = title === 'new';
    if (!title) {
      document.body.classList.add('black');
      clearPage();
      await say([{ t: '……이전의 기억이 남아 있다.', cls: 'center' }]);
      const { idx } = await choose([{ label: '이어서 한다' }, { label: '처음부터 한다', hint: '모든 기억을 지운다' }]);
      document.body.classList.remove('black');
      fresh = idx === 1;
    }
    if (fresh) { Save.clear(); return false; }
    S.P = s.P;
    S.W = s.W;
    // 예전 저장 파일은 세계를 이어 붙일 수 없어서, 이름과 기억만 가지고 숲에서 새로 시작한다
    return s.migrated ? 'fresh' : true;
  }

  // 쓰러져도 세계는 이어진다 (스토리_재설계.md 0절).
  async function main() {
    // 시작 화면 (디자인담당 js/ui). 없으면 바로 시작한다
    const title = await (window.UITitle ? window.UITitle({ hasSave: !!Save.read(), slots: Save.list() }) : null);
    const resume = await titleMenu(title);
    if (resume === 'fresh') await wakeAgain();
    else if (resume !== true) await intro();
    while (true) {
      const res = await explore();
      if (res === 'die') await (Player.sheltered(S) ? shaken() : collapse());
    }
  }

  // ---------- 화면(js/ui)이 쓰는 공식 연결점 (디자인_가이드.md 9절) ----------
  // 화면은 S를 읽기만 한다. 바꾸는 일은 아래 함수를 거친다: 저장·불러오기·지도 이동은
  // 장면 밖에서 다음 행동을 고르는 동안(resting)에만 된다. 그 밖에는 false를 돌려준다.
  const walkWord = (min) => (min <= 10 ? '바로 옆이다' : min <= 30 ? '조금 걸어야 한다' : '한참 걸어야 한다');
  window.Avernia = {
    state: () => S,
    canSave: () => !!resting,
    save(slot) {
      if (!resting || slot == null || slot === 'auto') return false;
      return Save.write(S, slot);
    },
    // 저장한 칸에서 이어 한다 (지금 하던 것은 마지막 자동 저장에 남아 있다)
    load(slot) {
      if (!resting || !cancelChoice) return false;
      const s = Save.read(slot);
      if (!s || s.migrated) return false;
      S.P = s.P;
      S.W = s.W;
      cancelChoice({ reload: true });
      return true;
    },
    // 지금 갈 수 있는 곳: 선택지에 있는 길과 같다 (막힘·밤의 습격·동행은 고른 뒤에 선택지와 똑같이 판정된다)
    routes() {
      if (!resting) return [];
      return resting.opts.filter((o) => o.to).map((o) => ({ to: o.to, label: fmt(o.label), hint: o.hint || null,
        far: walkWord(o.min || 0), dark: Time.dark(S.W.time.t) }));
    },
    go(to) {
      if (!resting || !cancelChoice) return false;
      const idx = resting.opts.findIndex((o) => o.to === to);
      if (idx < 0) return false;
      cancelChoice({ idx });
      return true;
    },
  };

  // 개발용: 콘솔에서 __dev.die() 로 쓰러짐을 시험한다. 디버그 화면(debug.js)도 이것을 쓴다.
  window.__dev = {
    S,
    die() { me().cause = '(개발용) 강제로 쓰러졌다'; if (cancelChoice) cancelChoice({ die: true }); },
    state() { return S; },
    // 세계를 흘린다 (대본 사건 포함). 화면을 새로 그린다.
    skipTo(minutes) { World.tick(S, minutes); this.refresh(); },
    refresh() { setHud(); if (cancelChoice) cancelChoice({ refresh: true }); },
  };

  // 뒤에 오는 화면 스크립트(js/ui: 시작 화면 UITitle 등)까지 다 읽은 뒤에 시작한다
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', main, { once: true });
  else main();
})();

</script>
<script>/* js/debug/debug.js */
// 개발자 전용 디버그 화면 (통합 명세 38절). 주소 끝에 ?debug 를 붙였을 때만 나타난다. 일반 플레이어에게는 보이지 않는다.
// 보여 주는 것: 시간·날씨, NPC의 위치·행동·목표·욕구·관계·기억·언어, 소문, 사건, 세력 관계, 경제, 플레이어 언어, 세계 상태 전체
// 명령: 시간 흘리기, 날씨, 플레이어 이동, NPC 이동, 관계 바꾸기, NPC 죽이기, 사건 만들기 — 모두 실제 시스템을 거친다.
(() => {
  if (typeof document === 'undefined' || !/[?&]debug\b/.test(location.search)) return;
  const S = () => window.__dev.state();
  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
  const r0 = (n) => Math.round(n);
  const clock = (t) => `${Time.dayLabel(t)} ${String(Math.floor(Time.clock(t) / 60)).padStart(2, '0')}:${String(Time.clock(t) % 60).padStart(2, '0')}`;

  const style = document.createElement('style');
  style.textContent = `
    #dbgBtn{position:fixed;right:12px;bottom:44px;z-index:50;font:12px monospace;background:#223;color:#cde;border:1px solid #456;border-radius:6px;padding:6px 9px;cursor:pointer}
    #dbg{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);z-index:49;background:#0b0f14f2;color:#cdd6e0;font:12px/1.5 Consolas,monospace;overflow:auto;padding:10px 12px 60px;border-left:1px solid #345;display:none}
    #dbg.on{display:block} #dbg h3{margin:10px 0 4px;color:#9cf;font-size:12px} #dbg .tabs button,#dbg .cmd button{margin:2px;font:11px monospace;background:#1b2530;color:#cde;border:1px solid #345;border-radius:4px;padding:3px 7px;cursor:pointer}
    #dbg .tabs button.on{background:#2d4a66} #dbg select,#dbg input{font:11px monospace;background:#111820;color:#cde;border:1px solid #345;margin:2px}
    #dbg pre{white-space:pre-wrap;word-break:break-all;margin:0} #dbg .dim{color:#789} #dbg .warn{color:#fb8}`;
  document.head.appendChild(style);

  const btn = document.createElement('button');
  btn.id = 'dbgBtn'; btn.textContent = 'DEBUG';
  const panel = document.createElement('div');
  panel.id = 'dbg';
  document.body.append(btn, panel);
  let tab = 'world';
  const TABS = { world: '세계', npc: 'NPC', social: '소문·사건', faction: '세력·경제', lang: '언어', json: 'WorldState' };

  function opts(list, sel) { return list.map((x) => `<option value="${esc(x)}"${x === sel ? ' selected' : ''}>${esc(x)}</option>`).join(''); }

  function commands(s) {
    const npcs = Object.keys(s.W.npcs), locs = Object.keys(PLACE_DATA);
    return `<div class="cmd">
      <button data-c="t60">시간 +1시간</button><button data-c="t360">+6시간</button><button data-c="t1440">+1일</button>
      날씨 <select id="dW">${opts(['clear', 'cloudy', 'rain', 'fog'], s.W.weather.kind)}</select><button data-c="weather">변경</button><br>
      플레이어 이동 <select id="dP">${opts(Object.keys(LOCS), s.W.player.loc)}</select><button data-c="tp">이동</button><br>
      NPC <select id="dN">${opts(npcs)}</select> → <select id="dL">${opts(locs)}</select><button data-c="move">강제 이동</button><button data-c="kill" class="warn">사망</button><br>
      관계 <select id="dA">${opts(npcs)}</select>→<select id="dB">${opts(['player', ...npcs])}</select>
      <select id="dX">${opts(Rel.AXES)}</select><input id="dV" type="number" value="50" style="width:48px"><button data-c="rel">설정</button><br>
      사건 <select id="dE">${opts(['missing', 'beast_attack', ...Object.keys(WORLD_EVENT_TYPES)])}</select> 대상 <select id="dT">${opts(npcs)}</select><button data-c="event">생성</button>
    </div>`;
  }

  function npcBlock(s, n) {
    const W = s.W;
    const rels = Object.entries(W.relationships).filter(([k]) => k.startsWith(n.id + '>'))
      .map(([k, r]) => `  ${k.split('>')[1]}: ` + Rel.AXES.filter((a) => r[a] >= 1).map((a) => `${a} ${r0(r[a])}`).join(', '));
    const act = n.currentAction ? `${n.currentAction.type} (~${clock(n.currentAction.until)})` : '-';
    const loc = n.location.transit ? `${n.location.loc} → ${n.location.path.join('→')} (도착 ${clock(n.location.nextAt)})` : n.location.loc + (n.location.hidden ? ' [숨음]' : '');
    return `<h3>${esc(n.id)} ${n.alive ? '' : '<span class="warn">[사망: ' + esc(n.death.cause) + ']</span>'}</h3><pre>${esc([
      `위치 ${loc}  |  지역 ${Places.regionOf(n.location.loc)}  |  행동 ${act}`,
      `몸 체력 ${r0(n.physical.health)} 출혈 ${n.physical.bleed.toFixed(3)} 충격 ${r0(n.physical.shock)} 통증 ${r0(n.physical.pain)} | 마음 두려움 ${r0(n.mental.fear)} 스트레스 ${r0(n.mental.stress)} 기분 ${r0(n.mental.mood)}`,
      `욕구 ` + Object.entries(n.needs).map(([k, v]) => `${k} ${r0(v)}`).join(' '),
      `목표 ` + n.goals.map((g) => `${g.id}(${r0(g.priority)})`).join(' '),
      `돈 ${r0(n.money)}  소지품 ` + JSON.stringify(n.inventory) + (n.magic ? `  마력 ${n.magic.mana}/${n.magic.maxMana}` : ''),
      `언어 ` + Object.entries(n.languages).map(([k, v]) => `${k} ${v.understanding}/${v.speaking}/${v.reading}/${v.writing}`).join(' '),
      `관계`, ...rels,
      `기억 ` + n.memories.map((m) => `${m.type}:${m.subject}(${m.emotionalImpact},${r0(m.importance)})`).join(' '),
      `소문 ` + Object.entries(n.knowledge.rumors).map(([id, h]) => `${W.rumors[id] ? W.rumors[id].type : id}@L${h.level}`).join(' '),
      `표시 ` + JSON.stringify(n.flags),
    ].join('\n'))}</pre>`;
  }

  function render() {
    const s = S();
    const W = s.W;
    let body = '';
    if (tab === 'world') {
      body = `<pre>${esc([
        `시각 ${clock(W.time.t)} (${Time.KO[Time.band(W.time.t)]})  날씨 ${Weather.KO[W.weather.kind]} ${Weather.temp(W).toFixed(1)}℃`,
        `플레이어 ${W.player.loc}  HP ${W.player.hp}/${hpMax(W.player)}  ` + Object.entries(W.player.surv).filter(([, v]) => typeof v === 'number').map(([k, v]) => `${k} ${r0(v)}`).join(' '),
        `부상 ${JSON.stringify(W.player.surv.injuries.map((x) => x.kind))}  병 ${JSON.stringify(W.player.surv.illness.map((x) => x.kind))}`,
        `지역 ` + Object.entries(W.regions).map(([k, r]) => `${k}:${r.level} 위협${r0(r.threat)} 경계${r0(r.alert)}`).join(' | '),
        `짐승 ` + Object.values(W.creatures).map((c) => `${c.id}@${c.loc}${c.hp != null ? ` hp${c.hp} 두려움${r0(c.fear)}` : ''}${c.shy ? ' [피함]' : ''}`).join(' | '),
        `예정 사건 ` + W.events.scheduled.map((e) => `${e.type}@${clock(e.at)}${e.done ? '✓' : ''}`).join(' '),
        `진행 중 ` + JSON.stringify(W.events.active),
        `기록 ` + JSON.stringify(W.history.slice(-5)),
        `흔적 ` + Object.entries(W.locations).filter(([, v]) => v.traces.length).map(([k, v]) => `${k}:${v.traces.map((x) => x.kind).join(',')}`).join(' | '),
      ].join('\n'))}</pre><h3>최근 이벤트 버스</h3><pre class="dim">${esc(Bus.recent.slice(-25).reverse().map((e) => `${clock(e.t)} ${e.type} ${JSON.stringify(Object.fromEntries(Object.entries(e).filter(([k]) => k !== 'type' && k !== 't')))}`).join('\n'))}</pre>`;
    } else if (tab === 'npc') {
      body = Object.values(W.npcs).map((n) => npcBlock(s, n)).join('');
    } else if (tab === 'social') {
      body = `<h3>소문</h3><pre>${esc(Object.values(W.rumors).map((r) => {
        const holders = Object.values(W.npcs).filter((n) => n.knowledge.rumors[r.id]).map((n) => `${n.id}@L${n.knowledge.rumors[r.id].level}`);
        return `${r.id} ${r.type} (${r.subject || '-'}→${r.target || '-'}) 중요도${r.importance}\n  "${Rumor.plain(W, r, 0)}"\n  아는 사람: ${holders.join(' ')}${s.P.found.rumors[r.id] ? '  [플레이어가 들음]' : ''}`;
      }).join('\n') || '(없음)')}</pre><h3>세계 사건 (최근 40)</h3><pre>${esc(W.events.log.slice(-40).reverse().map((e) => `${clock(e.t)} ${e.type} @${e.loc || '-'} 목격:${e.witnesses.join(',') || '-'} ${JSON.stringify(e.data)}`).join('\n'))}</pre>`;
    } else if (tab === 'faction') {
      const v = W.economy.markets.village_square;
      body = `<h3>세력 관계 (긴장 ${r0(W.politics.tension)})</h3><pre>${esc(Object.entries(W.politics.relations).map(([k, r]) => `${k.padEnd(40)} 외교${r0(r.diplomacy)} 무역${r0(r.trade)} 적대${r0(r.hostility)} 신뢰${r0(r.trust)}`).join('\n'))}</pre>
        <h3>먼 곳의 소식</h3><pre>${esc(W.politics.news.map((x) => `${clock(x.t)} ${x.type}`).join('\n') || '(없음)')}</pre>
        <h3>마을 가게 (${Economy.open(W, 'village_square') ? '열림' : '닫힘'})</h3><pre>${esc(`재고 ${JSON.stringify(v.stock)}\n값 ${JSON.stringify(v.price)}\n오가는 사람 ${v.traffic.toFixed(2)}  장사 안 된 날 ${v.lowDays}\n기록 ${JSON.stringify(v.history.slice(-7))}`)}</pre>`;
    } else if (tab === 'lang') {
      const L = s.P.lang;
      body = `<pre>${esc([
        ...Object.entries(L.languageKnowledge).map(([k, v]) => `${k.padEnd(12)} 이해 ${v.understanding} 말하기 ${v.speaking} 읽기 ${v.reading} 쓰기 ${v.writing}`),
        '', '단어 (확신 / 들은 횟수)',
        ...Object.entries(L.knownWords).flatMap(([lang, ws]) => Object.entries(ws).map(([id, r]) => `  ${lang}:${id.padEnd(12)} ${r.confidence.toFixed(2)} ×${r.encounters}  「${LangRegistry.sound(id, id)}」`)),
        '', `이정표 ${JSON.stringify(L.languageMilestones)}`,
      ].join('\n'))}</pre>`;
    } else {
      body = `<pre class="dim">${esc(JSON.stringify(W, null, 1))}</pre>`;
    }
    panel.innerHTML = `<div class="tabs">${Object.entries(TABS).map(([k, v]) => `<button data-tab="${k}" class="${k === tab ? 'on' : ''}">${v}</button>`).join('')}</div>${commands(s)}${body}`;
  }

  function run(c) {
    const s = S();
    const W = s.W;
    const val = (id) => panel.querySelector('#' + id).value;
    if (c.startsWith('t')) { World.tick(s, +c.slice(1)); }
    else if (c === 'weather') Weather.set(s, val('dW'));
    else if (c === 'tp') Player.teleport(s, val('dP'));
    else if (c === 'move') Npc.place(s, W.npcs[val('dN')], val('dL'));
    else if (c === 'kill') Npc.kill(s, W.npcs[val('dN')], '(디버그) 강제로 죽었다', null);
    else if (c === 'rel') Rel.set(s, val('dA'), val('dB'), val('dX'), +val('dV'));
    else if (c === 'event') {
      const e = val('dE'), n = W.npcs[val('dT')];
      if (e === 'missing') { n.expectedHome = W.time.t - 1; n.flags.missingResolved = false; WorldEvents.checkMissing(s); }
      else if (e === 'beast_attack') Combat.creatureVsNpc(s, W.creatures.thornback, n);
      else Factions.trigger(s, e);
    }
    window.__dev.refresh();
    render();
  }

  btn.onclick = () => { panel.classList.toggle('on'); if (panel.classList.contains('on')) render(); };
  panel.addEventListener('click', (e) => {
    const t = e.target;
    if (t.dataset.tab) { tab = t.dataset.tab; render(); }
    else if (t.dataset.c) run(t.dataset.c);
  });
  // 선택 상자를 고르는 중에는 다시 그리지 않는다
  setInterval(() => { if (panel.classList.contains('on') && !panel.contains(document.activeElement)) render(); }, 1500);
  // 게임 키 입력(숫자 선택)이 디버그 화면 입력과 섞이지 않게
  panel.addEventListener('keydown', (e) => e.stopPropagation());
})();

</script>
<!-- 화면 (디자인담당): 시스템 상태를 읽기만 한다 -->
<script>/* js/ui/data.js */
// 화면용 데이터 (디자인담당). 시스템 상태 S를 읽기만 하고 절대 바꾸지 않는다.
// 메뉴의 각 화면은 이 파일이 만든 "보여 줄 것"만 그린다. 숫자·플래그·내부 이름은 여기서 걸러진다.
// 시스템 상태를 얻는 곳은 source() 한 곳뿐이다: 공식 연결점 window.Avernia (시스템구조.md 9-1절)
const UIData = (() => {
  const source = () => (window.Avernia && window.Avernia.state ? window.Avernia.state() : null);
  const J = (w, t) => (typeof Text !== 'undefined' ? w + Text.josa(w, t) : w);

  // 시각 → "둘째 날 저녁" (분 단위 시각은 보여 주지 않는다: 시계가 없는 사람이다)
  function when(t) {
    if (t == null) return '';
    return `${Time.dayLabel(t)} ${Time.KO[Time.band(t)]}`;
  }
  const npcName = (S, id) => {
    const f = S.P.found.npcs[id];
    const n = S.W.npcs[id];
    if (f && f.name) return f.name;
    return n ? n.identity.desc : '누군가';
  };

  // 지역 이름은 그 지역에 발을 들인 뒤에만 고유 이름(예: 하르넨)으로 부른다. 그 전에는 보통 말로.
  const REGION_PLAIN = { forest: '숲', village: '마을', road: '큰길', far: '먼 곳' };
  function regionLabel(S, rid) {
    const d = REGION_DATA[rid];
    if (!d) return '';
    const been = Object.keys(PLACE_DATA).some((id) => Places.regionOf(id) === rid
      && (S.W.player.loc === id || Knowledge.RANK.indexOf(Knowledge.locState(S.P, id)) >= Knowledge.RANK.indexOf('visited')));
    return been ? d.name : (REGION_PLAIN[rid] || d.name);
  }

  // ---------- 지금 ----------
  function now(S) {
    const { W, P } = S;
    const me = W.player;
    const t = W.time.t;
    const lodging = me.lodging && RULES.lodgings[me.lodging.id];
    return {
      day: Time.dayLabel(t),
      band: Time.KO[Time.band(t)],
      place: Places.name(me.loc),
      region: regionLabel(S, Places.regionOf(me.loc)),
      name: P.name,
      body: Player.barWords(W),
      feeling: Player.hpFeeling(me),
      money: me.money || 0,
      lodging: lodging ? lodging.label : null,
      companions: (me.companions || []).map((id) => npcName(S, id)),
      // 상태창은 열린 뒤에만, 시스템이 만든 문장 그대로 (숫자는 플레이어가 알게 된 것만 나온다)
      status: me.status.unlocked ? Player.statusLines(me, P.name || '') : null,
    };
  }

  // ---------- 이야기 기록 ----------
  // 시각이 남는 것만 날짜별로 묶는다. 시각이 없는 "알아낸 것"은 따로 모은다.
  function journal(S) {
    const { W, P } = S;
    const me = W.player;
    const items = [];
    if (P.name) items.push({ t: Time.START, text: '낯선 숲에서 눈을 떴다.' });
    Object.entries(P.found.npcs).forEach(([id, f]) => {
      if (f.first != null) items.push({ t: f.first, text: `${J(npcName(S, id), '을를')} 처음 만났다.` });
    });
    Object.entries(P.clues || {}).forEach(([id, c]) => {
      const d = RULES.clues[id];
      if (d && c.t != null) items.push({ t: c.t, text: d.text, kind: 'clue' });
    });
    Object.entries(P.threads || {}).forEach(([th, t]) => {
      const d = RULES.threads[th];
      if (d) items.push({ t, text: d.ko + '.', kind: 'thread' });
    });
    if (me.lodging && RULES.lodgings[me.lodging.id]) {
      items.push({ t: me.lodging.since, text: `${RULES.lodgings[me.lodging.id].label}에서 지내기 시작했다.` });
    }
    // 알아낸 사실: 시각이 있으면 그날 기록에 (예전 저장 파일은 true라서 아래 '알아낸 것'으로)
    Object.entries(P.knowledge || {}).forEach(([k, v]) => { if (typeof v === 'number' && KNOW[k]) items.push({ t: v, text: KNOW[k], kind: 'fact' }); });
    if (typeof Knowledge.eventLines === 'function') Knowledge.eventLines(S).forEach((e) => items.push({ t: e.t, text: e.text, kind: e.how === 'witnessed' ? '' : 'heard' }));
    if (me.lastCollapse != null) items.push({ t: me.lastCollapse, text: '정신을 잃고 쓰러졌다.', kind: 'hard' });
    // 단서가 된 사실은 단서 쪽만 남긴다
    const clueFacts = new Set(Object.values(P.clues || {}).map((c) => String(c.from || '')).filter((f) => f.startsWith('fact:')).map((f) => KNOW[f.slice(5)]));
    for (let i = items.length - 1; i >= 0; i--) if (items[i].kind === 'fact' && clueFacts.has(items[i].text)) items.splice(i, 1);
    items.sort((a, b) => a.t - b.t);
    const days = [];
    items.forEach((x) => {
      const d = Time.dayLabel(x.t);
      let g = days[days.length - 1];
      if (!g || g.day !== d) days.push((g = { day: d, items: [] }));
      g.items.push({ when: Time.KO[Time.band(x.t)], text: x.text, kind: x.kind || '' });
    });
    // 단서가 된 사실은 위 날짜 목록에 이미 있으니 다시 적지 않는다
    const asClue = new Set(Object.values(P.clues || {}).map((c) => String(c.from || '')).filter((f) => f.startsWith('fact:')).map((f) => f.slice(5)));
    const facts = Object.keys(P.knowledge || {}).filter((k) => KNOW[k] && P.knowledge[k] === true && !asClue.has(k)).map((k) => KNOW[k]);
    return { days, facts };
  }

  // ---------- 인물 ----------
  // 관계 수치는 보여 주지 않는다 (스토리설계.md: "플레이어에게 숫자를 보이지 않는다").
  // 대신 시스템이 이미 문장으로 바꿔 둔 태도(Narrative.describe)를 쓴다.
  function people(S) {
    const { W, P } = S;
    return Object.entries(P.found.npcs).map(([id, f]) => {
      const n = W.npcs[id];
      if (!n) return null;
      const named = !!f.name;
      return {
        id,
        name: named ? f.name : '이름을 모른다',
        look: n.identity.desc,
        named,
        first: when(f.first),
        last: f.last != null && f.last !== f.first ? when(f.last) : null,
        together: (W.player.companions || []).includes(id),
        attitude: Narrative.describe(S, n),
      };
    }).filter(Boolean).sort((a, b) => (b.together - a.together) || (b.named - a.named));
  }

  // ---------- 소지품 ----------
  const CATEGORY_KO = { tool: '도구', food: '먹을 것', medicine: '약', weapon: '무기', material: '재료', clothing: '옷', misc: '물건' };
  function items(S) {
    const { W, P } = S;
    const inv = W.player.inv || {};
    return {
      money: W.player.money || 0,
      list: Object.entries(inv).filter(([, c]) => c > 0).map(([id, count]) => {
        const d = ITEM_DEFS[id] || {};
        return { id, name: Player.label(id, P), count, kind: CATEGORY_KO[d.category] || '물건', desc: Player.describe ? Player.describe(id, P) : d.desc || null };
      }),
    };
  }

  // ---------- 지도 ----------
  // 가 보았거나 멀리서 본 곳만. 길도 양 끝을 다 아는 것만 그린다.
  function map(S) {
    const { W, P } = S;
    const known = (id) => id === W.player.loc || Knowledge.locState(P, id) !== 'unknown';
    const ids = Object.keys(PLACE_DATA).filter(known);
    return {
      here: W.player.loc,
      places: ids.map((id) => ({
        id, name: Places.name(id), region: Places.regionOf(id),
        regionName: regionLabel(S, Places.regionOf(id)),
        state: id === W.player.loc ? '지금 여기' : Knowledge.KO[Knowledge.locState(P, id)] || '',
      })),
      paths: PATHS.filter(([a, b]) => known(a) && known(b)).map(([a, b]) => [a, b]),
    };
  }

  // ---------- 말 ----------
  function words(S) {
    return {
      words: LangUI.wordLines(S).map((l) => ({ text: l.t.replace(/^·\s*/, ''), dim: /dim/.test(l.cls) })),
      langs: LangUI.languageLines(S).map((l) => l.t),
    };
  }

  // ---------- 저장 ----------
  // 저장 규칙은 시스템(state.js)의 것이다. 여기서는 저장된 내용을 읽어 보여 주기만 한다.
  const SAVED_AGO = (ms) => {
    if (!ms) return null;
    const m = Math.round((Date.now() - ms) / 60000);
    if (m < 1) return '방금 전';
    if (m < 60) return `${m}분 전`;
    if (m < 60 * 24) return `${Math.round(m / 60)}시간 전`;
    return new Date(ms).toLocaleDateString('ko-KR', { month: 'long', day: 'numeric' });
  };
  // 저장 칸들: 자동 + 손 저장 1~3 (Save.list는 세계를 다시 짓지 않아 가볍다)
  function slots() {
    return Save.list().map((x) => x.empty ? { slot: x.slot, empty: true } : {
      slot: x.slot, name: x.name || '이름 없음', when: when(x.t), place: Places.name(x.loc), ago: SAVED_AGO(x.savedAt),
    });
  }
  // 대사의 말하는 사람: 이름을 안 뒤에만 붙인다. 그 전에는 장면 글이 "그녀"·겉모습으로 이미 가리키므로
  // 이름표가 따로 부르면 어긋난다 (리아: 장면은 '그녀', 겉모습은 '젊은 여자')
  function speaker(id) {
    const S = source();
    if (!S || !id) return null;
    const f = S.P.found.npcs[id];
    return f && f.name ? f.name : null;
  }

  return { source, when, now, journal, people, items, map, words, slots, speaker };
})();

</script>
<script>/* js/ui/menu.js */
// 메뉴와 정보 화면 (디자인담당). 게임 흐름(engine.js)은 건드리지 않는다.
// 열려 있는 동안 키 입력을 가로채서, 뒤의 선택지가 숫자키로 눌리지 않게 한다.
// 데이터는 모두 UIData(js/ui/data.js)에서 받는다.
(() => {
  'use strict';
  if (typeof document === 'undefined') return; // 테스트(node)에서는 화면이 없다
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

  // ---------- 설정 (화면 취향일 뿐이라 세이브와 따로 이 브라우저에만 둔다) ----------
  const PREF_KEY = 'avernia_ui';
  const PREF_DEFAULT = { size: 'm', leading: 'normal', motion: 'auto' };
  let pref = { ...PREF_DEFAULT };
  try { Object.assign(pref, JSON.parse(localStorage.getItem(PREF_KEY)) || {}); } catch (e) { /* 저장소가 막힌 환경 */ }
  function applyPref() {
    const h = document.documentElement;
    h.dataset.size = pref.size;
    h.dataset.leading = pref.leading;
    h.dataset.motion = pref.motion;
  }
  function savePref() { try { localStorage.setItem(PREF_KEY, JSON.stringify(pref)); } catch (e) { /* 무시 */ } applyPref(); }
  applyPref();

  // ---------- 대사 줄 표시 ----------
  // 엔진은 줄마다 cls만 준다. 「」나 따옴표로 시작하는 줄을 대사로 보고 모양만 붙인다 (내용은 바꾸지 않는다).
  const story = $('#story');
  if (story) {
    new MutationObserver((ms) => ms.forEach((m) => m.addedNodes.forEach((p) => {
      if (p.nodeType !== 1 || !p.classList.contains('line')) return;
      // 시스템이 말한 사람을 알려 주면 이름표 (모르는 사람은 겉모습). 아니면 「로 시작하는 줄을 대사로 짐작한다
      if (p.dataset.who) { const n = UIData.speaker(p.dataset.who); if (n) p.dataset.label = n; }
      if (/^\s*[「『"“]/.test(p.textContent)) p.classList.add('speech');
    }))).observe(story, { childList: true });
  }

  // ---------- 메뉴 버튼과 창 ----------
  const btn = document.createElement('button');
  btn.id = 'menuBtn';
  btn.type = 'button';
  btn.setAttribute('aria-label', '메뉴 열기 (Esc)');
  btn.setAttribute('aria-haspopup', 'dialog');
  btn.setAttribute('aria-expanded', 'false');
  btn.innerHTML = '<span></span><span></span><span></span>';

  const sheet = document.createElement('div');
  sheet.id = 'sheet';
  sheet.hidden = true;
  sheet.innerHTML = `
    <div class="scrim" data-close></div>
    <section class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <header class="panelHead">
        <h2 id="sheetTitle">메뉴</h2>
        <button type="button" class="close" data-close aria-label="닫기 (Esc)">닫기</button>
      </header>
      <nav class="tabs" role="tablist" aria-label="메뉴"></nav>
      <div class="panelBody" role="tabpanel" tabindex="-1"></div>
    </section>`;
  document.body.append(btn, sheet);
  const tabsEl = $('.tabs', sheet);
  const bodyEl = $('.panelBody', sheet);

  const TABS = [
    ['now', '지금'], ['journal', '기록'], ['people', '사람'], ['items', '소지품'],
    ['map', '지도'], ['words', '말'], ['save', '저장'], ['settings', '설정'],
  ];
  let tab = 'now';
  let lastFocus = null;

  TABS.forEach(([id, ko]) => {
    const b = document.createElement('button');
    b.type = 'button'; b.setAttribute('role', 'tab'); b.dataset.tab = id; b.textContent = ko;
    b.onclick = () => { tab = id; render(); };
    tabsEl.appendChild(b);
  });

  function open(which) {
    const S = UIData.source();
    if (!S || !S.P || !S.W) return;
    if (which) tab = which;
    lastFocus = document.activeElement;
    sheet.hidden = false;
    void sheet.offsetWidth;
    sheet.classList.add('in');
    btn.setAttribute('aria-expanded', 'true');
    render();
    $(`[data-tab="${tab}"]`, tabsEl).focus();
  }
  function close() {
    sheet.classList.remove('in');
    btn.setAttribute('aria-expanded', 'false');
    setTimeout(() => { sheet.hidden = true; }, 220);
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  const isOpen = () => !sheet.hidden;

  btn.onclick = () => (isOpen() ? close() : open());
  sheet.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) close(); });

  // 열려 있으면 키를 먼저 받는다 (엔진의 숫자키·Enter가 뒤에서 눌리지 않게)
  window.addEventListener('keydown', (e) => {
    if (!isOpen()) {
      if (e.key === 'Escape' && !document.body.classList.contains('black') && !document.body.classList.contains('titling') && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); open(); }
      return;
    }
    e.stopImmediatePropagation();
    if (e.key === 'Escape') { e.preventDefault(); close(); return; }
    if (e.key === 'Tab') trap(e);
    if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && e.target.closest('.tabs')) {
      const i = TABS.findIndex(([id]) => id === tab);
      tab = TABS[(i + (e.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length][0];
      render();
      $(`[data-tab="${tab}"]`, tabsEl).focus();
    }
  }, true);
  // 메뉴 위의 클릭이 뒤의 "다음으로(▾)"를 누르지 않게
  ['pointerdown', 'click'].forEach((t) => sheet.addEventListener(t, (e) => e.stopPropagation()));

  function trap(e) {
    const f = [...sheet.querySelectorAll('button, [href], input, select, [tabindex]:not([tabindex="-1"])')].filter((x) => !x.disabled && x.offsetParent);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }

  // ---------- 화면들 ----------
  const empty = (t) => `<p class="empty">${esc(t)}</p>`;
  const section = (title, html) => `<section class="block">${title ? `<h3>${esc(title)}</h3>` : ''}${html}</section>`;

  const VIEWS = {
    now(S) {
      const d = UIData.now(S);
      const rows = [
        ['때', `${d.day} · ${d.band}`],
        ['곳', d.region && d.region !== d.place ? `${esc(d.place)} <span class="sub">${esc(d.region)}</span>` : esc(d.place)],
        ['잘 곳', d.lodging ? esc(d.lodging) : '<span class="sub">정해진 곳이 없다</span>'],
        ['함께', d.companions.length ? esc(d.companions.join(', ')) : '<span class="sub">혼자다</span>'],
        ['가진 돈', d.money ? `동전 ${d.money}닢` : '<span class="sub">한 푼도 없다</span>'],
      ];
      return section(null, `<h4 class="who">${esc(d.name || '이름을 떠올리지 못했다')}</h4>
          <dl class="facts">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${k === '때' ? esc(v) : v}</dd>`).join('')}</dl>`)
        + section('몸', `<ul class="body">${d.body.map(([k, v]) => `<li><span>${esc(k)}</span>${esc(v)}</li>`).join('')}</ul>`
          + (d.feeling ? `<p class="feel">${esc(d.feeling)}</p>` : ''))
        + (d.status ? section('상태', `<pre class="statbox">${esc(d.status.map((l) => l.t).join('\n'))}</pre>`) : '');
    },

    journal(S) {
      const j = UIData.journal(S);
      const days = j.days.map((g) => `<section class="day"><h3>${esc(g.day)}</h3><ol>${g.items.map((x) =>
        `<li class="${x.kind}"><span class="when">${esc(x.when)}</span>${esc(x.text)}</li>`).join('')}</ol></section>`).join('');
      return (days || empty('아직 아무 일도 없었다.'))
        + (j.facts.length ? section('알아낸 것', `<ul class="facts-list">${j.facts.map((f) => `<li>${esc(f)}</li>`).join('')}</ul>`) : '');
    },

    people(S) {
      const list = UIData.people(S);
      if (!list.length) return empty('아직 아무도 만나지 못했다.');
      return list.map((p) => `<article class="person">
          <div class="portrait" aria-hidden="true">${esc(p.named ? p.name[0] : '?')}</div>
          <div class="pbody">
            <h3>${esc(p.name)}${p.together ? '<span class="tag">함께 있다</span>' : ''}</h3>
            <p class="sub">${esc(p.look)} · ${esc(p.first)}에 처음 만났다${p.last ? ` · 마지막으로 본 때: ${esc(p.last)}` : ''}</p>
            ${p.attitude.length ? `<ul class="attitude">${p.attitude.map((a) => `<li>${esc(a)}</li>`).join('')}</ul>` : '<p class="sub">아직 이 사람의 마음을 읽을 수 없다.</p>'}
            <p class="unknown">${p.named ? '' : '이름 · '}이 사람에 대해 모르는 것이 더 많다.</p>
          </div>
        </article>`).join('');
    },

    items(S) {
      const it = UIData.items(S);
      const money = `<p class="money">${it.money ? `동전 <b>${it.money}</b>닢` : '돈이 한 푼도 없다.'}</p>`;
      if (!it.list.length) return money + empty('가진 것이 없다.');
      return money + `<ul class="inv">${it.list.map((x) => `<li>
          <button type="button" class="invItem" aria-expanded="false">
            <span class="iname">${esc(x.name)}</span><span class="icount">× ${x.count}</span>
          </button>
          <p class="idesc" hidden><span class="sub">${esc(x.kind)}</span>${x.desc ? ' — ' + esc(x.desc) : ''}</p>
        </li>`).join('')}</ul>`;
    },

    map(S) {
      const m = UIData.map(S);
      if (!m.places.length) return empty('아직 아는 곳이 없다.');
      const routes = window.Avernia ? Avernia.routes() : [];
      const go = routes.length ? section('여기서 갈 수 있는 곳', `<ul class="routes">${routes.map((r) => `<li><button type="button" class="act route${r.dark ? ' dark' : ''}" data-act="go" data-to="${esc(r.to)}">
          <span>${esc(r.label)}</span><span class="sub">${esc(r.far || '')}${r.hint ? ' · ' + esc(r.hint) : ''}</span></button></li>`).join('')}</ul>`) : '';
      return mapSvg(m) + go + Object.entries(groupBy(m.places, 'regionName')).map(([r, ps]) => section(r,
        `<ul class="places">${ps.map((p) => `<li class="${p.id === m.here ? 'here' : ''}"><span>${esc(p.name)}</span><span class="sub">${esc(p.state)}</span></li>`).join('')}</ul>`)).join('');
    },

    words(S) {
      const w = UIData.words(S);
      if (!w.words.length && !w.langs.length) return empty('아직 낯선 말을 들어 본 적이 없다.');
      return (w.words.length ? section('들은 말', `<ul class="wordlist">${w.words.map((x) => `<li class="${x.dim ? 'dim' : ''}">${esc(x.text)}</li>`).join('')}</ul>`) : '')
        + (w.langs.length ? section('알아듣는 정도', `<pre class="statbox">${esc(w.langs.join('\n'))}</pre>`) : '');
    },

    save() {
      const ok = window.Avernia && Avernia.canSave();
      const card = (x) => {
        const title = x.slot === 'auto' ? '자동 저장' : `기록 ${x.slot}`;
        const info = x.empty ? '<p class="sub">비어 있음</p>'
          : `<p class="slotName">${esc(x.name)}</p><p>${esc(x.when)} · ${esc(x.place)}</p>${x.ago ? `<p class="sub">${esc(x.ago)}</p>` : ''}`;
        const acts = x.slot === 'auto' ? `<button type="button" class="mini" data-act="load" data-slot="auto" ${ok && !x.empty ? '' : 'disabled'}>이어 하기</button>`
          : `<button type="button" class="mini" data-act="save" data-slot="${x.slot}" ${ok ? '' : 'disabled'}>여기에 저장</button>
             <button type="button" class="mini" data-act="load" data-slot="${x.slot}" ${ok && !x.empty ? '' : 'disabled'}>불러오기</button>`;
        return `<div class="slot${x.empty ? ' emptySlot' : ''}"><div class="slotInfo"><p class="slotTitle">${title}</p>${info}</div><div class="slotActs">${acts}</div></div>`;
      };
      return `<p class="sub saveNote">${ok ? '지금 저장할 수 있다.' : '장면이 끝나고 다음 행동을 고를 때 저장할 수 있다.'}</p>`
        + UIData.slots().map(card).join('') + '<p class="sub" id="saveMsg" role="status"></p>';
    },

    settings() {
      const opt = (key, val, ko) => `<button type="button" class="seg${pref[key] === val ? ' on' : ''}" data-pref="${key}" data-val="${val}" aria-pressed="${pref[key] === val}">${ko}</button>`;
      return section('글자 크기', `<div class="segs">${opt('size', 's', '작게')}${opt('size', 'm', '보통')}${opt('size', 'l', '크게')}${opt('size', 'xl', '아주 크게')}</div>`)
        + section('줄 간격', `<div class="segs">${opt('leading', 'normal', '보통')}${opt('leading', 'wide', '넓게')}</div>`)
        + section('움직임', `<div class="segs">${opt('motion', 'auto', '기기 설정 따름')}${opt('motion', 'reduce', '줄이기')}</div>`)
        + section('조작', `<dl class="facts keys"><dt>Esc</dt><dd>메뉴 열기 · 닫기</dd><dt>1–9, 0</dt><dd>선택지 고르기</dd><dt>Space · Enter</dt><dd>다음 글로</dd></dl>`);
    },
  };

  function groupBy(a, k) { return a.reduce((o, x) => ((o[x[k]] = o[x[k]] || []).push(x), o), {}); }

  // 손으로 그린 듯한 지도. 자리는 디자인 데이터다 (아는 곳만 그린다).
  // [x, y, 'b'] — 'b'는 이름을 점 아래에 쓴다 (이웃과 겹치지 않게)
  const POS = {
    hill: [16, 22], deep: [36, 16], deepwood: [54, 6], clearing: [30, 40], hollow: [18, 60, 'b'],
    stream: [46, 52, 'b'], downstream: [56, 72, 'b'], edge: [70, 44],
    village_gate: [86, 50, 'b'], village_square: [104, 56, 'b'], village_guild: [100, 30],
    village_homes: [122, 42], village_herbhouse: [140, 54], village_smithy: [86, 70, 'b'],
    village_chapel: [106, 76, 'b'], village_inn: [124, 64, 'b'], village_field: [138, 80, 'b'],
    road: [90, 16], far_town: [116, 6],
  };
  function mapSvg(m) {
    const ps = m.places.filter((p) => POS[p.id]);
    if (!ps.length) return '';
    // 아는 곳만큼만 펼친다 (처음엔 숲 몇 곳뿐이라 크게 보인다)
    const xs = ps.map((p) => POS[p.id][0]), ys = ps.map((p) => POS[p.id][1]);
    const pad = 9;
    let x0 = Math.min(...xs) - pad, x1 = Math.max(...xs) + pad, y0 = Math.min(...ys) - pad, y1 = Math.max(...ys) + pad / 2;
    const w = Math.max(x1 - x0, 48), h = Math.max(y1 - y0, 32);
    x0 -= (w - (x1 - x0)) / 2; y0 -= (h - (y1 - y0)) / 2;
    const line = ([a, b]) => (POS[a] && POS[b] ? `<line x1="${POS[a][0]}" y1="${POS[a][1]}" x2="${POS[b][0]}" y2="${POS[b][1]}"/>` : '');
    return `<figure class="map"><svg viewBox="${x0} ${y0} ${w} ${h}" style="--k:${(w / 60).toFixed(2)}" role="img" aria-label="아는 곳의 지도">
        <g class="paths">${m.paths.map(line).join('')}</g>
        ${ps.map((p) => `<g class="node${p.id === m.here ? ' here' : ''}${POS[p.id][2] === 'b' ? ' below' : ''}" transform="translate(${POS[p.id][0]} ${POS[p.id][1]})">
          <circle r="${p.id === m.here ? 1.8 : 1.2}"/><text>${esc(p.name)}</text></g>`).join('')}
      </svg></figure>`;
  }

  function render() {
    const S = UIData.source();
    tabsEl.querySelectorAll('[data-tab]').forEach((b) => {
      const on = b.dataset.tab === tab;
      b.classList.toggle('on', on);
      b.setAttribute('aria-selected', on);
      b.tabIndex = on ? 0 : -1;
    });
    $('#sheetTitle').textContent = TABS.find(([id]) => id === tab)[1];
    try { bodyEl.innerHTML = VIEWS[tab](S); } catch (err) {
      console.error('[메뉴]', err);
      bodyEl.innerHTML = empty('이 화면을 그리지 못했다.');
    }
    bodyEl.scrollTop = 0;
  }

  bodyEl.addEventListener('click', (e) => {
    const inv = e.target.closest('.invItem');
    if (inv) {
      const d = inv.nextElementSibling;
      d.hidden = !d.hidden;
      inv.setAttribute('aria-expanded', String(!d.hidden));
      return;
    }
    const p = e.target.closest('[data-pref]');
    if (p) { pref[p.dataset.pref] = p.dataset.val; savePref(); render(); $(`[data-pref="${p.dataset.pref}"][data-val="${p.dataset.val}"]`, bodyEl).focus(); return; }
    const a = e.target.closest('[data-act]');
    if (!a || a.disabled) return;
    const slot = a.dataset.slot === 'auto' ? null : Number(a.dataset.slot); // null = 자동 저장 칸
    const say = (t) => { const m = $('#saveMsg'); if (m) m.textContent = t; };
    if (a.dataset.act === 'save') {
      if (Avernia.save(slot)) { render(); say(`기록 ${slot}에 남겼다.`); } else say('지금은 저장할 수 없다.');
    } else if (a.dataset.act === 'load') {
      if (Avernia.load(slot)) close(); else say('지금은 불러올 수 없다.');
    } else if (a.dataset.act === 'go') {
      close();
      Avernia.go(a.dataset.to);
    }
  });

  window.UIMenu = { open, close, isOpen, renderSettings: () => VIEWS.settings() };
})();

</script>
<script>/* js/ui/title.js */
// 시작 화면 (디자인담당). 엔진의 main()이 이것을 기다린다 (시스템구조.md 9-1절).
// 돌려주는 것: 'continue' | 'new' | { slot }. 화면은 고르기만 하고, 불러오기·지우기는 엔진이 한다.
(() => {
  'use strict';
  if (typeof document === 'undefined') return;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

  window.UITitle = ({ hasSave, slots }) => new Promise((done) => {
    const saved = (slots || []).filter((x) => !x.empty && x.slot !== 'auto');
    const auto = (slots || []).find((x) => x.slot === 'auto' && !x.empty);
    const el = document.createElement('div');
    el.id = 'title';
    el.setAttribute('role', 'dialog');
    el.setAttribute('aria-label', '아베르니아 시작 화면');
    document.body.appendChild(el);
    document.body.classList.add('titling');

    const info = (x) => `${esc(x.name || '이름 없음')} · ${esc(UIData.when(x.t))} · ${esc(Places.name(x.loc))}`;
    const btn = (act, label, sub, extra = '') => `<button type="button" class="tbtn" data-act="${act}" ${extra}><span>${label}</span>${sub ? `<span class="sub">${sub}</span>` : ''}</button>`;

    function home() {
      el.innerHTML = `<div class="tInner">
          <h1 class="tName">아베르니아</h1>
          <p class="tSub">AVERNIA</p>
          <nav class="tMenu">
            ${hasSave && auto ? btn('continue', '이어 하기', info(auto)) : ''}
            ${btn('new', '새로 시작')}
            ${saved.length ? btn('slots', '불러오기') : ''}
            ${btn('settings', '설정')}
          </nav>
        </div>`;
      el.querySelector('.tbtn').focus();
    }
    function slotsView() {
      el.innerHTML = `<div class="tInner"><h2 class="tHead">불러오기</h2><nav class="tMenu">
          ${saved.map((x) => btn('slot', `기록 ${x.slot}`, info(x), `data-slot="${x.slot}"`)).join('')}
          ${btn('home', '돌아가기')}</nav></div>`;
      el.querySelector('.tbtn').focus();
    }
    function confirmNew() {
      el.innerHTML = `<div class="tInner"><h2 class="tHead">새로 시작</h2>
          <p class="tWarn">자동 저장이 지워진다. 손으로 남긴 기록 1~3은 남는다.</p>
          <nav class="tMenu">${btn('newYes', '처음부터 시작한다')}${btn('home', '돌아가기')}</nav></div>`;
      el.querySelector('[data-act="home"]').focus();
    }
    function finish(v) {
      el.classList.add('out');
      document.body.classList.remove('titling');
      setTimeout(() => el.remove(), 600);
      done(v);
    }

    el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      const a = b.dataset.act;
      if (a === 'continue') finish('continue');
      else if (a === 'new') (hasSave ? confirmNew() : finish('new'));
      else if (a === 'newYes') finish('new');
      else if (a === 'slots') slotsView();
      else if (a === 'slot') finish({ slot: Number(b.dataset.slot) });
      else if (a === 'home') home();
      else if (a === 'settings' && window.UIMenu) UIMenu.open('settings');
    });
    // 시작 화면에서는 위아래 화살표로도 고른다
    el.addEventListener('keydown', (e) => {
      if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      const bs = [...el.querySelectorAll('.tbtn')];
      const i = bs.indexOf(document.activeElement);
      bs[(i + (e.key === 'ArrowDown' ? 1 : bs.length - 1)) % bs.length].focus();
      e.preventDefault();
    });
    home();
  });
})();

</script>
