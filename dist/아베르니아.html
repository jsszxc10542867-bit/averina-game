    { to: 'hill', label: '숲으로 돌아간다', min: 240, kw: ['숲', '돌아'], use: 'vit',
      text: ['왔던 숲으로 다시 들어간다.', '비탈 위까지는 한참이다.'],
      block: (g) => (g.dark ? { min: 5, lines: ['밤의 숲으로 들어갈 자신은 없다.'] } : null) },
  ],
  actions: [],
};

// 울타리를 지키는 사람이 나를 믿지 못하면 들여보내 주지 않는다 (리아가 함께 있거나, 나를 아는 사람이 보증하면 들어갈 수 있다)
function gateBlock(g) {
  const gk = g.W.npcs.gatekeeper;
  if (!gk || !Npc.present(g.W, gk) || g.dark) return null;
  const r = Rel.get(g.W, 'gatekeeper', 'player');
  if (r.suspicion < 60 && r.hostility < 30) return null;
  if (g.W.player.companions.some((id) => Npc.present(g.W, g.W.npcs[id]))) return null;
  return { min: 5, lines: ['울타리 틈으로 들어서려 하자, 창을 든 남자가 창대를 가로로 들어 길을 막는다.', '고개를 젓는다. 들여보내 줄 생각이 없다.'] };
}

LOCS.village_gate = {
  name: '마을 울타리',
  desc: (g) => ['나무 말뚝을 엮은 낮은 울타리다. 사람 하나 드나들 틈이 나 있다.', VSKY[g.period]],
  exits: [
    { to: 'village_square', label: '울타리 안으로 들어간다', min: 5, kw: ['안', '들어', '광장'], text: ['울타리 틈을 지나 안으로 들어선다.'], block: gateBlock },
    { to: 'edge', label: '숲 쪽으로 물러난다', min: 20, kw: ['숲', '물러'], text: ['울타리를 등지고 숲 쪽으로 걷는다.'] },
  ],
  actions: [],
};

LOCS.village_square = {
  name: '마을 광장',
  desc: (g) => ['흙바닥이 다져진 작은 광장이다. 가운데에 우물이 있다.', '한쪽에 천막을 친 가게가 있다.', VSKY[g.period]],
  exits: [
    { to: 'village_gate', label: '울타리 쪽으로 간다', min: 5, kw: ['울타리', '밖'], text: ['울타리 쪽으로 걷는다.'] },
    { to: 'village_homes', label: '집들 사이로 간다', min: 5, kw: ['집'], text: ['낮은 지붕들 사이로 걸어 들어간다.'] },
    { to: 'village_field', label: '밭으로 간다', min: 10, kw: ['밭'], text: ['울타리 안쪽 밭으로 걷는다.'] },
    { to: 'village_chapel', label: '뾰족한 지붕의 건물로 간다', min: 5, kw: ['예배당', '교회', '뾰족'], text: ['광장 한쪽, 지붕이 뾰족한 건물로 걷는다.'] },
  ],
  actions: [
    { id: 'well', label: '우물물을 마신다', kw: ['물', '마시', '우물'], min: 5,
      run: (g) => { g.me.surv.thirst = 0; return ['두레박을 내려 물을 길어 올린다.', '차갑다. 개울물과는 맛이 조금 다르다.']; } },
  ],
};

LOCS.village_homes = {
  name: '마을 집들',
  desc: (g) => ['낮은 지붕의 집 몇 채가 모여 있다. 굴뚝에서 연기가 오른다.', '마른 풀 냄새가 나는 헛간이 하나 보인다.', VSKY[g.period]],
  exits: [{ to: 'village_square', label: '광장으로 간다', min: 5, kw: ['광장'], text: ['광장으로 걷는다.'] }],
  actions: [],
};

LOCS.village_field = {
  name: '마을 밭',
  desc: (g) => ['울타리 안쪽의 밭이다. 이랑이 곧게 나 있다.', '밭 가장자리에 잎이 넓은 풀이 무성하다.', VSKY[g.period]],
  exits: [{ to: 'village_square', label: '광장으로 간다', min: 10, kw: ['광장'], text: ['광장으로 걷는다.'] }],
  actions: [],
};

// [임시] 교회의 구호 거처. 플레이어는 처음에 이곳이 무엇인지 모른다 (이름은 HUD에만 보인다)
LOCS.village_chapel = {
  name: '작은 예배당',
  desc: (g) => ['지붕이 뾰족한 작은 건물이다. 안은 서늘하고 조용하다.', '앞쪽에 낯선 문양이 새겨진 돌이 놓여 있다.', '한쪽 구석에 담요 몇 장이 개어져 있다.'],
  exits: [{ to: 'village_square', label: '광장으로 간다', min: 5, kw: ['광장'], text: ['광장으로 걷는다.'] }],
  actions: [],
};

if (typeof module !== 'undefined') module.exports = { gateBlock };

</script>
<script>/* js/scenes.js */
// 장면: 선택이 여러 번 오가는 사건들. 화면 도구(ui)를 받아 진행하고 결과를 돌려준다.
// 결과: 'ok' (탐색으로 돌아감) | 'die' | 'end:with' (그녀와 함께 숲을 나섬) | 'leave' (그녀를 두고 떠남)
// ui = { S, P, W, me, page(lines), say(lines), choose(opts) -> { idx, manner }, more(), pass(min, opt) -> lines,
//        speak(str, by), learn(word), knows(word), know(id), use(k), chance(p), pick(arr), hurt(n, cause, by),
//        npc(id), rel(id), relate(id, delta, cause) }
// 장면은 결과만 정한다. 관계·기억·소문은 Social(돕기·위협·공격)과 이벤트 버스를 거쳐 세계에 남는다.

const Scenes = (() => {
  const K = (t) => ({ t, cls: 'know' }); // 지식으로 알아챈 줄
  const J = (w, t) => w + Text.josa(w, t);

  function movePlayer(ui, to) {
    const from = ui.me.loc;
    ui.me.loc = to;
    Bus.emit(ui.S, 'PLAYER_MOVED', { from, to });
  }

  // ---------- 첫 번째 위험: 풀숲의 짐승 ----------
  async function beast(ui) {
    const { S, W, P, me } = ui;
    W.worldFlags.seen.beast = true;
    const B = W.creatures.thornback; // 짐승의 몸(체력, 두려움)은 세계에 남는다
    const F = { looked: 0, noticed: true, climbed: 0 }; // 이번 싸움의 형편
    const atWater = Places.has(me.loc, 'water');
    const lines = ['……', '풀숲이 움직인다.'];
    if (P.knowledge.beast_seen) lines.push(K('……이 움직임을 안다.'));
    if (me.stats.sen >= 5 || P.knowledge.beast_seen) {
      F.noticed = false;
      lines.push('이번에는 내가 먼저 알아챘다. 그것은 아직 나를 보지 못했다.');
    } else {
      lines.push('바람이 아니다. 무언가가 낮게, 풀을 가르며 다가온다.', '풀숲 사이로 눈이 번뜩인다.');
    }
    await ui.page(lines);
    WorldEvents.record(S, 'beast_encounter', { loc: me.loc, actors: [B.id, 'player'], data: { subject: B.id, target: 'player' } });

    while (true) {
      const weapon = Combat.weaponOf(me);
      const wname = weapon ? ITEM_DEFS[weapon].name : null;
      const opts = [
        { id: 'look', label: '관찰한다' },
        { id: 'hit', label: weapon ? `${J(wname, '으로')} 공격한다` : '맨손으로 덤빈다' },
      ];
      if (me.inv.stone) opts.push({ id: 'throw', label: '돌을 던진다' });
      if (atWater) opts.push({ id: 'water', label: '물속으로 들어간다', hint: P.knowledge.beast_water ? '안다' : null });
      if (Places.has(me.loc, 'rocks')) opts.push({ id: 'climb', label: '바위 위로 올라간다' });
      opts.push({ id: 'hide', label: '숨는다' });
      opts.push({ id: F.noticed ? 'flee' : 'sneak', label: F.noticed ? '도망친다' : '조용히 물러난다' });
      const { idx } = await ui.choose(opts);
      const a = opts[idx].id;
      const out = [];
      let done = false, counter = F.noticed, hurtIt = false;
      const str = me.stats.str - 3;
      // 성공 가능성은 몸 상태, 어둠, 날씨, 지형, 그것의 두려움이 정한다 (play/combat.js)
      const can = (act) => ui.chance(Combat.chance(S, act, B, { noticed: F.noticed }));

      if (a === 'look') {
        F.looked++;
        if (F.looked === 1) {
          ui.use('sen');
          out.push('숨을 죽이고 본다.', '', { t: '[???]', cls: 'sys' }, '작은 짐승처럼 보인다.', '하지만…… 뭔가 이상하다.');
          if (!F.noticed) counter = false;
        } else if (F.looked === 2) {
          ui.use('sen');
          ui.know('beast_seen');
          out.push('개만 한 몸집. 털 대신, 가시 같은 것이 등에 빽빽하게 돋아 있다.', '눈이…… 셋이다.', '가운데 눈만 깜빡이지 않는다.');
          if (!F.noticed && ui.chance(0.5)) { F.noticed = true; out.push('', '가운데 눈이 나를 향한다.'); }
          counter = false;
        } else {
          ui.use('int');
          ui.know('beast_water');
          out.push('그것은 나를 노리면서도, 젖은 자갈이나 물웅덩이는 한 번도 밟지 않는다.', '돌아서 온다. 일부러.', '……물을 싫어하는 걸까.');
        }
      } else if (a === 'hit') {
        ui.use('str');
        const dmg = (weapon ? 1 : ui.chance(0.5) ? 1 : 0) + (str >= 2 ? 1 : 0) + (F.noticed ? 0 : 1);
        if (!F.noticed || can('hit')) {
          B.hp -= dmg;
          out.push(weapon ? `${J(wname, '을를')} 힘껏 내리친다.` : '주먹을 휘두른다.',
            dmg > 0 ? '둔한 감촉. 그것이 날카롭게 운다.' : '가시에 손이 찢긴다. 그것은 꿈쩍도 하지 않는다.');
          if (!weapon && dmg === 0) ui.hurt(1, '풀숲의 짐승에게 당했다', B.id);
          if (weapon && Player.wear(me, weapon)) out.push(`……${J(wname, '이가')} 뚝 부러진다.`);
          if (dmg > 0) { hurtIt = true; Combat.scare(B, 25); }
        } else out.push('헛손질이다. 그것이 옆으로 튄다.');
        F.noticed = true;
      } else if (a === 'throw') {
        ui.use('agi');
        Player.take(me, 'stone');
        if (can('throw')) {
          B.hp -= 1;
          hurtIt = true;
          Combat.scare(B, 20);
          out.push('돌이 그것의 옆구리에 맞는다.', '그것이 움찔 물러선다.');
          if (ui.chance(0.5)) counter = false;
        } else out.push('돌이 빗나가 풀숲에 떨어진다.');
        F.noticed = true;
      } else if (a === 'water') {
        ui.know('beast_water');
        me.surv.wet = 100;
        out.push('개울로 뛰어든다. 차가운 물이 무릎까지 차오른다.', '', '그것이 물가에서 멈춘다.',
          '낮게 으르렁거리며 물가를 따라 몇 번이고 오간다.', '하지만 발을 들이지 않는다.', '', '……이윽고 그것은 풀숲으로 사라진다.');
        done = true; counter = false;
      } else if (a === 'climb') {
        ui.use('agi');
        if (can('climb')) {
          F.climbed++;
          out.push('이끼 낀 바위를 기어오른다. 손톱이 들린다.', '그것이 바위 아래를 맴돈다. 뛰어오르려다, 미끄러진다.');
          if (F.climbed >= 2 || ui.chance(0.5)) { out.push('', '한참을 맴돌던 그것이 흥미를 잃은 듯 돌아선다.'); done = true; }
          counter = false;
        } else out.push('이끼에 손이 미끄러진다. 바위에서 떨어진다.');
      } else if (a === 'hide') {
        ui.use('sen');
        if (can('hide')) {
          out.push('고목 뒤에 몸을 붙이고 숨을 참는다.', '킁킁거리는 소리가 바로 옆을 지나간다.', '……멀어진다.');
          done = true; counter = false;
        } else {
          out.push('덤불 뒤로 몸을 숨긴다.', '킁킁거리는 소리가 멈춘다.', '그리고 덤불이 갈라진다.');
          F.noticed = true; counter = true;
        }
      } else if (a === 'flee' || a === 'sneak') {
        ui.use('agi');
        if (can(a)) {
          const exit = LOCS[me.loc].exits[0];
          out.push(a === 'sneak' ? '발끝으로 한 걸음씩 물러난다. 그것은 끝내 돌아보지 않는다.' : '돌아서서 달린다. 가지가 얼굴을 할퀸다. 뒤를 돌아보지 않는다.');
          if (a === 'flee') { movePlayer(ui, exit.to); out.push('', `정신을 차려 보니 ${LOCS[exit.to].name}이다. 따라오는 소리는 없다.`); }
          done = true; counter = false;
        } else {
          out.push('달리려는 순간 뿌리에 발이 걸린다.');
          F.noticed = true; counter = true;
        }
      }

      if (B.hp <= 0 && !done) {
        ui.know('beast_seen');
        out.push('', '그것이 비틀거린다.', '찢어지는 소리를 내지르며 풀숲 속으로 달아난다.', '',
          '풀 위에 검은 피가 점점이 떨어져 있다.', '……피에서, 희미하게 빛이 난다.');
        Places.addTrace(W, me.loc, 'blood', { quiet: true });
        done = true; counter = false;
      } else if (B.fear >= 80 && !done) {
        // 겁을 먹으면 싸움을 그만둔다
        out.push('', '그것이 멈칫한다.', '가시를 곤두세운 채 뒷걸음질 치더니, 풀숲 속으로 사라진다.');
        done = true; counter = false;
      }
      if (counter && !done && can('counter')) {
        if (can('dodge')) out.push('', '그것이 뛰어든다. 몸을 비틀어 겨우 피한다.');
        else {
          ui.hurt(2, '풀숲의 짐승에게 당했다', B.id);
          Player.injure(S, 'bite', 30);
          out.push('', ui.pick(['그것이 뛰어든다. 종아리에 이빨이 박힌다.', '가시가 팔을 긁고 지나간다. 뜨거운 것이 흘러내린다.', '어깨를 물린다. 비명이 새어 나온다.']));
        }
      }
      out.push(...ui.pass(5, { fight: true }));
      if (me.hp <= 0) {
        await ui.page([...out, '', '다리에 힘이 빠진다.', '풀 위로 쓰러진다. 흙 냄새가 난다.', '가시 돋친 그림자가, 천천히 다가온다.']);
        await ui.more();
        return 'die';
      }
      const f = Player.hpFeeling(me);
      if (f && !done) out.push('', f);
      await ui.page(out);
      if (done) {
        // 다치거나 겁을 먹은 짐승은 이 낯선 것을 피해 다닌다. 제 영역 깊은 곳으로 물러난다.
        if (hurtIt || B.hp <= 0 || B.fear >= 80 || F.climbed) { B.shy = true; B.loc = 'deep'; }
        B.hp = Math.max(1, B.hp);
        await ui.more();
        return 'ok';
      }
    }
  }

  // ---------- 첫 번째 이상현상: 떠 있는 빛 ----------
  async function light(ui) {
    const { S, W, P } = ui;
    W.worldFlags.seen.light = true;
    const lines = ['나무 사이에 무언가 떠 있다.', '빛이다. 작고, 희미하게 푸르다.',
      '반딧불처럼 보인다. 하지만 반딧불은 저렇게 움직이지 않는다.',
      '그것은 흔들리지도 않고 한 자리에 가만히 떠서……', '……나를 바라보는 것 같다.'];
    if (P.knowledge.light_watches) lines.push(K('……또 만났다.'));
    await ui.page(lines);
    let watched = false, near = 0;
    while (true) {
      const opts = [{ id: 'near', label: '다가간다' }, { id: 'watch', label: '가만히 지켜본다' }];
      if (watched || P.knowledge.light_watches) opts.push({ id: 'touch', label: '손을 뻗는다' });
      opts.push({ id: 'away', label: '눈을 돌린다' });
      const { idx } = await ui.choose(opts);
      const a = opts[idx].id;
      let out, done = true;
      if (a === 'near') {
        near++;
        if (near === 1) { out = ['한 걸음 다가선다.', '빛이 스르르 물러난다. 꼭 내가 다가선 만큼.']; done = false; }
        else out = ['다시 다가선다.', '빛은 꺼지듯 사라진다.', '눈을 깜빡이는 사이, 그것은 어디에도 없다.'];
      } else if (a === 'watch') {
        ui.use('sen');
        ui.know('light_watches');
        watched = true; done = false;
        out = ['숨을 고르고, 가만히 지켜본다.', '빛이 천천히 맥동한다. 숨을 쉬는 것처럼.',
          '내가 숨을 들이쉬면 밝아지고, 내쉬면 어두워진다.', '……나를 따라 하고 있다.'];
      } else if (a === 'touch') {
        ui.use('wil');
        ui.know('light_touched');
        Lang.sense(S, 'spirit', 5);
        Magic.observe(S, 'light', 2);
        out = ['손을 천천히 뻗는다.', '빛이 머뭇거리다가, 손끝에 내려앉는다.', '……따뜻하다.',
          '귓가에서, 소리가 아닌 무언가가 스친다.', '「……○△…… ○○……」',
          '무슨 뜻인지는 모른다. 싫은 느낌은 아니었다.', '', '빛은 사라졌다. 손끝에 온기가 남아 있다.'];
      } else {
        out = ['눈을 돌린다.', '다시 봤을 때, 빛은 없다.'];
      }
      out.push(...ui.pass(5));
      await ui.page(out);
      if (done) { await ui.more(); return 'ok'; }
    }
  }

  // ---------- 첫날 밤, 이름을 부르는 목소리 ----------
  async function call(ui) {
    const { P, me } = ui;
    const lines = ['……어디선가 목소리가 들린다.', '「……{이름}……」', '바람 소리였을까.', '',
      '아니다. 다시 들린다. 이번엔 조금 더 가깝다.', '「……{이름}.」', '그 소리는 분명, 내 이름의 모양을 하고 있다.'];
    if (P.knowledge.voice_kills) lines.push('', K('……이 목소리를 안다.'), K('따라가면 어떻게 되는지도.'));
    await ui.page(lines);
    ui.know('name_call');
    const opts = [
      { id: 'answer', label: '「……누구야?」 대답한다' },
      { id: 'look', label: '소리가 나는 쪽을 본다' },
      { id: 'ears', label: '귀를 막고 웅크린다' },
    ];
    if (P.knowledge.voice_kills) opts.push({ id: 'silent', label: '숨을 죽인다. 절대 대답하지 않는다', hint: '안다' });
    const { idx } = await ui.choose(opts);
    const a = opts[idx].id;
    const deathBy = async (pre) => {
      ui.know('voice_kills');
      me.cause = '밤의 목소리를 따라갔다';
      await ui.page([...pre, '', '몇 걸음. 몇 걸음 더.', '목소리가 멎는다.', '', '뒤에서 누군가 내 어깨에 손을 얹는다.',
        '차갑다.', '돌아본다.', '', '거기에는……']);
      await ui.more();
      return 'die';
    };
    if (a === 'answer') {
      await ui.page(['「……누구야?」', '', '목소리가 멎는다.', '그리고, 아주 가까이에서.', '「이쪽이야, {이름}.」', '', '……내 목소리다.']);
      const r = await ui.choose([{ label: '목소리 쪽으로 간다' }, { label: '뒤로 물러선다' }]);
      if (r.idx === 0) return deathBy(['나무 사이로 발을 옮긴다.', '낮에 없던 길이 나 있다. 희미하게 빛나는 길이다.']);
      ui.use('wil');
      await ui.page(['뒷걸음질 친다. 발밑에서 가지가 부러진다.', '목소리가 뚝 끊긴다.', '',
        '그 뒤로 한참 동안, 아무 소리도 없다.', '무언가가 어둠 속에서 나를 보고 있다는 느낌만 남는다.',
        ...ui.pass(30)]);
    } else if (a === 'look') {
      ui.know('night_path');
      await ui.page(['어둠 속, 나무 사이에 길이 하나 나 있다.', '낮에는 분명 없던 길이다.',
        '길 끝에서 희미한 빛이 흔들린다.', '목소리는 그 끝에서 들린다.', '「{이름}. 이리 와.」']);
      const r = await ui.choose([{ label: '길을 따라간다' }, { label: '눈을 질끈 감는다' }]);
      if (r.idx === 0) return deathBy(['홀린 듯 발을 옮긴다.', '길은 발밑에서 부드럽게 빛난다.']);
      ui.use('wil');
      await ui.page(['눈을 감는다. 숫자를 센다. 하나, 둘, 셋……', '백을 넘겼을 때 눈을 뜬다.', '길은 없다. 원래 그랬던 것처럼.', ...ui.pass(30)]);
    } else {
      ui.use('wil');
      if (a === 'silent') ui.use('wil');
      await ui.page(a === 'silent'
        ? ['입을 틀어막는다. 숨소리조차 내지 않는다.', '목소리는 몇 번 더 내 이름을 부르다가……', '……포기한 듯 멀어진다.', ...ui.pass(30)]
        : ['귀를 막는다.', '목소리는 손가락 사이로 스며든다.', '「{이름}…… {이름}……」', '이를 악문다. 대답하지 않는다.', '',
          '……얼마나 지났을까.', '목소리는 사라졌다.', ...ui.pass(40)]);
    }
    await ui.more();
    return 'ok';
  }

  // ---------- 상태창 해금 (첫 밤을 넘긴 새벽) ----------
  async function status(ui) {
    const { P, me } = ui;
    Player.unlockStatus(me);
    const again = P.knowledge.status_seen;
    P.knowledge.status_seen = true;
    await ui.page(again
      ? ['몸을 일으킨다.', '……또 이 감각이다.', '내 몸의 상태가, 숫자로 느껴진다.', '']
      : ['몸을 일으킨다. 밤새 굳은 팔다리가 삐걱거린다.', '손을 쥐었다, 편다.', '', '……이상하다.',
        '분명 처음 보는 몸인데……', '내 몸의 상태가, 숫자로 느껴진다.', '']);
    await ui.say(Player.statusLines(me, P.name));
    await ui.say(['', '대부분은 아직 흐릿하다.', '하지만 어딘가에 힘을 더 실을 수 있을 것 같다.'], { pace: 700 });
    const { idx } = await ui.choose([{ label: '지금 정한다' }, { label: '나중에 정한다', hint: '언제든 몸 상태를 확인할 수 있다' }]);
    if (idx === 0) await allocate(ui);
    return 'ok';
  }

  // 능력치 배분. 포인트는 회차마다 다시 받는다.
  async function allocate(ui) {
    const { P, me } = ui;
    while (me.status.points > 0) {
      await ui.page(['현재 능력치를 확인한다.', '', ...Player.statusLines(me, P.name)], { pace: 60 });
      const opts = STAT_KEYS.map((k) => ({
        k, label: `${STAT_KO[k]}에 힘을 싣는다`, disabled: me.stats[k] >= STAT_MAX,
        hint: me.status.known[k] ? String(me.stats[k]) : '?',
      }));
      opts.push({ k: null, label: '여기까지만 한다', sep: true });
      const { idx } = await ui.choose(opts);
      const k = opts[idx].k;
      if (!k) break;
      me.stats[k]++;
      me.status.points--;
      if (k === 'vit') Player.heal(me, 1);
    }
    await ui.page(me.status.points > 0
      ? ['남은 힘은 아껴 둔다.', '']
      : ['몸 안에서 무언가가 자리를 잡는다.', '']);
    await ui.say(Player.statusLines(me, P.name), { pace: 60 });
    await ui.more();
  }

  // 만난 사람을 떠올린다. 관계는 숫자가 아니라 인상으로.
  function peopleLines(ui) {
    const { S, W, P } = ui;
    return Object.keys(P.found.npcs).filter((id) => W.npcs[id]).map((id) => {
      const n = W.npcs[id];
      const name = P.found.npcs[id].name || n.identity.desc;
      const sawDeath = !n.alive && W.events.log.some((e) => e.type === 'death_witnessed' && e.data.target === id && e.witnesses.includes('player'));
      if (sawDeath) return { t: `· ${name} — ……죽었다.`, cls: 'note' };
      const r = Rel.peek(W, id, 'player');
      const word = !r ? '잘 모르겠다' : r.hostility >= 50 ? '나를 미워한다' : r.fear >= 50 ? '나를 두려워한다'
        : r.trust >= 40 ? '나를 조금 믿는 것 같다' : r.gratitude >= 20 ? '고마워하는 것 같다' : r.suspicion >= 60 ? '나를 경계한다' : '잘 모르겠다';
      return { t: `· ${name} — ${word}`, cls: 'note' };
    });
  }

  // 몸 상태를 확인한다 (상태창이 열린 뒤 언제든). 능력치, 언어, 아는 곳, 만난 사람 (통합 명세 37절)
  async function checkBody(ui) {
    const { S, P, me } = ui;
    const f = Player.hpFeeling(me);
    const lines = ['눈을 감고 몸에 집중한다.', '', ...Player.statusLines(me, P.name), '', f || '몸은 아직 괜찮다.'];
    const langs = LangUI.languageLines(S);
    if (langs.length) lines.push('', ...langs);
    const places = Explore.mapLines(S);
    if (places.length) lines.push('', '아는 곳', ...places);
    const people = peopleLines(ui);
    if (people.length) lines.push('', '만난 사람', ...people);
    // 생활: 손에 익은 일, 잠자리, 함께 다니는 사람
    const work = Work.tendencyLines(S);
    if (work.length) lines.push('', '해 본 일', ...work);
    if (me.lodging) lines.push('', { t: `잠자리 — ${RULES.lodgings[me.lodging.id].label}`, cls: 'note' });
    const comp = Companion.list(ui.W).filter((n) => n.alive);
    const nameOf = (n) => (P.found.npcs[n.id] && P.found.npcs[n.id].name) || n.identity.desc;
    if (comp.length) lines.push({ t: `함께 다니는 사람 — ${comp.map(nameOf).join(', ')}`, cls: 'note' });
    await ui.page(lines);
    if (me.status.points > 0) {
      const { idx } = await ui.choose([{ label: '남은 힘을 싣는다' }, { label: '그만둔다' }]);
      if (idx === 0) await allocate(ui);
    } else await ui.more();
  }

  // ---------- 첫 번째 인간: 다친 여자 ----------
  function girlLook(ui, G) {
    const r = Rel.get(ui.W, 'lia', 'player');
    const l = [];
    if (G.physical.bleed === 0) l.push('팔에 짓이긴 풀이 덮여 있다. 피는 멎었다.');
    else if (G.physical.health >= 30) l.push('그녀는 나무에 기대어 앉아 있다. 팔을 감싼 손가락 사이로 피가 배어 나온다.');
    else l.push('그녀의 얼굴이 창백하다. 숨이 얕고 빠르다. 팔에서 피가 계속 흐른다.');
    if (G.flags.close) l.push('그녀는 이제 나보다 숲 쪽을 더 살핀다.');
    else if (G.mental.fear >= 50 || r.suspicion >= 60) l.push('손은 여전히 단검 자루 위에 있다.');
    else l.push('단검은 무릎 옆에 내려놓여 있다.');
    return l;
  }

  async function magicScene(ui) {
    const { W, P } = ui;
    const G = W.npcs.lia;
    G.flags.magicSeen = true;
    ui.know('magic_seen');
    P.memory.worldKnowledge++;
    await ui.page(['그녀가 눈을 감는다. 다친 팔 위에 다른 손을 얹는다.', '입술이 무언가를 낮게 중얼거린다.', '',
      '……손끝이 빛난다.', '희미한, 물빛 같은 빛.', '빛이 닿은 자리에서, 찢어진 살이 천천히 오므라든다.', '',
      '숨을 쉬는 것도 잊는다.', '「……방금, 뭐 한 거예요?」', '', '그녀가 눈을 뜬다.', ui.speak('「[[뭐:20]]가?」'),
      '내 얼굴을 한참 들여다보더니, 무언가 알겠다는 듯 눈을 가늘게 뜬다.', ui.speak('「[[마법:45]]…… [[처음:30]] [[봐:30]]?」'), '',
      '뜻은 모른다.', '하지만 그 눈빛은, 이상한 것을 보는 눈빛이다.', '이 세계에서 이상한 건, 나다.']);
    await ui.more();
  }

  async function invite(ui) {
    const { S, W, P } = ui;
    const G = W.npcs.lia;
    G.flags.invited = true;
    const lines = ['그녀가 나무를 짚고 일어선다. 휘청이지만 쓰러지지 않는다.', '단검을 칼집에 꽂고, 숲 저편을 가리킨다.'];
    if (P.knowledge.smoke) lines.push('……비탈 위에서 봤던, 연기가 오르던 쪽이다.');
    lines.push(ui.speak('「[[마을:20]].」'), '그녀가 걷는 시늉을 하고, 나를 가리키고, 다시 저편을 가리킨다.', ui.speak('「[[같이:30]]…… [[가:30]].」'));
    if (ui.learn('마을')) lines.push('', K('……"마을". 사람이 모여 사는 곳을 말하는 것 같다.'));
    ui.know('village');
    await ui.page(lines);
    const { idx } = await ui.choose([{ label: '그녀를 따라간다' }, { label: '고개를 젓는다' }]);
    if (idx === 0) return 'travel'; // 그녀와 함께 마을까지 걷는다 (arriveWith)
    // 그녀는 혼자 마을로 간다. 기다려 주지 않는다.
    G.physical.shock = Math.min(G.physical.shock, 15);
    Goals.add(G, { id: 'return_home', type: 'personal', priority: 90 }, W.time.t);
    Npc.startMove(S, G, G.location.home);
    await ui.page(['고개를 젓는다.', '그녀는 잠시 나를 보더니, 어깨를 으쓱한다.', '그리고 걸어간다.', '돌아보지 않는다.']);
    W.worldFlags.feed.length = 0;
    await ui.more();
    return 'ok';
  }

  // 그녀에게서 들은 말 가운데 따라 해 볼 만한 것 (뜻을 어렴풋이라도 짐작하는 말)
  function sayable(ui) {
    const w = LangKnowledge.heardWords(ui.S, Lang.AVER).find((x) => x.confidence >= LangKnowledge.GUESS);
    return w ? { id: w.id, sound: LangRegistry.sound(w.id, w.id) } : null;
  }

  async function girl(ui) {
    const { S, W, P, me } = ui;
    const G = W.npcs.lia;
    ui.talker = 'lia';
    const R = () => Rel.get(W, 'lia', 'player');
    if (!G.flags.met) {
      G.flags.met = true;
      G.flags.heardStop = (G.flags.heardStop || 0) + 1;
      Social.meet(S, 'lia');
      ui.know('girl_hollow');
      const l = ['나무뿌리가 엉킨 움푹한 곳.', '거기, 사람이 있다.', '',
        '젊은 여자다. 나무에 등을 기대고 앉아 있다.', '옷이 피로 젖어 있다. 한쪽 팔을 다른 손으로 꽉 부여잡고 있다.', '',
        '마른 가지가 발밑에서 부러진다.', '그녀의 고개가 번쩍 들린다.', '팔을 쥐고 있던 손이, 허리춤의 단검으로 향한다.', '',
        ui.speak('「[[거기:15]]…… [[멈춰:10]].」'), '낮고 갈라진 목소리다.'];
      if (ui.knows('멈춰')) l.push(K('……"멈춰". 이 말을 안다.'));
      else l.push('무슨 말인지 모른다.', '……하지만 그 눈빛이 무엇을 말하는지는 안다.');
      if (P.deaths > 0 && P.knowledge.girl_name) l.push('', K('……그녀다.'), K('그녀는 나를 모른다.'));
      await ui.page(l);
    } else {
      await ui.page(['그녀는 아직 그 자리에 있다.', ...girlLook(ui, G)]);
    }

    let unread = false; // 방금 보여 준 결과를 아직 넘기지 않았다
    while (true) {
      const pi = W.worldFlags.pending.indexOf('magic:lia');
      const inviteReady = !G.flags.invited && G.flags.magicSeen && R().trust >= 40 && G.physical.health >= 15;
      // 다음 장면이 화면을 지우기 전에, 방금 일어난 일을 읽을 틈을 준다
      if (unread && (!G.alive || !Npc.present(W, G) || pi >= 0 || inviteReady)) await ui.more();
      unread = false;
      if (!G.alive) {
        await ui.page(['그녀가 더는 움직이지 않는다.', '몇 번을 불러도, 대답이 없다.']);
        await ui.more();
        return 'ok';
      }
      if (!Npc.present(W, G)) return 'ok';
      if (pi >= 0) { W.worldFlags.pending.splice(pi, 1); await magicScene(ui); }
      if (!G.flags.invited && G.flags.magicSeen && R().trust >= 40 && G.physical.health >= 15) {
        const r = await invite(ui);
        if (r !== 'ok') return r;
        continue;
      }

      Save.write(S);
      const F = G.flags;
      const knowsName = P.knowledge.girl_name && !F.named && !F.calledName;
      const weapon = Combat.weaponOf(me);
      const wname = weapon ? ITEM_DEFS[weapon].name : null;
      const word = sayable(ui);
      const opts = [];
      if (ui.knows('멈춰') && !F.stopped && !F.close && !F.named && R().trust < 25) opts.push({ id: 'stop', label: '멈춰 선다. 두 손을 펴 보인다', hint: '말을 안다' });
      if (!F.close) opts.push({ id: 'near', label: '다가간다' });
      if (!F.gotWater) opts.push({ id: 'water', label: '개울물을 떠다 건넨다' });
      opts.push({ id: 'wound', label: '상처를 살펴본다' });
      opts.push({ id: 'talk', label: '말을 걸어 본다' });
      if (word) opts.push({ id: 'say', label: '들은 말을 되풀이해 본다' });
      if (F.talked >= 2 && !F.named) opts.push({ id: 'name', label: '나를 가리키며 이름을 말한다' });
      if (knowsName) opts.push({ id: 'callname', label: '「……리아?」 이름을 불러 본다', hint: '안다' });
      if (me.inv.herb && !F.gotHerb) {
        opts.push(P.knowledge.herb_heals
          ? { id: 'herb', label: '쓴 풀을 짓이겨 상처에 대어 준다', hint: '안다' }
          : { id: 'herb', label: '쓴 냄새가 나는 풀을 건넨다' });
      }
      if (me.inv.berry && !F.sawBerry) opts.push({ id: 'berry', label: '붉은 열매를 건넨다' });
      opts.push({ id: 'wait', label: '거리를 두고 기다린다' });
      opts.push({ id: 'threat', label: me.inv.stone ? '돌을 쥐고 위협한다' : '주먹을 쥐고 위협한다' });
      opts.push({ id: 'attack', label: weapon ? `${J(wname, '을를')} 치켜들고 달려든다` : '그녀에게 달려든다' });
      opts.push({ id: 'leave', label: '그냥 지나간다', sep: true });
      const { idx, manner } = await ui.choose(opts);
      const a = opts[idx].id;
      let out = [], min = 5;

      if (a === 'stop') {
        F.stopped = true;
        ui.relate('lia', { trust: 15, suspicion: -15, respect: 10 }, 'stopped');
        out = ['그 말을 안다.', '발을 멈춘다. 천천히 두 손을 펴 보인다.', '',
          '그녀의 눈이 조금 커진다.', ui.speak('「……[[알아듣는:40]] [[거야:40]]?」'), '단검을 쥔 손에서, 힘이 조금 빠진다.'];
      } else if (a === 'near') {
        if (R().trust >= 25 || F.named) {
          F.close = true;
          ui.relate('lia', { trust: 5, familiarity: 5 }, 'close');
          out = ['천천히 다가간다.', '그녀는 나를 한 번 올려다보고, 단검에서 손을 뗀다.'];
        } else {
          F.heardStop = (F.heardStop || 0) + 1;
          F.approach = (F.approach || 0) + 1;
          // 조심스럽게 다가가면 덜 놀란다 (자유 입력의 "조심스럽게", 통합 명세 34절)
          ui.relate('lia', manner === 'careful' ? { fear: 5, suspicion: 5 } : { fear: 10, suspicion: 10 }, 'approached');
          out = [manner === 'careful' ? '몸을 낮추고, 아주 천천히 한 걸음 다가선다.' : '한 걸음 다가선다.',
            '단검이 칼집에서 반쯤 빠져나온다.', ui.speak('「[[멈춰:10]]! [[멈춰:10]]!」')];
          if (F.heardStop >= 2 && ui.learn('멈춰')) {
            out.push('', K('……아까부터 같은 말을 반복하고 있다.'), K('아마, "멈춰"라는 뜻인 것 같다.'));
          }
          if (F.approach >= 3) {
            ui.hurt(2, '그녀의 단검에 베였다', 'lia');
            Player.injure(S, 'cut', 20);
            ui.relate('lia', { hostility: 10 }, 'cornered');
            out.push('', '한 걸음 더 내딛는 순간, 칼끝이 팔을 스친다.', '뜨겁다. 피가 흐른다.', '그녀는 숨을 몰아쉬며 나를 노려본다.');
          }
        }
      } else if (a === 'water') {
        min = 20;
        F.gotWater = true;
        me.surv.thirst = 0; // 개울에 간 김에 나도 마신다
        Social.help(S, 'player', 'lia', 'water', { trust: 10, suspicion: -5 }); // 그녀의 갈증과 충격은 도움 이벤트가 덜어 준다
        out = ['개울까지 가서, 넓은 잎을 접어 물을 담아 온다.', '돌아오는 사이 반은 흘렀다.', '',
          '그녀 앞 땅바닥에 잎을 내려놓고, 뒤로 물러선다.', '그녀는 한참 나를 노려보다가…… 잎을 집어 든다.', '단숨에 마신다.', '',
          ui.speak('「……[[물:10]].」'), '그녀가 빈 잎을 들어 보이며 같은 소리를 한 번 더 낸다.', '그리고 개울 쪽을 가리킨다.'];
        if (ui.learn('물')) out.push('', K('……물.'), K('아마 물을 뜻하는 말이다.'));
      } else if (a === 'wound') {
        ui.use('int');
        ui.know('girl_wound');
        out = F.close
          ? ['곁에 앉아 상처를 본다. 그녀가 팔을 조금 내밀어 준다.', '팔 위쪽이 깊게 찢겨 있다. 나란히 난 세 줄.',
            '살이 벌어져 있다. 이대로는 피가 멎지 않을 것이다.']
          : ['거리를 둔 채 눈으로만 살핀다.', '팔 위쪽이 깊게 찢겨 있다. 칼에 베인 상처가 아니다.', '나란히 난 세 줄.',
            '……세 갈래.'];
        if (P.knowledge.fresh_prints) out.push(K('개울가 진흙의, 앞이 갈라진 발자국이 떠오른다.'));
        if (!F.close) ui.relate('lia', { suspicion: 5 }, 'stared');
      } else if (a === 'talk') {
        F.talked = (F.talked || 0) + 1;
        if (F.talked === 1) {
          ui.know('lang_barrier');
          Memory.add(S, G, { type: 'strange', subject: 'player', detail: 'unknown_language' });
          out = ['「저기요…… 괜찮아요?」', '', '그녀의 눈썹이 찌푸려진다.', '「……?」', '',
            '그녀가 무언가를 되묻는다.', ui.speak('「[[어디:30]]서 [[왔:30]]어? [[어느:35]] [[마을:20]]?」'),
            '……알아들을 수 없다.', '', '고개를 젓자, 그녀의 얼굴에 묘한 표정이 떠오른다.',
            '경계가 아니다. 이해할 수 없는 것을 보는 얼굴이다.', '', '……그녀는 내 말을 모른다.', '내가 그녀의 말을 모르는 것처럼.'];
        } else if (F.talked === 2) {
          ui.relate('lia', { trust: 3 }, 'talked');
          out = ['다시 말을 걸어 본다. 이번엔 천천히, 손짓을 섞어서.', '', '그녀가 한숨을 쉰다.',
            '그리고 자기 가슴을 두 번 두드린다.', '「리아.」', '한 번 더.', '「리아.」'];
        } else {
          out = ['손짓 발짓으로 무언가를 전해 보려 한다.', ui.speak('「[[너:25]]…… [[정말:40]] [[아무것도:40]] [[몰라:30]]?」'),
            '그녀는 알 수 없는 말을 중얼거리며 고개를 젓는다.'];
        }
      } else if (a === 'say') {
        const r = Dialogue.playerSays(S, 'lia', word.id);
        out = ['그녀에게서 들은 소리를 흉내 내어 본다.', `「${word.sound}.」`, ''];
        if (r.success) out.push('그녀의 눈이 커진다.', `「……${word.sound}.」`, '그녀가 같은 소리를 천천히 되받는다. 고개를 끄덕인다.', K('……통했다.'));
        else out.push('그녀가 고개를 갸웃한다.', '……발음이 틀렸거나, 뜻이 틀렸다.');
      } else if (a === 'name') {
        F.named = true;
        ui.know('girl_name');
        ui.relate('lia', { trust: 10, affection: 5 }, 'named');
        G.knowledge.facts.playerName = true;
        Memory.add(S, G, { type: 'heard_name', subject: 'player', detail: P.name });
        Knowledge.learnName(S, 'lia');
        out = ['내 가슴을 가리킨다.', '「{이름}.」', '', '그녀가 눈을 깜빡인다.', '「……{이름}?」',
          '발음이 조금 이상하다. 하지만 분명 내 이름이다.', '', '그녀가 다시 자기 가슴을 두드린다.', '「리아.」', '「……리아.」', '',
          '그녀의 입꼬리가, 아주 조금 올라간다.'];
      } else if (a === 'callname') {
        F.calledName = true;
        ui.relate('lia', { suspicion: 25, fear: 15, trust: -5 }, 'knew_name');
        Memory.add(S, G, { type: 'strange', subject: 'player', detail: 'knew_my_name' });
        out = ['「……리아?」', '', '그녀의 몸이 굳는다.', '단검이 완전히 뽑혀 나온다.',
          ui.speak('「[[어떻게:40]]…… [[내:25]] [[이름을:35]]……?」'), '',
          '……아차.', '이번의 그녀는, 나에게 이름을 알려 준 적이 없다.'];
      } else if (a === 'herb') {
        F.gotHerb = true;
        Player.take(me, 'herb');
        G.physical.bleed = 0;
        if (P.knowledge.herb_heals) {
          Social.help(S, 'player', 'lia', 'herb', { trust: 20, respect: 10 });
          out = ['쓴 풀을 두 손으로 비벼 짓이긴다.', '그녀의 팔을 가리키고, 내 손을 보여 준다.', '',
            '그녀가 망설이다가, 팔을 내민다.', '짓이긴 풀을 상처에 꾹 누른다. 그녀가 이를 악문다.', '……피가 멎는다.', '',
            ui.speak('「……[[어디:30]]서 [[배웠:40]]어?」'), '그녀가 신기하다는 듯 나를 본다.'];
        } else {
          ui.know('herb_heals');
          Social.help(S, 'player', 'lia', 'herb', { trust: 15, respect: 5 });
          out = ['쓴 냄새가 나는 풀을 꺼내 내민다.', '그녀의 눈이 풀에 멎는다.', ui.speak('「……[[쓴잎:30]]?」'), '',
            '그녀가 풀을 낚아챈다. 입에 넣고 씹더니, 짓이긴 것을 상처에 꾹 누른다.', '이를 악문 얼굴이 조금씩 풀린다.', '',
            '……피가 멎는다.', K('그 풀은, 피를 멎게 하는 풀이었다.')];
        }
      } else if (a === 'berry') {
        F.sawBerry = true;
        ui.relate('lia', { trust: 3 }, 'berry');
        out = ['붉은 열매를 내민다.', '그녀가 내 손을 쳐낸다. 열매가 흙바닥에 흩어진다.', '',
          ui.speak('「[[독:15]]! [[먹으면:40]] [[죽어:30]]!」'), '그녀가 목을 움켜쥐고, 토하는 시늉을 한다.'];
        if (ui.learn('독')) out.push('', K('……"독". 먹으면 안 된다는 말이다.'));
        if (me.ateBerry) out.push('……어제 배가 뒤집혔던 게 그것 때문이었다.');
        ui.know('berry_poison');
        delete me.inv.berry;
      } else if (a === 'wait') {
        min = 15;
        ui.relate('lia', { suspicion: -5 }, 'waited');
        out = ['나무 하나를 사이에 두고 앉는다.', '그녀도 나도 말이 없다.', '새소리. 그녀의 얕은 숨소리.'];
        if (G.mental.fear < 45) out.push('그녀의 어깨에서 힘이 조금 빠진다.');
      } else if (a === 'threat') {
        // 협박: 공포와 적의가 오르고 신뢰가 무너진다. 그녀는 달아난다 (통합 명세 36절)
        const strong = G.physical.health >= 25;
        Social.threaten(S, 'player', 'lia', { hostility: 50, trust: -30, fear: 20 });
        if (strong) {
          ui.hurt(3, '그녀를 위협했다가 되레 쓰러졌다', 'lia');
          out = [me.inv.stone ? '돌을 쥐고 그녀를 노려본다.' : '주먹을 쥐고 한 걸음 내딛는다.', '',
            '그녀가 먼저 움직인다. 다친 사람의 움직임이 아니다.', '단검 자루가 명치에 꽂힌다. 숨이 막힌다.',
            ui.speak('「[[오지:30]] [[마:30]]!」'), '', '고개를 들었을 때, 그녀는 이미 숲 속으로 사라진 뒤다.'];
        } else {
          out = ['한 걸음 내딛는다.', '그녀의 눈에 공포가 스친다.', '그녀는 다친 팔을 끌어안고, 기다시피 숲 속으로 달아난다.',
            '핏자국이 풀 위로 길게 이어진다.'];
          Places.addTrace(W, me.loc, 'blood', { quiet: true });
        }
        Behavior.force(S, G, 'flee');
        W.worldFlags.feed.length = 0;
        out.push(...ui.pass(5));
        await ui.page(out);
        await ui.more();
        return me.hp <= 0 ? 'die' : 'ok';
      } else if (a === 'attack') {
        // 공격: 정답도 오답도 아니다. 다만 세계는 그것을 기억한다.
        const strong = G.physical.health >= 25;
        ui.use('str');
        Social.attack(S, 'player', 'lia', { weapon });
        const res = Combat.playerVsNpc(S, G, weapon);
        out = [weapon ? `${J(wname, '을를')} 치켜들고 달려든다.` : '주먹을 쥐고 달려든다.', ''];
        if (!res.hit) out.push('그녀가 몸을 비튼다. 허공을 가른다.');
        else if (res.killed) out.push('……둔한 소리.', '그녀의 몸이 나무뿌리 위로 무너진다.', '단검이 손에서 미끄러진다.', '', '움직이지 않는다.');
        else out.push('손에 둔한 감촉이 전해진다. 그녀가 비틀거린다.');
        if (G.alive) {
          if (strong) {
            ui.hurt(4, '그녀에게 달려들었다가 칼에 찔렸다', 'lia');
            Player.injure(S, 'stab', 40);
            out.push('', '그녀의 단검이 번뜩인다.', '옆구리가 뜨겁다. 무릎이 꺾인다.');
          }
          Behavior.force(S, G, 'flee');
          Places.addTrace(W, me.loc, 'blood', { quiet: true });
          out.push('', '고개를 들었을 때, 그녀는 피를 흘리며 숲 속으로 사라지고 있다.');
        }
        W.worldFlags.feed.length = 0;
        out.push(...ui.pass(5, { fight: true }));
        await ui.page(out);
        await ui.more();
        return me.hp <= 0 ? 'die' : 'ok';
      } else if (a === 'leave') {
        G.flags.lastSawPlayer = W.time.t;
        movePlayer(ui, 'stream');
        return 'leave';
      }

      out.push(...ui.pass(min));
      if (me.hp <= 0) { await ui.page([...out, '', '눈앞이 어두워진다.']); await ui.more(); return 'die'; }
      if (Npc.present(W, G) && G.alive) out.push('', ...girlLook(ui, G));
      await ui.page(out);
      unread = true;
    }
  }

  // ---------- 마을에 닿다 (예전 1장의 끝. 되감기가 없어져 이제 마을 생활로 이어진다) ----------
  // 마을이 어떤 모습인지는 그사이 세계에서 벌어진 일에 달려 있다 (소문, 리아의 생사와 위치, 문지기의 인상)
  function villageLines(ui) {
    const { S, W } = ui;
    const lia = W.npcs.lia;
    const gate = W.npcs.gatekeeper;
    const onDuty = gate && gate.alive && Npc.at(W, 'gatekeeper', 'village_gate');
    const heard = (type) => gate && Object.keys(gate.knowledge.rumors).some((id) => W.rumors[id] && W.rumors[id].type === type && (W.rumors[id].subject === 'player' || W.rumors[id].target === 'lia'));
    const r = gate ? Rel.get(W, 'gatekeeper', 'player') : null;
    const liaIn = lia.alive && Places.regionOf(lia.location.loc) === 'village';
    if (!lia.alive && (heard('died') || W.regions.village.alert >= 60)) {
      return ['울타리 앞에 사람이 여럿 서 있다. 모두 손에 무언가를 들고 있다.', '그중 하나가 나를 가리키며 무언가 외친다.',
        ui.speak('「[[거기:15]] [[서:10]]! [[누구:20]]야!」', 'gatekeeper'), '', '알아들을 수 없다.', '……무언가가, 이미 벌어진 뒤다.'];
    }
    if (!onDuty) {
      return ['울타리 앞에는 아무도 없다.', Time.dark(W.time.t) ? '집들 사이로 불빛 몇 개가 새어 나온다.' : '어디선가 개 짖는 소리가 들린다.'];
    }
    if (r && (r.hostility >= 30 || heard('threatened') || heard('attacked'))) {
      return ['울타리 앞의 남자가 나를 보자마자 창끝을 겨눈다.', ui.speak('「[[가:30]]! [[오지:30]] [[마:30]]!」', 'gatekeeper'),
        '', '알아들을 수 없다.', '……그런데 그 눈빛은, 나를 알고 있는 눈빛이다.'];
    }
    // 그녀가 먼저 마을에 닿아 있고 나를 믿는다면, 울타리의 소란을 듣고 나온다
    if (liaIn && Rel.get(W, 'lia', 'player').trust >= 30) {
      Npc.place(S, lia, 'village_gate');
      Rel.change(S, 'gatekeeper', 'player', { suspicion: -30, trust: 10 }, 'vouched');
      return ['울타리 앞의 남자가 나를 보더니, 뒤를 돌아보며 무언가 외친다.', '……집들 사이에서, 팔에 천을 감은 여자가 나온다.',
        '리아다.', '그녀가 나를 보고, 아주 조금 웃는다.'];
    }
    return ['울타리 앞의 남자가 나를 보고 무언가 외친다.', '「……!」', '', '알아들을 수 없다.', '……대체, 이 세계는 뭐지?'];
  }

  // 혼자 숲의 가장자리에 닿았다
  async function arrival(ui) {
    const { S, W } = ui;
    W.worldFlags.seen.arrival = true;
    const lia = W.npcs.lia;
    const liaIn = lia.alive && Places.regionOf(lia.location.loc) === 'village';
    const lines = ['몇 시간을 걸었다.', '다리가 후들거리고, 목이 탄다.', '', '나무 사이가 성겨진다.', '숲이 끝나는 곳에 낮은 울타리와 지붕들이 보인다.',
      '사람이 있다.', '', ...(lia.flags.met && !liaIn ? ['……그녀는 어디로 갔을까.', ''] : [])];
    movePlayer(ui, 'village_gate');
    lines.push(...villageLines(ui));
    await ui.page(lines);
    await ui.more();
    return 'ok';
  }

  // 리아를 따라 마을까지 걷는다 (동행). 울타리에서 그녀가 나를 보증해 준다.
  async function arriveWith(ui) {
    const { S, W, me } = ui;
    const G = W.npcs.lia;
    W.worldFlags.seen.arrival = true;
    Companion.join(S, 'lia');
    const route = Places.route(me.loc, 'village_gate');
    await ui.page(['그녀를 따라 걷는다.', '그녀는 몇 걸음마다 뒤를 돌아본다. 내가 따라오는지 확인하는 것처럼.']);
    // 숲을 빠져나가는 동안 (둘 다 숲의 가장자리 쪽에 있는 것으로 둔다)
    movePlayer(ui, 'edge');
    Npc.place(S, G, 'edge');
    const walk = ui.pass(route ? route.min - 20 : 200, { move: true });
    movePlayer(ui, 'village_gate');
    Npc.place(S, G, 'village_gate');
    const lines = [...walk.filter((l) => l !== ''), '',
      Time.band(W.time.t) === 'evening' ? '해가 기울 무렵, 나무 사이가 성겨진다.' : '나무 사이가 성겨진다.',
      '숲이 끝나는 곳에 낮은 울타리와 지붕들이 보인다.', '굴뚝에서 연기가 오른다.', '',
      '리아가 걸음을 멈추고 나를 돌아본다.', ui.speak('「[[어서:40]] [[와:40]]. [[여기가:60]] [[마을:20]]이야.」', 'lia'), '',
      '그녀가 무슨 말을 했는지, 전부는 모른다.', '하지만 언젠가는 알게 될 것이다.'];
    // 울타리를 지키는 사람에게 나를 보증한다
    const gk = W.npcs.gatekeeper;
    if (gk && gk.alive && Npc.at(W, 'gatekeeper', 'village_gate')) {
      Rumor.exchange(S, G, gk);
      Rel.change(S, 'gatekeeper', 'player', { suspicion: -30, trust: 10 }, 'vouched');
      lines.push('', '울타리 앞의 남자가 리아를 보고 달려온다.', '둘이 빠르게 말을 주고받는다. 남자가 나를 한 번 훑어본다.', '……그리고 길을 비켜 준다.');
    }
    // 그녀는 집으로 간다. 함께 다니고 싶으면 다시 청해야 한다.
    Companion.leave(S, 'lia', 'home');
    Goals.add(G, { id: 'return_home', type: 'personal', priority: 90 }, W.time.t);
    lines.push('', '리아가 집들 쪽을 가리키더니, 먼저 걸어 들어간다.');
    Npc.startMove(S, G, G.location.home);
    W.worldFlags.feed.length = 0;
    await ui.page(lines);
    await ui.more();
    return 'ok';
  }

  return { beast, light, call, status, allocate, checkBody, girl, peopleLines, arrival, arriveWith, villageLines };
})();

if (typeof module !== 'undefined') module.exports = { Scenes };

</script>
<script>/* js/engine.js */
// 화면과 게임 흐름: 시작 연출 → 기억 → 이름 → 숲 자유 탐색.
// 게임 상태는 S = { P, W } 하나다. P는 되감아도 남고, W(세계)는 되감으면 처음으로 돌아간다.
(() => {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const app = $('#app'), story = $('#story'), choicesEl = $('#choices'), hudEl = $('#hud'), barEl = $('#bar');
  const freeRow = $('#freeRow'), freeInput = $('#free');

  const S = { P: Persist.create(), W: World.create(0) };
  const DIE = { die: true }; // 장면 도중 개발용 강제 죽음
  let skip = false, wake = null, cancelChoice = null;

  const fmt = (s) => Text.fmt(s, { 이름: S.P.name });
  const me = () => S.W.player;
  const flags = () => S.W.worldFlags;

  // ---------- 출력 ----------
  function wait(ms) {
    return new Promise((res) => {
      const t = setTimeout(() => { wake = null; res(); }, ms);
      wake = () => { clearTimeout(t); wake = null; res(); };
    });
  }

  function addLine(text, cls) {
    const p = document.createElement('p');
    p.className = 'line' + (text === '' ? ' gap' : '') + (cls ? ' ' + cls : '');
    p.textContent = fmt(text);
    story.appendChild(p);
    void p.offsetWidth; // 강제 리플로우: 다음 줄에서 클래스를 붙여도 전환 효과가 난다
    p.classList.add('in');
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }

  // 줄을 하나씩 보여 준다. 클릭/Space/Enter로 나머지를 한 번에 보여 줄 수 있다.
  async function say(lines, { pace = 520, cls = '' } = {}) {
    skip = false;
    const stop = () => { skip = true; if (wake) wake(); };
    const onKey = (e) => {
      if ((e.key === 'Enter' || e.key === ' ') && document.activeElement.tagName !== 'INPUT') stop();
    };
    app.addEventListener('pointerdown', stop);
    document.addEventListener('keydown', onKey);
    try {
      for (let i = 0; i < lines.length; i++) {
        const o = typeof lines[i] === 'string' ? { t: lines[i] } : lines[i];
        addLine(o.t, o.cls || cls);
        if (!skip && o.t !== '' && i < lines.length - 1) await wait(o.pause || pace);
      }
    } finally {
      app.removeEventListener('pointerdown', stop);
      document.removeEventListener('keydown', onKey);
    }
  }

  // 클릭이나 Space/Enter를 기다린다.
  function more() {
    return new Promise((res) => {
      const hint = document.createElement('div');
      hint.className = 'more';
      hint.textContent = '▾';
      story.appendChild(hint);
      const armAt = performance.now() + 300;
      const done = (e) => {
        if (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;
        if (performance.now() < armAt) return;
        app.removeEventListener('click', done);
        document.removeEventListener('keydown', done);
        hint.remove();
        res();
      };
      app.addEventListener('click', done);
      document.addEventListener('keydown', done);
    });
  }

  function clearPage() {
    story.innerHTML = '';
    choicesEl.innerHTML = '';
    freeRow.hidden = true;
    window.scrollTo(0, 0);
  }

  // 선택지를 띄우고 고른 결과를 반환한다. { idx } | { text } | { die } | { refresh }
  function choose(options, { free = false } = {}) {
    return new Promise((res) => {
      choicesEl.innerHTML = '';
      const armAt = performance.now() + 300;
      const finish = (v) => {
        document.removeEventListener('keydown', onKey);
        freeRow.onsubmit = null;
        cancelChoice = null;
        choicesEl.innerHTML = '';
        freeRow.hidden = true;
        res(v);
      };
      options.forEach((o, i) => {
        if (o.sep) { const s = document.createElement('div'); s.className = 'sep'; choicesEl.appendChild(s); }
        const b = document.createElement('button');
        b.className = 'choice';
        b.disabled = !!o.disabled;
        const n = document.createElement('span'); n.className = 'num'; n.textContent = i + 1;
        const l = document.createElement('span'); l.className = 'lbl'; l.textContent = fmt(o.label);
        b.append(n, l);
        if (o.hint) { const h = document.createElement('span'); h.className = 'hint'; h.textContent = '· ' + o.hint; b.append(h); }
        b.onclick = () => { if (performance.now() >= armAt) finish({ idx: i }); };
        choicesEl.appendChild(b);
      });
      choicesEl.classList.remove('in');
      void choicesEl.offsetWidth;
      choicesEl.classList.add('in');
      const onKey = (e) => {
        if (document.activeElement.tagName === 'INPUT') return;
        const i = e.key === '0' ? 9 : parseInt(e.key, 10) - 1;
        if (i >= 0 && i < options.length && !options[i].disabled) finish({ idx: i });
      };
      document.addEventListener('keydown', onKey);
      cancelChoice = finish;
      if (free) {
        freeRow.hidden = false;
        freeInput.value = '';
        freeRow.onsubmit = (e) => {
          e.preventDefault();
          const text = freeInput.value.trim();
          if (text) finish({ text });
        };
      }
    });
  }

  // 장면 안의 선택: 자유 입력도 받는다 (통합 명세 34절). 알아듣지 못한 입력은 다시 묻는다.
  async function sceneChoose(opts) {
    while (true) {
      const r = await choose(opts, { free: true });
      if (r.die) throw DIE;
      if (r.refresh) continue;
      if (r.idx != null) return { idx: r.idx, manner: null };
      const m = Intent.match(opts, r.text);
      if (m) return { idx: opts.indexOf(m.option), manner: m.manner };
      await say(['……어떻게 해야 할지 모르겠다.'], { cls: 'dim' });
    }
  }

  // 이름 입력
  function askName() {
    return new Promise((res) => {
      choicesEl.innerHTML = '';
      const form = document.createElement('form');
      form.className = 'nameRow';
      const input = document.createElement('input');
      input.maxLength = 8;
      input.placeholder = '이름';
      input.autocomplete = 'off';
      const btn = document.createElement('button');
      btn.className = 'choice go';
      btn.textContent = '이 이름이다';
      const err = document.createElement('p');
      err.className = 'err';
      form.append(input, btn, err);
      choicesEl.appendChild(form);
      choicesEl.classList.add('in');
      input.focus();
      form.onsubmit = (e) => {
        e.preventDefault();
        const v = input.value.replace(/\s+/g, ' ').trim();
        if (!/^[가-힣a-zA-Z0-9 ]{1,8}$/.test(v)) {
          err.textContent = '……이름이 흐릿하다. (한글·영문·숫자 1~8자)';
          return;
        }
        choicesEl.innerHTML = '';
        res(v);
      };
    });
  }

  // 위: 날과 시간대, 장소 / 아래: 몸 상태를 느낌으로 (통합 명세 37절)
  function setHud() {
    const t = S.W.time.t;
    const d = Time.day(t);
    hudEl.textContent = `${d > 1 ? Time.dayLabel(t) + ' ' : ''}${Time.KO[Time.band(t)]} · ${Places.name(me().loc)}`;
    barEl.textContent = Player.barWords(S.W).map(([k, v]) => `${k} ${v}`).join('　·　');
    document.body.dataset.band = Time.band(t); // 시간대 색 연출 (style.css)
  }
  function clearHud() { hudEl.textContent = ''; barEl.textContent = ''; delete document.body.dataset.band; }

  // ---------- 시작 연출 ----------
  async function blackout(lines, pace) {
    document.body.classList.add('black');
    clearHud();
    clearPage();
    await say(lines, { pace, cls: 'center' });
    await more();
    clearPage();
    await say(['눈을 뜬다.'], { cls: 'center' });
    await wait(1400);
    document.body.classList.remove('black');
    clearPage();
    await wait(1600);
  }

  async function intro() {
    // 개발용: 주소 끝에 ?dev 를 붙이면 연출과 이름 입력을 건너뛴다
    if (/[?&]dev\b/.test(location.search)) { S.P.name = '민준'; S.P.memory.name = true; return; }
    await blackout([
      '어둡다.', '', '춥다.', '', '몸이 젖어 있다.', '', '흙 냄새가 난다.', '',
      '그리고 어디선가 물 흐르는 소리가 들린다.',
    ], 1100);
    await say([
      '나무가 있다. 아주 높다.',
      '가지 사이로 조각난 하늘이 보인다.',
      '풀 사이로 작은 계곡의 물빛이 어른거린다.',
      '이끼 낀 바위. 이름을 모르는 식물들.',
      '',
      '……',
    ], { pace: 800 });
    await more();
    clearPage();
    await memoryScene();
  }

  async function memoryScene() {
    const P = S.P;
    await say(['……여기가 어디지?', '나는……', '누구지?'], { pace: 900 });
    const used = new Set();
    const menu = [
      { id: 'name', label: '내 이름을 떠올린다.' },
      { id: 'last', label: '마지막으로 기억나는 순간을 떠올린다.' },
      { id: 'family', label: '가족을 떠올린다.' },
      { id: 'place', label: '내가 있던 장소를 떠올린다.' },
      { id: 'none', label: '아무것도 생각하지 않는다.' },
    ];
    const fragments = {
      last: ['마지막으로 기억나는 순간을 더듬는다.', '……문이 닫히는 소리. 어딘가로 가고 있었다. 누군가에게 무언가를 말하려 했다.', '거기서, 뚝 끊겨 있다.'],
      family: ['가족을 떠올린다.', '……누군가의 얼굴이 스친다. 얼굴만. 이름은 나오지 않는다.', '그런데 이상하게, 가슴이 먹먹하다.'],
      place: ['내가 있던 곳을 떠올린다.', '……익숙한 방. 창으로 들어오는 아침빛. 멀리서 들리던 소음.', '하지만 어디였는지는 떠오르지 않는다.'],
    };
    while (true) {
      const opts = menu.filter((m) => !used.has(m.id));
      const { idx } = await choose(opts);
      const id = opts[idx].id;
      clearPage();
      if (id === 'name' || id === 'none') {
        if (id === 'none') {
          await say(['눈을 감고 머리를 비운다.', '바람 소리. 물소리. 내 숨소리.', '……조금 진정된다.', '그래도, 이름은 떠올려야 한다.']);
        } else {
          await say(['이름을 떠올려 본다.', '……그래.']);
        }
        await say(['내 이름은……'], { pace: 600 });
        P.name = await askName();
        P.memory.name = true;
        clearPage();
        await say([
          `……{이름}.`, '적어도 이것 하나는 기억난다.', '내 이름.', '',
          '주변에는 아무도 없다.', '혼자다.', '', '일단, 움직여야 한다.',
        ], { pace: 800 });
        await more();
        return;
      }
      used.add(id);
      if (id === 'last') P.memory.lastMoment = 'fragment';
      if (id === 'family') P.memory.family = 'fragment';
      if (id === 'place') P.memory.previousLocation = 'fragment';
      await say(fragments[id], { pace: 750 });
      await say(['', '……여기까지다. 더는 떠오르지 않는다.'], { pace: 700 });
    }
  }

  // 쓰러진다 (체력 0). 죽지 않는다: 구조되거나 깨어나고, 대가가 남는다 (play/collapse.js, RULES.collapse [임시])
  async function collapse() {
    clearPage();
    clearHud();
    await say(['다리에서 힘이 빠진다.', '눈앞이 어두워진다.'], { pace: 1000 });
    document.body.classList.add('black');
    await wait(1200);
    clearPage();
    const met = (n) => Memory.has(n, 'player', 'met');
    const r = Collapse.resolve(S, me().cause);
    await say([{ t: '……', cls: 'center' }], { pace: 900 });
    await more();
    document.body.classList.remove('black');
    clearPage();
    setHud();
    const lines = [];
    if (r.again) lines.push({ t: '……또 쓰러졌다. 몸이 버텨 주지 않는다.', cls: 'dim' }, '');
    if (r.rescuer) {
      const w = Narrative.who(S, r.rescuer, !met(r.rescuer));
      const hi = Dialogue.process(S, { speakerId: r.rescuer.id, listenerId: 'player', dialogueId: 'are_you_ok' });
      lines.push('누군가 나를 흔드는 느낌에 눈을 뜬다.', `${w}${Text.josa(w, '이가')} 곁에 앉아 있다.`, '상처에 무언가가 감겨 있다.', hi.displayText);
      if (hi.tone && !hi.fullyUnderstood) lines.push(hi.tone);
    } else {
      lines.push('눈을 뜬다.', '얼마나 누워 있었는지 모르겠다.', Time.dark(S.W.time.t) ? '주위가 캄캄하다.' : '빛의 기울기가 달라져 있다.');
      if (r.lost) { const l = Player.label(r.lost, S.P); lines.push(`주머니가 가볍다. ${l}${Text.josa(l, '이가')} 없다.`); }
    }
    const f = Player.hpFeeling(me());
    if (f) lines.push('', f);
    Save.write(S);
    await say(lines);
    await more();
  }

  // 첫날 밤 보호 중에 장면이 죽음으로 끝났다 (밤의 목소리 등) [결정 #6]: 쓰러지지 않는다.
  // 정신이 아득해졌다가 돌아오고, 탈진과 시간만 남는다. [임시] 문장 — 장면의 결말은 스토리가 다시 쓴다
  async function shaken() {
    const R = RULES.protection;
    clearPage();
    await say(['눈앞이 하얘진다.', '……'], { pace: 900 });
    World.tick(S, R.shakenMin, { unconscious: true });
    flags().feed.length = 0;
    const m = me();
    m.hp = Math.max(m.hp, R.minHp);
    m.surv.fatigue = Math.min(100, m.surv.fatigue + R.shakenFatigue);
    Save.write(S);
    await say(['', '정신을 차리니 차가운 흙바닥 위다.', '온몸이 떨린다. 무슨 일이 있었는지 제대로 떠오르지 않는다.'], { pace: 800 });
    await more();
  }

  // 예전 저장 파일에서 이름만 가져와 새로 시작할 때
  async function wakeAgain() {
    await blackout(['젖은 흙.', '', '물 흐르는 소리.'], 1100);
  }

  // ---------- 장면 도구 ----------
  const ui = {
    get S() { return S; },
    get P() { return S.P; },
    get W() { return S.W; },
    get me() { return S.W.player; },
    talker: null, // 지금 마주한 NPC (말을 하는 사람)
    async page(lines, opt) { clearPage(); setHud(); await say(lines, opt); },
    say: (lines, opt) => say(lines, opt),
    choose: (opts) => sceneChoose(opts),
    more: () => more(),
    pass: (min, opt) => passTime(min, opt),
    speak(str, by) { return Lang.speak(S, str, by || ui.talker); },
    // 새 단어의 뜻을 알아내면 이해도가 오른다. 이미 알던 단어면 false.
    learn: (word, o) => Lang.learn(S, word, o),
    guess: (word) => Lang.guess(S, word),
    knows: (word) => Lang.knows(S, word),
    know(id) { S.P.knowledge[id] = true; Explore.onFact(S, id); Clues.onFact(S, id); },
    use(k) { Player.use(S, k); },
    chance: (p) => Rng.chance(S.W, p),
    pick: (a) => Rng.pick(S.W, a),
    hurt: (n, cause, by) => Player.hurt(S, n, cause, by),
    npc: (id) => S.W.npcs[id],
    rel: (id) => Rel.get(S.W, id, 'player'),
    relate: (id, d, cause) => Rel.change(S, id, 'player', d, cause),
  };

  // ---------- 숲 탐색 ----------
  const ctx = () => {
    const W = S.W, t = W.time.t;
    return {
      W, P: S.P, me: W.player, period: Time.band(t), dark: Time.dark(t),
      first(key) { if (W.worldFlags.seen[key]) return false; W.worldFlags.seen[key] = true; return true; },
      give(item, cap) {
        const n = W.worldFlags.counts[item] || 0;
        if (n >= cap) return false;
        W.worldFlags.counts[item] = n + 1;
        Player.give(W.player, item);
        return true;
      },
      know(id) { ui.know(id); },
      use(k) { Player.use(S, k); },
    };
  };

  // 지금 있는 곳: 장소 묘사 + 날씨 + 보지 못한 사이 남은 흔적 + 곁에 있는 사람
  function placeLines() {
    const W = S.W;
    const loc = me().loc;
    const lines = LOCS[loc].desc(ctx());
    const extra = Weather.SKY_EXTRA[W.weather.kind];
    if (extra) lines.push(extra);
    const tr = Narrative.traceLines(S, loc);
    if (tr.length) lines.push('', ...tr);
    return lines;
  }

  // 시간이 흐른다: 세계 전체가 함께 움직인다 (월드 틱)
  function passTime(min, opt = {}) {
    if (min <= 0) return takeNotes();
    const W = S.W;
    const r = World.tick(S, min, opt);
    if (Time.day(W.time.t) >= 2 && Time.clock(W.time.t) >= 6 * 60) flags().day2Acts++;
    return [...(r.lines.length ? ['', ...r.lines] : []), ...(r.body.length ? ['', ...r.body] : []), ...takeNotes()];
  }

  function takeNotes() {
    const f = flags();
    const out = [];
    if (f.feed.length) out.push('', ...f.feed.splice(0));
    if (f.notes.length) out.push('', ...f.notes.splice(0));
    return out;
  }

  function doAction(a) {
    const lines = a.run(ctx());
    Explore.didAction(S, me().loc, a.id);
    return [...lines, ...passTime(a.min)];
  }

  // 자리를 옮긴다. 함께 다니는 사람도 따라온다 (따라오지 않으면 그 줄을 돌려준다)
  function moveTo(to) {
    const from = me().loc;
    me().loc = to;
    Bus.emit(S, 'PLAYER_MOVED', { from, to });
    return Companion.onMove(S, from, to);
  }

  function doMove(e) {
    const g = ctx();
    const blocked = e.block && e.block(g);
    if (blocked) return [...blocked.lines, ...passTime(blocked.min)];
    const lines = [...e.text];
    // 밤에 돌아다니면 어둠 속의 무언가와 마주칠 수 있다 (그것이 지나는 곳을 밟으면)
    if (Creatures.nightStrike(S, me().loc, e.to)) {
      Player.hurt(S, 2, '어둠 속의 무언가에게 당했다', 'shade');
      Player.injure(S, 'scratch', 25);
      Player.use(S, 'sen');
      lines.push('', '어둠 속에서 무언가가 발목을 스친다.', '날카로운 통증. 돌아봤을 때는 아무것도 없다.');
    }
    if (e.use) Player.use(S, e.use);
    lines.push(...moveTo(e.to));
    lines.push(...passTime(e.min, { move: true }));
    // 그녀보다 먼저 도착하면, 그녀가 올 때까지 기다린다
    const lia = S.W.npcs.lia;
    if (e.to === 'hollow' && lia.alive && lia.location.transit && lia.location.dest === 'hollow' && lia.location.nextAt > S.W.time.t) {
      lines.push('', '아직 아무도 없다.', '뿌리 사이에 몸을 낮추고 기다린다.', ...passTime(Math.ceil(lia.location.nextAt - S.W.time.t)),
        '', '……발소리. 누군가 비틀거리며 다가온다.');
      return lines;
    }
    lines.push('', ...placeLines());
    return lines;
  }

  function eatBerry() {
    const P = S.P, m = me();
    Player.take(m, 'berry');
    m.surv.hunger = Math.max(0, m.surv.hunger - 25);
    const knew = P.knowledge.berry_poison;
    m.ateBerry = true;
    ui.know('berry_poison');
    Player.hurt(S, 3, '붉은 열매의 독에 당했다', 'berry');
    Player.sicken(S, 'poison', 180);
    return [
      knew ? '먹으면 안 된다는 걸 알면서도, 허기를 이기지 못한다.' : '열매를 하나 입에 넣는다. 달다. 하나 더.',
      '……얼마 지나지 않아 배 속이 뒤틀린다.',
      '무릎을 꿇고 전부 게워 낸다. 식은땀이 흐른다.',
      '한참을 그렇게 웅크려 있었다.',
      ...(knew ? [] : [{ t: '……이건 먹으면 안 되는 거였다.', cls: 'know' }]),
      ...passTime(60),
    ];
  }

  function chewHerb() {
    const m = me();
    Player.take(m, 'herb');
    m.surv.hunger = Math.max(0, m.surv.hunger - 3);
    return ['쓴 풀을 씹어 본다.', '혀가 오그라들 만큼 쓰다. 삼키지 못하고 뱉는다.', ...passTime(5)];
  }

  // 아는 것을 쓴다: 피를 멎게 하는 풀 (지식이 새 선택지를 연다)
  function treatSelf() {
    Player.take(me(), 'herb');
    Player.treat(S);
    return ['쓴 풀을 두 손으로 비벼 짓이긴다.', '상처에 꾹 누른다. 눈앞이 하얘질 만큼 쓰라리다.', '……피가 멎는다.', ...passTime(10)];
  }

  function notebookLines() {
    const P = S.P;
    const known = Object.keys(KNOW).filter((k) => P.knowledge[k]);
    return ['알고 있는 것을 하나씩 되짚는다.', '', ...known.map((k) => ({ t: '· ' + KNOW[k], cls: 'note' })), ...Clues.lines(S)];
  }

  const liaWounded = () => S.W.events.scheduled.some((e) => e.type === 'lia_wounded' && e.done);
  const liaAtHollow = () => Npc.at(S.W, 'lia', 'hollow');

  // 둘째 날, 그녀가 있는 곳으로 가는 길
  function girlExit() {
    if (!liaWounded()) return null;
    if (!['clearing', 'stream', 'deep'].includes(me().loc)) return null;
    if (flags().seen.teaser) return { to: 'hollow', label: '피 냄새가 나던 쪽으로 간다', min: 20, kw: ['피', '냄새'], text: ['피 냄새를 기억하며 걷는다.'] };
    if (S.P.knowledge.girl_hollow) {
      return { to: 'hollow', label: '뿌리가 엉킨 움푹한 곳으로 간다', hint: '안다', min: 20, kw: ['움푹', '그녀', '여자'],
        text: ['이 숲에서 어디로 가야 하는지, 나는 안다.'] };
    }
    return null;
  }

  function buildOptions() {
    const P = S.P, m = me();
    const L = LOCS[m.loc];
    const g = ctx();
    const opts = [];
    L.actions.forEach((a) => opts.push({ label: a.label, kw: a.kw, run: () => doAction(a) }));
    opts.push(...Life.options(S, passTime)); // 일, 잠자리, 잠, 가게, 동행과 헤어지기
    // 이미 아는 사람이 곁에 있으면 내가 다가갈 수 있다
    Npc.here(S.W, m.loc).filter((n) => !n.location.hidden && Memory.has(n, 'player', 'met') && !(n.id === 'lia' && m.loc === 'hollow'))
      .forEach((n) => opts.push({ label: `${Narrative.who(S, n)}에게 다가간다`, kw: [Narrative.who(S, n)], scene: 'meet:' + n.id }));
    const exits = L.exits.filter((e) => !e.show || e.show(g));
    const ge = girlExit();
    if (ge) exits.push(ge);
    Explore.seeExits(S, exits);
    exits.forEach((e, i) => {
      const h = typeof e.hint === 'string' ? e.hint : e.hint && P.knowledge[e.hint[0]] ? e.hint[1] : null;
      opts.push({ label: e.label, hint: h, kw: e.kw, sep: i === 0, run: () => doMove(e) });
    });
    const G = GLOBAL_ACTIONS;
    opts.push({ label: G.listen.label, kw: G.listen.kw, sep: true,
      run: () => [...listenLines(ctx()), ...passTime(G.listen.min)] });
    opts.push({ label: G.bag.label, kw: G.bag.kw, run: () => bagLines(S) });
    if (m.inv.berry) opts.push({ label: '붉은 열매를 먹는다', kw: ['먹', '열매'], hint: P.knowledge.berry_poison ? '독이다' : null, run: eatBerry });
    if (m.inv.herb && Player.bleeding(S.W) && P.knowledge.herb_heals) opts.push({ label: '쓴 풀을 짓이겨 상처에 댄다', kw: ['상처', '풀'], hint: '안다', run: treatSelf });
    else if (m.inv.herb) opts.push({ label: '쓴 풀을 씹어 본다', kw: ['씹'], run: chewHerb });
    if (m.status.unlocked) opts.push({ label: '몸 상태를 확인한다', kw: ['상태', '몸'], scene: 'body' });
    if (LangUI.hasAny(S)) opts.push({ label: '들은 말을 되뇐다', kw: ['말', '단어', '언어'], run: () => LangUI.notebook(S) });
    if (Object.keys(KNOW).some((k) => P.knowledge[k]) || Object.keys(P.clues).length) {
      opts.push({ label: '기억을 되짚는다', kw: ['기억', '되짚', '수첩'], run: notebookLines });
    }
    if (g.dark) {
      opts.push({ label: '밤이 지나가기를 기다린다', kw: G.rest.kw, run: () => [
        '나무에 등을 기대고 웅크린다.',
        '잠은 오지 않는다. 눈을 감아도 숲의 소리가 들린다.',
        '몇 번이고 눈을 뜨고, 다시 감는다.',
        ...passTime(Time.untilDawn(S.W.time.t), { rest: true }),
      ] });
    } else {
      opts.push({ label: '잠시 쉰다', kw: G.rest.kw, run: () => [
        '나무에 등을 기대고 잠시 숨을 고른다.', '심장이 천천히 가라앉는다.', ...passTime(30, { rest: true }),
      ] });
    }
    return opts;
  }

  // 지금 벌어져야 할 장면이 있으면 그 이름을 돌려준다
  function nextScene() {
    const W = S.W, m = me();
    const pend = flags().pending;
    const i = pend.findIndex((p) => !p.startsWith('magic'));
    if (i >= 0) return pend.splice(i, 1)[0];
    if (m.loc === 'hollow' && liaAtHollow()) return 'girl';
    if (m.loc === 'edge' && !flags().seen.arrival) return 'arrival';
    // 누군가 곁에 와 있다: 처음 보는 사람, 누군가를 찾는 사람, 나를 적대하는 사람은 먼저 다가온다.
    // 이미 아는 사람에게는 내가 다가간다 (선택지)
    const other = Npc.here(W, m.loc).find((n) => !n.location.hidden && !(n.id === 'lia' && m.loc === 'hollow')
      && (!Memory.has(n, 'player', 'met') || Goals.get(n, 'search') || Rel.get(W, n.id, 'player').hostility >= 50)
      && !(n.flags.metAt != null && W.time.t - n.flags.metAt < 60));
    if (other) return 'meet:' + other.id;
    if (Creatures.engages(S)) return 'beast';
    if (!flags().seen.light && Time.band(W.time.t) === 'evening' && ['clearing', 'deep', 'stream', 'downstream'].includes(m.loc)) return 'light';
    return null;
  }

  async function runScene(sc) {
    if (sc.startsWith('meet:')) return Encounter.run(ui, sc.slice(5));
    return Scenes[sc](ui);
  }

  async function explore() {
    Knowledge.location(S, me().loc, 'visited'); // 눈을 뜬 곳
    let carry = placeLines();
    let lastHp = me().hp;
    while (true) {
      clearPage();
      setHud();
      if (me().hp < lastHp) { const f = Player.hpFeeling(me()); if (f) carry = [...carry, '', f]; }
      lastHp = me().hp;
      await say(carry);
      if (me().hp <= 0) {
        await say(['', '더는 몸을 가눌 수 없다.', '흙바닥이 뺨에 닿는다.'], { pace: 900 });
        await more();
        return 'die';
      }
      const sc = nextScene();
      if (sc) {
        if (carry.length) await more();
        let res;
        try {
          res = await runScene(sc);
          // 리아를 따라 마을까지 함께 걷는다
          if (res === 'travel') res = await Scenes.arriveWith(ui);
        } catch (e) { if (e === DIE) return 'die'; throw e; }
        ui.talker = null;
        if (res === 'die' || me().hp <= 0) return 'die';
        carry = res === 'leave'
          ? ['그녀를 두고 자리를 뜬다.', ...passTime(15), '', ...placeLines()]
          : placeLines();
        lastHp = me().hp;
        continue;
      }

      // 둘째 날 아침: 바람에 피 냄새가 실려 온다
      const lia = S.W.npcs.lia;
      if (liaAtHollow() && flags().day2Acts >= 3 && !flags().seen.teaser && !lia.flags.met) {
        flags().seen.teaser = true;
        await say(['', '바람에 실려 무언가가 코끝을 스친다.', '……피 냄새다.'], { pace: 1200 });
        const { idx } = await choose([{ label: '냄새를 따라간다' }, { label: '모른 척한다' }]);
        if (idx === 0) {
          moveTo('hollow');
          carry = ['냄새를 따라 걷는다. 비릿한 냄새가 점점 짙어진다.', ...passTime(20, { move: true })];
          continue;
        }
        carry = ['냄새가 나는 쪽에서 등을 돌린다.', '……신경 쓰이지 않는다면 거짓말이다.'];
        continue;
      }

      Save.write(S);
      const opts = buildOptions();
      const pick = await choose(opts, { free: true });
      if (pick.die) return 'die';
      if (pick.refresh) { carry = placeLines(); continue; }
      let o = pick.idx != null ? opts[pick.idx] : null;
      if (!o && pick.text) { const m = Intent.match(opts, pick.text); o = m && m.option; }
      if (!o) { carry = ['……어떻게 해야 할지 모르겠다.']; continue; }
      if (o.scene) {
        try {
          if (o.scene === 'body') await Scenes.checkBody(ui);
          else if (o.scene === 'shop') await Shop.run(ui);
          else { const r = await runScene(o.scene); ui.talker = null; if (r === 'die') return 'die'; }
        } catch (e) { if (e === DIE) return 'die'; throw e; }
        if (me().hp <= 0) return 'die';
        carry = placeLines();
        continue;
      }
      carry = o.run();
    }
  }

  // ---------- 흐름 ----------
  async function titleMenu() {
    const s = Save.read();
    if (!s) return false;
    document.body.classList.add('black');
    clearPage();
    await say([{ t: '……이전의 기억이 남아 있다.', cls: 'center' }]);
    const { idx } = await choose([{ label: '이어서 한다' }, { label: '처음부터 한다', hint: '모든 기억을 지운다' }]);
    document.body.classList.remove('black');
    if (idx === 1) { Save.clear(); return false; }
    S.P = s.P;
    S.W = s.W;
    // 예전 저장 파일은 세계를 이어 붙일 수 없어서, 이름과 기억만 가지고 숲에서 새로 시작한다
    return s.migrated ? 'fresh' : true;
  }

  // 되감기는 없다 (스토리_재설계.md 0절). 쓰러져도 세계는 이어진다.
  async function main() {
    const resume = await titleMenu();
    if (resume === 'fresh') await wakeAgain();
    else if (resume !== true) await intro();
    while (true) {
      const res = await explore();
      if (res === 'die') await (Player.sheltered(S) ? shaken() : collapse());
    }
  }

  // 개발용: 콘솔에서 __dev.die() 로 쓰러짐을 시험한다. 디버그 화면(debug.js)도 이것을 쓴다.
  window.__dev = {
    S,
    die() { me().cause = '(개발용) 강제로 쓰러졌다'; if (cancelChoice) cancelChoice({ die: true }); },
    state() { return S; },
    // 세계를 흘린다 (대본 사건 포함). 화면을 새로 그린다.
    skipTo(minutes) { World.tick(S, minutes); this.refresh(); },
    refresh() { setHud(); if (cancelChoice) cancelChoice({ refresh: true }); },
  };

  main();
})();

</script>
<script>/* js/debug/debug.js */
// 개발자 전용 디버그 화면 (통합 명세 38절). 주소 끝에 ?debug 를 붙였을 때만 나타난다. 일반 플레이어에게는 보이지 않는다.
// 보여 주는 것: 시간·날씨, NPC의 위치·행동·목표·욕구·관계·기억·언어, 소문, 사건, 세력 관계, 경제, 플레이어 언어, 세계 상태 전체
// 명령: 시간 흘리기, 날씨, 플레이어 이동, NPC 이동, 관계 바꾸기, NPC 죽이기, 사건 만들기 — 모두 실제 시스템을 거친다.
(() => {
  if (typeof document === 'undefined' || !/[?&]debug\b/.test(location.search)) return;
  const S = () => window.__dev.state();
  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
  const r0 = (n) => Math.round(n);
  const clock = (t) => `${Time.dayLabel(t)} ${String(Math.floor(Time.clock(t) / 60)).padStart(2, '0')}:${String(Time.clock(t) % 60).padStart(2, '0')}`;

  const style = document.createElement('style');
  style.textContent = `
    #dbgBtn{position:fixed;right:12px;bottom:44px;z-index:50;font:12px monospace;background:#223;color:#cde;border:1px solid #456;border-radius:6px;padding:6px 9px;cursor:pointer}
    #dbg{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);z-index:49;background:#0b0f14f2;color:#cdd6e0;font:12px/1.5 Consolas,monospace;overflow:auto;padding:10px 12px 60px;border-left:1px solid #345;display:none}
    #dbg.on{display:block} #dbg h3{margin:10px 0 4px;color:#9cf;font-size:12px} #dbg .tabs button,#dbg .cmd button{margin:2px;font:11px monospace;background:#1b2530;color:#cde;border:1px solid #345;border-radius:4px;padding:3px 7px;cursor:pointer}
    #dbg .tabs button.on{background:#2d4a66} #dbg select,#dbg input{font:11px monospace;background:#111820;color:#cde;border:1px solid #345;margin:2px}
    #dbg pre{white-space:pre-wrap;word-break:break-all;margin:0} #dbg .dim{color:#789} #dbg .warn{color:#fb8}`;
  document.head.appendChild(style);

  const btn = document.createElement('button');
  btn.id = 'dbgBtn'; btn.textContent = 'DEBUG';
  const panel = document.createElement('div');
  panel.id = 'dbg';
  document.body.append(btn, panel);
  let tab = 'world';
  const TABS = { world: '세계', npc: 'NPC', social: '소문·사건', faction: '세력·경제', lang: '언어', json: 'WorldState' };

  function opts(list, sel) { return list.map((x) => `<option value="${esc(x)}"${x === sel ? ' selected' : ''}>${esc(x)}</option>`).join(''); }

  function commands(s) {
    const npcs = Object.keys(s.W.npcs), locs = Object.keys(PLACE_DATA);
    return `<div class="cmd">
      <button data-c="t60">시간 +1시간</button><button data-c="t360">+6시간</button><button data-c="t1440">+1일</button>
      날씨 <select id="dW">${opts(['clear', 'cloudy', 'rain', 'fog'], s.W.weather.kind)}</select><button data-c="weather">변경</button><br>
      플레이어 이동 <select id="dP">${opts(Object.keys(LOCS), s.W.player.loc)}</select><button data-c="tp">이동</button><br>
      NPC <select id="dN">${opts(npcs)}</select> → <select id="dL">${opts(locs)}</select><button data-c="move">강제 이동</button><button data-c="kill" class="warn">사망</button><br>
      관계 <select id="dA">${opts(npcs)}</select>→<select id="dB">${opts(['player', ...npcs])}</select>
      <select id="dX">${opts(Rel.AXES)}</select><input id="dV" type="number" value="50" style="width:48px"><button data-c="rel">설정</button><br>
      사건 <select id="dE">${opts(['missing', 'beast_attack', ...Object.keys(WORLD_EVENT_TYPES)])}</select> 대상 <select id="dT">${opts(npcs)}</select><button data-c="event">생성</button>
    </div>`;
  }

  function npcBlock(s, n) {
    const W = s.W;
    const rels = Object.entries(W.relationships).filter(([k]) => k.startsWith(n.id + '>'))
      .map(([k, r]) => `  ${k.split('>')[1]}: ` + Rel.AXES.filter((a) => r[a] >= 1).map((a) => `${a} ${r0(r[a])}`).join(', '));
    const act = n.currentAction ? `${n.currentAction.type} (~${clock(n.currentAction.until)})` : '-';
    const loc = n.location.transit ? `${n.location.loc} → ${n.location.path.join('→')} (도착 ${clock(n.location.nextAt)})` : n.location.loc + (n.location.hidden ? ' [숨음]' : '');
    return `<h3>${esc(n.id)} ${n.alive ? '' : '<span class="warn">[사망: ' + esc(n.death.cause) + ']</span>'}</h3><pre>${esc([
      `위치 ${loc}  |  지역 ${Places.regionOf(n.location.loc)}  |  행동 ${act}`,
      `몸 체력 ${r0(n.physical.health)} 출혈 ${n.physical.bleed.toFixed(3)} 충격 ${r0(n.physical.shock)} 통증 ${r0(n.physical.pain)} | 마음 두려움 ${r0(n.mental.fear)} 스트레스 ${r0(n.mental.stress)} 기분 ${r0(n.mental.mood)}`,
      `욕구 ` + Object.entries(n.needs).map(([k, v]) => `${k} ${r0(v)}`).join(' '),
      `목표 ` + n.goals.map((g) => `${g.id}(${r0(g.priority)})`).join(' '),
      `돈 ${r0(n.money)}  소지품 ` + JSON.stringify(n.inventory) + (n.magic ? `  마력 ${n.magic.mana}/${n.magic.maxMana}` : ''),
      `언어 ` + Object.entries(n.languages).map(([k, v]) => `${k} ${v.understanding}/${v.speaking}/${v.reading}/${v.writing}`).join(' '),
      `관계`, ...rels,
      `기억 ` + n.memories.map((m) => `${m.type}:${m.subject}(${m.emotionalImpact},${r0(m.importance)})`).join(' '),
      `소문 ` + Object.entries(n.knowledge.rumors).map(([id, h]) => `${W.rumors[id] ? W.rumors[id].type : id}@L${h.level}`).join(' '),
      `표시 ` + JSON.stringify(n.flags),
    ].join('\n'))}</pre>`;
  }

  function render() {
    const s = S();
    const W = s.W;
    let body = '';
    if (tab === 'world') {
      body = `<pre>${esc([
        `시각 ${clock(W.time.t)} (${Time.KO[Time.band(W.time.t)]})  날씨 ${Weather.KO[W.weather.kind]} ${Weather.temp(W).toFixed(1)}℃`,
        `플레이어 ${W.player.loc}  HP ${W.player.hp}/${hpMax(W.player)}  ` + Object.entries(W.player.surv).filter(([, v]) => typeof v === 'number').map(([k, v]) => `${k} ${r0(v)}`).join(' '),
        `부상 ${JSON.stringify(W.player.surv.injuries.map((x) => x.kind))}  병 ${JSON.stringify(W.player.surv.illness.map((x) => x.kind))}`,
        `지역 ` + Object.entries(W.regions).map(([k, r]) => `${k}:${r.level} 위협${r0(r.threat)} 경계${r0(r.alert)}`).join(' | '),
        `짐승 ` + Object.values(W.creatures).map((c) => `${c.id}@${c.loc}${c.hp != null ? ` hp${c.hp} 두려움${r0(c.fear)}` : ''}${c.shy ? ' [피함]' : ''}`).join(' | '),
        `예정 사건 ` + W.events.scheduled.map((e) => `${e.type}@${clock(e.at)}${e.done ? '✓' : ''}`).join(' '),
        `진행 중 ` + JSON.stringify(W.events.active),
        `기록 ` + JSON.stringify(W.history.slice(-5)),
        `흔적 ` + Object.entries(W.locations).filter(([, v]) => v.traces.length).map(([k, v]) => `${k}:${v.traces.map((x) => x.kind).join(',')}`).join(' | '),
      ].join('\n'))}</pre><h3>최근 이벤트 버스</h3><pre class="dim">${esc(Bus.recent.slice(-25).reverse().map((e) => `${clock(e.t)} ${e.type} ${JSON.stringify(Object.fromEntries(Object.entries(e).filter(([k]) => k !== 'type' && k !== 't')))}`).join('\n'))}</pre>`;
    } else if (tab === 'npc') {
      body = Object.values(W.npcs).map((n) => npcBlock(s, n)).join('');
    } else if (tab === 'social') {
      body = `<h3>소문</h3><pre>${esc(Object.values(W.rumors).map((r) => {
        const holders = Object.values(W.npcs).filter((n) => n.knowledge.rumors[r.id]).map((n) => `${n.id}@L${n.knowledge.rumors[r.id].level}`);
        return `${r.id} ${r.type} (${r.subject || '-'}→${r.target || '-'}) 중요도${r.importance}\n  "${Rumor.plain(W, r, 0)}"\n  아는 사람: ${holders.join(' ')}${s.P.found.rumors[r.id] ? '  [플레이어가 들음]' : ''}`;
      }).join('\n') || '(없음)')}</pre><h3>세계 사건 (최근 40)</h3><pre>${esc(W.events.log.slice(-40).reverse().map((e) => `${clock(e.t)} ${e.type} @${e.loc || '-'} 목격:${e.witnesses.join(',') || '-'} ${JSON.stringify(e.data)}`).join('\n'))}</pre>`;
    } else if (tab === 'faction') {
      const v = W.economy.markets.village_square;
      body = `<h3>세력 관계 (긴장 ${r0(W.politics.tension)})</h3><pre>${esc(Object.entries(W.politics.relations).map(([k, r]) => `${k.padEnd(40)} 외교${r0(r.diplomacy)} 무역${r0(r.trade)} 적대${r0(r.hostility)} 신뢰${r0(r.trust)}`).join('\n'))}</pre>
        <h3>먼 곳의 소식</h3><pre>${esc(W.politics.news.map((x) => `${clock(x.t)} ${x.type}`).join('\n') || '(없음)')}</pre>
        <h3>마을 가게 (${Economy.open(W, 'village_square') ? '열림' : '닫힘'})</h3><pre>${esc(`재고 ${JSON.stringify(v.stock)}\n값 ${JSON.stringify(v.price)}\n오가는 사람 ${v.traffic.toFixed(2)}  장사 안 된 날 ${v.lowDays}\n기록 ${JSON.stringify(v.history.slice(-7))}`)}</pre>`;
    } else if (tab === 'lang') {
      const L = s.P.lang;
      body = `<pre>${esc([
        ...Object.entries(L.languageKnowledge).map(([k, v]) => `${k.padEnd(12)} 이해 ${v.understanding} 말하기 ${v.speaking} 읽기 ${v.reading} 쓰기 ${v.writing}`),
        '', '단어 (확신 / 들은 횟수)',
        ...Object.entries(L.knownWords).flatMap(([lang, ws]) => Object.entries(ws).map(([id, r]) => `  ${lang}:${id.padEnd(12)} ${r.confidence.toFixed(2)} ×${r.encounters}  「${LangRegistry.sound(id, id)}」`)),
        '', `이정표 ${JSON.stringify(L.languageMilestones)}`,
      ].join('\n'))}</pre>`;
    } else {
      body = `<pre class="dim">${esc(JSON.stringify(W, null, 1))}</pre>`;
    }
    panel.innerHTML = `<div class="tabs">${Object.entries(TABS).map(([k, v]) => `<button data-tab="${k}" class="${k === tab ? 'on' : ''}">${v}</button>`).join('')}</div>${commands(s)}${body}`;
  }

  function run(c) {
    const s = S();
    const W = s.W;
    const val = (id) => panel.querySelector('#' + id).value;
    if (c.startsWith('t')) { World.tick(s, +c.slice(1)); }
    else if (c === 'weather') Weather.set(s, val('dW'));
    else if (c === 'tp') Player.teleport(s, val('dP'));
    else if (c === 'move') Npc.place(s, W.npcs[val('dN')], val('dL'));
    else if (c === 'kill') Npc.kill(s, W.npcs[val('dN')], '(디버그) 강제로 죽었다', null);
    else if (c === 'rel') Rel.set(s, val('dA'), val('dB'), val('dX'), +val('dV'));
    else if (c === 'event') {
      const e = val('dE'), n = W.npcs[val('dT')];
      if (e === 'missing') { n.expectedHome = W.time.t - 1; n.flags.missingResolved = false; WorldEvents.checkMissing(s); }
      else if (e === 'beast_attack') Combat.creatureVsNpc(s, W.creatures.thornback, n);
      else Factions.trigger(s, e);
    }
    window.__dev.refresh();
    render();
  }

  btn.onclick = () => { panel.classList.toggle('on'); if (panel.classList.contains('on')) render(); };
  panel.addEventListener('click', (e) => {
    const t = e.target;
    if (t.dataset.tab) { tab = t.dataset.tab; render(); }
    else if (t.dataset.c) run(t.dataset.c);
  });
  // 선택 상자를 고르는 중에는 다시 그리지 않는다
  setInterval(() => { if (panel.classList.contains('on') && !panel.contains(document.activeElement)) render(); }, 1500);
  // 게임 키 입력(숫자 선택)이 디버그 화면 입력과 섞이지 않게
  panel.addEventListener('keydown', (e) => e.stopPropagation());
})();

</script>
</body>
</html>
