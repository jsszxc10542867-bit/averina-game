<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Avernia</title>
<style>
/* 아베르니아 스타일 — 디자인담당 관리. 새 줄 종류나 화면 요소가 생기면 클래스 이름만 알려 주세요. */

/* 색 토큰. @property로 등록해서 시간대가 바뀔 때 색이 천천히 번진다 */
@property --bg      { syntax: '<color>'; inherits: true; initial-value: #0e1411; }
@property --fg      { syntax: '<color>'; inherits: true; initial-value: #d9dfd6; }
@property --dim     { syntax: '<color>'; inherits: true; initial-value: #7d8a80; }
@property --line    { syntax: '<color>'; inherits: true; initial-value: #2a382f; }
@property --acc     { syntax: '<color>'; inherits: true; initial-value: #a9c9a4; }
@property --err     { syntax: '<color>'; inherits: true; initial-value: #d98b8b; }
@property --surface { syntax: '<color>'; inherits: true; initial-value: #16201a; }
@property --vig     { syntax: '<number>'; inherits: true; initial-value: .3; }

/* 기본값 = 오후 (첫날 오후 3시에 눈을 뜬다). 모든 글자 대비 4.5:1 이상 */
body {
  --bg: #0e1411; --fg: #d9dfd6; --dim: #7d8a80; --line: #2a382f;
  --acc: #a9c9a4; --err: #d98b8b; --surface: #16201a; --vig: .3;
}
/* 시간대 (engine.js setHud가 body[data-band]를 붙인다) */
body[data-band="dawn"]       { --bg: #111317; --fg: #d6d9de; --dim: #858b97; --line: #2e333c; --acc: #cdb6bd; --err: #e0979a; --surface: #181b21; --vig: .35; }
body[data-band="morning"]    { --bg: #101814; --fg: #dde4da; --dim: #87958c; --line: #2e3e34; --acc: #b3d4ae; --err: #e0979a; --surface: #18241d; --vig: .2; }
body[data-band="evening"]    { --bg: #15110d; --fg: #e2d9cc; --dim: #948775; --line: #3a2f23; --acc: #dbb47e; --err: #e09184; --surface: #1e1811; --vig: .42; }
body[data-band="night"]      { --bg: #0a0d12; --fg: #c6cdd7; --dim: #78838f; --line: #232c39; --acc: #a3b9d3; --err: #d98f95; --surface: #121821; --vig: .55; }
body[data-band="late_night"] { --bg: #060709; --fg: #b2b7be; --dim: #737a84; --line: #1e2228; --acc: #93a2b8; --err: #c98a90; --surface: #0e1014; --vig: .65; }
/* 검은 화면 (시작 연출, 죽음, 되감기). 시간대보다 우선한다 */
body.black { --bg: #000; --fg: #bfc6bd; --dim: #737b74; --line: #1a1d1b; --surface: #0b0d0c; --vig: 0; }

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  /* 명조 우선. 이 PC처럼 Noto Serif KR이 없으면 바탕으로 (고딕으로 떨어지지 않게) */
  font: 17px/1.85 "Noto Serif KR", "Nanum Myeongjo", "Batang", "바탕", "AppleMyungjo", serif;
  transition: --bg 2.6s ease, --fg 2.6s ease, --dim 2.6s ease, --line 2.6s ease, --acc 2.6s ease,
              --err 2.6s ease, --surface 2.6s ease, --vig 2.6s ease;
  -webkit-tap-highlight-color: transparent;
}
/* 가장자리 어둠. 밤일수록 짙어진다 */
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 1;
  background: radial-gradient(ellipse 80% 70% at 50% 42%, transparent 55%, rgb(0 0 0 / var(--vig)) 100%);
}
::selection { background: color-mix(in srgb, var(--acc) 30%, transparent); }

/* 위: 날과 시간대, 장소. 글이 밑으로 지나가도 겹쳐 보이지 않게 배경을 깐다 */
#hud {
  position: fixed; top: 0; left: 0; right: 0; padding: 12px 16px 18px;
  font-size: 13px; letter-spacing: .12em; color: var(--dim);
  background: linear-gradient(var(--bg) 55%, transparent);
  pointer-events: none; z-index: 2;
}
#hud:empty { display: none; }
#app { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding: 56px 20px 120px; min-height: 100vh; }
/* 아래: 몸 상태 (숫자 대신 느낌). 검은 화면에서는 숨긴다 */
#bar {
  position: fixed; left: 0; right: 0; bottom: 0; padding: 18px 16px 10px;
  font-size: 12px; letter-spacing: .06em; color: var(--dim); text-align: center;
  background: linear-gradient(transparent, var(--bg) 45%); pointer-events: none; z-index: 2;
}
#bar:empty, body.black #bar { display: none; }

/* 글줄 */
.line { margin: 0 0 10px; opacity: 0; transform: translateY(4px); transition: opacity .7s ease, transform .7s ease; }
.line.in { opacity: 1; transform: none; }
.line.gap { height: 14px; margin: 0; }
.line.dim { color: var(--dim); font-size: 15px; }
.line.center { text-align: center; }
/* 지식: 되감기 전에 알아낸 것. 기억이 겹쳐 보이는 듯한 옅은 번짐 */
.line.know { color: var(--acc); text-shadow: 0 0 14px color-mix(in srgb, var(--acc) 35%, transparent); }
.line.death { text-align: center; color: var(--err); font-size: 30px; letter-spacing: .4em; padding-left: .4em; margin: 0 0 22px; transition-duration: 2.2s; }
.line.sys { color: var(--dim); font-size: 14px; letter-spacing: .08em; }
.line.note { color: var(--fg); font-size: 15px; padding-left: 4px; }
.line.note.dim { color: var(--dim); }
.line.stat { font-family: "D2Coding", "Consolas", "Malgun Gothic", monospace; font-size: 15px; margin: 0 0 2px; color: var(--acc); white-space: pre; text-align: center; }
.line.stat.head { color: var(--fg); letter-spacing: .1em; }
body.black #app { display: flex; flex-direction: column; justify-content: center; }
body.black .line { font-size: 19px; }

.more { text-align: center; color: var(--dim); animation: blink 1.6s infinite; margin-top: 18px; cursor: pointer; }
@keyframes blink { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }

/* 선택지 */
#choices { margin-top: 22px; opacity: 0; transition: opacity .5s ease; }
#choices.in { opacity: 1; }
.sep { height: 1px; background: var(--line); margin: 12px 0; }
.choice {
  display: flex; align-items: baseline; gap: 12px; width: 100%; min-height: 44px; text-align: left;
  background: transparent; color: var(--fg); border: 1px solid var(--line);
  border-radius: 6px; padding: 10px 14px; margin: 0 0 8px; font: inherit; font-size: 16px; cursor: pointer;
  transition: border-color .2s, background .2s;
}
.choice:hover:not(:disabled), .choice:focus-visible { border-color: var(--acc); background: var(--surface); outline: none; }
.choice:disabled { opacity: .35; cursor: default; }
.choice .num { color: var(--dim); font-size: 13px; min-width: 14px; }
.choice .hint { color: var(--acc); font-size: 13px; margin-left: auto; }
.choice.go { justify-content: center; margin-top: 10px; }

/* 입력 */
.nameRow input, #free {
  width: 100%; background: transparent; color: var(--fg); font: inherit; font-size: 18px;
  border: 0; border-bottom: 1px solid var(--dim); padding: 8px 2px; outline: none; text-align: center;
}
.nameRow input:focus { border-bottom-color: var(--acc); }
#free { text-align: left; font-size: 15px; border: 1px solid var(--line); border-radius: 6px; padding: 9px 12px; margin-top: 4px; color: var(--dim); }
#free:focus { border-color: var(--acc); color: var(--fg); }
#free::placeholder, .nameRow input::placeholder { color: var(--dim); opacity: .7; }
#freeRow { margin-top: 10px; }
.err { color: var(--err); font-size: 14px; text-align: center; min-height: 1.5em; margin: 8px 0 0; }

@media (max-width: 480px) {
  body { font-size: 16px; }
  #app { padding: 52px 16px 100px; }
}
@media (prefers-reduced-motion: reduce) {
  body { transition: none; }
  .line { transition: opacity .2s linear; transform: none; }
  .more { animation: none; opacity: .7; }
}

</style>
</head>
<body>
<div id="hud"></div>
<div id="app">
  <div id="story"></div>
  <div id="choices"></div>
  <form id="freeRow" hidden>
    <input id="free" autocomplete="off" placeholder="무엇을 할까…  (예: 물을 마신다)">
  </form>
</div>
<div id="bar"></div>
<!-- 순서: 도구 → 데이터 → 핵심 → 세계 시뮬레이션 → NPC → 사회 → 언어 → 플레이 → 이야기 → 화면 -->
<script>/* js/text.js */
// 텍스트 도구: 한국어 조사 자동 처리, {이름} 치환
const Text = (() => {
  const isHangul = (c) => c >= 0xac00 && c <= 0xd7a3;

  // 마지막 글자의 받침 정보. 한글이 아니면 받침 없음으로 취급한다.
  function tail(word) {
    const ch = [...String(word)].reverse().find((c) => /[가-힣a-zA-Z0-9]/.test(c));
    if (!ch) return { batchim: false, rieul: false };
    const c = ch.charCodeAt(0);
    if (!isHangul(c)) return { batchim: false, rieul: false };
    const jong = (c - 0xac00) % 28;
    return { batchim: jong !== 0, rieul: jong === 8 };
  }

  const JOSA = {
    '은는': ['은', '는'],
    '이가': ['이', '가'],
    '을를': ['을', '를'],
    '과와': ['과', '와'],
    '이야야': ['이야', '야'],
  };

  function josa(word, type) {
    const t = tail(word);
    if (type === '으로') return t.batchim && !t.rieul ? '으로' : '로';
    const pair = JOSA[type];
    if (!pair) throw new Error('알 수 없는 조사: ' + type);
    return t.batchim ? pair[0] : pair[1];
  }

  // {이름} → 이름, {이름:은는} → 이름 + 알맞은 조사
  function fmt(str, vars) {
    return String(str).replace(/\{([^{}:]+)(?::([^{}]+))?\}/g, (m, key, j) => {
      if (!(key in vars) || vars[key] == null) return m;
      const v = vars[key];
      return j ? v + josa(v, j) : v;
    });
  }

  // 언어 이해도에 따라 대사를 가리는 일은 언어 시스템(js/lang/)이 맡는다.
  return { josa, fmt, tail };
})();

if (typeof module !== 'undefined') module.exports = { Text };

</script>
<script>/* js/core/rng.js */
// 난수. 씨앗을 세계 상태 안에 넣어 두므로, 저장했다 불러와도 같은 흐름이 이어진다.
// 씨앗이 두 갈래다: 'rng'(사람과 사건)와 날씨(weather.seed). 날씨는 플레이어의 행동과 무관하게 회차마다 같다.
const Rng = (() => {
  // mulberry32. obj[key]가 씨앗이다.
  function next(obj, key = 'rng') {
    let t = (obj[key] = (obj[key] + 0x6d2b79f5) >>> 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const chance = (W, p) => next(W) < Math.max(0, Math.min(1, p));
  const pick = (W, arr) => arr[Math.floor(next(W) * arr.length)];
  const between = (W, lo, hi) => lo + next(W) * (hi - lo);
  return { next, chance, pick, between };
})();

if (typeof module !== 'undefined') module.exports = { Rng };

</script>
<script>/* js/core/bus.js */
// 이벤트 버스: 시스템끼리 서로를 직접 부르지 않고 "무슨 일이 있었다"를 알린다.
// 처리기는 (S, e)를 받는다. S = { P, W } (P: 되감아도 남는 것, W: 세계 상태)
const Bus = (() => {
  // 쓸 수 있는 이벤트 이름. 목록에 없는 이름은 오타로 보고 멈춘다.
  // PLAYER_ATTACKED = 플레이어가 누군가를 공격했다 / NPC_ATTACKED = NPC가 공격을 받았다
  const EVENTS = [
    'PLAYER_MOVED', 'PLAYER_ATTACKED', 'PLAYER_HELPED_NPC', 'PLAYER_HURT', 'PLAYER_DIED',
    'NPC_MOVED', 'NPC_ATTACKED', 'NPC_HELPED', 'NPC_THREATENED', 'NPC_DIED', 'NPC_MET_PLAYER',
    'DIALOGUE_STARTED', 'DIALOGUE_COMPLETED',
    'LANGUAGE_WORD_LEARNED', 'LANGUAGE_LEVEL_CHANGED', 'LANGUAGE_MISUNDERSTOOD', 'LANGUAGE_FULLY_UNDERSTOOD',
    'TRANSLATION_PERFORMED',
    'RELATIONSHIP_CHANGED',
    'RUMOR_CREATED', 'RUMOR_SPREAD',
    'LOCATION_DISCOVERED', 'WORLD_EVENT_CREATED',
    // 생활 (스토리 재설계): 쓰러짐, 일, 거처, 동행, 단서
    'PLAYER_COLLAPSED', 'PLAYER_RESCUED', 'PLAYER_WORKED', 'PLAYER_SLEPT', 'LODGING_CHANGED',
    'COMPANION_JOINED', 'COMPANION_LEFT', 'CLUE_FOUND', 'THREAD_OPENED',
  ];
  const handlers = {};
  const recent = []; // 디버그 화면용 최근 이벤트. 저장하지 않는다.
  let depth = 0;

  function on(type, fn) {
    if (type !== '*' && !EVENTS.includes(type)) throw new Error('알 수 없는 이벤트: ' + type);
    (handlers[type] = handlers[type] || []).push(fn);
  }

  function emit(S, type, data) {
    if (!EVENTS.includes(type)) throw new Error('알 수 없는 이벤트: ' + type);
    if (depth >= 16) throw new Error('이벤트가 끝없이 이어진다: ' + type);
    const e = Object.assign({ type, t: S.W.time.t }, data);
    depth++;
    try {
      recent.push(e);
      if (recent.length > 120) recent.shift();
      (handlers[type] || []).forEach((fn) => fn(S, e));
      (handlers['*'] || []).forEach((fn) => fn(S, e));
    } finally {
      depth--;
    }
    return e;
  }

  return { EVENTS, on, emit, recent };
})();

if (typeof module !== 'undefined') module.exports = { Bus };

</script>
<script>/* js/core/time.js */
// 시간. W.time.t = 1일차 0시부터 흐른 분.
const Time = (() => {
  const DAY = 1440;
  const START = 15 * 60; // 첫날 오후 3시에 눈을 뜬다

  // 시간대 (통합 명세 4절)
  const BANDS = [
    ['late_night', 0, 5], ['dawn', 5, 8], ['morning', 8, 12],
    ['afternoon', 12, 17], ['evening', 17, 20], ['night', 20, 24],
  ];
  const KO = { late_night: '심야', dawn: '새벽', morning: '오전', afternoon: '오후', evening: '저녁', night: '밤' };
  const DAY_KO = ['', '첫날', '둘째 날', '셋째 날', '넷째 날', '다섯째 날', '여섯째 날', '일곱째 날', '여덟째 날', '아홉째 날', '열흘째'];

  // 행동이 쓰는 시간 (지시서 11절 [확정]): 탐색 +10 / 이동 +20 / 휴식 +30 / 전투 +5
  const COST = { explore: 10, move: 20, rest: 30, fight: 5, talk: 5 };

  const clock = (t) => ((t % DAY) + DAY) % DAY;
  const day = (t) => Math.floor(t / DAY) + 1;
  const hour = (t) => clock(t) / 60;
  const band = (t) => { const h = hour(t); return BANDS.find(([, a, b]) => h >= a && h < b)[0]; };
  const dark = (t) => { const b = band(t); return b === 'night' || b === 'late_night'; };
  const at = (d, h, m = 0) => (d - 1) * DAY + h * 60 + m; // d일차 h시 m분
  const dayLabel = (t) => DAY_KO[day(t)] || `${day(t)}일째`;

  // 다음 아침 6시까지 남은 분 (밤을 넘길 때)
  function untilDawn(t) {
    const c = clock(t);
    const target = c >= 6 * 60 ? t - c + DAY + 6 * 60 : t - c + 6 * 60;
    return Math.max(1, target - t);
  }

  // a에서 b로 넘어가는 동안 시계가 h시를 지났는가
  function crossed(a, b, h) {
    const mark = h * 60;
    const first = a - clock(a) + mark;
    const next = first > a ? first : first + DAY;
    return next <= b;
  }

  return { DAY, START, BANDS, KO, DAY_KO, COST, clock, day, hour, band, dark, at, dayLabel, untilDawn, crossed };
})();

if (typeof module !== 'undefined') module.exports = { Time };

</script>
<script>/* js/data/places.js */
// 장소 데이터: 지역, 지형 특징, NPC가 다니는 길(분).
// 플레이어가 고르는 길과 장소 묘사는 world.js(숲)에 있다. 여기는 시스템이 쓰는 사실만 둔다.
// features: water(물이 있다) shelter(몸을 숨기거나 잘 수 있다) market(사고팔 수 있다)
//           rocks, trees, slope, high, dense, roots, bushes, fence, field, homes

const PLACE_DATA = {
  // 숲 (이름은 world.js의 LOCS에서 가져온다)
  clearing:   { region: 'forest', features: ['trees', 'rocks'] },
  stream:     { region: 'forest', features: ['water'] },
  downstream: { region: 'forest', features: ['water', 'bushes'] },
  hill:       { region: 'forest', features: ['rocks', 'slope', 'high'] },
  deep:       { region: 'forest', features: ['trees', 'dense'] },
  hollow:     { region: 'forest', features: ['roots', 'shelter'] },
  edge:       { region: 'forest', features: [] },
  // 플레이어는 들어갈 수 없는 숲 깊은 곳 (리아가 첫날 밤을 보낸 곳)
  deepwood:   { region: 'forest', name: '숲 깊은 곳', features: ['trees', 'dense', 'shelter'] },

  // 마을 [제안] 스토리에서 이름과 구성을 정하면 바꾼다
  village_gate:   { region: 'village', name: '마을 울타리', features: ['fence'] },
  village_square: { region: 'village', name: '마을 광장', features: ['market', 'water'] },
  village_homes:  { region: 'village', name: '마을 집들', features: ['shelter', 'homes'] },
  village_field:  { region: 'village', name: '마을 밭', features: ['field'] },
  // [임시] 교회의 구호 거처 (세계관 14절 "교회: 종교와 구호 활동") [결정 #10]
  village_chapel: { region: 'village', name: '작은 예배당', features: ['shelter'] },

  // 먼 곳 (추상 시뮬레이션만 한다)
  road:     { region: 'road', name: '큰길', features: [] },
  far_town: { region: 'far', name: '먼 도시', features: ['market', 'shelter', 'water', 'homes'] },
};

// 지역. adj = 이웃 지역 (플레이어가 있는 지역의 이웃은 중간 정밀도로 계산한다)
const REGION_DATA = {
  forest:  { name: '숲', adj: ['village'] },
  village: { name: '마을', adj: ['forest', 'road'] },
  road:    { name: '큰길', adj: ['village', 'far'] },
  far:     { name: '먼 곳', adj: ['road'] },
};

// NPC가 걷는 길 [장소 A, 장소 B, 걸리는 분]. 양방향이다.
const PATHS = [
  ['clearing', 'stream', 15], ['clearing', 'hill', 30], ['clearing', 'deep', 15], ['clearing', 'hollow', 20],
  ['stream', 'downstream', 20], ['stream', 'hollow', 15],
  ['deep', 'deepwood', 40], ['hollow', 'deepwood', 60],
  ['hollow', 'edge', 200], ['hill', 'edge', 240], ['downstream', 'edge', 230],
  ['edge', 'village_gate', 20],
  ['village_gate', 'village_square', 5], ['village_square', 'village_homes', 5], ['village_square', 'village_field', 10],
  ['village_square', 'village_chapel', 5],
  ['village_gate', 'road', 60], ['road', 'far_town', 720],
];

if (typeof module !== 'undefined') module.exports = { PLACE_DATA, REGION_DATA, PATHS };

</script>
<script>/* js/data/items.js */
// 아이템 데이터 (통합 명세 22절). 무게는 kg, 값은 동전 수.
// name은 플레이어에게 보이는 이름이다. label(P)이 있으면 플레이어가 아는 만큼 이름이 달라진다.

<script>/* js/sim/places.js */
// 장소: 지역, 지형 특징, NPC가 걷는 길 찾기, 장소에 남는 흔적.
// 흔적(trace)은 플레이어가 보지 못한 곳에서 일어난 일이 남기는 것이다. 다음에 그곳에 가면 흔적만 보인다.
const Places = (() => {
  const adj = {};
  PATHS.forEach(([a, b, m]) => {
    (adj[a] = adj[a] || {})[b] = m;
    (adj[b] = adj[b] || {})[a] = m;
  });

  const info = (loc) => PLACE_DATA[loc] || null;
  const name = (loc) => (typeof LOCS !== 'undefined' && LOCS[loc] && LOCS[loc].name) || (PLACE_DATA[loc] && PLACE_DATA[loc].name) || loc;
  const regionOf = (loc) => (PLACE_DATA[loc] ? PLACE_DATA[loc].region : 'far');
  const has = (loc, f) => !!(PLACE_DATA[loc] && PLACE_DATA[loc].features.includes(f));
  const neighbors = (loc) => Object.keys(adj[loc] || {});
  const distance = (a, b) => (adj[a] && adj[a][b]) || null;

  // 가장 빠른 길 (다익스트라). { path: [from, ..., to], min } 또는 null
  function route(from, to) {
    if (from === to) return { path: [from], min: 0 };
    const dist = { [from]: 0 }, prev = {}, done = new Set();
    while (true) {
      let cur = null;
      for (const k in dist) if (!done.has(k) && (cur === null || dist[k] < dist[cur])) cur = k;
      if (cur === null) return null;
      if (cur === to) break;
      done.add(cur);
      for (const [n, m] of Object.entries(adj[cur] || {})) {
        if (dist[n] == null || dist[cur] + m < dist[n]) { dist[n] = dist[cur] + m; prev[n] = cur; }
      }
    }
    const path = [to];
    while (path[0] !== from) path.unshift(prev[path[0]]);
    return { path, min: dist[to] };
  }

  function createState() {
    const s = {};
    Object.keys(PLACE_DATA).forEach((k) => { s[k] = { traces: [] }; });
    return s;
  }

  // 흔적을 남긴다. kind: blood | drag | body | camp | footprints | crushed_herb | struggle
  function addTrace(W, loc, kind, data = {}) {
    const st = W.locations[loc];
    if (!st) return null;
    const tr = Object.assign({ kind, t: W.time.t, until: W.time.t + (data.ttl || 3 * Time.DAY) }, data);
    delete tr.ttl;
    st.traces.push(tr);
    return tr;
  }
  const traces = (W, loc) => (W.locations[loc] ? W.locations[loc].traces.filter((x) => x.until > W.time.t) : []);

  // 시간이 지나 사라진 흔적을 지운다 (한 시간마다)
  function update(S) {
    const { W } = S;
    Object.values(W.locations).forEach((st) => { st.traces = st.traces.filter((x) => x.until > W.time.t); });
  }

  return { info, name, regionOf, has, neighbors, distance, route, createState, addTrace, traces, update };
})();

if (typeof module !== 'undefined') module.exports = { Places };

</script>
<script>/* js/sim/weather.js */
// 날씨. 한 시간마다 바뀔 수 있다. 날씨 씨앗은 사건 씨앗과 따로 돌아서, 플레이어가 무엇을 하든 회차마다 같은 하늘이다.
const Weather = (() => {
  const KO = { clear: '맑음', cloudy: '흐림', rain: '비', fog: '안개' };
  // 한 시간 뒤의 날씨 확률
  const NEXT = {
    clear: [['clear', 0.86], ['cloudy', 0.12], ['fog', 0.02]],
    cloudy: [['cloudy', 0.62], ['clear', 0.24], ['rain', 0.14]],
    rain: [['rain', 0.62], ['cloudy', 0.38]],
    fog: [['fog', 0.55], ['clear', 0.45]],
  };
  const CHANGE_LINE = {
    rain: '빗방울이 떨어지기 시작한다.',
    cloudy: '하늘이 낮게 흐려진다.',
    fog: '어느새 안개가 낮게 깔렸다.',
    clear: null,
  };
  const AFTER = { rain: '비가 그쳤다. 잎에서 물방울이 떨어진다.', fog: '안개가 걷힌다.' };
  // 장소 묘사 끝에 붙는 줄
  const SKY_EXTRA = { rain: '빗소리가 잎을 두드린다.', fog: '안개 때문에 몇 걸음 앞도 흐릿하다.', cloudy: null, clear: null };

  function create(seed) {
    return { seed: seed >>> 0, kind: 'clear', since: Time.START };
  }

  // 바깥 기온(도). 오후 3시에 가장 따뜻하고 새벽 3시에 가장 춥다.
  function temp(W) {
    const h = Time.hour(W.time.t);
    const base = 13 + 6 * Math.cos(((h - 15) / 24) * 2 * Math.PI);
    return base + ({ clear: 0, cloudy: -1, rain: -3, fog: -1 })[W.weather.kind];
  }

  function roll(w) {
    // 안개는 새벽과 밤에만 낀다
    const r = Rng.next(w, 'seed');
    let acc = 0;
    for (const [k, p] of NEXT[w.kind]) { acc += p; if (r < acc) return k; }
    return w.kind;
  }

  // 정시마다 날씨가 바뀔 수 있다. 바뀌면 바깥에 있는 플레이어에게 한 줄 보인다.
  function update(S, prevT) {
    const { W } = S;
    if (Math.floor(prevT / 60) === Math.floor(W.time.t / 60)) return;
    const w = W.weather;
    let k = roll(w);
    const b = Time.band(W.time.t);
    if (k === 'fog' && !(b === 'dawn' || b === 'late_night' || b === 'night')) k = 'clear';
    if (k === w.kind) return;
    const before = w.kind;
    set(S, k);
    const line = CHANGE_LINE[k] || AFTER[before];
    if (line && !W.worldFlags.end) W.worldFlags.feed.push(line);
  }

  function set(S, kind) {
    S.W.weather.kind = kind;
    S.W.weather.since = S.W.time.t;
  }

  const wet = (W) => W.weather.kind === 'rain';
  const hazy = (W) => W.weather.kind === 'fog';

  return { KO, SKY_EXTRA, create, temp, update, set, wet, hazy };
})();

if (typeof module !== 'undefined') module.exports = { Weather };

</script>
<script>/* js/sim/regions.js */
// 지역별 시뮬레이션 정밀도 (통합 명세 31·39절)
// active  = 플레이어가 있는 지역. 5분마다 NPC가 판단한다.
// nearby  = 이웃 지역. 30분마다.
// distant = 먼 지역. 3시간마다 추상적으로 (일정대로 움직이고 욕구는 뭉뚱그려 채운다).
// NPC마다 자기 시각(simT)을 따로 갖고 있어서, 지역을 옮겨 다녀도 같은 시간을 두 번 계산하지 않는다.
const Regions = (() => {
  const STEP = { active: 5, nearby: 30, distant: 180 };

  function create() {
    const r = {};
    Object.keys(REGION_DATA).forEach((id) => {
      r[id] = { level: 'distant', simT: Time.START, threat: id === 'forest' ? 30 : 5, alert: 0 };
    });
    return r;
  }

  function updateLevels(S) {
    const { W } = S;
    const here = Places.regionOf(W.player.loc);
    Object.keys(W.regions).forEach((id) => {
      W.regions[id].level = id === here ? 'active' : REGION_DATA[here].adj.includes(id) ? 'nearby' : 'distant';
    });
  }

  // 시각 t까지, 계산할 때가 된 지역의 NPC와 짐승을 움직인다
  function simulate(S, t) {
    const { W } = S;
    Object.entries(W.regions).forEach(([id, r]) => {
      if (t - r.simT < STEP[r.level]) return;
      r.simT = t;
      Object.values(W.npcs).forEach((n) => {
        if (Places.regionOf(n.location.loc) === id) Behavior.update(S, n, t, r.level);
      });
      Object.values(W.creatures).forEach((c) => {
        if (Places.regionOf(c.loc) === id) Creatures.update(S, c, t, r.level);
      });
    });
  }

  // 하루에 한 번: 위협은 조금씩 가라앉는다
  function daily(S) {
    Object.values(S.W.regions).forEach((r) => {
      r.threat = Math.max(0, r.threat - 4);
      r.alert = Math.max(0, r.alert - 10);
    });
  }

  function raiseThreat(S, region, n) {
    const r = S.W.regions[region];
    if (r) r.threat = Math.min(100, r.threat + n);
  }

  return { STEP, create, updateLevels, simulate, daily, raiseThreat };
})();

if (typeof module !== 'undefined') module.exports = { Regions };

</script>
<script>/* js/sim/creatures.js */
// 숲의 짐승. 플레이어가 보지 않는 동안에도 움직인다.
// thornback = 풀숲의 짐승 (눈이 셋, 등에 가시). 이름은 플레이어에게 보이지 않는다 ([???]).
// shade     = 밤에만 돌아다니는 정체불명의 무언가. 모습을 보여 주지 않는다.
const Creatures = (() => {
  const clamp = (n) => Math.max(0, Math.min(100, n));

  function createAll() {
    return {
      thornback: { id: 'thornback', kind: 'thornback', loc: 'downstream', alive: true, hp: 3, maxHp: 3,
        fear: 0, aggression: 70, caution: 40, hunger: 50, shy: false, fled: false,
        territory: ['downstream', 'deep', 'stream'], simT: Time.START },
      shade: { id: 'shade', kind: 'shade', loc: 'deep', alive: true, nocturnal: true,
        territory: ['clearing', 'stream', 'downstream', 'deep', 'hollow', 'hill'], simT: Time.START },
    };
  }

  // 그 장소에서 지금 활동 중인 짐승
  const at = (W, loc) => Object.values(W.creatures).filter((c) => c.alive && c.loc === loc && (!c.nocturnal || Time.dark(W.time.t)));

  function danger(c) {
    if (c.kind === 'shade') return 50;
    return c.shy ? 20 : clamp(40 + c.aggression * 0.3 + c.hunger * 0.2 - c.fear * 0.5);
  }

  // 한 시간마다 자리를 옮긴다
  function update(S, c, t, level) {
    const { W } = S;
    if (!c.alive) { c.simT = t; return; }
    const hours = Math.floor(t / 60) - Math.floor(c.simT / 60);
    c.simT = t;
    if (hours <= 0) return;
    if (c.kind === 'shade') {
      if (Time.dark(t)) c.loc = Rng.pick(W, c.territory);
      else c.loc = 'deep';
      return;
    }
    c.hunger = clamp(c.hunger + hours * 2);
    c.fear = clamp(c.fear - hours * 5);
    // 둘째 날 새벽 이후에는 숲 깊은 곳까지 돌아다닌다 (첫날은 대본 사건을 위해 깊은 곳에 가지 않는다)
    const range = t >= Time.at(2, 6) ? c.territory.concat(['deepwood']) : c.territory;
    if (!Time.dark(t)) c.loc = Rng.pick(W, range);
    // 사람을 덮친다 (둘째 날 새벽 이후, 배가 고프고 겁을 먹지 않았다면)
    if (t >= Time.at(2, 7) && !c.shy && c.hunger >= 60) {
      const prey = Npc.here(W, c.loc).find((n) => !n.location.hidden);
      if (prey && Rng.chance(W, 0.3)) Combat.creatureVsNpc(S, c, prey);
    }
  }

  // 풀숲의 짐승이 플레이어를 노리는가 (첫 번째 위험, 지시서 8절).
  // 제 영역(계곡 아래, 숲 안쪽)에 들어오면, 또는 첫날 해가 기울면 낯선 냄새를 쫓아온다. 비탈 위와 움푹한 곳까지는 오지 않는다.
  function engages(S) {
    const { W } = S;
    const c = W.creatures.thornback;
    if (!c || !c.alive || c.shy || W.worldFlags.seen.beast) return null;
    const loc = W.player.loc, t = W.time.t;
    if (Time.dark(t) || loc === 'hill' || loc === 'hollow') return null;
    const inTerritory = loc === 'downstream' || loc === 'deep';
    const hunting = Time.day(t) === 1 && Time.clock(t) >= 16 * 60 + 30;
    if (!inTerritory && !hunting) return null;
    c.loc = loc;
    return c.id;
  }

  // 밤에 걷다가 어둠 속의 무언가와 마주친다 (그것이 있는 곳을 지나면)
  function nightStrike(S, from, to) {
    const { W } = S;
    const s = W.creatures.shade;
    if (!s || !Time.dark(W.time.t) || !W.worldFlags.seen.night) return false;
    return s.loc === from || s.loc === to;
  }

  return { createAll, at, danger, update, engages, nightStrike };
})();

if (typeof module !== 'undefined') module.exports = { Creatures };

</script>
<script>/* js/sim/events.js */
// 세계 사건 (통합 명세 28~30절). 퀘스트로 보여 주지 않는다. 한 번 일어나면 흔적과 기억과 소문이 남는다.
// W.events = { log: [사건], active: { 'missing:lia': {...} }, scheduled: [{ at, type, done }] }
const WorldEvents = (() => {
  // 수색대가 숲을 뒤지는 순서
  const SEARCH_PLAN = ['edge', 'hollow', 'stream', 'downstream', 'clearing', 'deep', 'hill'];

  function initialSchedule() {
    return [{ at: Time.at(2, 6), type: 'lia_wounded', done: false }];
  }

  // 그 장소에서 보고 있던 사람들
  function witnessesAt(W, loc) {
    const w = Npc.here(W, loc).map((n) => n.id);
    if (W.player.loc === loc && W.player.hp > 0) w.push('player');
    return w;
  }

  function record(S, type, o = {}) {
    const { W } = S;
    const loc = o.loc || null;
    const ev = {
      id: `e-${++W.seq}`, type, t: W.time.t, loc,
      actors: o.actors || [], witnesses: o.witnesses || (loc ? witnessesAt(W, loc) : []),
      data: o.data || {}, distant: !!o.distant,
    };
    W.events.log.push(ev);
    if (W.events.log.length > 400) W.events.log.shift();
    Bus.emit(S, 'WORLD_EVENT_CREATED', { eventId: ev.id, kind: type, loc, witnesses: ev.witnesses });
    return ev;
  }

  // ---------- 정해진 사건 (이야기의 뼈대) ----------
  const SCRIPTED = {
    // 둘째 날 새벽, 숲 깊은 곳. 리아가 무언가에게 습격당하고 움푹한 곳으로 피한다. 플레이어는 보지 못한다.
    lia_wounded(S) {
      const { W } = S;
      const lia = W.npcs.lia;
      if (!lia || !lia.alive) return;
      const beast = W.creatures.thornback;
      if (beast && beast.alive) beast.loc = 'deepwood';
      if (lia.location.loc !== 'deepwood' || lia.location.transit) Npc.place(S, lia, 'deepwood');
      Npc.injure(S, lia, { health: 45, bleed: 1 / 12, pain: 75, shock: 100, kind: 'claw', by: 'thornback', cause: '짐승에게 습격당했다' });
      lia.mental.fear = 70;
      lia.needs.hunger = Math.max(lia.needs.hunger, 60);
      Memory.add(S, lia, { type: 'attacked_by', subject: 'thornback' });
      Places.addTrace(W, 'deepwood', 'blood');
      Places.addTrace(W, 'deepwood', 'struggle');
      // [제안 · 스토리 확인 필요] 습격 때 약초 주머니를 잃는다. 약초꾼의 제자가 약초를 지닌 채면 곧바로 스스로 피를 멎게 해서,
      // 피 흘리는 채로 만나는 첫 장면이 성립하지 않는다. 흩어진 약초는 숲 깊은 곳에 흔적으로 남는다.
      const lost = lia.inventory.herb || 0;
      delete lia.inventory.herb;
      delete lia.inventory.bandage;
      if (lost) Places.addTrace(W, 'deepwood', 'scattered_herbs', { count: lost });
      record(S, 'beast_attack', { loc: 'deepwood', actors: ['thornback', 'lia'], witnesses: ['lia'],
        data: { subject: 'thornback', target: 'lia' } });
      Goals.add(lia, { id: 'return_home', type: 'personal', priority: 65 }, W.time.t);
      // 움푹한 곳까지 한 시간 (7시에 닿는다)
      Npc.startMove(S, lia, 'hollow');
      lia.location.speed = 1;
      lia.location.nextAt = W.time.t + 60;
      lia.currentAction = { type: 'flee', start: W.time.t, until: W.time.t + 60, data: {} };
      // 움푹한 곳의 핏자국은 장면 글(주변을 조사한다)이 직접 묘사하므로 따로 적지 않는다
      Places.addTrace(W, 'hollow', 'blood', { ttl: 3 * Time.DAY, quiet: true });
    },
  };

  // ---------- 실종과 수색 ----------
  function checkMissing(S) {
    const { W } = S;
    const t = W.time.t;
    Object.values(W.npcs).forEach((n) => {
      if (!n.expectedHome || t < n.expectedHome || n.flags.missingResolved) return;
      if (n.alive && Npc.atHome(n)) return;
      const key = 'missing:' + n.id;
      if (W.events.active[key]) return;
      const homeRegion = Places.regionOf(n.location.home);
      // 마을 안에서 오가는 중인 사람도 마을 사람이다
      const villagers = Object.values(W.npcs).filter((v) => v !== n && v.alive
        && Places.regionOf(v.location.loc) === homeRegion);
      if (!villagers.length) return;
      const ev = record(S, 'missing', { loc: n.location.home, witnesses: villagers.map((v) => v.id),
        data: { target: n.id } });
      W.events.active[key] = { type: 'missing', target: n.id, since: t, event: ev.id };
      // 아끼는 사람과 마을을 지키는 사람이 다음 날 새벽 숲을 뒤진다
      const dawn = t - Time.clock(t) + Time.DAY + 6 * 60;
      villagers.forEach((v) => {
        const r = Rel.peek(W, v.id, n.id) || {};
        if ((r.affection || 0) >= 30 || v.identity.occupation === 'guard') {
          Goals.add(v, { id: 'search', type: 'social', base: 70 + (r.affection || 0) * 0.2, priority: 0,
            target: n.id, plan: SEARCH_PLAN.slice(), idx: 0, startAt: dawn }, t);
        }
      });
    });
  }

  // 수색대의 한 걸음 (behavior.js의 search 행동)
  function searchStep(S, n, c) {
    const { W } = S;
    const g = Goals.get(n, 'search');
    if (!g) return { min: 5 };
    if (c.dark || Time.hour(c.now) >= 18) {
      // 해가 지면 돌아가고, 내일 새벽 처음부터 다시 찾는다
      g.idx = 0;
      g.startAt = c.now - Time.clock(c.now) + Time.DAY + 6 * 60;
      if (c.loc !== c.home) Npc.startMove(S, n, c.home);
      return { min: 10 };
    }
    const where = g.plan[g.idx];
    if (!where) {
      Goals.remove(n, 'search');
      Npc.startMove(S, n, c.home);
      return { min: 10 };
    }
    if (c.loc !== where) { Npc.startMove(S, n, where); return { min: 10 }; }
    const target = W.npcs[g.target];
    if (target.alive && !target.location.transit && target.location.loc === c.loc) { found(S, n, target, 'alive'); return { min: 20 }; }
    if (!target.alive && Places.traces(W, c.loc).some((x) => x.kind === 'body' && x.npc === target.id)) { found(S, n, target, 'dead'); return { min: 30 }; }
    Places.addTrace(W, c.loc, 'footprints', { by: n.id, ttl: 2 * Time.DAY });
    g.idx++;
    return { min: 20 };
  }

  function stopSearch(W, targetId, onlyAt) {
    Object.values(W.npcs).forEach((v) => {
      const g = Goals.get(v, 'search');
      if (g && g.target === targetId && (!onlyAt || v.location.loc === onlyAt)) Goals.remove(v, 'search');
    });
  }

  function found(S, n, target, how) {
    const { W } = S;
    const loc = n.location.loc;
    delete W.events.active['missing:' + target.id];
    target.flags.missingResolved = true;
    if (how === 'alive') {
      record(S, 'found_alive', { loc, data: { subject: n.id, target: target.id } });
      // 부축해서 데려간다
      target.physical.shock = Math.min(target.physical.shock, 15);
      Goals.add(target, { id: 'return_home', type: 'personal', priority: 90 }, W.time.t);
      stopSearch(W, target.id, loc);
      Npc.startMove(S, n, n.location.home);
      return;
    }
    // 시신: 무엇이 그를 죽였는지는 흔적으로만 짐작한다. 곁에 이방인이 있었다면 의심은 그쪽으로 간다.
    const d = target.death || {};
    const by = d.by === 'thornback' ? 'thornback' : (d.by === 'player' && W.player.loc === loc ? 'player' : null);
    record(S, 'found_dead', { loc, data: { target: target.id, cause: d.cause || null, by } });
    Regions.raiseThreat(S, 'village', 25);
    W.regions.village.alert = 80;
    stopSearch(W, target.id, loc);
    Npc.startMove(S, n, n.location.home);
  }

  // ---------- 매 틱 ----------
  function process(S, prevT) {
    const { W } = S;
    W.events.scheduled.forEach((e) => {
      if (!e.done && W.time.t >= e.at) { e.done = true; SCRIPTED[e.type](S); }
    });
    if (Math.floor(prevT / 60) !== Math.floor(W.time.t / 60)) checkMissing(S);
  }

  // 누군가 죽었다. 곁에서 본 사람이 있으면 그들이 이야기를 시작한다.
  Bus.on('NPC_DIED', (S, e) => {
    const w = witnessesAt(S.W, e.loc).filter((x) => x !== e.npcId);
    record(S, 'death_witnessed', { loc: e.loc, witnesses: w, data: { target: e.npcId, cause: e.cause, by: e.by, subject: e.by === 'player' ? 'player' : null } });
    // 곁에서 본 사람은 죽인 쪽을 두려워하고 미워한다
    w.filter((x) => x !== 'player' && x !== e.by).forEach((x) => {
      if (!e.by || !S.W.npcs[x]) return;
      const aff = (Rel.peek(S.W, x, e.npcId) || {}).affection || 0;
      Rel.change(S, x, e.by, { fear: 40, hostility: 30 + aff * 0.7, resentment: aff }, 'saw_death');
    });
  });
  // 집으로 돌아오면 실종은 끝난다
  Bus.on('NPC_MOVED', (S, e) => {
    const n = S.W.npcs[e.npcId];
    if (!n || e.to !== n.location.home) return;
    if (S.W.events.active['missing:' + n.id]) {
      delete S.W.events.active['missing:' + n.id];
      n.flags.missingResolved = true;
      record(S, 'returned', { loc: e.to, data: { target: n.id } });
      stopSearch(S.W, n.id);
    }
  });
  // 누군가 죽었다는 이야기를 들은 수색꾼은 찾기를 그만둔다
  Bus.on('RUMOR_SPREAD', (S, e) => {
    const r = S.W.rumors[e.rumorId];
    if (r && r.type === 'died') { const v = S.W.npcs[e.to]; const g = v && Goals.get(v, 'search'); if (g && g.target === r.target) Goals.remove(v, 'search'); }
  });

  return { SEARCH_PLAN, initialSchedule, witnessesAt, record, SCRIPTED, checkMissing, searchStep, found, process };
})();

if (typeof module !== 'undefined') module.exports = { WorldEvents };

</script>
<script>/* js/sim/economy.js */
// 경제 (통합 명세 27절). 재고, 사고팔기, 값, 돈, 수요와 공급, 지역 물가.
// 연쇄: 숲이 위험하다는 소문 → 오가는 사람이 줄고 밭일·채집이 줄어든다 → 들어오는 식량이 줄어 값이 오른다
//       → 장사가 안 되는 날이 이어지면 상인이 마을을 떠난다.
const Economy = (() => {
  const round = (n) => Math.round(n * 10) / 10;
  const BASE = (item) => (ITEM_DEFS[item] ? ITEM_DEFS[item].value : 1);

  function market(stock, demand, supply) {
    const price = {};
    Object.keys(stock).forEach((k) => { price[k] = BASE(k); });
    return { stock, price, demand, supply, traffic: 1, salesToday: 0, lowDays: 0, history: [] };
  }

  function create() {
    return {
      markets: {
        // 마을 광장의 가게. 이름 없는 주민들의 수요와 밭에서 나는 공급을 뭉뚱그려 계산한다
        village_square: market(
          { bread: 24, dried_meat: 8, herb: 4, bandage: 4, salt: 2, waterskin: 2 },
          { bread: 6, dried_meat: 2, herb: 1, bandage: 1, salt: 0.5 },
          { bread: 6, dried_meat: 2 }),
        far_town: market(
          { bread: 200, dried_meat: 80, herb: 30, bandage: 40, salt: 60, waterskin: 20 },
          { bread: 40, dried_meat: 15, herb: 5, bandage: 6, salt: 8 },
          { bread: 40, dried_meat: 15, herb: 5, bandage: 6, salt: 10 }),
      },
    };
  }

  const get = (W, loc) => W.economy.markets[loc] || null;

  // 가게를 보는 사람 (마을 가게는 상인이 일하는 동안만 열린다)
  function merchantAt(W, loc) {
    const m = Object.values(W.npcs).find((n) => n.alive && n.identity.occupation === 'merchant' && !n.location.transit
      && n.location.loc === loc && n.currentAction && n.currentAction.type === 'work');
    return m ? m.id : null;
  }
  function open(W, loc) {
    if (!get(W, loc)) return false;
    if (loc === 'far_town') { const h = Time.hour(W.time.t); return h >= 8 && h < 18; }
    return !!merchantAt(W, loc);
  }
  const priceOf = (W, loc, item) => { const m = get(W, loc); return m ? (m.price[item] || BASE(item)) : BASE(item); };

  // 가게 주인의 돈 (먼 도시의 가게는 돈이 넉넉하다고 본다)
  function till(W, loc) { const id = merchantAt(W, loc); return id ? W.npcs[id] : null; }

  function buy(S, n, loc, item, qty = 1) {
    const { W } = S;
    const m = get(W, loc);
    if (!m || !open(W, loc) || (m.stock[item] || 0) < qty) return false;
    const cost = priceOf(W, loc, item) * qty;
    if (n.money < cost) return false;
    n.money -= cost;
    m.stock[item] -= qty;
    m.salesToday += cost;
    const owner = till(W, loc);
    if (owner) owner.money += cost;
    return true;
  }

  // 가게가 물건을 사 준다 (값의 60%)
  function sell(S, n, loc, item, qty = 1) {
    const { W } = S;
    const m = get(W, loc);
    if (!m || !open(W, loc) || (n.inventory[item] || 0) < qty) return false;
    const pay = round(priceOf(W, loc, item) * 0.6 * qty);
    const owner = till(W, loc);
    if (owner && owner.money < pay) return false;
    if (owner) owner.money -= pay;
    n.money += pay;
    n.inventory[item] -= qty;
    if (n.inventory[item] <= 0) delete n.inventory[item];
    m.stock[item] = (m.stock[item] || 0) + qty;
    return true;
  }

  // 팔 것이 있거나 살 것이 있는가
  function hasBusiness(W, n, loc) {
    if (!get(W, loc)) return false;
    const trip = Goals.get(n, 'trade_trip');
    if (trip && trip.target === loc && !n.flags.tripDone) return true;
    const surplus = (n.inventory.herb || 0) > 3 || (n.inventory.dried_meat || 0) > 1 || (n.inventory.bandage || 0) > 3;
    const hungry = !Object.keys(n.inventory).some((k) => ITEM_DEFS[k] && ITEM_DEFS[k].category === 'food') && n.needs.hunger > 40;
    return surplus || (hungry && n.money >= priceOf(W, loc, 'bread'));
  }

  function trade(S, n, loc) {
    const { W } = S;
    const trip = Goals.get(n, 'trade_trip');
    if (trip && trip.target === loc && !n.flags.tripDone) {
      // 행상: 가져온 것을 넘기고 이 마을에서 나는 것을 사 간다
      ['bread', 'bandage', 'salt'].forEach((k) => { while ((n.inventory[k] || 0) > 1 && sell(S, n, loc, k)) { /* 판다 */ } });
      buy(S, n, loc, 'herb', Math.min(2, get(W, loc).stock.herb || 0));
      n.flags.tripDone = true;
      n.flags.lastTrip = W.time.t;
      return;
    }
    if ((n.inventory.herb || 0) > 3) sell(S, n, loc, 'herb', n.inventory.herb - 3);
    if ((n.inventory.dried_meat || 0) > 1) sell(S, n, loc, 'dried_meat', n.inventory.dried_meat - 1);
    if ((n.inventory.bandage || 0) > 3) sell(S, n, loc, 'bandage', n.inventory.bandage - 3);
    const hasFood = Object.keys(n.inventory).some((k) => ITEM_DEFS[k] && ITEM_DEFS[k].category === 'food');
    if (!hasFood && n.needs.hunger > 40 && buy(S, n, loc, 'bread')) n.inventory.bread = (n.inventory.bread || 0) + 1;
  }

  // 주인이 자리를 비운 가게 (훔칠 기회)
  function unattended(W, loc, n) {
    const m = get(W, loc);
    if (!m || loc === 'far_town' || open(W, loc)) return null;
    return (m.stock.bread || 0) > 0 ? m : null;
  }
  function steal(S, n, loc) {
    const { W } = S;
    const m = unattended(W, loc, n);
    if (!m) return false;
    m.stock.bread--;
    n.inventory.bread = (n.inventory.bread || 0) + 1;
    WorldEvents.record(S, 'theft', { loc, actors: [n.id], data: { subject: n.id, item: 'bread' } });
    return true;
  }

  // 하루에 한 번 (새벽 6시)
  function daily(S) {
    const { W } = S;
    const v = get(W, 'village_square');
    const threat = W.regions.village.threat;
    const southTrade = Factions.rel(W, 'lumeris', 'southern_confederation').trade;
    v.traffic = Math.max(0.1, Math.min(1.5, 1 - threat / 100 * 0.8 + (southTrade - 70) / 200));
    const owner = Object.values(W.npcs).find((n) => n.alive && n.identity.occupation === 'merchant' && n.location.home === 'village_homes');
    // 이름 없는 주민들이 사 간다 (오가는 사람이 줄면 덜 팔린다)
    let sales = v.salesToday;
    Object.entries(v.demand).forEach(([k, d]) => {
      const want = d * (0.7 + 0.3 * v.traffic);
      const sold = Math.min(v.stock[k] || 0, Math.round(want));
      v.stock[k] = (v.stock[k] || 0) - sold;
      sales += sold * (v.price[k] || BASE(k));
    });
    if (owner) owner.money += sales - v.salesToday;
    // 밭과 사냥에서 들어오는 것 (숲이 무서우면 덜 나가고, 리아가 없으면 고기가 준다)
    const lia = W.npcs.lia;
    const hunter = lia && lia.alive && Npc.atHome(lia) ? 1 : 0.5;
    v.stock.bread = (v.stock.bread || 0) + Math.round(v.supply.bread * (1 - threat / 120));
    v.stock.dried_meat = (v.stock.dried_meat || 0) + Math.round(v.supply.dried_meat * (1 - threat / 80) * hunter);
    // 모자라면 값이 오르고, 남으면 내린다
    Object.keys(v.demand).forEach((k) => {
      const d = v.demand[k];
      const ratio = 1 + (d * 3 - (v.stock[k] || 0)) / (d * 6);
      v.price[k] = round(BASE(k) * Math.max(0.6, Math.min(2.5, ratio)));
    });
    v.price.salt = round(BASE('salt') * Math.max(0.6, Math.min(2, 1 + (60 - southTrade) / 100)));
    // 장사가 안 되는 날이 이어지면 상인은 떠날 궁리를 한다
    v.lowDays = sales < 12 ? v.lowDays + 1 : 0;
    v.history.push({ day: Time.day(W.time.t), sales: round(sales), traffic: round(v.traffic), threat: Math.round(threat), bread: v.price.bread });
    if (v.history.length > 30) v.history.shift();
    v.salesToday = 0;
    if (owner && v.lowDays >= 3 && owner.money < 120 && !owner.flags.leaving) leaveTown(S, owner);
  }

  // 상인이 마을을 떠난다 (NPC 이주)
  function leaveTown(S, n) {
    n.flags.leaving = true;
    n.location.home = 'far_town';
    n.schedule = JSON.parse(JSON.stringify(SCHEDULES.traveler));
    WorldEvents.record(S, 'merchant_left', { loc: n.location.loc, actors: [n.id], data: { subject: n.id } });
    Npc.startMove(S, n, 'far_town');
  }

  return { create, get, merchantAt, open, priceOf, buy, sell, hasBusiness, trade, unattended, steal, daily, leaveTown };
})();

if (typeof module !== 'undefined') module.exports = { Economy };

</script>
<script>/* js/sim/factions.js */
// 국가와 세력, 정치 (통합 명세 26절). 먼 곳의 일이라 하루 단위로 추상 계산한다.
// 먼 곳에서 벌어진 큰 사건은 먼 도시에 "소식"으로 쌓이고, 그곳을 오가는 사람(행상)이 소문으로 실어 온다.
const Factions = (() => {
  const clamp = (n) => Math.max(0, Math.min(100, n));
  const clone = (o) => JSON.parse(JSON.stringify(o));

  function create() {
    return Object.fromEntries(Object.entries(FACTION_DEFS).map(([id, d]) => [id, Object.assign({ id }, clone(d))]));
  }
  function createPolitics() {
    return { relations: clone(FACTION_RELATIONS), base: clone(FACTION_RELATIONS), tension: 20, news: [] };
  }

  function rel(W, a, b) {
    const R = W.politics.relations;
    return R[`${a}|${b}`] || R[`${b}|${a}`];
  }

  // 그날 먼 곳에서 벌어질 수 있는 일의 가능성
  function odds(W) {
    const day = Time.day(W.time.t);
    return {
      war_tension: rel(W, 'lumeris', 'caelvar').hostility / 700 + W.politics.tension / 1000,
      trade_boom: rel(W, 'lumeris', 'southern_confederation').trade / 1400,
      anomaly: 0.03 + day * 0.004, // 세계관 19절: 이상현상이 늘고 있다
      beasts_rising: 0.03 + W.politics.tension / 1500,
    };
  }

  // 하루에 한 번
  function daily(S) {
    const { W } = S;
    const P = W.politics;
    // 관계는 사건이 없으면 원래 자리로 조금씩 돌아간다
    Object.entries(P.relations).forEach(([k, r]) => {
      Object.keys(r).forEach((ax) => { r[ax] = clamp(r[ax] + (P.base[k][ax] - r[ax]) * 0.05); });
    });
    P.tension = clamp(P.tension + (Rng.next(W) - 0.5) * 2);
    Object.entries(odds(W)).forEach(([type, p]) => { if (Rng.chance(W, p)) trigger(S, type); });
    // 먼 도시에 있는 사람은 그곳의 소식을 듣는다
    Object.values(W.npcs).filter((n) => n.alive && !n.location.transit && n.location.loc === 'far_town').forEach((n) => pickUpNews(S, n));
  }

  // 먼 곳의 큰 사건이 벌어진다 (디버그 화면에서도 부른다)
  function trigger(S, type) {
    const { W } = S;
    const P = W.politics;
    const def = WORLD_EVENT_TYPES[type];
    if (!def) throw new Error('알 수 없는 세계 사건: ' + type);
    const ev = WorldEvents.record(S, type, { loc: 'far_town', witnesses: [], distant: true, data: { place: def.place } });
    if (type === 'war_tension') {
      const r = rel(W, 'lumeris', 'caelvar');
      r.hostility = clamp(r.hostility + 6); r.trade = clamp(r.trade - 4); r.diplomacy = clamp(r.diplomacy - 3);
      P.tension = clamp(P.tension + 5);
    } else if (type === 'trade_boom') {
      const r = rel(W, 'lumeris', 'southern_confederation');
      r.trade = clamp(r.trade + 5);
    } else if (type === 'beasts_rising') {
      Regions.raiseThreat(S, 'road', 10);
    }
    P.news.push({ type, event: ev.id, t: W.time.t, rumor: def.rumor });
    if (P.news.length > 20) P.news.shift();
    return ev;
  }

  function pickUpNews(S, n) {
    const { W } = S;
    W.politics.news.forEach((x) => {
      if (x.rumorId && n.knowledge.rumors[x.rumorId]) return;
      if (!x.rumorId) x.rumorId = Rumor.create(S, [n.id], { type: x.rumor, place: 'far_town', event: x.event }).id;
      else n.knowledge.rumors[x.rumorId] = { level: 1, from: 'far_town', t: W.time.t };
    });
  }

  return { create, createPolitics, rel, odds, daily, trigger, pickUpNews };
})();

if (typeof module !== 'undefined') module.exports = { Factions };

</script>
<script>/* js/body.js */
// 플레이어의 몸: 체력, 생존(허기·갈증·피로·추위·젖음·출혈·부상·병), 능력치와 성장, 소지품.
// 화면과 무관한 순수 로직이다. me = W.player
const STAT_KEYS = ['str', 'agi', 'vit', 'int', 'sen', 'wil'];
const STAT_KO = { str: '힘', agi: '민첩', vit: '체력', int: '지능', sen: '감각', wil: '의지' };
const STAT_POINTS = 10; // 상태창이 열릴 때 받는 포인트
const STAT_MAX = 10;
const GRASP_REVEAL = 2; // 이만큼 몸을 써 봐야 그 능력치가 숫자로 보인다
const GROW_EVERY = 6;   // 상태창이 열린 뒤, 이만큼 더 쓰면 그 능력치가 1 오른다
const GROW_MAX = 2;     // 한 회차에 쓰면서 오를 수 있는 최대치 (능력치마다)

const hpMax = (me) => 7 + me.stats.vit;

const Player = (() => {
  const clamp = (n, lo = 0, hi = 100) => Math.max(lo, Math.min(hi, n));

  function create() {
    const zero = () => Object.fromEntries(STAT_KEYS.map((k) => [k, 0]));
    return {
      id: 'player', loc: 'clearing', inv: {}, dur: {}, hp: 10,
      stats: Object.fromEntries(STAT_KEYS.map((k) => [k, 3])),
      grasp: zero(), grown: zero(),
      status: { unlocked: false, points: 0, known: {} },
      // 몸이 젖은 채로 눈을 뜬다
      surv: { hunger: 30, thirst: 40, fatigue: 20, cold: 20, wet: 60, bleeding: 0, injuries: [], illness: [] },
      acc: { starve: 0, chill: 0, rest: 0 },
      feel: {}, cause: null, ateBerry: false, asleep: false,
      // [제안] 마법 재능은 숨긴 값이다. 플레이어에게 보여 주지 않는다
      magic: { mana: 5, maxMana: 5, talent: { light: 40, spirit: 55, life: 30 } },
      // 생활: 돈(동전), 한 일의 경향(분), 거처, 함께 다니는 사람, 진 빚, 마지막으로 쓰러진 시각
      money: 0, tendency: {}, lodging: null, companions: [], debts: [], lastCollapse: null,
    };
  }

  // 몸을 쓴다. 상태창이 열린 뒤라면 처음으로 감이 잡힌 능력치를 알려 주고, 계속 쓰면 조금씩 자란다.
  function use(S, k) {
    const me = S.W.player;
    me.grasp[k] = (me.grasp[k] || 0) + 1;
    if (!me.status.unlocked) return;
    if (!me.status.known[k] && me.grasp[k] >= GRASP_REVEAL) {
      me.status.known[k] = true;
      S.W.worldFlags.notes.push({ t: `……${STAT_KO[k]}에 대한 이해도가 상승했다.`, cls: 'sys' });
      return;
    }
    const over = me.grasp[k] - GRASP_REVEAL;
    if (over > 0 && over % GROW_EVERY === 0 && me.grown[k] < GROW_MAX && me.stats[k] < STAT_MAX) {
      me.stats[k]++;
      me.grown[k]++;
      S.W.worldFlags.notes.push({ t: `……${STAT_KO[k]}이 몸에 조금 붙은 것 같다.`, cls: 'sys' });
    }
  }

  // 첫날 밤 보호 중인가 (RULES.protection): 그동안은 체력이 minHp 밑으로 내려가지 않는다
  const sheltered = (S) => S.W.time.t < Time.at(RULES.protection.until[0], RULES.protection.until[1]);

  // cause: 이 상처로 쓰러지면 보일 까닭. by: 누가 (NPC id, 'beast' 등)
  function hurt(S, n, cause, by) {
    const me = S.W.player;
    me.hp = Math.max(sheltered(S) ? RULES.protection.minHp : 0, me.hp - n);
    if (cause) me.cause = cause;
    Bus.emit(S, 'PLAYER_HURT', { amount: n, cause: cause || null, by: by || null, hp: me.hp });
  }

  function heal(me, n) { me.hp = Math.min(hpMax(me), me.hp + n); }

  // 피가 나는 상처. bleedMin분 동안 피가 흐르고 저절로 멎는다 (그동안 쉬어도 낫지 않는다)
  function injure(S, kind, bleedMin = 0) {
    const me = S.W.player;
    me.surv.injuries.push({ kind, t: S.W.time.t, bleedUntil: S.W.time.t + bleedMin });
  }
  const bleeding = (W) => W.player.surv.injuries.some((x) => x.bleedUntil > W.time.t);
  // 상처를 싸매면 피가 멎는다
  function treat(S) {
    S.W.player.surv.injuries.forEach((x) => { x.bleedUntil = Math.min(x.bleedUntil, S.W.time.t); });
  }
  const ill = (W) => W.player.surv.illness.some((x) => x.until > W.time.t);
  function sicken(S, kind, min) { S.W.player.surv.illness.push({ kind, t: S.W.time.t, until: S.W.time.t + min }); }

  // ---------- 소지품 ----------
  const weight = (me) => Object.entries(me.inv).reduce((s, [k, n]) => s + (ITEM_DEFS[k] ? ITEM_DEFS[k].weight * n : 0), 0);
  const carryLimit = (me) => 4 + me.stats.str * 1.5;
  function give(me, item, n = 1) {
    me.inv[item] = (me.inv[item] || 0) + n;
    const d = ITEM_DEFS[item];
    if (d && d.durability != null && me.dur[item] == null) me.dur[item] = d.durability;
  }
  function take(me, item, n = 1) {
    if (!me.inv[item]) return false;
    me.inv[item] -= n;
    if (me.inv[item] <= 0) { delete me.inv[item]; delete me.dur[item]; }
    return true;
  }
  // 무기로 한 번 쓴다. 부러지면 true (하나를 잃고, 남은 것이 있으면 새것으로 바꿔 든다)
  function wear(me, item) {
    const d = ITEM_DEFS[item];
    if (!d || d.durability == null || !me.inv[item]) return false;
    me.dur[item] = (me.dur[item] == null ? d.durability : me.dur[item]) - 1;
    if (me.dur[item] > 0) return false;
    take(me, item);
    if (me.inv[item]) me.dur[item] = d.durability;
    return true;
  }
  const label = (item, P) => { const d = ITEM_DEFS[item]; return d ? (d.label ? d.label(P) : d.name) : item; };

  // ---------- 시간이 흐를 때 ----------
  // opt: { rest, sleep, move, fight } — 무엇을 하며 보냈는가. 느낌이 바뀌면 그 줄을 돌려준다.
  function update(S, dt, opt = {}) {
    const { W } = S;
    const me = W.player, s = me.surv, a = me.acc;
    const lines = [];
    s.thirst = clamp(s.thirst + dt * 0.05);  // 시간당 +3
    s.hunger = clamp(s.hunger + dt * 0.025); // 시간당 +1.5

    // 피로
    // opt.work = 일의 분당 피로 (play/work.js)
    let f = opt.fight ? 0.15 : opt.move ? 0.08 : opt.work != null ? opt.work : 0.03;
    if (opt.move && weight(me) > carryLimit(me)) f *= 1.5;
    if (ill(W)) f *= 2;
    f *= 1 - (me.stats.vit - 3) * 0.05;
    if (opt.sleep) f = -0.25; else if (opt.rest) f = -0.08;
    s.fatigue = clamp(s.fatigue + f * dt);

    // 젖음과 추위: 비를 맞으면 젖고, 해가 있으면 마른다. 젖은 몸은 밤에 식는다.
    const shelter = Places.has(me.loc, 'shelter');
    if (Weather.wet(W)) s.wet = clamp(s.wet + dt * (shelter ? 0.12 : 0.3));
    else s.wet = clamp(s.wet - dt * (Time.dark(W.time.t) ? 0.04 : 0.12));
    const target = clamp((15 - Weather.temp(W)) * 4 + s.wet * 0.4 - (opt.move || opt.fight ? 10 : 0));
    s.cold = clamp(s.cold + (target - s.cold) * Math.min(1, dt / 60));
    if (s.cold >= 90) {
      a.chill += dt;
      while (a.chill >= 90) { a.chill -= 90; hurt(S, 1, '추위를 버티지 못했다'); }
    } else a.chill = 0;

    // 굶주림과 갈증
    if (s.thirst >= 85 || s.hunger >= 90) {
      a.starve += dt;
      while (a.starve >= 60) { a.starve -= 60; hurt(S, 1, '굶주림과 갈증을 버티지 못했다'); }
    } else a.starve = 0;

    s.bleeding = bleeding(W) ? 1 : 0;
    // 쉬면 조금씩 낫는다 (목마르거나, 굶주리거나, 피를 흘리거나, 얼어붙어 있으면 낫지 않는다)
    // 거처에서 자면 잠의 질(opt.quality)만큼 낫는다 (RULES.sleep.healPer30)
    // 정신을 잃은 동안(opt.unconscious)은 쉬는 게 아니다: 낫지 않는다 (깨어날 때의 체력은 쓰러짐 규칙이 정한다)
    if ((opt.rest || opt.sleep) && !opt.unconscious && s.thirst < 70 && s.hunger < 80 && !s.bleeding && s.cold < 80) {
      a.rest += dt;
      const per = opt.sleep && opt.quality != null ? RULES.sleep.healPer30[opt.quality] : 1;
      while (a.rest >= 30) { a.rest -= 30; heal(me, per); }
    }
    s.illness = s.illness.filter((x) => x.until > W.time.t);

    const feel = (key, on, text) => {
      if (on && !me.feel[key]) { me.feel[key] = true; lines.push(text); }
      if (!on) me.feel[key] = false;
    };
    feel('thirst1', s.thirst >= 60, '목이 마르다.');
    feel('thirst2', s.thirst >= 85, '목이 타들어 간다. 머리가 멍하다.');
    feel('hunger1', s.hunger >= 55, '배가 고프다.');
    feel('hunger2', s.hunger >= 85, '배 속이 쓰리다. 손끝이 조금 떨린다.');
    feel('tired1', s.fatigue >= 60, '몸이 무겁다. 걸음이 자꾸 늦어진다.');
    feel('tired2', s.fatigue >= 85, '눈꺼풀이 자꾸 내려앉는다.');
    feel('cold1', s.cold >= 55, s.wet >= 40 ? '젖은 옷이 차갑게 달라붙는다. 몸이 떨린다.' : '춥다. 몸이 저절로 움츠러든다.');
    feel('cold2', s.cold >= 80, '이가 딱딱 부딪친다. 손끝에 감각이 없다.');
    return lines;
  }

  // 체력을 숫자 대신 몸의 느낌으로 표현한다.
  function hpFeeling(me) {
    const r = me.hp / hpMax(me);
    if (r >= 0.9) return null;
    if (r >= 0.6) return '몸 여기저기가 욱신거린다.';
    if (r >= 0.3) return '상처가 화끈거린다. 움직일 때마다 숨이 막힌다.';
    return '시야가 흐리다. 이대로는 오래 버티지 못한다.';
  }

  // 화면 아래에 늘 보이는 몸 상태 (통합 명세 37절). 숫자 대신 느낌으로.
  function barWords(W) {
    const me = W.player, s = me.surv;
    const r = me.hp / hpMax(me);
    const pick = (v, steps) => steps.find(([th]) => v >= th)[1];
    return [
      ['몸', r >= 0.9 ? '멀쩡함' : r >= 0.6 ? '욱신거림' : r >= 0.3 ? '다침' : '위험'],
      ['허기', pick(s.hunger, [[85, '굶주림'], [55, '배고픔'], [35, '출출함'], [0, '괜찮음']])],
      ['갈증', pick(s.thirst, [[85, '타는 듯함'], [60, '목마름'], [0, '괜찮음']])],
      ['피로', pick(s.fatigue, [[85, '한계'], [60, '지침'], [35, '조금'], [0, '괜찮음']])],
      ...(s.cold >= 55 ? [['추위', s.cold >= 80 ? '얼어붙음' : '떨림']] : []),
      ...(bleeding(W) ? [['피', '흐름']] : []),
    ];
  }

  // 상태창. 아직 감이 오지 않은 능력치는 ? 로 보인다.
  function statusLines(me, name) {
    const lines = [
      { t: '━━━━━━━━━━━━━━━━', cls: 'stat' },
      { t: name, cls: 'stat head' },
      { t: '━━━━━━━━━━━━━━━━', cls: 'stat' },
    ];
    STAT_KEYS.forEach((k) => {
      const v = me.status.known[k] ? String(me.stats[k]) : '?';
      lines.push({ t: `${STAT_KO[k].padEnd(2, '　')}　　${v.padStart(2, ' ')}`, cls: 'stat' });
    });
    lines.push({ t: '━━━━━━━━━━━━━━━━', cls: 'stat' });
    if (me.status.points > 0) lines.push({ t: `남은 포인트: ${me.status.points}`, cls: 'stat' });
    return lines;
  }

  function unlockStatus(me) {
    me.status.unlocked = true;
    me.status.points = STAT_POINTS;
    STAT_KEYS.forEach((k) => { me.status.known[k] = me.grasp[k] >= GRASP_REVEAL; });
  }

  // 순간 이동 (디버그용)
  function teleport(S, loc) {
    const from = S.W.player.loc;
    S.W.player.loc = loc;
    Bus.emit(S, 'PLAYER_MOVED', { from, to: loc });
  }

  return {
    create, use, hurt, heal, injure, bleeding, treat, ill, sicken, sheltered,
    weight, carryLimit, give, take, wear, label, update, hpFeeling, barWords, statusLines, unlockStatus, teleport,
  };
})();

if (typeof module !== 'undefined') {
  module.exports = { STAT_KEYS, STAT_KO, STAT_POINTS, STAT_MAX, hpMax, Player };
}

</script>
<script>/* js/npc/npc.js */
// NPC 본체 (통합 명세 6절): 만들기, 위치와 이동, 다치고 죽기.
// NPC는 플레이어를 기다리지 않는다. 판단은 behavior.js, 욕구는 needs.js, 목표는 goals.js가 맡는다.
const Npc = (() => {
  const clone = (o) => JSON.parse(JSON.stringify(o));

  function create(id, def) {
    const sched = typeof def.schedule === 'string' ? SCHEDULES[def.schedule] : def.schedule;
    return {
      id,
      identity: clone(def.identity),
      physical: { health: 100, maxHealth: 100, bleed: 0, pain: 0, shock: 0, injured: false, wounds: [] },
      mental: { fear: 0, stress: 10, mood: 60, alert: 20 },
      personality: clone(def.personality),
      needs: Object.assign({ hunger: 20, thirst: 20, fatigue: 20, health: 0, safety: 0, social: 30, money: 0 }, def.needs),
      goals: (def.goals || []).map((g) => Object.assign({ since: Time.START }, g)),
      location: { loc: def.start.loc, home: def.home, path: [], nextAt: null, dest: null, transit: false, speed: 1, hidden: false },
      schedule: clone(sched),
      memories: [],
      languages: clone(def.languages || {}),
      inventory: clone(def.inventory || {}),
      money: def.money || 0,
      knowledge: { facts: {}, rumors: {}, npcs: {}, events: {} },
      magic: def.magic ? clone(def.magic) : null,
      currentAction: null,
      flags: {},
      away: !!def.start.away,
      expectedHome: def.expectedHome ? Time.at(def.expectedHome[0], def.expectedHome[1]) : null,
      alive: true,
      death: null,
      simT: Time.START,
      lastDecide: -1e9, // 저장 파일(JSON)에 무한대는 들어가지 않으므로 아주 먼 과거로 둔다
    };
  }

  const createAll = () => Object.fromEntries(Object.entries(NPC_DEFS).map(([id, d]) => [id, create(id, d)]));

  // 그 장소에 (지나가는 중이 아니라) 머물러 있는 산 NPC
  const here = (W, loc) => Object.values(W.npcs).filter((n) => n.alive && !n.location.transit && n.location.loc === loc);
  const present = (W, n) => !!(n && n.alive && !n.location.transit && n.location.loc === W.player.loc);
  const at = (W, id, loc) => { const n = W.npcs[id]; return !!(n && n.alive && !n.location.transit && n.location.loc === loc); };
  const inRegion = (n, region) => Places.regionOf(n.location.loc) === region;
  const atHome = (n) => !n.location.transit && Places.regionOf(n.location.loc) === Places.regionOf(n.location.home);

  // 걷는 속도. 다쳤거나 충격이 남아 있으면 느리다.
  function speed(n) {
    let s = 1;
    if (n.physical.health < 50) s *= 0.7;
    if (n.physical.shock > 20) s *= 0.6;
    return s;
  }

  // dest까지 걷기 시작한다. 이미 거기 있으면 false
  function startMove(S, n, dest) {
    const { W } = S;
    if (n.location.loc === dest && !n.location.transit) return false;
    const r = Places.route(n.location.loc, dest);
    if (!r || r.path.length < 2) return false;
    const leaving = present(W, n);
    n.location.path = r.path.slice(1);
    n.location.dest = dest;
    n.location.transit = true;
    n.location.hidden = false;
    n.location.speed = speed(n);
    n.location.nextAt = W.time.t + Places.distance(n.location.loc, n.location.path[0]) / n.location.speed;
    if (leaving) Narrative.feedLeave(S, n);
    return true;
  }

  // 다음 장소에 닿는다 (여러 구간을 지나야 하면 다음 구간을 잡는다)
  function arrive(S, n) {
    const { W } = S;
    const from = n.location.loc;
    const to = n.location.path.shift();
    n.location.loc = to;
    if (n.location.path.length) {
      n.location.nextAt += Places.distance(to, n.location.path[0]) / n.location.speed;
    } else {
      n.location.transit = false;
      n.location.nextAt = null;
      n.location.dest = null;
    }
    Bus.emit(S, 'NPC_MOVED', { npcId: n.id, from, to });
    if (present(W, n)) Narrative.feedArrive(S, n);
  }

  // 즉시 옮긴다 (대본 사건과 디버그용)
  function place(S, n, loc) {
    const from = n.location.loc;
    Object.assign(n.location, { loc, path: [], nextAt: null, dest: null, transit: false, hidden: false });
    Bus.emit(S, 'NPC_MOVED', { npcId: n.id, from, to: loc });
  }

  function injure(S, n, o) {
    const p = n.physical;
    if (o.health != null) p.health = Math.max(0, Math.min(p.maxHealth, o.health));
    if (o.bleed != null) p.bleed = o.bleed;
    if (o.pain != null) p.pain = o.pain;
    if (o.shock != null) p.shock = o.shock;
    p.injured = true;
    p.wounds.push({ kind: o.kind || 'wound', t: S.W.time.t, by: o.by || null });
    if (p.health <= 0) kill(S, n, o.cause || '상처', o.by);
  }

  function hurt(S, n, amount, cause, by) {
    if (!n.alive) return;
    n.physical.health = Math.max(0, n.physical.health - amount);
    n.physical.injured = true;
    n.physical.pain = Math.min(100, n.physical.pain + amount * 2);
    if (n.physical.health <= 0) kill(S, n, cause, by);
  }

  // 죽음은 되돌리지 않는다 (같은 회차 안에서는). 되감기만이 시간을 되돌린다.
  function kill(S, n, cause, by) {
    if (!n.alive) return;
    const { W } = S;
    n.alive = false;
    n.death = { cause, location: n.location.loc, timestamp: W.time.t, by: by || null };
    n.currentAction = null;
    Object.assign(n.location, { path: [], nextAt: null, dest: null, transit: false });
    Places.addTrace(W, n.location.loc, 'body', { npc: n.id, ttl: 30 * Time.DAY });
    Bus.emit(S, 'NPC_DIED', { npcId: n.id, cause, by: by || null, loc: n.location.loc });
  }

  return { create, createAll, here, present, at, inRegion, atHome, speed, startMove, arrive, place, injure, hurt, kill };
})();

if (typeof module !== 'undefined') module.exports = { Npc };

</script>
<script>/* js/npc/needs.js */
// NPC 욕구 (통합 명세 7절). 0~100, 높을수록 급하다. 욕구가 높을수록 관련 행동의 점수가 오른다.
const Needs = (() => {
  const clamp = (n, lo = 0, hi = 100) => Math.max(lo, Math.min(hi, n));

  // 몸 상태: 피를 흘리면 체력이 줄고, 충격과 통증은 시간이 지나며 가라앉는다
  function body(S, n, dt) {
    const p = n.physical;
    if (p.bleed > 0) {
      p.health = Math.max(0, p.health - p.bleed * dt);
      if (p.health <= 0) { Npc.kill(S, n, '피를 너무 많이 흘렸다', null); return; }
    }
    // 충격은 천천히 가라앉는다 (쉬면 조금 더 빨리). 다친 뒤 대여섯 시간은 멀리 걷지 못한다.
    p.shock = Math.max(0, p.shock - dt * 0.12);
    const act = n.currentAction && n.currentAction.type;
    if ((act === 'rest' || act === 'sleep') && p.bleed === 0) p.health = Math.min(p.maxHealth, p.health + dt * 0.02);
    p.pain = clamp(p.injured ? 40 + (60 - p.health) : p.pain - dt * 0.1);
    if (p.health >= p.maxHealth * 0.9 && p.bleed === 0) p.injured = false;
  }

  function update(S, n, dt) {
    const x = n.needs, p = n.physical;
    const act = n.currentAction && n.currentAction.type;
    x.hunger = clamp(x.hunger + dt * 0.02);
    x.thirst = clamp(x.thirst + dt * (p.bleed > 0 ? 0.06 : 0.035));
    if (act !== 'sleep' && act !== 'rest') x.fatigue = clamp(x.fatigue + dt * (act === 'work' || n.location.transit ? 0.05 : 0.025));
    x.social = clamp(x.social + dt * 0.01 * (n.personality.sociability / 50));
    x.health = clamp((1 - p.health / p.maxHealth) * 100 + p.pain * 0.3 + (p.bleed > 0 ? 20 : 0));
    x.money = clamp(60 - n.money * 0.5);
    // 두려움은 위험이 없으면 천천히 가라앉는다 (용감할수록 빨리)
    n.mental.fear = clamp(n.mental.fear - dt * 0.02 * (0.5 + n.personality.bravery / 100));
    x.safety = clamp(n.mental.fear);
    n.mental.stress = clamp(n.mental.stress + dt * 0.01 * ((x.hunger + x.thirst + x.health) / 150 - 0.5));
  }

  // 가장 급한 욕구 순으로
  const urgent = (n) => Object.entries(n.needs).sort((a, b) => b[1] - a[1]);

  // 도움을 받으면 몸과 마음이 조금 놓인다 (통합 명세 36절: 물을 주면 갈증이 줄어든다)
  const RELIEF = { water: { thirst: -100, shock: 30 }, herb: { shock: 15 }, treat: { shock: 15 }, heal: { shock: 15 }, gift: { shock: 5 } };
  Bus.on('NPC_HELPED', (S, e) => {
    const n = S.W.npcs[e.npcId];
    const r = RELIEF[e.kind];
    if (!n || !n.alive || !r) return;
    if (r.thirst) n.needs.thirst = clamp(n.needs.thirst + r.thirst);
    if (r.shock) n.physical.shock = Math.max(0, n.physical.shock - r.shock);
  });

  return { RELIEF, body, update, urgent };
})();

if (typeof module !== 'undefined') module.exports = { Needs };

</script>
<script>/* js/npc/goals.js */
// NPC 목표 (통합 명세 8절). 상황이 바뀌면 우선순위도 바뀐다.
// { id, type, priority, target?, since, plan? }
const Goals = (() => {
  const clamp = (n, lo = 0, hi = 100) => Math.max(lo, Math.min(hi, n));
  const get = (n, id) => n.goals.find((g) => g.id === id) || null;

  function add(n, goal, t) {
    const old = get(n, goal.id);
    if (old) return Object.assign(old, goal);
    const g = Object.assign({ since: t }, goal);
    n.goals.push(g);
    return g;
  }
  function remove(n, id) { n.goals = n.goals.filter((g) => g.id !== id); }

  // 우선순위를 다시 매긴다
  function update(S, n) {
    const { W } = S;
    const t = W.time.t;
    for (const g of n.goals) {
      if (g.id === 'survive') g.priority = clamp(40 + n.needs.health * 0.5 + n.needs.safety * 0.3);
      else if (g.id === 'return_home') {
        // 집 밖에 오래 있을수록 돌아가고 싶어진다. 다쳤으면 더. 떠날 날(startAt [일, 시])이 정해져 있으면 그때부터.
        const from = Array.isArray(g.startAt) ? Time.at(g.startAt[0], g.startAt[1]) : (g.startAt || g.since);
        g.priority = Npc.atHome(n) || t < from ? 0 : clamp(45 + (t - Math.max(g.since, from)) / 60 * 4 + (n.physical.injured ? 20 : 0));
      } else if (g.id === 'earn_money') g.priority = clamp(35 + n.needs.money * 0.5);
      else if (g.id === 'guard_village') g.priority = clamp(50 + (W.regions.village ? W.regions.village.threat * 0.3 : 0));
      // 스승(돌볼 사람)이 아프거나 다칠수록 돌보고 싶어진다. 세상을 떠나면 목표도 끝난다
      else if (g.id === 'care_for_teacher') { const t = W.npcs[g.target]; g.priority = t && t.alive ? clamp(50 + t.needs.health * 0.5) : 0; }
      // 수색은 정해 둔 새벽부터, 해가 있는 동안만
      else if (g.id === 'search') g.priority = t >= g.startAt && !Time.dark(t) ? g.base : 0;
      else if (g.id === 'trade_trip') {
        // 행상은 사흘에 한 번쯤 마을로 떠난다
        const last = n.flags.lastTrip == null ? Time.START - 2 * Time.DAY : n.flags.lastTrip;
        g.priority = n.flags.tripDone ? 0 : clamp(20 + (t - last) / Time.DAY * 20);
      }
    }
    // 집에 돌아왔으면 귀가 목표는 끝
    if (Npc.atHome(n) && get(n, 'return_home')) { remove(n, 'return_home'); n.away = false; }
  }

  const top = (n) => n.goals.reduce((a, g) => (!a || g.priority > a.priority ? g : a), null);

  return { get, add, remove, update, top };
})();

if (typeof module !== 'undefined') module.exports = { Goals };

</script>
<script>/* js/npc/schedule.js */
// NPC 일정. 지금 시각에 무엇을, 어디서 하는가. 'home'은 그 NPC의 집이다.
const Schedule = (() => {
  function current(n, t) {
    const h = Time.hour(t);
    const e = n.schedule.find(([a, b]) => h >= a && h < b);
    if (!e) return null;
    return { act: e[2], at: e[3] === 'home' ? n.location.home : e[3] };
  }
  return { current };
})();

if (typeof module !== 'undefined') module.exports = { Schedule };

</script>
<script>/* js/npc/memory.js */
// NPC 기억 (통합 명세 10절). 강렬한 기억은 오래 남고, 약한 기억은 흐려진다.
// { id, type, subject, event, emotionalImpact(-100~100), importance(0~100), timestamp, detail }
const Memory = (() => {
  // 사건 종류별 기본 감정과 중요도
  const KIND = {
    met: [0, 30], helped_by: [40, 60], gift: [25, 45], healed_by: [55, 70], threatened_by: [-50, 70],
    attacked_by: [-80, 90], betrayed_by: [-90, 95], lied_to: [-40, 55], paid_by: [20, 35], promise_kept: [35, 50],
    shared_danger: [30, 60], witnessed_death: [-70, 90], lost: [-85, 95], heard_name: [10, 40], taught: [15, 35],
    stolen_from: [-50, 70], strange: [0, 35],
    rescued: [30, 75], worked_with: [15, 35], sheltered: [20, 45], travelled_with: [20, 45],
  };
  function add(S, n, o) {
    const [impact, importance] = KIND[o.type] || [0, 30];
    const m = {
      id: `m-${++S.W.seq}`,
      type: o.type, subject: o.subject || null, event: o.event || null,
      emotionalImpact: o.impact != null ? o.impact : impact,
      importance: o.importance != null ? o.importance : importance,
      timestamp: S.W.time.t, detail: o.detail || null,
    };
    n.memories.push(m);
    return m;
  }

  const about = (n, subject, type) => n.memories.filter((m) => m.subject === subject && (!type || m.type === type));
  const has = (n, subject, type) => n.memories.some((m) => m.subject === subject && (!type || m.type === type));
  // 그 사람에 대한 느낌의 합 (중요한 기억일수록 크게)
  const feeling = (n, subject) => about(n, subject).reduce((s, m) => s + m.emotionalImpact * (m.importance / 100), 0);

  // 하루마다 흐려진다. 감정이 강했던 기억은 거의 흐려지지 않는다.
  function decay(S) {
    Object.values(S.W.npcs).forEach((n) => {
      n.memories.forEach((m) => { m.importance -= Math.abs(m.emotionalImpact) >= 60 ? 1 : 6; });
      n.memories = n.memories.filter((m) => m.importance > 0);
    });
  }

  // ---------- 사건이 기억이 된다 ----------
  Bus.on('NPC_HELPED', (S, e) => {
    const n = S.W.npcs[e.npcId];
    if (n && n.alive) add(S, n, { type: e.kind === 'heal' ? 'healed_by' : 'helped_by', subject: e.helperId, detail: e.kind });
  });
  Bus.on('NPC_THREATENED', (S, e) => {
    const n = S.W.npcs[e.npcId];
    if (n && n.alive) add(S, n, { type: 'threatened_by', subject: e.by });
  });
  Bus.on('NPC_ATTACKED', (S, e) => {
    const n = S.W.npcs[e.npcId];
    if (n && n.alive) add(S, n, { type: 'attacked_by', subject: e.by, detail: e.weapon || null });
  });
  Bus.on('NPC_MET_PLAYER', (S, e) => {
    const n = S.W.npcs[e.npcId];
    if (n && !has(n, 'player', 'met')) add(S, n, { type: 'met', subject: 'player', detail: e.loc });
  });
  // 누군가 죽는 것을 본 사람은 그것을 기억한다
  Bus.on('NPC_DIED', (S, e) => {
    Npc.here(S.W, e.loc).forEach((w) => add(S, w, { type: 'witnessed_death', subject: e.npcId, detail: e.cause }));
  });

  return { KIND, add, about, has, feeling, decay };
})();

if (typeof module !== 'undefined') module.exports = { Memory };

</script>
<script>/* js/npc/behavior.js */
// NPC 행동 판단 (통합 명세 6~9절). 생성형 AI는 쓰지 않는다. 규칙과 점수로만 움직인다.
// 무작위가 아니라 욕구·목표·성격·일정·관계·위험을 점수로 따져 고른다.
// 행동마다: avail(n, c) 할 수 있는가 / score(n, c) 얼마나 하고 싶은가 / start(S, n, c) 시작 → { min, data }
//          tick(S, n, c, dt) 하는 동안 / end(S, n, c) 끝날 때
// c = 지금 상황 (context): 장소, 곁에 있는 사람과 짐승, 플레이어, 위협, 일정, 어둠
const Behavior = (() => {
  const REPLAN = 30; // 긴 행동을 하는 중에도 30분마다 다시 판단한다
  const clamp = (n, lo = 0, hi = 100) => Math.max(lo, Math.min(hi, n));

  // ---------- 도구 ----------
  const foodOf = (n) => Object.keys(n.inventory).find((k) => n.inventory[k] > 0 && ITEM_DEFS[k]
    && ITEM_DEFS[k].category === 'food' && !ITEM_DEFS[k].properties.poison);
  const medicineOf = (n) => Object.keys(n.inventory).find((k) => n.inventory[k] > 0 && ITEM_DEFS[k] && ITEM_DEFS[k].properties.stopsBleeding);
  const weaponOf = (n) => Object.keys(n.inventory).filter((k) => n.inventory[k] > 0 && ITEM_DEFS[k] && ITEM_DEFS[k].properties.weapon)
    .sort((a, b) => ITEM_DEFS[b].properties.weapon.dmg - ITEM_DEFS[a].properties.weapon.dmg)[0] || null;
  function useItem(n, k) { n.inventory[k]--; if (n.inventory[k] <= 0) delete n.inventory[k]; }
  const HERB_JOBS = ['herbalist', 'herbalist_apprentice']; // 숲에서 약초를 캐는 사람
  const canTravel = (n) => n.physical.shock <= 20 && n.physical.health >= 15 && n.needs.fatigue < 95;
  const hasWater = (n, loc) => Places.has(loc, 'water') || (n.inventory.waterskin > 0);

  function context(S, n, now) {
    const { W } = S;
    const loc = n.location.loc;
    const transit = n.location.transit;
    const others = transit ? [] : Npc.here(W, loc).filter((o) => o !== n);
    const playerHere = !transit && W.player.loc === loc && W.player.hp > 0 && !W.worldFlags.end;
    const creatures = transit ? [] : Creatures.at(W, loc);
    const relP = Rel.peek(W, n.id, 'player');
    // 위협: 곁의 짐승, 곁에 있는 두려운 사람
    let threat = creatures.reduce((m, x) => Math.max(m, Creatures.danger(x)), 0);
    if (playerHere && relP) threat = Math.max(threat, relP.hostility >= 50 ? 80 : relP.fear * 0.8);
    others.forEach((o) => { const r = Rel.peek(W, n.id, o.id); if (r && r.hostility >= 60) threat = Math.max(threat, 60); });
    return {
      S, W, now, loc, transit, others, playerHere, creatures, relP, threat,
      sched: Schedule.current(n, now), dark: Time.dark(now), band: Time.band(now),
      region: Places.regionOf(loc), home: n.location.home,
    };
  }

  // 누군가 도움이 필요한가 (다쳐서 피를 흘리는 사람)
  function needyHere(n, c) {
    const npc = c.others.find((o) => o.physical.bleed > 0 && !(Rel.peek(c.W, n.id, o.id) || {}).hostility);
    if (npc) return { id: npc.id, npc };
    if (c.playerHere && Player.bleeding(c.W) && c.relP && c.relP.trust >= 40 && c.relP.hostility < 20) return { id: 'player' };
    return null;
  }

  // 먼저 떠난 플레이어를 얼마나 기다려 줄까 (믿는 만큼, 참을성만큼)
  const waitLimit = (n) => 60 + n.personality.patience * 1.5;

  // ---------- 행동 ----------
  const A = {
    wait: {
      avail: () => true,
      score: (n) => 8 + n.personality.patience * 0.1,
      start: () => ({ min: 15 }),
    },
    rest: {
      avail: () => true,
      score: (n) => n.needs.fatigue * 0.5 + n.needs.health * 0.4 + (n.physical.shock > 20 ? 30 : 0),
      start: (S, n, c) => ({ min: 30, data: { hidden: Places.has(c.loc, 'shelter') || Places.has(c.loc, 'roots') } }),
      tick: (S, n, c, d) => {
        n.needs.fatigue = clamp(n.needs.fatigue - 0.12 * d);
        n.physical.shock = Math.max(0, n.physical.shock - 0.1 * d);
      },
    },
    sleep: {
      // 행상은 길 위에서도 아무 데나 몸을 누인다
      avail: (n, c) => c.threat < 30 && (c.loc === c.home || Places.has(c.loc, 'shelter') || n.identity.occupation === 'peddler'),
      score: (n, c) => n.needs.fatigue * 0.8 + (c.dark ? 30 : -30) + (c.sched && c.sched.act === 'sleep' ? 40 : 0) - c.threat,
      start: () => ({ min: 60 }),
      tick: (S, n, c, d) => { n.needs.fatigue = clamp(n.needs.fatigue - 0.3 * d); n.mental.stress = clamp(n.mental.stress - 0.05 * d); },
    },
    eat: {
      avail: (n, c) => !!foodOf(n) || (Economy.open(c.W, c.loc) && n.money >= Economy.priceOf(c.W, c.loc, 'bread')),
      score: (n, c) => n.needs.hunger * 1.1 - 20 + (c.sched && c.sched.act === 'eat' ? 30 : 0),
      start: (S, n, c) => {
        let k = foodOf(n);
        if (k) useItem(n, k);
        else if (Economy.buy(S, n, c.loc, 'bread', 1)) k = 'bread'; // 사서 그 자리에서 먹는다
        if (k) n.needs.hunger = clamp(n.needs.hunger + (ITEM_DEFS[k].effects.hunger || -30));
        return { min: 20 };
      },
    },
    drink: {
      avail: (n, c) => hasWater(n, c.loc),
      score: (n) => n.needs.thirst * 1.2 - 15,
      start: (S, n, c) => { n.needs.thirst = Places.has(c.loc, 'water') ? 0 : clamp(n.needs.thirst - 60); return { min: 5 }; },
    },
    work: {
      avail: (n, c) => !!(c.sched && c.sched.act === 'work' && c.loc === c.sched.at),
      score: (n, c) => 55 + n.needs.money * 0.2 - n.needs.fatigue * 0.3 - c.threat * 0.5,
      start: () => ({ min: 60 }),
      tick: (S, n, c, d) => {
        const occ = n.identity.occupation;
        if (occ === 'guard') { n.money += d / 60 * 1.5; c.W.regions.village.alert = Math.max(c.W.regions.village.alert, 30); }
        else if (occ === 'herbalist') {
          // 약초를 달여 천 조각(약)을 만든다
          n.flags.brew = (n.flags.brew || 0) + d;
          if (n.flags.brew >= 120 && n.inventory.herb > 0) { n.flags.brew = 0; useItem(n, 'herb'); n.inventory.bandage = (n.inventory.bandage || 0) + 1; }
        } else if (occ === 'hunter') n.money += d / 60;
      },
    },
    gather: {
      avail: (n, c) => !c.dark && ((c.sched && c.sched.act === 'gather' && c.loc === c.sched.at) || (c.region === 'forest' && HERB_JOBS.includes(n.identity.occupation))),
      score: (n, c) => 50 - c.threat * 0.6 - c.W.regions[c.region].threat * 0.3 + (c.sched && c.sched.act === 'gather' ? 15 : 0),
      start: () => ({ min: 60 }),
      tick: (S, n, c, d) => {
        // 위험하다는 소문이 돌면 멀리까지 나가지 않아 덜 캔다
        const p = (d / 60) * 0.6 * (1 - c.W.regions.village.threat / 120);
        if (Rng.chance(c.W, p)) n.inventory.herb = (n.inventory.herb || 0) + 1;
      },
    },
    hunt: {
      avail: (n, c) => n.identity.occupation === 'hunter' && c.region === 'forest' && !c.dark && !!weaponOf(n) && !n.physical.injured && n.away,
      score: (n, c) => 45 + n.needs.hunger * 0.2 + n.personality.bravery * 0.1 - c.threat * 0.5,
      start: () => ({ min: 60 }),
      tick: (S, n, c, d) => { if (Rng.chance(c.W, d / 60 * 0.2)) n.inventory.dried_meat = (n.inventory.dried_meat || 0) + 1; },
    },
    trade: {
      avail: (n, c) => Economy.open(c.W, c.loc) && Economy.merchantAt(c.W, c.loc) !== n.id && Economy.hasBusiness(c.W, n, c.loc),
      score: (n, c) => 25 + n.personality.greed * 0.2 + n.needs.money * 0.3
        + ((Goals.get(n, 'trade_trip') || {}).target === c.loc && !n.flags.tripDone ? 60 : 0),
      start: (S, n, c) => { Economy.trade(S, n, c.loc); return { min: 30 }; },
    },
    talk: {
      avail: (n, c) => c.others.some((o) => !(o.currentAction && o.currentAction.type === 'sleep')),
      score: (n, c) => n.needs.social * 0.7 + n.personality.sociability * 0.25 - c.threat
        + (c.others.some((o) => Rumor.hasNews(c.W, n, o)) ? 25 : 0) + (c.sched && c.sched.act === 'social' ? 25 : 0),
      start: (S, n, c) => {
        const awake = c.others.filter((o) => !(o.currentAction && o.currentAction.type === 'sleep'));
        // 새 소식이 있는 상대, 그다음 가까운 상대에게 말을 건다
        awake.sort((a, b) => (Rumor.hasNews(c.W, n, b) - Rumor.hasNews(c.W, n, a))
          || ((Rel.peek(c.W, n.id, b.id) || {}).familiarity || 0) - ((Rel.peek(c.W, n.id, a.id) || {}).familiarity || 0));
        return { min: 20, data: { with: awake[0].id } };
      },
      end: (S, n, c) => {
        const o = S.W.npcs[n.currentAction.data.with];
        if (!o || !o.alive || o.location.loc !== n.location.loc || o.location.transit) return;
        n.needs.social = clamp(n.needs.social - 35);
        o.needs.social = clamp(o.needs.social - 20);
        Rel.change(S, n.id, o.id, { familiarity: 2 }, 'talk', true);
        Rel.change(S, o.id, n.id, { familiarity: 2 }, 'talk', true);
        const told = Rumor.exchange(S, n, o);
        if (Rng.chance(S.W, 0.5)) Rumor.exchange(S, o, n);
        Narrative.feedTalk(S, n, o, told);
      },
    },
    explore: {
      avail: (n, c) => n.personality.curiosity >= 60 && !c.dark && canTravel(n) && !n.physical.injured && c.region === 'forest',
      score: (n, c) => n.personality.curiosity * 0.3 - n.needs.fatigue * 0.3 - c.threat - 10,
      start: (S, n, c) => {
        const next = Places.neighbors(c.loc).filter((x) => Places.regionOf(x) === c.region);
        if (next.length) Npc.startMove(S, n, Rng.pick(S.W, next));
        return { min: 20 };
      },
    },
    search: {
      avail: (n) => !!Goals.get(n, 'search') && canTravel(n),
      score: (n, c) => (Goals.get(n, 'search') || {}).priority - (c.dark ? 60 : 0),
      start: (S, n, c) => WorldEvents.searchStep(S, n, c),
    },
    fight: {
      avail: (n, c) => c.creatures.length > 0 && !!weaponOf(n) && n.physical.health > 30,
      score: (n, c) => c.threat * n.personality.bravery / 100 + (c.others.length ? 20 : 0) - n.mental.fear * 0.3 - n.needs.health * 0.3,
      start: (S, n, c) => { Combat.npcVsCreature(S, n, c.creatures[0], weaponOf(n)); return { min: 5 }; },
    },
    flee: {
      avail: (n, c) => c.threat >= 20 && !c.transit,
      score: (n, c) => c.threat * (100 - n.personality.bravery) / 100 + n.mental.fear * 0.4 + n.needs.health * 0.2
        + (c.relP && c.playerHere && c.relP.hostility >= 50 ? 60 : 0),
      start: (S, n, c) => {
        // 위협이 없는 이웃 장소로. 숨을 곳이 있으면 그쪽을 고른다
        const opts = Places.neighbors(c.loc).filter((x) => x !== S.W.player.loc && !Creatures.at(S.W, x).length);
        opts.sort((a, b) => (Places.has(b, 'shelter') - Places.has(a, 'shelter')) || (Places.distance(c.loc, a) - Places.distance(c.loc, b)));
        if (opts.length) Npc.startMove(S, n, opts[0]);
        n.mental.fear = clamp(n.mental.fear + 10);
        return { min: 10 };
      },
    },
    hide: {
      avail: (n, c) => c.threat >= 20 && (Places.has(c.loc, 'shelter') || Places.has(c.loc, 'dense') || Places.has(c.loc, 'roots')),
      score: (n, c) => c.threat * 0.5 + n.mental.fear * 0.3 + (canTravel(n) ? 0 : 30),
      start: () => ({ min: 30, data: { hidden: true } }),
    },
    heal: {
      avail: (n) => n.physical.injured && (!!medicineOf(n) || Magic.canCast(n, 'life', 15)),
      score: (n, c) => {
        const p = n.physical;
        if (medicineOf(n)) return n.needs.health * 0.9 + (p.bleed > 0 ? 20 : 0);
        // 마력으로 고치려면 집중해야 한다: 곁에 믿을 만한 사람이 있거나, 혼자서 마음이 가라앉았거나, 목숨이 걸렸을 때
        if (p.health < 20) return 95;
        const calm = c.threat < 20 && (c.playerHere ? (c.relP && c.relP.trust >= 25) : n.mental.fear < 40);
        return calm ? n.needs.health * 0.6 + 20 : -50;
      },
      start: (S, n, c) => {
        const k = medicineOf(n);
        if (k) { useItem(n, k); n.physical.bleed = 0; return { min: 20 }; }
        Magic.cast(S, n, 'life', { cost: 15, target: n.id });
        if (c.playerHere) c.W.worldFlags.pending.push('magic:' + n.id);
        else n.flags.healedAlone = c.now;
        return { min: 10 };
      },
    },
    pray: {
      avail: (n) => !!n.identity.devout,
      score: (n, c) => 15 + n.mental.stress * 0.3 + (c.sched && c.sched.act === 'pray' ? 45 : 0),
      start: () => ({ min: 30 }),
      tick: (S, n, c, d) => { n.mental.stress = clamp(n.mental.stress - 0.3 * d); n.mental.mood = clamp(n.mental.mood + 0.1 * d); },
    },
    study: {
      avail: (n, c) => n.identity.education === 'literate' && c.loc === c.home && !c.dark,
      score: (n, c) => n.personality.curiosity * 0.25 + (c.sched && c.sched.act === 'rest' ? 15 : 0) - n.needs.fatigue * 0.2,
      start: () => ({ min: 60 }),
      tick: (S, n, c, d) => {
        const l = n.languages.common_aver;
        if (l) l.reading = Math.min(100, l.reading + d / 600);
      },
    },
    teach: {
      avail: (n, c) => c.playerHere && c.relP && c.relP.trust >= 45 && n.mental.fear < 50 && c.threat < 20
        && (n.flags.taughtAt == null || c.now - n.flags.taughtAt >= 60) && Lang.canTeach(S_(c), n),
      score: (n, c) => n.personality.kindness * 0.3 + n.personality.patience * 0.2 + c.relP.trust * 0.3,
      start: (S, n, c) => { n.flags.taughtAt = c.now; Lang.teach(S, n); return { min: 10 }; },
    },
    steal: {
      avail: (n, c) => n.personality.greed >= 60 && n.personality.honesty <= 40
        && (n.needs.money >= 50 || n.needs.hunger >= 70) && !!Economy.unattended(c.W, c.loc, n),
      score: (n, c) => (n.personality.greed - n.personality.honesty) * 0.5 + n.needs.money * 0.3 - c.others.length * 40 - (c.playerHere ? 30 : 0),
      start: (S, n, c) => { Economy.steal(S, n, c.loc); return { min: 5 }; },
    },
    help: {
