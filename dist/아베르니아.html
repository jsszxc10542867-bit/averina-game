    if (!n.alive) return;
    Memory.add(S, n, { type: 'attacked_by', subject: c.id });
    Places.addTrace(W, n.location.loc, 'blood');
    WorldEvents.record(S, 'beast_attack', { loc: n.location.loc, actors: [c.id, n.id], data: { subject: c.id, target: n.id } });
    c.hunger = Math.max(0, c.hunger - 40);
    Behavior.interrupt(n);
  }

  return { mods, chance, weaponOf, scare, playerVsNpc, npcVsCreature, creatureVsNpc };
})();

if (typeof module !== 'undefined') module.exports = { Combat };

</script>
<script>/* js/play/magic.js */
// 마법 (통합 명세 25절, 세계관 10·11절). 플레이어는 처음에 마법이 있다는 것조차 모른다. 목록을 보여 주지 않는다.
// 쓸 수 있는가는 마력(mana)·이해도·숙련도·재능·지식·훈련으로 정해진다.
// NPC: n.magic = { mana, maxMana, schools: { life: { understanding, proficiency, talent } } }
// 플레이어: 이해(지식) = P.magic.understanding, 마력과 재능(몸) = W.player.magic
const Magic = (() => {
  const SCHOOLS = ['fire', 'water', 'wind', 'earth', 'light', 'dark', 'space', 'time', 'mind', 'life', 'summoning', 'gravity', 'creation'];
  // 기본 속성은 1, 고위 마법은 2~3 (세계관 10절)
  const TIER = { fire: 1, water: 1, wind: 1, earth: 1, light: 1, dark: 1, mind: 2, life: 2, summoning: 2, space: 3, time: 3, gravity: 3, creation: 3 };

  function canCast(n, school, cost) {
    const m = n && n.magic;
    if (!m || m.mana < cost) return false;
    const s = m.schools && m.schools[school];
    if (!s) return false;
    const tier = TIER[school];
    return s.understanding >= 20 * tier && s.proficiency >= 10 * tier && s.talent >= 15 * tier;
  }

  // life: 상처가 아문다 (체력 +15, 출혈 절반)
  function cast(S, n, school, o) {
    const { W } = S;
    if (!canCast(n, school, o.cost)) return false;
    n.magic.mana -= o.cost;
    n.magic.schools[school].proficiency = Math.min(100, n.magic.schools[school].proficiency + 1);
    if (school === 'life') {
      const t = o.target === 'player' ? null : W.npcs[o.target];
      if (t) { t.physical.health = Math.min(t.physical.maxHealth, t.physical.health + 15); t.physical.bleed /= 2; }
      else if (o.target === 'player') Player.heal(W.player, 3);
    }
    const ev = WorldEvents.record(S, 'magic', { loc: n.location.loc, actors: [n.id], data: { subject: n.id, school, target: o.target } });
    // 곁에서 본 플레이어는 그 마법을 조금 이해하게 된다 (지식)
    if (ev.witnesses.includes('player')) observe(S, school, 5);
    return true;
  }

  function observe(S, school, n) {
    const u = S.P.magic.understanding;
    u[school] = Math.min(100, (u[school] || 0) + n);
  }

  // 한 시간마다 마력이 조금 돌아온다
  function regen(S) {
    Object.values(S.W.npcs).forEach((n) => { if (n.magic && n.alive) n.magic.mana = Math.min(n.magic.maxMana, n.magic.mana + 1); });
    const pm = S.W.player.magic;
    pm.mana = Math.min(pm.maxMana, pm.mana + 0.5);
  }

  // 플레이어가 그 계열을 쓸 수 있는 몸과 앎을 갖췄는가 (아직 쓰는 장면은 없다)
  function playerCanCast(S, school, cost) {
    const pm = S.W.player.magic;
    const tier = TIER[school];
    const u = S.P.magic.understanding[school] || 0;
    const prof = (S.W.player.magic.proficiency || {})[school] || 0;
    return pm.mana >= cost && u >= 20 * tier && prof >= 10 * tier && (pm.talent[school] || 0) >= 15 * tier;
  }

  return { SCHOOLS, TIER, canCast, cast, observe, regen, playerCanCast };
})();

if (typeof module !== 'undefined') module.exports = { Magic };

</script>
<script>/* js/play/narrative.js */
// 서술 (통합 명세 12·35절). 시스템의 수치를 문장으로 바꾼다. 숫자는 절대 보여 주지 않는다.
// feed: 플레이어 곁에서 벌어진 일. 행동이 끝난 뒤 화면에 덧붙는다 (W.worldFlags.feed).
const Narrative = (() => {
  const J = (w, t) => w + Text.josa(w, t);
  const feed = (S, line) => { if (!S.W.worldFlags.end) S.W.worldFlags.feed.push(line); };

  // 플레이어가 그 사람을 부르는 말. 이름을 알면 이름, 모르면 겉모습. 리아는 장면과 같이 '그녀'로 부른다.
  function who(S, n, first) {
    if (n.id === 'lia') return '그녀';
    const known = S.P.found.npcs[n.id];
    if (known && known.name) return known.name;
    const d = n.identity.desc;
    return first ? d : d.split(' ').pop();
  }

  // 아직 마주하지 않은 사람은 만남 장면이 직접 소개한다 (먼저 적으면 등장을 망친다)
  const met = (n) => Memory.has(n, 'player', 'met');

  function feedArrive(S, n) {
    const { W } = S;
    if (!met(n)) return;
    const seen = !!S.P.found.npcs[n.id];
    if (Time.dark(W.time.t)) feed(S, '어둠 속에서 발소리가 다가온다.');
    else if (Places.regionOf(n.location.loc) === 'forest') feed(S, `${J(who(S, n, !seen), '이가')} 나무 사이에서 모습을 드러낸다.`);
    else feed(S, `${J(who(S, n, !seen), '이가')} 저쪽에서 걸어온다.`);
  }

  function feedLeave(S, n) {
    if (!met(n)) return;
    feed(S, Time.dark(S.W.time.t) ? '발소리가 멀어진다.' : `${J(who(S, n), '이가')} 자리를 뜬다.`);
  }

  // NPC가 스스로 하는 일 가운데 눈에 띄는 것만 (같은 일을 한 시간 안에 되풀이해서 적지 않는다)
  const ACT_LINE = {
    eat: (w) => `${J(w, '이가')} 품에서 무언가를 꺼내 씹는다.`,
    drink: (w) => `${J(w, '이가')} 몸을 숙여 물을 마신다.`,
    sleep: (w) => `${J(w, '이가')} 눈을 감는다. 숨소리가 길어진다.`,
    pray: (w) => `${J(w, '이가')} 무릎을 꿇고 무언가를 낮게 중얼거린다.`,
    gather: (w) => `${J(w, '이가')} 허리를 굽혀 풀을 뜯는다.`,
    hide: (w) => `${J(w, '이가')} 몸을 한껏 낮춘다.`,
    flee: (w) => `${J(w, '이가')} 뒷걸음질 치더니, 몸을 돌려 달아난다.`,
    fight: (w) => `${J(w, '이가')} 무기를 고쳐 쥔다.`,
  };
  function feedAction(S, n, type) {
    const { W } = S;
    if (type === 'search') { searchCall(S, n); return; } // 부르는 소리는 보이지 않아도 들린다
    const f = ACT_LINE[type];
    if (!f || !met(n)) return;
    const last = n.flags.narr;
    if (last && last.type === type && W.time.t - last.t < 60) return;
    n.flags.narr = { type, t: W.time.t };
    feed(S, f(who(S, n)));
  }

  // 수색하는 사람은 이름을 부른다
  function searchCall(S, n) {
    const g = Goals.get(n, 'search');
    const tgt = g && S.W.npcs[g.target];
    if (!tgt) return;
    const last = n.flags.narr;
    if (last && last.type === 'search' && S.W.time.t - last.t < 60) return;
    n.flags.narr = { type: 'search', t: S.W.time.t };
    const r = Dialogue.process(S, { speakerId: n.id, listenerId: 'player', dialogueId: 'call_name', vars: { target: tgt.identity.name } });
    feed(S, Lang.line(r, n.id));
    if (r.tone && !r.fullyUnderstood) feed(S, r.tone);
  }

  // 두 사람이 이야기를 나눈다. 곁에 있으면 들린다 (알아듣는 만큼만).
  function feedTalk(S, a, b, told) {
    if (!Npc.present(S.W, a)) return;
    feed(S, `${J(who(S, a), '과와')} ${J(who(S, b), '이가')} 낮은 목소리로 이야기를 나눈다.`);
    if (!told) return;
    const text = Rumor.speech(S.W, told.rumor, told.level);
    if (!text) return;
    const r = Dialogue.process(S, { speakerId: a.id, listenerId: 'player', text });
    feed(S, Lang.line(r, a.id));
    Knowledge.rumor(S, told.rumor.id, told.level);
    // 절반 넘게 알아들었다면 그 이야기는 단서가 된다
    if (r.understanding >= 0.5) Clues.onRumor(S, told.rumor.type);
    Incidents.notice(S, 'rumor', { type: told.rumor.type, understanding: r.understanding });
  }

  function feedHelpPlayer(S, n, item) {
    feed(S, `${J(who(S, n), '이가')} ${item ? '천 조각을 꺼내' : '손을 얹어'} 내 상처를 감싸 준다.`);
  }

  // 관계가 행동으로 드러난다 (12절). 가장 강한 감정 두 가지만.
  function describe(S, n) {
    const r = Rel.peek(S.W, n.id, 'player');
    if (!r) return [];
    const w = who(S, n);
    const armed = Object.keys(n.inventory).some((k) => ITEM_DEFS[k] && ITEM_DEFS[k].category === 'weapon');
    const pool = [
      [r.hostility, 50, `${w}의 눈에 적의가 서려 있다.`],
      [r.fear, 50, `${J(w, '은는')} 거리를 둔 채, 언제든 달아날 수 있게 몸을 비스듬히 하고 있다.`],
      [r.suspicion, 60, armed ? `${J(w, '은는')} 나에게서 눈을 떼지 않는다. 무기를 쥔 손에 힘이 들어가 있다.` : `${J(w, '은는')} 나에게서 눈을 떼지 않는다.`],
      [r.trust, 60, `${J(w, '은는')} 경계를 풀고 가까이 와 있다.`],
      [r.trust, 40, `${J(w, '이가')} 먼저 눈을 맞춘다.`],
      [r.gratitude, 20, `나를 보는 ${w}의 눈이 조금 부드럽다.`],
    ].filter(([v, th]) => v >= th).sort((x, y) => (y[0] - y[1]) - (x[0] - x[1]));
    const out = [];
    const used = new Set();
    for (const [, , line] of pool) { if (!used.has(line.slice(0, 6))) { out.push(line); used.add(line.slice(0, 6)); } if (out.length >= 2) break; }
    return out;
  }

  // 플레이어가 보지 못한 사이에 남은 흔적 (장면 글이 이미 다루는 흔적은 quiet)
  const TRACE_LINE = {
    footprints: '여러 사람의 발자국이 어지럽게 찍혀 있다. 내 것이 아니다.',
    blood: '풀잎에 검붉은 얼룩이 튀어 있다.',
    struggle: '풀이 넓게 짓이겨져 있다. 무언가 뒤엉켜 싸운 자리다.',
    body: '풀숲 사이에 사람의 형체가 쓰러져 있다. ……움직이지 않는다.',
  };
  function traceLines(S, loc) {
    const seen = new Set();
    const out = [];
    Places.traces(S.W, loc).forEach((x) => {
      if (x.quiet || seen.has(x.kind) || !TRACE_LINE[x.kind]) return;
      seen.add(x.kind);
      out.push(TRACE_LINE[x.kind]);
    });
    return out;
  }

  return { who, feedArrive, feedLeave, feedAction, feedTalk, feedHelpPlayer, describe, traceLines };
})();

if (typeof module !== 'undefined') module.exports = { Narrative };

</script>
<script>/* js/play/intent.js */
// 자연어 행동 (통합 명세 34절). 생성형 AI 없이 규칙으로 해석한다.
// 입력 → 의도(동사·대상·방식) → 지금 고를 수 있는 선택지 중 가장 가까운 것.
// 선택지의 문구도 같은 규칙으로 해석하므로, 장면을 쓰는 사람이 따로 키워드를 달지 않아도 된다.
const Intent = (() => {
  // [의도, 어간...] 긴 어간을 먼저 본다
  const VERBS = [
    ['repeat_word', '따라 말', '다시 말', '되뇌', '되뇐', '되풀이', '따라 해'],
    ['follow', '따라가', '따라간', '뒤를 따', '따라나'],
    ['drink', '마시', '마셔', '들이켜'],
    ['eat', '먹'],
    ['give', '건네', '건넨', '주어', '줘', '준다', '주고', '주자', '줄래', '내민', '내밀', '나눠'],
    ['examine', '살펴', '살핀', '조사', '관찰', '둘러', '들여다', '본다', '보자', '볼래', '확인', '지켜'],
    ['approach', '다가'],
    ['attack', '공격', '때리', '때린', '찌르', '찌른', '덤비', '덤빈', '내리친', '내리쳐', '죽이', '죽인', '베어', '벤다'],
    ['flee', '도망', '달아나', '달아난', '뛰어가'],
    ['hide', '숨는', '숨어', '숨을래', '숨자', '숨긴', '몸을 숨'],
    ['rest', '쉬', '쉰', '앉', '눕', '잔다', '자자', '잠을'],
    ['wait', '기다'],
    ['listen', '듣', '귀 기울', '귀를'],
    ['speak', '말을 걸', '말 걸', '말해', '말한', '부르', '불러', '외치', '묻', '물어'],
    ['move', '간다', '가자', '갈래', '가 본', '이동', '올라', '내려', '돌아가', '돌아간', '향한', '들어간', '나간', '들어선'],
    ['take', '줍', '꺾', '딴다', '따자', '뜯', '챙기', '챙긴', '집어', '집는'],
    ['threaten', '위협', '겁주', '협박', '노려'],
    ['leave', '떠나', '떠난', '지나간', '지나가', '두고'],
    ['draw', '뽑', '꺼내', '쥐', '움켜'],
    ['treat', '치료', '대어', '감싸', '싸매', '짓이겨'],
    ['show', '보여', '펴 보'],
    ['stop', '멈춰', '멈춘', '멈추'],
    ['climb', '올라가', '기어오'],
    ['throw', '던지', '던진', '던져'],
  ];
  const TARGETS = {
    lia: ['그녀', '리아', '여자'], water: ['물', '개울'], tree: ['나무', '고목', '가지'], rock: ['바위', '돌'],
    herb: ['풀', '약초', '잎'], berry: ['열매'], sound: ['소리'], hands: ['손'], wound: ['상처', '다친'],
    light: ['빛'], word: ['말', '단어'], name: ['이름'], body: ['몸'],
  };
  const MANNERS = { careful: ['조심', '천천히', '살금', '살며시', '살살'], quick: ['빨리', '급히', '재빨리', '힘껏'] };
  const NEGATE = /(지 ?않|지 ?말|안 |말고|못 )/;

  // 받침 없는 어간은 활용하면 끝 글자에 ㄴ·ㄹ·ㅂ 받침이 붙는다: 마시 → 마신다, 마실래, 마십니다
  function variants(stem) {
    const last = stem.charCodeAt(stem.length - 1);
    if (last < 0xac00 || last > 0xd7a3 || (last - 0xac00) % 28 !== 0) return [stem];
    const head = stem.slice(0, -1);
    return [stem, ...[4, 8, 17].map((j) => head + String.fromCharCode(last + j))];
  }
  const STEMS = VERBS.map(([v, ...stems]) => [v, [...new Set(stems.flatMap(variants))]]);

  function parse(text) {
    const s = String(text).replace(/[.!?,]/g, ' ');
    const verbs = new Set(), negated = new Set(), targets = new Set();
    // "뽑지만 공격하지 않는다" → 절마다 따로 본다
    s.split(/지만|는데|면서|하고 |고 /).forEach((clause) => {
      const neg = NEGATE.test(clause);
      STEMS.forEach(([v, stems]) => { if (stems.some((x) => clause.includes(x))) (neg ? negated : verbs).add(v); });
    });
    if (verbs.has('repeat_word')) verbs.delete('speak');
    if (verbs.has('follow')) verbs.delete('move');
    if (verbs.has('climb')) verbs.delete('move');
    Object.entries(TARGETS).forEach(([t, words]) => { if (words.some((w) => s.includes(w))) targets.add(t); });
    const manner = Object.keys(MANNERS).find((m) => MANNERS[m].some((w) => s.includes(w))) || null;
    return { verbs, negated, targets, manner };
  }

  const cache = new Map();
  function parseLabel(label) {
    if (!cache.has(label)) cache.set(label, parse(label));
    return cache.get(label);
  }

  // 가장 가까운 선택지. { option, manner, score } 또는 null
  function match(opts, text) {
    const I = parse(text);
    let best = null;
    opts.forEach((o) => {
      if (o.disabled) return;
      const L = parseLabel(o.label);
      let score = 0;
      I.verbs.forEach((v) => { if (L.verbs.has(v)) score += 4; });
      I.negated.forEach((v) => { if (L.verbs.has(v)) score -= 6; });
      I.targets.forEach((t) => { if (L.targets.has(t)) score += 2; });
      // 장면이 달아 둔 키워드도 그대로 쓴다 (예전 방식)
      (o.kw || []).forEach((k) => { if (text.includes(k)) score += k.length * 2; });
      if (o.label.includes(text.trim()) || text.includes(o.label)) score += 3;
      if (!best || score > best.score) best = { option: o, score, manner: I.manner };
    });
    return best && best.score >= 2 ? best : null;
  }

  return { parse, match };
})();

if (typeof module !== 'undefined') module.exports = { Intent };

</script>
<script>/* js/play/explore.js */
// 탐험 (통합 명세 20절). 장소는 모름 → 멀리서 봄 → 가 봄 → 살펴봄 → 잘 앎 으로 드러난다.
// 지도는 발견한 만큼만 보여 준다.
const Explore = (() => {
  // 사실을 알면 장소도 알게 된다
  const FACT_PLACES = { girl_hollow: ['hollow', 'known'], smoke: ['edge', 'seen'], broken_branch: ['deep', 'explored'] };

  // 갈 수 있는 길이 보이면 그 끝을 "멀리서 봤다"
  function seeExits(S, exits) { exits.forEach((e) => Knowledge.location(S, e.to, 'seen')); }

  // 그 장소에서 해 본 일. 절반 넘게 해 봤으면 "살폈다"
  function didAction(S, loc, id) {
    const { W } = S;
    const done = W.worldFlags.done[loc] = W.worldFlags.done[loc] || {};
    done[id] = true;
    const a = LOCS[loc] && LOCS[loc].actions.find((x) => x.id === id);
    LifeLog.act(S, (a && a.kind) || 'explore', { min: a ? a.min : 0 });
    const total = (LOCS[loc] && LOCS[loc].actions.length) || 1;
    if (Object.keys(done).length >= Math.ceil(total / 2)) Knowledge.location(S, loc, 'explored');
  }

  function onFact(S, id) {
    const f = FACT_PLACES[id];
    if (f) Knowledge.location(S, f[0], f[1]);
  }

  // 알고 있는 장소 (숲 안, 플레이어가 갈 수 있는 곳만)
  function mapLines(S) {
    return Object.keys(LOCS).filter((k) => Knowledge.locState(S.P, k) !== 'unknown')
      .map((k) => ({ t: `· ${LOCS[k].name} — ${Knowledge.KO[Knowledge.locState(S.P, k)]}`, cls: 'note' }));
  }

  return { FACT_PLACES, seeExits, didAction, onFact, mapLines };
})();

if (typeof module !== 'undefined') module.exports = { Explore };

</script>
<script>/* js/play/encounter.js */
// 누군가와 마주친다 (리아의 첫 장면이 아닌 모든 만남). 장면 글이 따로 없는 사람도 세계 상태에 맞춰 반응한다.
// NPC의 태도는 관계(소문으로 들은 인상 포함)·성격·기억·지금 하는 일에서 나온다 (통합 명세 12·35절).
const Encounter = (() => {
  const K = (t) => ({ t, cls: 'know' });
  const J = (w, t) => w + Text.josa(w, t);
  const armed = (n) => Object.keys(n.inventory).some((k) => ITEM_DEFS[k] && ITEM_DEFS[k].category === 'weapon');
  const GIFTS = ['bread', 'dried_meat', 'waterskin', 'bandage', 'herb', 'berry'];

  // 처음 만날 때의 모습과 첫마디 (스토리설계.md 단계 5 장면 문장 C). look(S, n, w): 모습 줄 / say: 첫마디 / after: 말하며 하는 몸짓
  // 그 자리와 시각에 맞지 않으면 null (보통의 첫 만남이 된다)
  const herbalHeard = (S, n) => Object.keys(n.knowledge.rumors).some((id) => S.W.rumors[id] && (S.W.rumors[id].subject === 'player' || S.W.rumors[id].target === 'player'));
  const helpedLia = (S) => (S.W.player.life.choices || []).some((c) => c.id === 'lia_first_meeting' && c.outcome === 'helped');
  const offHours = (S) => { const h = Time.hour(S.W.time.t); return h < 8 || h >= 18; };
  const FIRST = {
    innkeeper: (S, n, w) => (n.location.loc === 'village_inn'
      ? { look: [`넓은 방 안쪽에서 ${J(w, '이가')} 국자를 든 채 나를 위아래로 훑어본다.`, '젖은 옷, 흙 묻은 맨손. 그 눈이 내 빈손에서 멈춘다.'],
        say: 'greet_innkeeper', after: '말하며 국자로 솥을, 이어 계단 위를 가리킨다.' } : null),
    peer: (S, n, w) => ({ look: [n.location.loc === 'village_square' ? `우물가에 걸터앉은 ${J(w, '이가')} 나를 보고 눈을 가늘게 뜬다.` : `${J(w, '이가')} 나를 보고 눈을 가늘게 뜬다.`,
      '피하지 않는다. 오히려 재미있다는 얼굴이다.'], say: 'greet_peer', after: '숲 쪽을 엄지로 가리킨다.' }),
    child: () => ({ look: ['집 모퉁이에서 작은 얼굴이 반쯤 나와 있다.', '눈이 마주치자 쏙 들어간다.', '……다시 나온다.'],
      say: 'greet_child', after: '손가락으로 나를 콕 찌르는 시늉을 한다.' }),
    farmer: (S, n, w) => (Time.dark(S.W.time.t) || Time.band(S.W.time.t) === 'evening'
      ? { look: [`${J(w, '이가')} 나를 한 번 본다.`], say: null, after: '고개만 한 번 끄덕이고, 집 쪽으로 걸어간다.', home: true }
      : n.location.loc === 'village_field'
        ? { look: [`밭 가장자리에서 ${J(w, '이가')} 괭이에 기대어 나를 본다.`, '내 손을 본다. 일하는 손인지 보는 것 같다.'], say: 'greet_farmer', after: '괭이를 들어 보인다.' }
        : null),
    merchant: (S, n, w) => (offHours(S)
      ? { look: [`천막을 걷던 ${J(w, '이가')} 손을 멈춘다.`, '내 차림을 보고, 내 빈손을 보고, 다시 천막을 걷는다.'], say: 'greet_merchant', after: '접힌 천막을 손바닥으로 두드린다.' }
      : null),
    herbalist: (S, n, w) => {
      const liaHere = Npc.present(S.W, S.W.npcs.lia);
      const look = n.location.loc === 'village_herbhouse'
        ? [`약초 통 사이에 앉은 ${J(w, '이가')} 고개를 든다.`, '눈이 맑다. 나를 오래, 아주 천천히 본다.']
        : [`${J(w, '이가')} 고개를 든다.`, '눈이 맑다. 나를 오래, 아주 천천히 본다.'];
      if (liaHere && helpedLia(S)) look.push('……그리고 문 쪽의 리아를 한 번 본다. 리아가 짧게 고개를 끄덕인다.');
      return { look, say: herbalHeard(S, n) || liaHere ? 'greet_herbalist' : 'greet_herbalist_unknown' };
    },
  };

  // NPC의 첫마디: 무엇을 하던 중이었는지, 나를 어떻게 여기는지에 따라. first = 처음 만날 때의 첫마디(있으면)
  function opening(S, n, first) {
    const r = Rel.get(S.W, n.id, 'player');
    const search = Goals.get(n, 'search');
    if (search) return { id: 'ask_seen', vars: { target: S.W.npcs[search.target].identity.name } };
    if (r.hostility >= 50) return { id: 'go_away' };
    // 처음 만날 때는 사람별 첫마디. 적대·의심이 크면 그보다 먼저 쫓거나 따져 묻는다
    if (first && r.suspicion < 60) return first;
    if (r.trust >= 40 && Player.bleeding(S.W)) return { id: 'are_you_ok' };
    if (r.trust >= 40) return { id: 'greet_warm' };
    // 지키는 사람이거나 나를 크게 의심하면 따져 묻고, 아니면 말을 건다
    if (n.identity.occupation === 'guard' || r.suspicion >= 60) return { id: 'challenge' };
    return { id: 'greet' };
  }

  function speak(S, n, d) {
    const r = Dialogue.process(S, { speakerId: n.id, listenerId: 'player', dialogueId: d.id, vars: d.vars });
    const said = Lang.line(r, n.id);
    return r.tone && !r.fullyUnderstood ? [said, r.tone] : [said];
  }

  const ACTIVITY = {
    search: '무언가를 찾는 듯 사방을 두리번거린다.', gather: '허리를 굽혀 풀숲을 뒤지고 있다.', rest: '나무에 기대어 숨을 고르고 있다.',
    sleep: '웅크린 채 잠들어 있다.', flee: '무언가에 쫓기듯 서두르고 있다.', hide: '몸을 낮추고 있다.',
  };

  // 상대가 먼저 움직인다: 적의가 크고 용감하면 덤비고, 두려우면 달아난다
  function theirMove(S, n, out) {
    const r = Rel.get(S.W, n.id, 'player');
    const w = Narrative.who(S, n);
    if (r.hostility >= 60 && n.personality.bravery >= 50 && armed(n) && n.physical.health > 30) {
      Player.hurt(S, 3, `${w}에게 공격당했다`, n.id);
      Player.injure(S, 'stab', 30);
      out.push('', `${J(w, '이가')} 무기를 휘두른다. 피할 틈이 없다.`, '뜨거운 것이 옆구리를 가른다.');
      return true;
    }
    if (r.fear >= 60 && n.personality.bravery < 60) {
      Behavior.force(S, n, 'flee');
      S.W.worldFlags.feed.length = 0;
      out.push('', `${J(w, '이가')} 뒷걸음질 치더니, 몸을 돌려 달아난다.`);
      return true;
    }
    return false;
  }

  async function run(ui, id) {
    const { S, W, P, me } = ui;
    const n = W.npcs[id];
    ui.talker = id;
    const first = !Memory.has(n, 'player', 'met');
    const who = () => Narrative.who(S, n);
    const fl = first && FIRST[id] ? FIRST[id](S, n, who()) : null;
    Social.meet(S, id);
    let lines;
    if (fl) {
      // 처음 만나는 마을 사람: 사람별 모습과 첫마디 (스토리설계.md 단계 5 장면 문장 C)
      lines = [...fl.look];
      const o = opening(S, n, fl.say ? { id: fl.say } : null);
      if (fl.say && o.id === fl.say) lines.push(...speak(S, n, o), ...(fl.after ? [fl.after] : []));
      else if (!fl.say && o.id !== 'go_away' && o.id !== 'ask_seen') {
        // 말없이 몸짓만 (저녁의 밭 주인: 고개만 끄덕이고 집으로 간다)
        lines.push(fl.after);
        if (fl.home) Npc.startMove(S, n, n.location.home);
      } else lines.push(...speak(S, n, o)); // 적대·의심이 크면 사람별 첫마디보다 먼저
      lines.push(...Narrative.describe(S, n));
    } else {
      // 리아를 마을(약초집)에서 처음 다시 본다
      const villageLia = id === 'lia' && !n.flags.seenInVillage && n.location.loc === 'village_herbhouse';
      if (villageLia) n.flags.seenInVillage = true;
      lines = [id === 'lia'
        ? (villageLia ? (Rel.get(W, 'lia', 'player').trust >= 30
          ? '리아가 팔에 새 천을 감고 있다. 나를 보더니, 놀라지 않는다. 올 줄 알았다는 얼굴이다.'
          : '리아가 문간에서 나를 본다. 반가운 얼굴은 아니다. 그래도 문을 닫지는 않는다.') : '그녀다.')
        : `${J(first ? n.identity.desc : who(), '이가')} 있다.`];
      const act = n.currentAction && ACTIVITY[n.currentAction.type];
      if (act) lines.push(act);
      lines.push('', `${J(who(), '이가')} 나를 본다.`, ...speak(S, n, opening(S, n)), ...Narrative.describe(S, n));
    }
    await ui.page(lines);

    while (true) {
      if (!n.alive || !Npc.present(W, n)) return 'ok';
      const r = Rel.get(W, id, 'player');
      const search = Goals.get(n, 'search');
      const weapon = Combat.weaponOf(me);
      const gift = GIFTS.find((k) => me.inv[k]);
      const word = LangKnowledge.heardWords(S, Lang.AVER).find((x) => x.confidence >= LangKnowledge.GUESS);
      const opts = [
        { id: 'look', label: '가만히 살펴본다' },
        { id: 'near', label: '다가간다' },
        { id: 'hands', label: '두 손을 펴 보인다' },
        { id: 'talk', label: '말을 걸어 본다' },
      ];
      if (word) opts.push({ id: 'say', label: '들은 말을 되풀이해 본다' });
      if (search && P.knowledge.girl_hollow) opts.push({ id: 'point', label: '움푹한 곳이 있는 쪽을 가리킨다', hint: '안다' });
      if (gift) opts.push({ id: 'give', label: `${J(Player.label(gift, P), '을를')} 내민다` });
      if (Companion.canAsk(S, n)) opts.push({ id: 'ask', label: '함께 가자고 손짓한다' });
      opts.push({ id: 'threat', label: '주먹을 쥐고 위협한다' });
      opts.push({ id: 'attack', label: weapon ? `${J(ITEM_DEFS[weapon].name, '을를')} 치켜들고 달려든다` : '달려든다' });
      opts.push({ id: 'leave', label: '물러선다', sep: true });
      const { idx, manner } = await ui.choose(opts);
      const a = opts[idx].id;
      // 삶의 기록: 사람을 대한 일 (건넨 선물은 도움으로 따로 쌓인다)
      if (a !== 'leave' && a !== 'give') LifeLog.act(S, a === 'threat' || a === 'attack' ? 'fight' : 'talk', { min: 5 });
      const w = who();
      let out = [], min = 5;

      if (a === 'look') {
        const d = Narrative.describe(S, n);
        out = [`${J(w, '을를')} 가만히 살핀다.`, armed(n) ? '손에 무기를 쥐고 있다.' : '무기는 보이지 않는다.', ...(d.length ? d : ['무슨 생각을 하는지 알 수 없는 얼굴이다.'])];
      } else if (a === 'near') {
        if (r.suspicion >= 50 || r.fear >= 50) {
          if (n.personality.bravery >= 50 && armed(n)) {
            ui.relate(id, { suspicion: manner === 'careful' ? 2 : 6 }, 'approached');
            out = ['한 걸음 다가선다.', `${J(w, '이가')} 무기 끝을 나에게 겨눈다.`, ...speak(S, n, { id: 'challenge' })];
          } else {
            ui.relate(id, { fear: manner === 'careful' ? 3 : 8 }, 'approached');
            out = ['한 걸음 다가선다.', `${J(w, '이가')} 그만큼 물러선다.`];
          }
        } else {
          ui.relate(id, { familiarity: 3 }, 'approached');
          out = ['천천히 다가간다.', `${J(w, '은는')} 물러서지 않는다.`];
        }
      } else if (a === 'hands') {
        ui.relate(id, { suspicion: -10, fear: -5 }, 'showed_hands');
        out = ['두 손을 펴 보인다. 아무것도 들지 않았다는 것을.', r.suspicion >= 60 ? `${J(w, '은는')} 여전히 나를 노려본다. 그래도 조금은 누그러진 것 같다.` : `${J(w, '이가')} 작게 고개를 끄덕인다.`];
      } else if (a === 'talk') {
        Memory.add(S, n, { type: 'strange', subject: 'player', detail: 'unknown_language' });
        if (r.trust < 30) ui.relate(id, { suspicion: 3 }, 'strange_words');
        out = ['「저기요……」', '', `${J(w, '이가')} 얼굴을 찌푸린다.`, '「……?」', '', '말이 통하지 않는다.'];
      } else if (a === 'say') {
        const res = Dialogue.playerSays(S, id, word.id);
        const snd = LangRegistry.sound(word.id, word.id);
        out = ['들은 소리를 흉내 내어 본다.', `「${snd}.」`, ''];
        out.push(...(res.success ? [`${J(w, '이가')} 눈을 크게 뜬다.`, `「……${snd}?」`, K('……알아들었다.')] : [`${J(w, '이가')} 고개를 갸웃한다.`]));
      } else if (a === 'point') {
        // 말이 없어도 손짓은 통한다
        search.plan.splice(search.idx, 0, 'hollow');
        ui.relate(id, { trust: 8, suspicion: -8 }, 'pointed');
        out = ['숲 안쪽, 뿌리가 엉킨 움푹한 곳이 있는 쪽을 가리킨다.', `${J(w, '이가')} 내 손끝을 따라 그쪽을 본다.`, '잠시 망설이더니, 그쪽으로 발을 옮긴다.'];
        Behavior.interrupt(n);
      } else if (a === 'give') {
        if (gift === 'berry') {
          ui.relate(id, { suspicion: 5 }, 'berry');
          out = ['붉은 열매를 내민다.', `${J(w, '이가')} 질색하며 손사래를 친다.`, ui.speak('「[[독:15]]!」', id)];
          if (ui.learn('독')) out.push(K('……"독". 먹으면 안 된다는 말이다.'));
        } else {
          Player.take(me, gift);
          n.inventory[gift] = (n.inventory[gift] || 0) + 1;
          Social.help(S, 'player', id, 'gift', { trust: 6, suspicion: -6, affection: 2 });
          out = [`${J(Player.label(gift, P), '을를')} 내민다.`, `${J(w, '이가')} 머뭇거리다가 받아 든다.`, ...speak(S, n, { id: 'thanks' })];
        }
      } else if (a === 'ask') {
        out = ['나와 저편을 번갈아 가리키며, 함께 가자고 손짓한다.', ...Companion.ask(S, n)];
      } else if (a === 'threat') {
        Social.threaten(S, 'player', id);
        out = ['주먹을 쥐고 한 걸음 내딛는다.'];
        if (!theirMove(S, n, out)) out.push(`${J(w, '이가')} 무기를 고쳐 쥔다. 물러설 기색이 없다.`);
      } else if (a === 'attack') {
        ui.use('str');
        Social.attack(S, 'player', id, { weapon });
        const res = Combat.playerVsNpc(S, n, weapon);
        out = [weapon ? `${J(ITEM_DEFS[weapon].name, '을를')} 치켜들고 달려든다.` : '달려든다.', ''];
        if (!res.hit) out.push(`${J(w, '이가')} 몸을 비튼다. 허공을 가른다.`);
        else if (res.killed) out.push('……둔한 소리.', `${J(w, '이가')} 쓰러진다.`, '', '움직이지 않는다.');
        else out.push(`손에 둔한 감촉이 전해진다. ${J(w, '이가')} 비틀거린다.`);
        if (n.alive) theirMove(S, n, out);
        min = 5;
      } else if (a === 'leave') {
        n.flags.metAt = W.time.t;
        await ui.page(['눈을 피하고 물러선다.', `${J(w, '은는')} 나를 한동안 지켜보다가, 제 할 일로 돌아간다.`]);
        await ui.more();
        return 'ok';
      }

      W.worldFlags.feed.length = 0;
      out.push(...ui.pass(min, a === 'attack' ? { fight: true } : {}));
      if (me.hp <= 0) { await ui.page([...out, '', '눈앞이 어두워진다.']); await ui.more(); return 'die'; }
      if (n.alive && Npc.present(W, n)) out.push('', ...Narrative.describe(S, n));
      else if (n.alive) out.push('', `${J(w, '은는')} 이제 보이지 않는다.`);
      await ui.page(out);
      if (!n.alive || !Npc.present(W, n)) { n.flags.metAt = W.time.t; await ui.more(); return 'ok'; }
    }
  }

  return { run, opening };
})();

if (typeof module !== 'undefined') module.exports = { Encounter };

</script>
<script>/* js/play/collapse.js */
// 쓰러짐 (스토리_재설계.md 11절 A안 [임시]). 체력이 0이 되어도 죽지 않는다. 쓰러지고, 구조되거나 깨어나며, 대가가 남는다.
// 대가: 흐른 시간(그동안 세계는 움직인다), 남은 상처, 잃은 소지품, 구해 준 사람에게 진 빚.
// 수치는 data/rules.js의 RULES.collapse. 판단만 여기서 하고, 화면 연출은 engine.js가 한다.
const Collapse = (() => {
  // 곁이나 바로 이웃한 곳에 있는 사람 가운데, 나를 적대하지 않고 믿거나 착한 사람
  function findRescuer(S) {
    const { W } = S;
    const C = RULES.collapse.rescuer;
    const loc = W.player.loc;
    const near = [loc, ...Places.neighbors(loc)];
    let best = null;
    Object.values(W.npcs).forEach((n) => {
      if (!n.alive || n.location.transit || !near.includes(n.location.loc)) return;
      const r = Rel.get(W, n.id, 'player');
      if (r.hostility > C.maxHostility || r.fear >= 60) return;
      if (r.trust < C.minTrust && n.personality.kindness < C.minKindness) return;
      const score = r.trust + n.personality.kindness * 0.5 + (n.location.loc === loc ? 20 : 0);
      if (!best || score > best.score) best = { n, score };
    });
    return best ? best.n : null;
  }

  // 쓰러진다. 결과: { rescuer, minutes, lost, again, lines(그사이 지나간 이야기 시계) }
  function resolve(S, cause) {
    const { W, P } = S;
    const me = W.player;
    const C = RULES.collapse;
    P.collapses = (P.collapses || 0) + 1;
    const again = me.lastCollapse != null && W.time.t - me.lastCollapse < C.repeatWindow;
    me.lastCollapse = W.time.t;
    const loc = me.loc;
    Bus.emit(S, 'PLAYER_COLLAPSED', { cause: cause || null, loc, again });
    const n = findRescuer(S);
    let minutes, hpRatio, lost = null;
    if (n) {
      minutes = C.rescuedMin;
      hpRatio = C.rescuedHp;
      if (n.location.loc !== loc) Npc.place(S, n, loc);
      n.flags.caring = W.time.t + minutes; // 깨어날 때까지 곁을 지킨다
      Player.treat(S);
      Memory.add(S, n, { type: 'rescued', subject: 'player', detail: cause || null });
      Rel.change(S, n.id, 'player', { familiarity: 10, affection: 3 }, 'rescued', true);
      me.debts.push({ npcId: n.id, kind: 'rescue', t: W.time.t, repaid: false });
      WorldEvents.record(S, 'rescued_player', { loc, actors: [n.id, 'player'], witnesses: [n.id, 'player'],
        data: { subject: 'player', target: n.id, cause: cause || null } });
      Bus.emit(S, 'PLAYER_RESCUED', { npcId: n.id, loc });
    } else {
      const [a, b] = C.aloneMin;
      minutes = Math.round(Rng.between(W, a, b));
      hpRatio = C.aloneHp;
      const items = Object.keys(me.inv).filter((k) => me.inv[k] > 0);
      if (items.length && Rng.chance(W, C.lossChanceAlone)) { lost = Rng.pick(W, items); Player.take(me, lost); }
    }
    if (again) minutes += C.repeatExtra;
    // 정신을 잃은 동안에도 세계는 흐른다. 그사이 벌어진 이야기 시계(해 질 녘 등)는 깨어난 뒤 짧게 알린다.
    const lines = [];
    let left = minutes;
    while (left > 0) {
      const r = World.tick(S, left, { sleep: true, unconscious: true });
      lines.push(...r.lines);
      left -= r.spent;
      // 정신을 잃은 사람에게는 밤의 목소리가 닿지 않는다
      const call = W.worldFlags.pending.indexOf('call');
      if (call >= 0) W.worldFlags.pending.splice(call, 1);
      if (r.spent <= 0) break;
    }
    W.worldFlags.feed.length = 0;
    me.hp = Math.max(me.hp, Math.ceil(hpMax(me) * hpRatio));
    return { rescuer: n, minutes, lost, again, lines };
  }

  // 밤의 목소리를 따라갔다 [결정 #6 · 스토리설계.md 단계 0~4 장면 문장 B]: 쓰러지지 않는다 (쓰러진 횟수에 세지 않는다).
  // 정신을 잃었다가 새벽 직전에 깨어난다. 처음 보는 자리다 (가 보지 않은 이웃 숲으로 옮긴다 [후보]). 잃는 것은 시간과 힘뿐이다.
  function lose(S) {
    const { W } = S;
    const me = W.player;
    const R = RULES.protection;
    const from = me.loc;
    World.tick(S, Math.max(R.shakenMin, Time.untilDawn(W.time.t) - 30), { unconscious: true });
    W.worldFlags.feed.length = 0;
    W.worldFlags.notes.length = 0;
    me.hp = Math.max(me.hp, R.minHp);
    me.surv.fatigue = Math.min(100, me.surv.fatigue + R.shakenFatigue);
    const near = Places.neighbors(from).filter((l) => LOCS[l] && Places.regionOf(l) === 'forest' && !['edge', 'hollow'].includes(l));
    const strange = near.find((l) => ['unknown', 'seen'].includes(Knowledge.locState(S.P, l))) || near[0];
    if (strange) Player.teleport(S, strange);
    return { from, to: me.loc };
  }

  return { findRescuer, resolve, lose };
})();

if (typeof module !== 'undefined') module.exports = { Collapse };

</script>
<script>/* js/play/work.js */
// 일 (품삯) — 스토리_재설계.md 6절 "생활". 일을 거들면 돈, 그 사람의 호감, 직업 경향, 소문이 남는다.
// 일거리는 data/rules.js의 RULES.jobs. 일을 주는 사람이 그 시각에 그곳에 있어야 하고, 나를 그만큼 믿어야 한다.
// 말이 통하지 않아도 일은 손짓으로 통한다.
const Work = (() => {
  const J = (w, t) => w + Text.josa(w, t);

  // 지금 이 자리에서 거들 수 있는 일
  function available(S) {
    const { W } = S;
    const h = Time.hour(W.time.t);
    return Object.entries(RULES.jobs).filter(([, j]) => {
      if (j.lodgingOnly) return false; // 잠자리 값으로만 하는 일 (lodging.js)
      if (j.at !== W.player.loc || h < j.hours[0] || h >= j.hours[1]) return false;
      const giver = W.npcs[j.giver];
      if (!giver || !Npc.present(W, giver) || Condition.stageOf(giver) === 'bedridden') return false; // 병상에 누운 사람은 일을 맡기지 않는다
      const r = Rel.get(W, j.giver, 'player');
      return r.trust >= j.minTrust && r.hostility < 30 && r.suspicion < 70;
    }).map(([id, job]) => ({ id, job }));
  }

  // 일을 한다. 흐른 시간의 줄은 pass(min, opt)가 만든다 (engine의 passTime)
  function perform(S, id, pass) {
    const { W } = S;
    const job = RULES.jobs[id];
    const giver = W.npcs[job.giver];
    const who = Narrative.who(S, giver);
    const me = W.player;
    const lines = [`${J(who, '이가')} 손짓으로 할 일을 보여 준다.`, '', ...job.lines];
    Player.use(S, job.stat);
    Player.use(S, job.stat);
    lines.push(...pass(job.min, { work: job.fatigue / job.min }));
    if (!giver.alive || me.hp <= 0) return lines;
    // 품삯: 돈이 모자라면 먹을 것으로 준다
    let paid = job.pay;
    if (giver.money >= paid) { giver.money -= paid; me.money += paid; lines.push('', `일이 끝나자 ${J(who, '이가')} 동전 ${paid}닢을 손에 쥐여 준다.`); }
    else { paid = 0; Player.give(me, 'bread'); lines.push('', `${J(who, '이가')} 동전 대신 빵 한 덩이를 내민다.`); }
    me.tendency[job.tendency] = (me.tendency[job.tendency] || 0) + job.min;
    Rel.change(S, job.giver, 'player', { trust: 3, familiarity: 5, respect: 2 }, 'worked');
    // 같은 사람과 하루에 한 번만 기억과 소문이 된다 (매번 부풀지 않게)
    const today = Time.day(W.time.t);
    if (giver.flags.workedDay !== today) {
      giver.flags.workedDay = today;
      Memory.add(S, giver, { type: 'worked_with', subject: 'player', detail: id });
      WorldEvents.record(S, 'player_worked', { loc: me.loc, actors: ['player', giver.id], witnesses: [giver.id, 'player'],
        data: { subject: 'player', target: giver.id, job: id } });
    }
    // 일이 마을을 조금 바꾼다
    const v = W.economy.markets.village_square;
    if (id === 'field') v.stock.bread = (v.stock.bread || 0) + 1;
    if (id === 'errand') v.salesToday += 2;
    if (id === 'watch') W.regions.village.alert = Math.max(W.regions.village.alert, 40);
    if (id === 'herbs' && giver.inventory.herb > 0) { giver.inventory.herb--; giver.inventory.bandage = (giver.inventory.bandage || 0) + 1; }
    Bus.emit(S, 'PLAYER_WORKED', { job: id, giver: giver.id, paid });
    const thanks = Dialogue.process(S, { speakerId: giver.id, listenerId: 'player', dialogueId: 'thanks' });
    lines.push(Lang.line(thanks, giver.id));
    return lines;
  }

  // 가장 많이 해 온 일 (직업 경향. 숫자는 보여 주지 않는다)
  function tendencyLines(S) {
    const t = S.W.player.tendency;
    const top = Object.entries(t).filter(([, m]) => m >= 60).sort((a, b) => b[1] - a[1]);
    return top.map(([k, m]) => ({ t: `· ${RULES.tendencyKo[k] || k} — ${m >= 600 ? '손에 익었다' : m >= 240 ? '조금 익숙하다' : '해 본 적 있다'}`, cls: 'note' }));
  }

  return { available, perform, tendencyLines };
})();

if (typeof module !== 'undefined') module.exports = { Work };

</script>
<script>/* js/play/lodging.js */
// 거처 — 스토리_재설계.md 6절 "잠자리 문제", 스토리설계.md PART 5 단계 5 [결정 #10].
// 첫 잠자리는 앞의 행동에 따라 갈린다: 리아의 말로 노파가 헛간을 내준다 / 일을 거들고 재워 달라고 한다 /
// 교회의 구호를 받는다 / 울타리 밑에서 노숙한다. 어느 길이 정답인지 게임은 알려 주지 않는다.
// 어디서 자느냐가 회복, 안전, 사람들과의 관계를 바꾼다. 거처 목록은 RULES.lodgings, 잠의 효과는 RULES.sleep.
const Lodging = (() => {
  const J = (w, t) => w + Text.josa(w, t);
  const today = (W) => Time.day(W.time.t - 6 * 60); // 밤은 전날에 속한다 (새벽 6시가 하루의 경계)
  const stayId = (id) => RULES.lodgings[id].stays || id;

  // 지금 이 자리에서 구할 수 있는 잠자리
  function offers(S) {
    const { W } = S;
    const me = W.player;
    const h = Time.hour(W.time.t);
    const night = h >= 17 || h < 5; // 저녁부터 새벽 전까지
    const paidTonight = me.lodging && me.lodging.paidDay === today(W);
    return Object.entries(RULES.lodgings).filter(([id, l]) => {
      if (l.at !== me.loc) return false;
      if (me.lodging && stayId(id) === me.lodging.id && (paidTonight || !l.price)) return false; // 이미 오늘 밤 잘 곳이다
      if (l.charity) {
        const used = me.charityNights || 0;
        return night && me.money <= l.charity.maxMoney && used < l.charity.maxNights;
      }
      if (!l.owner) return night && !me.lodging;
      const o = W.npcs[l.owner];
      if (!o || !Npc.present(W, o)) return false;
      const r = Rel.get(W, l.owner, 'player');
      if (r.trust < l.minTrust || r.hostility >= 30) return false;
      if (l.work) {
        const job = RULES.jobs[l.work];
        return h >= job.hours[0] && h < job.hours[1] && r.suspicion < 70;
      }
      return me.money >= l.price;
    }).map(([id, l]) => ({ id, l }));
  }

  const label = (id) => RULES.lodgings[id].ask || RULES.lodgings[id].label;

  // 처음인가 (거처마다 · 마을의 첫 아침): W.worldFlags.seen에 남긴다
  const once = (W, key) => { if (W.worldFlags.seen[key]) return false; W.worldFlags.seen[key] = true; return true; };
  const say = (S, id, text) => Lang.line(Dialogue.process(S, { speakerId: id, listenerId: 'player', text }), id);

  function settle(S, id) {
    const { W } = S;
    W.player.lodging = { id: stayId(id), since: W.time.t, paidDay: today(W) };
    Bus.emit(S, 'LODGING_CHANGED', { lodging: stayId(id), via: id });
  }

  // 잠자리를 얻는다. pass(min, opt)는 시간을 흘린다 (일로 치를 때)
  function take(S, id, pass) {
    const { W } = S;
    const l = RULES.lodgings[id];
    const me = W.player;
    // 문장: 스토리설계.md 단계 5 장면 문장 D (첫 잠자리 네 갈래)
    if (l.charity) {
      settle(S, id);
      return ['안은 서늘하다. 아무도 없다.', '앞쪽의 돌 앞에 작은 등잔 하나가 타고 있다. 누군가 불을 갈아 두고 갔다.',
        '구석에 개어 둔 담요는 낡았지만 깨끗하다.', '……누구에게 허락을 받아야 하는지 모른다. 물어볼 사람도 없다.', '담요 한 장을 조심스럽게 펼친다.'];
    }
    if (!l.owner) {
      settle(S, id);
      return ['울타리 말뚝에 등을 붙인다. 바람이 덜 드는 자리다.',
        ...(W.worldFlags.seen.v_gate ? ['발톱 자국이 난 말뚝이 바로 옆에 있다.'] : []), '……숲이 등 뒤에 있다.'];
    }
    const o = W.npcs[l.owner];
    const who = Narrative.who(S, o);
    const whoFull = Narrative.who(S, o, true);
    Memory.add(S, o, { type: 'sheltered', subject: 'player', detail: id });
    Rel.change(S, l.owner, 'player', { familiarity: 5 }, 'lodging', true);
    if (l.work) {
      // 돈 대신 일로 치른다: 먼저 일을 하고, 그러면 방을 내준다
      const lines = ['주머니를 뒤집어 보이고, 계단 위와 나를 번갈아 가리킨다.', `${J(whoFull, '이가')} 팔짱을 낀다. 내 얼굴과 빈 주머니를 번갈아 본다.`,
        '……한숨. 그리고 행주를 던지듯 내민다.', '', ...RULES.jobs[l.work].lines];
      lines.push(...pass(RULES.jobs[l.work].min, { work: RULES.jobs[l.work].fatigue / RULES.jobs[l.work].min }));
      me.tendency[RULES.jobs[l.work].tendency] = (me.tendency[RULES.jobs[l.work].tendency] || 0) + RULES.jobs[l.work].min;
      LifeLog.worked(S, l.work, l.owner, RULES.jobs[l.work].min);
      Incidents.notice(S, 'work', { job: l.work, at: me.loc });
      Rel.change(S, l.owner, 'player', { trust: 3, familiarity: 3 }, 'chores');
      settle(S, id);
      lines.push('', `일이 끝나자 ${J(who, '이가')} 국자로 계단 위를 가리킨다.`);
      // 첫날에만: 식은 국 한 그릇 (허기가 조금 준다)
      if (once(W, 'lodge_soup')) {
        me.surv.hunger = Math.max(0, me.surv.hunger - RULES.sleep.firstSoup);
        lines.push('탁자 위에 그릇 하나가 놓여 있다. 식은 국이다. 아무도 내 것이라고 말하지 않았지만, 아무도 치우지 않는다.');
      }
      return lines;
    }
    if (l.price) { me.money -= l.price; o.money += l.price; LifeLog.money(S, -l.price, 'rent', { with: l.owner }); }
    settle(S, id);
    if (l.price) return [`${who}에게 동전 ${l.price}닢을 내민다.`, `${J(who, '이가')} 동전을 세어 보고, 계단 위의 작은 방을 가리킨다.`];
    // 헛간: 노파가 리아 쪽을 한 번 보고, 한 마디로 내준다
    const liaHere = Npc.present(W, W.npcs.lia);
    return [`${J(whoFull, '이가')} 나를 오래 본다.`, ...(liaHere ? ['그리고 리아 쪽을 한 번 본다.'] : []),
      `${J(who, '이가')} 마른 손가락으로 마당 한쪽을 가리킨다. 헛간이다.`, say(S, l.owner, '「[[자:30]].」'),
      `한 마디뿐이다. ${J(who, '은는')} 다시 약초 통으로 몸을 돌린다.`,
      ...(once(W, 'lodge_barn') ? ['', '마른 풀이 천장까지 쌓여 있다. 숨을 쉴 때마다 쓴 냄새가 목에 걸린다.', '지붕이 있다. 벽이 있다. 그것만으로 다리에 힘이 풀린다.'] : [])];
  }

  // 잘 수 있는가: 내 거처에 있고, 저녁 6시 이후 또는 새벽 5시 전
  function canSleep(S) {
    const me = S.W.player;
    if (!me.lodging || RULES.lodgings[me.lodging.id].at !== me.loc) return false;
    const h = Time.hour(S.W.time.t);
    return h >= 18 || h < 5;
  }

  // 잔다. 아침(6시)까지. 흐른 시간의 줄은 pass가 만든다
  function sleep(S, pass) {
    const { W } = S;
    const me = W.player;
    const l = RULES.lodgings[me.lodging.id];
    const q = l.quality;
    const lines = [q === 0 ? '울타리 밑에 몸을 웅크린다. 땅이 차다.' : q === 1 ? '마른 풀과 담요 위에 몸을 누인다.' : '좁지만 벽과 지붕이 있는 방이다. 눕자마자 눈이 감긴다.'];
    // 방값은 하룻밤마다 한 번 (이미 치렀으면 받지 않는다. 못 내면 주인의 신뢰가 깎인다)
    if (l.price && me.lodging.paidDay !== today(W)) {
      const o = W.npcs[l.owner];
      if (me.money >= l.price) { me.money -= l.price; o.money += l.price; me.lodging.paidDay = today(W); LifeLog.money(S, -l.price, 'rent', { with: l.owner }); }
      else { Rel.change(S, l.owner, 'player', { trust: -10, resentment: 5 }, 'unpaid'); lines.push('……방값을 치를 돈이 없다. 주인의 눈초리가 차갑다.'); }
    }
    if (l.charity) me.charityNights = (me.charityNights || 0) + 1;
    // 그 거처에서 처음 자는 밤 (스토리설계.md 단계 5 장면 문장 D)
    const id = me.lodging.id;
    let cover = false;
    if (once(W, 'night_' + id)) {
      if (id === 'barn') {
        lines.push('벽 너머 집 안에서 기침 소리가 난다. 늙은 사람의 기침이다.');
        if (Npc.at(W, 'lia', 'village_herbhouse')) lines.push('……한참 뒤, 낮은 목소리가 무언가를 달랜다. 리아의 목소리 같다.');
      } else if (id === 'chapel') {
        lines.push('한밤중에 문이 삐걱 열린다. 발소리가 등잔 앞에서 멈췄다가, 다시 나간다. 나를 깨우지 않는다.');
      } else if (id === 'rough') {
        lines.push('숲 쪽에서 무언가 우는 소리가 난다. 멀다.');
        if (S.P.knowledge.name_call) lines.push('……이름을 부르는 소리는 아니다. 그것만 확인하고, 눈을 감는다.');
        lines.push('잠은 자꾸 끊긴다. 깰 때마다 하늘을 본다. 아직 어둡다.');
      }
    }
    // 노숙하는 밤 울타리를 지키던 사람이 지나간다. 나를 믿으면 천을 던져 준다 (추위만 조금 덜하다)
    if (id === 'rough' && Npc.at(W, 'gatekeeper', 'village_gate')) {
      const gk = Narrative.who(S, W.npcs.gatekeeper, true);
      if (Rel.get(W, 'gatekeeper', 'player').trust >= RULES.sleep.coverTrust) {
        cover = true;
        lines.push(`${J(gk, '이가')} 지나가다 나를 내려다본다.`, '……발치에 거친 천 한 장을 던져 두고 간다.');
      } else lines.push(`${J(gk, '이가')} 지나가다 나를 내려다본다. 한참 서 있다가…… 그냥 지나간다.`);
    }
    lines.push(...pass(Time.untilDawn(W.time.t), { sleep: true, quality: q, cover }));
    // 마을에서 맞는 첫 아침 (스토리설계.md 단계 5 장면 문장 E)
    const firstMorning = once(W, 'village_morning');
    if (firstMorning) lines.push('', ...(FIRST_MORNING[id] || []));
    // 노숙은 도둑과 추위에 약하다
    const items = Object.keys(me.inv).filter((k) => me.inv[k] > 0);
    if (items.length && Rng.chance(W, RULES.sleep.theftChance[q])) {
      const k = Rng.pick(W, items);
      Player.take(me, k);
      lines.push('', `아침에 보니 ${J(Player.label(k, S.P), '이가')} 없다.`);
    }
    // 방값을 치른 밤이 지났다: 다음 밤은 새로 치러야 한다 / 구호는 하룻밤씩
    if (l.price || l.charity) me.lodging = l.charity ? null : Object.assign(me.lodging, { paidDay: null });
    Bus.emit(S, 'PLAYER_SLEPT', { lodging: me.lodging ? me.lodging.id : 'chapel', quality: q });
    // 나를 믿는 사람은 아침에 찾아온다
    const visitor = Object.values(W.npcs).find((n) => n.alive && Places.regionOf(n.location.loc) === 'village'
      && Rel.get(W, n.id, 'player').trust >= RULES.sleep.visitTrust && Memory.has(n, 'player', 'met'));
    if (visitor) {
      Npc.place(S, visitor, me.loc);
      Player.give(me, 'bread');
      Rel.change(S, visitor.id, 'player', { familiarity: 3 }, 'visited', true);
      lines.push('', firstMorning && visitor.id === 'lia'
        ? '문 두드리는 소리. 리아다. 빵 한 덩이를 내밀고, 내가 받기 전에 벌써 돌아서 있다.'
        : `문 두드리는 소리. ${J(Narrative.who(S, visitor), '이가')} 빵 한 덩이를 들고 서 있다.`);
    }
    // 숲의 새벽이 첫 번째였다: 둘째 날 마을에 닿아 셋째 날 아침을 맞을 때만
    if (firstMorning && Time.day(W.time.t) === 3) lines.push('', '이 세계에서 맞는 두 번째 아침이다.');
    return lines;
  }

  const FIRST_MORNING = {
    barn: ['풀 냄새 속에서 눈을 뜬다. 틈으로 햇빛이 줄무늬처럼 들어온다.', '마당에서 절구 찧는 소리가 난다.'],
    room: ['아래층에서 그릇 부딪히는 소리에 눈을 뜬다.', '창밖 우물가에 벌써 사람들이 있다.'],
    chapel: ['등잔은 꺼져 있다. 담요가 한 장 더 덮여 있다. 어젯밤엔 없던 것이다.'],
    rough: ['이슬에 옷이 젖어 있다. 몸이 굳어 펴지지 않는다.', '울타리 너머로 마을이 깨어나는 소리가 들린다. 나는 아직 그 바깥에 있다.'],
  };

  return { offers, label, take, canSleep, sleep };
})();

if (typeof module !== 'undefined') module.exports = { Lodging };

</script>
<script>/* js/play/shop.js */
// 가게 — 마을 광장의 가게에서 사고판다. 값은 마을 사정(경제 시스템)에 따라 매일 달라진다.
// 말이 통하지 않아도 물건과 동전은 통한다.
const Shop = (() => {
  const J = (w, t) => w + Text.josa(w, t);
  const SELLS = ['bread', 'dried_meat', 'herb', 'bandage', 'waterskin']; // 플레이어에게 파는 것
  const BUYS = ['herb', 'dried_meat'];                           // 플레이어에게서 사는 것

  const open = (S) => Economy.open(S.W, S.W.player.loc) && S.W.player.loc !== 'far_town';

  // 살 수 있는 것: { item, price }
  function wares(S) {
    const { W } = S;
    const m = Economy.get(W, W.player.loc);
    return SELLS.filter((k) => (m.stock[k] || 0) > 0).map((k) => ({ item: k, price: Math.ceil(Economy.priceOf(W, W.player.loc, k)) }));
  }
  // 팔 수 있는 것: { item, price }
  function offers(S) {
    const { W } = S;
    return BUYS.filter((k) => W.player.inv[k] > 0).map((k) => ({ item: k, price: Math.max(1, Math.floor(Economy.priceOf(W, W.player.loc, k) * 0.6)) }));
  }

  function buy(S, item) {
    const { W } = S;
    const me = W.player;
    const loc = me.loc;
    const m = Economy.get(W, loc);
    const price = Math.ceil(Economy.priceOf(W, loc, item));
    const owner = W.npcs[Economy.merchantAt(W, loc)];
    const who = Narrative.who(S, owner);
    if (me.money < price) {
      Incidents.notice(S, 'market', { item, noMoney: true });
      return [`${J(Player.label(item, S.P), '을를')} 가리킨다.`, `${J(who, '이가')} 손가락 ${price}개를 펴 보인다. ……돈이 모자라다.`];
    }
    me.money -= price;
    owner.money += price;
    m.stock[item]--;
    m.salesToday += price;
    Player.give(me, item);
    LifeLog.money(S, -price, 'buy', { with: owner.id, item });
    LifeLog.act(S, 'trade');
    Incidents.notice(S, 'market', { item, bought: true });
    Rel.change(S, owner.id, 'player', { familiarity: 2 }, 'bought', true);
    return [`${J(Player.label(item, S.P), '을를')} 가리킨다.`, `${J(who, '이가')} 손가락 ${price}개를 펴 보인다. 동전을 건넨다.`];
  }

  function sell(S, item) {
    const { W } = S;
    const me = W.player;
    const loc = me.loc;
    const price = Math.max(1, Math.floor(Economy.priceOf(W, loc, item) * 0.6));
    const owner = W.npcs[Economy.merchantAt(W, loc)];
    const who = Narrative.who(S, owner);
    if (owner.money < price) return [`${J(who, '이가')} 고개를 젓는다. 지금은 살 돈이 없는 모양이다.`];
    owner.money -= price;
    me.money += price;
    Player.take(me, item);
    Economy.get(W, loc).stock[item] = (Economy.get(W, loc).stock[item] || 0) + 1;
    LifeLog.money(S, price, 'sell', { with: owner.id, item });
    LifeLog.act(S, 'trade');
    return [`${J(Player.label(item, S.P), '을를')} 내민다.`, `${J(who, '이가')} 이리저리 살펴보더니 동전 ${price}닢을 내준다.`];
  }

  // 가게 앞에서 고른다 (장면처럼 ui를 받는다)
  async function run(ui) {
    const { S } = ui;
    let out = ['가게 앞에 선다. 천막 아래에 물건이 늘어서 있다.'];
    Incidents.notice(S, 'market', { item: 'herb', browse: true }); // 약초 값과 재고가 눈에 들어온다
    while (open(S)) {
      await ui.page([...out, '', `주머니에는 동전 ${S.W.player.money}닢이 있다.`]);
      const w = wares(S), o = offers(S);
      const opts = [
        ...w.map((x) => ({ act: 'buy', item: x.item, label: `${J(Player.label(x.item, S.P), '을를')} 산다`, hint: `${x.price}닢` })),
        ...o.map((x) => ({ act: 'sell', item: x.item, label: `${J(Player.label(x.item, S.P), '을를')} 판다`, hint: `${x.price}닢` })),
        { act: 'leave', label: '그만둔다', sep: true },
      ];
      const { idx } = await ui.choose(opts);
      const c = opts[idx];
      if (c.act === 'leave') return 'ok';
      out = c.act === 'buy' ? buy(S, c.item) : sell(S, c.item);
    }
    await ui.page(['가게 주인이 천막을 걷고 있다. 오늘 장사는 끝난 모양이다.']);
    await ui.more();
    return 'ok';
  }

  return { open, wares, offers, buy, sell, run };
})();

if (typeof module !== 'undefined') module.exports = { Shop };

</script>
<script>/* js/play/companion.js */
// 동행 — 스토리_재설계.md 6절 "함께 여행". 믿는 사람과 함께 다닌다. 함께 걸으면 가까워지고, 말을 배운다.
// 믿음이 무너지거나, 너무 위험한 곳으로 가려 하거나, 해야 할 일이 있으면 따라오지 않는다. 값은 RULES.companion.
const Companion = (() => {
  const J = (w, t) => w + Text.josa(w, t);
  const list = (W) => W.player.companions.map((id) => W.npcs[id]).filter(Boolean);

  function canAsk(S, n) {
    const { W } = S;
    if (!n.alive || W.player.companions.includes(n.id) || n.flags.caring) return false;
    const r = Rel.get(W, n.id, 'player');
    return r.trust >= RULES.companion.minTrust && r.hostility < 20;
  }

  function join(S, id) {
    const { W } = S;
    const n = W.npcs[id];
    if (!W.player.companions.includes(id)) W.player.companions.push(id);
    n.flags.follow = 'player';
    if (!Memory.has(n, 'player', 'travelled_with')) Memory.add(S, n, { type: 'travelled_with', subject: 'player' });
    Bus.emit(S, 'COMPANION_JOINED', { npcId: id });
  }

  function leave(S, id, why) {
    const { W } = S;
    const n = W.npcs[id];
    W.player.companions = W.player.companions.filter((x) => x !== id);
    if (n) n.flags.follow = null;
    Bus.emit(S, 'COMPANION_LEFT', { npcId: id, why: why || null });
  }

  // 함께 가자는 손짓. 할 일(일하는 시간의 일터)이 있거나 몸이 성치 않으면 거절한다.
  function ask(S, n) {
    const { W } = S;
    const who = Narrative.who(S, n);
    const sched = Schedule.current(n, W.time.t);
    if (sched && sched.act === 'work' && Npc.atHome(n)) return [`${J(who, '이가')} 고개를 젓는다. 하던 일 쪽을 턱으로 가리킨다.`];
    if (!Behavior.canTravel(n)) return [`${J(who, '이가')} 다친 곳을 가리키며 고개를 젓는다.`];
    join(S, n.id);
    return [`${J(who, '이가')} 잠시 망설이더니, 고개를 끄덕인다.`];
  }

  // 플레이어가 자리를 옮기면 곁에 있던 동행도 함께 간다. 너무 위험한 곳이면 따라오지 않는다.
  function onMove(S, from, to) {
    const { W } = S;
    const lines = [];
    list(W).forEach((n) => {
      const who = Narrative.who(S, n);
      if (!n.alive) { leave(S, n.id, 'dead'); return; }
      if (n.location.transit || n.location.loc !== from) return;
      const r = Rel.get(W, n.id, 'player');
      if (r.trust < RULES.companion.leaveTrust || r.hostility >= 30) {
        leave(S, n.id, 'distrust');
        lines.push(`${J(who, '은는')} 따라오지 않는다.`);
        return;
      }
      if (W.regions[Places.regionOf(to)].threat > RULES.companion.refuseDanger) {
        leave(S, n.id, 'danger');
        lines.push(`${J(who, '이가')} 그쪽을 보더니 걸음을 멈춘다. 가지 않겠다는 얼굴이다.`);
        return;
      }
      Npc.place(S, n, to);
      Rel.change(S, n.id, 'player', { familiarity: 2 }, 'walked_together', true);
      // 함께 걷다 보면 가끔 무언가를 가리키며 말을 가르쳐 준다
      if (Rng.chance(W, 0.3) && Lang.canTeach(S, n) && r.trust >= n.teach.minTrust) Lang.teach(S, n);
    });
    return lines;
  }

  return { list, canAsk, join, leave, ask, onMove };
})();

if (typeof module !== 'undefined') module.exports = { Companion };

</script>
<script>/* js/play/clues.js */
// 단서 — 스토리_재설계.md 7절. 어떤 활동에서든 단서 조각이 쌓인다 (알아낸 사실, 엿들은 소문).
// 같은 갈래(thread)의 단서가 정해진 수만큼 모이면 그 갈래가 "열린다". 열린 뒤 무슨 사건이 이어지는지는 스토리가 정한다
// (지금은 수첩에 기록하고 W.worldFlags.threads에 표시만 한다). 단서 목록과 갈래는 RULES.clues / RULES.threads [임시].
const Clues = (() => {
  function gain(S, id, from) {
    const { P, W } = S;
    const c = RULES.clues[id];
    if (!c || P.clues[id]) return false;
    P.clues[id] = { t: W.time.t, from };
    Bus.emit(S, 'CLUE_FOUND', { clueId: id, thread: c.thread, from });
    check(S, c.thread);
    return true;
  }

  function check(S, thread) {
    const { P, W } = S;
    const T = RULES.threads[thread];
    if (!T || P.threads[thread]) return;
    const n = Object.keys(P.clues).filter((id) => RULES.clues[id] && RULES.clues[id].thread === thread).length;
    if (n < T.need) return;
    P.threads[thread] = W.time.t;
    W.worldFlags.threads = W.worldFlags.threads || {};
    W.worldFlags.threads[thread] = W.time.t;
    W.worldFlags.notes.push({ t: `……${T.ko}.`, cls: 'know' });
    Bus.emit(S, 'THREAD_OPENED', { thread });
  }

  // 알아낸 사실에서
  function onFact(S, fact) {
    Object.entries(RULES.clues).forEach(([id, c]) => { if (c.from.fact && c.from.fact.includes(fact)) gain(S, id, 'fact:' + fact); });
  }
  // 엿들은 소문에서
  function onRumor(S, type) {
    Object.entries(RULES.clues).forEach(([id, c]) => { if (c.from.rumor && c.from.rumor.includes(type)) gain(S, id, 'rumor:' + type); });
  }

  // 수첩: 마음에 걸리는 것
  function lines(S) {
    const { P } = S;
    const ids = Object.keys(P.clues).filter((id) => RULES.clues[id]);
    if (!ids.length) return [];
    return ['', '마음에 걸리는 것', ...ids.map((id) => ({ t: '· ' + RULES.clues[id].text, cls: 'note' })),
      ...Object.keys(P.threads).map((t) => ({ t: `— ${RULES.threads[t].ko}`, cls: 'know' }))];
  }

  return { gain, check, onFact, onRumor, lines };
})();

if (typeof module !== 'undefined') module.exports = { Clues };

</script>
