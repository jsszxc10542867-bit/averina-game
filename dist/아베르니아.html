// 일 (품삯) — 스토리_재설계.md 6절 "생활". 일을 거들면 돈, 그 사람의 호감, 직업 경향, 소문이 남는다.
// 일거리는 data/rules.js의 RULES.jobs. 일을 주는 사람이 그 시각에 그곳에 있어야 하고, 나를 그만큼 믿어야 한다.
// 말이 통하지 않아도 일은 손짓으로 통한다.
const Work = (() => {
  const J = (w, t) => w + Text.josa(w, t);

  // 지금 이 자리에서 거들 수 있는 일
  function available(S) {
    const { W } = S;
    const h = Time.hour(W.time.t);
    return Object.entries(RULES.jobs).filter(([, j]) => {
      if (j.lodgingOnly) return false; // 잠자리 값으로만 하는 일 (lodging.js)
      if (j.at !== W.player.loc || h < j.hours[0] || h >= j.hours[1]) return false;
      const giver = W.npcs[j.giver];
      if (!giver || !Npc.present(W, giver)) return false;
      const r = Rel.get(W, j.giver, 'player');
      return r.trust >= j.minTrust && r.hostility < 30 && r.suspicion < 70;
    }).map(([id, job]) => ({ id, job }));
  }

  // 일을 한다. 흐른 시간의 줄은 pass(min, opt)가 만든다 (engine의 passTime)
  function perform(S, id, pass) {
    const { W } = S;
    const job = RULES.jobs[id];
    const giver = W.npcs[job.giver];
    const who = Narrative.who(S, giver);
    const me = W.player;
    const lines = [`${J(who, '이가')} 손짓으로 할 일을 보여 준다.`, '', ...job.lines];
    Player.use(S, job.stat);
    Player.use(S, job.stat);
    lines.push(...pass(job.min, { work: job.fatigue / job.min }));
    if (!giver.alive || me.hp <= 0) return lines;
    // 품삯: 돈이 모자라면 먹을 것으로 준다
    let paid = job.pay;
    if (giver.money >= paid) { giver.money -= paid; me.money += paid; lines.push('', `일이 끝나자 ${J(who, '이가')} 동전 ${paid}닢을 손에 쥐여 준다.`); }
    else { paid = 0; Player.give(me, 'bread'); lines.push('', `${J(who, '이가')} 동전 대신 빵 한 덩이를 내민다.`); }
    me.tendency[job.tendency] = (me.tendency[job.tendency] || 0) + job.min;
    Rel.change(S, job.giver, 'player', { trust: 3, familiarity: 5, respect: 2 }, 'worked');
    // 같은 사람과 하루에 한 번만 기억과 소문이 된다 (매번 부풀지 않게)
    const today = Time.day(W.time.t);
    if (giver.flags.workedDay !== today) {
      giver.flags.workedDay = today;
      Memory.add(S, giver, { type: 'worked_with', subject: 'player', detail: id });
      WorldEvents.record(S, 'player_worked', { loc: me.loc, actors: ['player', giver.id], witnesses: [giver.id],
        data: { subject: 'player', target: giver.id, job: id } });
    }
    // 일이 마을을 조금 바꾼다
    const v = W.economy.markets.village_square;
    if (id === 'field') v.stock.bread = (v.stock.bread || 0) + 1;
    if (id === 'errand') v.salesToday += 2;
    if (id === 'watch') W.regions.village.alert = Math.max(W.regions.village.alert, 40);
    if (id === 'herbs' && giver.inventory.herb > 0) { giver.inventory.herb--; giver.inventory.bandage = (giver.inventory.bandage || 0) + 1; }
    Bus.emit(S, 'PLAYER_WORKED', { job: id, giver: giver.id, paid });
    const thanks = Dialogue.process(S, { speakerId: giver.id, listenerId: 'player', dialogueId: 'thanks' });
    lines.push(thanks.displayText);
    return lines;
  }

  // 가장 많이 해 온 일 (직업 경향. 숫자는 보여 주지 않는다)
  function tendencyLines(S) {
    const t = S.W.player.tendency;
    const top = Object.entries(t).filter(([, m]) => m >= 60).sort((a, b) => b[1] - a[1]);
    return top.map(([k, m]) => ({ t: `· ${RULES.tendencyKo[k] || k} — ${m >= 600 ? '손에 익었다' : m >= 240 ? '조금 익숙하다' : '해 본 적 있다'}`, cls: 'note' }));
  }

  return { available, perform, tendencyLines };
})();

if (typeof module !== 'undefined') module.exports = { Work };

</script>
<script>/* js/play/lodging.js */
// 거처 — 스토리_재설계.md 6절 "잠자리 문제", 스토리설계.md PART 5 단계 5 [결정 #10].
// 첫 잠자리는 앞의 행동에 따라 갈린다: 리아의 말로 노파가 헛간을 내준다 / 일을 거들고 재워 달라고 한다 /
// 교회의 구호를 받는다 / 울타리 밑에서 노숙한다. 어느 길이 정답인지 게임은 알려 주지 않는다.
// 어디서 자느냐가 회복, 안전, 사람들과의 관계를 바꾼다. 거처 목록은 RULES.lodgings, 잠의 효과는 RULES.sleep.
const Lodging = (() => {
  const J = (w, t) => w + Text.josa(w, t);
  const today = (W) => Time.day(W.time.t - 6 * 60); // 밤은 전날에 속한다 (새벽 6시가 하루의 경계)
  const stayId = (id) => RULES.lodgings[id].stays || id;

  // 지금 이 자리에서 구할 수 있는 잠자리
  function offers(S) {
    const { W } = S;
    const me = W.player;
    const h = Time.hour(W.time.t);
    const night = h >= 17 || h < 5; // 저녁부터 새벽 전까지
    const paidTonight = me.lodging && me.lodging.paidDay === today(W);
    return Object.entries(RULES.lodgings).filter(([id, l]) => {
      if (l.at !== me.loc) return false;
      if (me.lodging && stayId(id) === me.lodging.id && (paidTonight || !l.price)) return false; // 이미 오늘 밤 잘 곳이다
      if (l.charity) {
        const used = me.charityNights || 0;
        return night && me.money <= l.charity.maxMoney && used < l.charity.maxNights;
      }
      if (!l.owner) return night && !me.lodging;
      const o = W.npcs[l.owner];
      if (!o || !Npc.present(W, o)) return false;
      const r = Rel.get(W, l.owner, 'player');
      if (r.trust < l.minTrust || r.hostility >= 30) return false;
      if (l.work) {
        const job = RULES.jobs[l.work];
        return h >= job.hours[0] && h < job.hours[1] && r.suspicion < 70;
      }
      return me.money >= l.price;
    }).map(([id, l]) => ({ id, l }));
  }

  function label(id) {
    const l = RULES.lodgings[id];
    if (l.work) return '일을 거들고 재워 달라고 한다';
    if (l.charity) return `${l.label}에 몸을 누일 수 있을지 살펴본다`;
    if (!l.owner) return `${l.label}에서 밤을 나기로 한다`;
    return `잠자리를 부탁한다 (${l.label})`;
  }

  function settle(S, id) {
    const { W } = S;
    W.player.lodging = { id: stayId(id), since: W.time.t, paidDay: today(W) };
    Bus.emit(S, 'LODGING_CHANGED', { lodging: stayId(id), via: id });
  }

  // 잠자리를 얻는다. pass(min, opt)는 시간을 흘린다 (일로 치를 때)
  function take(S, id, pass) {
    const { W } = S;
    const l = RULES.lodgings[id];
    const me = W.player;
    if (l.charity) {
      settle(S, id);
      return ['안은 비어 있다. 누가 쓰라고 개어 둔 것인지, 담요가 몇 장 있다.', '……오늘 밤은 여기 신세를 지기로 한다.'];
    }
    if (!l.owner) {
      settle(S, id);
      return ['울타리 밑, 바람이 덜 드는 자리를 봐 둔다.', '……오늘 밤은 여기서 버텨야 한다.'];
    }
    const o = W.npcs[l.owner];
    const who = Narrative.who(S, o);
    Memory.add(S, o, { type: 'sheltered', subject: 'player', detail: id });
    Rel.change(S, l.owner, 'player', { familiarity: 5 }, 'lodging', true);
    if (l.work) {
      // 돈 대신 일로 치른다: 먼저 일을 하고, 그러면 방을 내준다
      const lines = ['주머니를 뒤집어 보이고, 가게 안쪽과 나를 번갈아 가리킨다.', `${J(who, '이가')} 나를 한참 보더니, 빗자루를 내민다.`, '', ...RULES.jobs[l.work].lines];
      lines.push(...pass(RULES.jobs[l.work].min, { work: RULES.jobs[l.work].fatigue / RULES.jobs[l.work].min }));
      me.tendency[RULES.jobs[l.work].tendency] = (me.tendency[RULES.jobs[l.work].tendency] || 0) + RULES.jobs[l.work].min;
      Rel.change(S, l.owner, 'player', { trust: 3, familiarity: 3 }, 'chores');
      settle(S, id);
      lines.push('', `일이 끝나자 ${J(who, '이가')} 가게 뒤쪽의 작은 방을 가리킨다.`);
      return lines;
    }
    if (l.price) { me.money -= l.price; o.money += l.price; }
    settle(S, id);
    return l.price
      ? [`${who}에게 동전 ${l.price}닢을 내민다.`, `${J(who, '이가')} 동전을 세어 보고, 가게 뒤쪽의 작은 방을 가리킨다.`]
      : [`${J(who, '이가')} 나를 한참 보더니, 헛간 쪽을 턱으로 가리킨다.`, '마른 풀 냄새가 난다. 지붕이 있다.'];
  }

  // 잘 수 있는가: 내 거처에 있고, 저녁 6시 이후 또는 새벽 5시 전
  function canSleep(S) {
    const me = S.W.player;
    if (!me.lodging || RULES.lodgings[me.lodging.id].at !== me.loc) return false;
    const h = Time.hour(S.W.time.t);
    return h >= 18 || h < 5;
  }

  // 잔다. 아침(6시)까지. 흐른 시간의 줄은 pass가 만든다
  function sleep(S, pass) {
    const { W } = S;
    const me = W.player;
    const l = RULES.lodgings[me.lodging.id];
    const q = l.quality;
    const lines = [q === 0 ? '울타리 밑에 몸을 웅크린다. 땅이 차다.' : q === 1 ? '마른 풀과 담요 위에 몸을 누인다.' : '좁지만 벽과 지붕이 있는 방이다. 눕자마자 눈이 감긴다.'];
    // 방값은 하룻밤마다 한 번 (이미 치렀으면 받지 않는다. 못 내면 주인의 신뢰가 깎인다)
    if (l.price && me.lodging.paidDay !== today(W)) {
      const o = W.npcs[l.owner];
      if (me.money >= l.price) { me.money -= l.price; o.money += l.price; me.lodging.paidDay = today(W); }
      else { Rel.change(S, l.owner, 'player', { trust: -10, resentment: 5 }, 'unpaid'); lines.push('……방값을 치를 돈이 없다. 주인의 눈초리가 차갑다.'); }
    }
    if (l.charity) me.charityNights = (me.charityNights || 0) + 1;
    lines.push(...pass(Time.untilDawn(W.time.t), { sleep: true, quality: q }));
    // 노숙은 도둑과 추위에 약하다
    const items = Object.keys(me.inv).filter((k) => me.inv[k] > 0);
    if (items.length && Rng.chance(W, RULES.sleep.theftChance[q])) {
      const k = Rng.pick(W, items);
      Player.take(me, k);
      lines.push('', `아침에 보니 ${J(Player.label(k, S.P), '이가')} 없다.`);
    }
    // 방값을 치른 밤이 지났다: 다음 밤은 새로 치러야 한다 / 구호는 하룻밤씩
    if (l.price || l.charity) me.lodging = l.charity ? null : Object.assign(me.lodging, { paidDay: null });
    Bus.emit(S, 'PLAYER_SLEPT', { lodging: me.lodging ? me.lodging.id : 'chapel', quality: q });
    // 나를 믿는 사람은 아침에 찾아온다
    const visitor = Object.values(W.npcs).find((n) => n.alive && Places.regionOf(n.location.loc) === 'village'
      && Rel.get(W, n.id, 'player').trust >= RULES.sleep.visitTrust && Memory.has(n, 'player', 'met'));
    if (visitor) {
      Npc.place(S, visitor, me.loc);
      Player.give(me, 'bread');
      Rel.change(S, visitor.id, 'player', { familiarity: 3 }, 'visited', true);
      lines.push('', `문 두드리는 소리. ${J(Narrative.who(S, visitor), '이가')} 빵 한 덩이를 들고 서 있다.`);
    }
    return lines;
  }

  return { offers, label, take, canSleep, sleep };
})();

if (typeof module !== 'undefined') module.exports = { Lodging };

</script>
<script>/* js/play/shop.js */
// 가게 — 마을 광장의 가게에서 사고판다. 값은 마을 사정(경제 시스템)에 따라 매일 달라진다.
// 말이 통하지 않아도 물건과 동전은 통한다.
const Shop = (() => {
  const J = (w, t) => w + Text.josa(w, t);
  const SELLS = ['bread', 'dried_meat', 'bandage', 'waterskin']; // 플레이어에게 파는 것
  const BUYS = ['herb', 'dried_meat'];                           // 플레이어에게서 사는 것

  const open = (S) => Economy.open(S.W, S.W.player.loc) && S.W.player.loc !== 'far_town';

  // 살 수 있는 것: { item, price }
  function wares(S) {
    const { W } = S;
    const m = Economy.get(W, W.player.loc);
    return SELLS.filter((k) => (m.stock[k] || 0) > 0).map((k) => ({ item: k, price: Math.ceil(Economy.priceOf(W, W.player.loc, k)) }));
  }
  // 팔 수 있는 것: { item, price }
  function offers(S) {
    const { W } = S;
    return BUYS.filter((k) => W.player.inv[k] > 0).map((k) => ({ item: k, price: Math.max(1, Math.floor(Economy.priceOf(W, W.player.loc, k) * 0.6)) }));
  }

  function buy(S, item) {
    const { W } = S;
    const me = W.player;
    const loc = me.loc;
    const m = Economy.get(W, loc);
    const price = Math.ceil(Economy.priceOf(W, loc, item));
    const owner = W.npcs[Economy.merchantAt(W, loc)];
    const who = Narrative.who(S, owner);
    if (me.money < price) return [`${J(Player.label(item, S.P), '을를')} 가리킨다.`, `${J(who, '이가')} 손가락 ${price}개를 펴 보인다. ……돈이 모자라다.`];
    me.money -= price;
    owner.money += price;
    m.stock[item]--;
    m.salesToday += price;
    Player.give(me, item);
    Rel.change(S, owner.id, 'player', { familiarity: 2 }, 'bought', true);
    return [`${J(Player.label(item, S.P), '을를')} 가리킨다.`, `${J(who, '이가')} 손가락 ${price}개를 펴 보인다. 동전을 건넨다.`];
  }

  function sell(S, item) {
    const { W } = S;
    const me = W.player;
    const loc = me.loc;
    const price = Math.max(1, Math.floor(Economy.priceOf(W, loc, item) * 0.6));
    const owner = W.npcs[Economy.merchantAt(W, loc)];
    const who = Narrative.who(S, owner);
    if (owner.money < price) return [`${J(who, '이가')} 고개를 젓는다. 지금은 살 돈이 없는 모양이다.`];
    owner.money -= price;
    me.money += price;
    Player.take(me, item);
    Economy.get(W, loc).stock[item] = (Economy.get(W, loc).stock[item] || 0) + 1;
    return [`${J(Player.label(item, S.P), '을를')} 내민다.`, `${J(who, '이가')} 이리저리 살펴보더니 동전 ${price}닢을 내준다.`];
  }

  // 가게 앞에서 고른다 (장면처럼 ui를 받는다)
  async function run(ui) {
    const { S } = ui;
    let out = ['가게 앞에 선다. 천막 아래에 물건이 늘어서 있다.'];
    while (open(S)) {
      await ui.page([...out, '', `주머니에는 동전 ${S.W.player.money}닢이 있다.`]);
      const w = wares(S), o = offers(S);
      const opts = [
        ...w.map((x) => ({ act: 'buy', item: x.item, label: `${J(Player.label(x.item, S.P), '을를')} 산다`, hint: `${x.price}닢` })),
        ...o.map((x) => ({ act: 'sell', item: x.item, label: `${J(Player.label(x.item, S.P), '을를')} 판다`, hint: `${x.price}닢` })),
        { act: 'leave', label: '그만둔다', sep: true },
      ];
      const { idx } = await ui.choose(opts);
      const c = opts[idx];
      if (c.act === 'leave') return 'ok';
      out = c.act === 'buy' ? buy(S, c.item) : sell(S, c.item);
    }
    await ui.page(['가게 주인이 천막을 걷고 있다. 오늘 장사는 끝난 모양이다.']);
    await ui.more();
    return 'ok';
  }

  return { open, wares, offers, buy, sell, run };
})();

if (typeof module !== 'undefined') module.exports = { Shop };

</script>
<script>/* js/play/companion.js */
// 동행 — 스토리_재설계.md 6절 "함께 여행". 믿는 사람과 함께 다닌다. 함께 걸으면 가까워지고, 말을 배운다.
// 믿음이 무너지거나, 너무 위험한 곳으로 가려 하거나, 해야 할 일이 있으면 따라오지 않는다. 값은 RULES.companion.
const Companion = (() => {
  const J = (w, t) => w + Text.josa(w, t);
  const list = (W) => W.player.companions.map((id) => W.npcs[id]).filter(Boolean);

  function canAsk(S, n) {
    const { W } = S;
    if (!n.alive || W.player.companions.includes(n.id) || n.flags.caring) return false;
    const r = Rel.get(W, n.id, 'player');
    return r.trust >= RULES.companion.minTrust && r.hostility < 20;
  }

  function join(S, id) {
    const { W } = S;
    const n = W.npcs[id];
    if (!W.player.companions.includes(id)) W.player.companions.push(id);
    n.flags.follow = 'player';
    if (!Memory.has(n, 'player', 'travelled_with')) Memory.add(S, n, { type: 'travelled_with', subject: 'player' });
    Bus.emit(S, 'COMPANION_JOINED', { npcId: id });
  }

  function leave(S, id, why) {
    const { W } = S;
    const n = W.npcs[id];
    W.player.companions = W.player.companions.filter((x) => x !== id);
    if (n) n.flags.follow = null;
    Bus.emit(S, 'COMPANION_LEFT', { npcId: id, why: why || null });
  }

  // 함께 가자는 손짓. 할 일(일하는 시간의 일터)이 있거나 몸이 성치 않으면 거절한다.
  function ask(S, n) {
    const { W } = S;
    const who = Narrative.who(S, n);
    const sched = Schedule.current(n, W.time.t);
    if (sched && sched.act === 'work' && Npc.atHome(n)) return [`${J(who, '이가')} 고개를 젓는다. 하던 일 쪽을 턱으로 가리킨다.`];
    if (!Behavior.canTravel(n)) return [`${J(who, '이가')} 다친 곳을 가리키며 고개를 젓는다.`];
    join(S, n.id);
    return [`${J(who, '이가')} 잠시 망설이더니, 고개를 끄덕인다.`];
  }

  // 플레이어가 자리를 옮기면 곁에 있던 동행도 함께 간다. 너무 위험한 곳이면 따라오지 않는다.
  function onMove(S, from, to) {
    const { W } = S;
    const lines = [];
    list(W).forEach((n) => {
      const who = Narrative.who(S, n);
      if (!n.alive) { leave(S, n.id, 'dead'); return; }
      if (n.location.transit || n.location.loc !== from) return;
      const r = Rel.get(W, n.id, 'player');
      if (r.trust < RULES.companion.leaveTrust || r.hostility >= 30) {
        leave(S, n.id, 'distrust');
        lines.push(`${J(who, '은는')} 따라오지 않는다.`);
        return;
      }
      if (W.regions[Places.regionOf(to)].threat > RULES.companion.refuseDanger) {
        leave(S, n.id, 'danger');
        lines.push(`${J(who, '이가')} 그쪽을 보더니 걸음을 멈춘다. 가지 않겠다는 얼굴이다.`);
        return;
      }
      Npc.place(S, n, to);
      Rel.change(S, n.id, 'player', { familiarity: 2 }, 'walked_together', true);
      // 함께 걷다 보면 가끔 무언가를 가리키며 말을 가르쳐 준다
      if (Rng.chance(W, 0.3) && Lang.canTeach(S, n) && r.trust >= 45) Lang.teach(S, n);
    });
    return lines;
  }

  return { list, canAsk, join, leave, ask, onMove };
})();

if (typeof module !== 'undefined') module.exports = { Companion };

<script>/* js/play/clues.js */
// 단서 — 스토리_재설계.md 7절. 어떤 활동에서든 단서 조각이 쌓인다 (알아낸 사실, 엿들은 소문).
// 같은 갈래(thread)의 단서가 정해진 수만큼 모이면 그 갈래가 "열린다". 열린 뒤 무슨 사건이 이어지는지는 스토리가 정한다
// (지금은 수첩에 기록하고 W.worldFlags.threads에 표시만 한다). 단서 목록과 갈래는 RULES.clues / RULES.threads [임시].
const Clues = (() => {
  function gain(S, id, from) {
    const { P, W } = S;
    const c = RULES.clues[id];
    if (!c || P.clues[id]) return false;
    P.clues[id] = { t: W.time.t, from };
    Bus.emit(S, 'CLUE_FOUND', { clueId: id, thread: c.thread, from });
    check(S, c.thread);
    return true;
  }

  function check(S, thread) {
    const { P, W } = S;
    const T = RULES.threads[thread];
    if (!T || P.threads[thread]) return;
    const n = Object.keys(P.clues).filter((id) => RULES.clues[id] && RULES.clues[id].thread === thread).length;
    if (n < T.need) return;
    P.threads[thread] = W.time.t;
    W.worldFlags.threads = W.worldFlags.threads || {};
    W.worldFlags.threads[thread] = W.time.t;
    W.worldFlags.notes.push({ t: `……${T.ko}.`, cls: 'know' });
    Bus.emit(S, 'THREAD_OPENED', { thread });
  }

  // 알아낸 사실에서
  function onFact(S, fact) {
    Object.entries(RULES.clues).forEach(([id, c]) => { if (c.from.fact && c.from.fact.includes(fact)) gain(S, id, 'fact:' + fact); });
  }
  // 엿들은 소문에서
  function onRumor(S, type) {
    Object.entries(RULES.clues).forEach(([id, c]) => { if (c.from.rumor && c.from.rumor.includes(type)) gain(S, id, 'rumor:' + type); });
  }

  // 수첩: 마음에 걸리는 것
  function lines(S) {
    const { P } = S;
    const ids = Object.keys(P.clues).filter((id) => RULES.clues[id]);
    if (!ids.length) return [];
    return ['', '마음에 걸리는 것', ...ids.map((id) => ({ t: '· ' + RULES.clues[id].text, cls: 'note' })),
      ...Object.keys(P.threads).map((t) => ({ t: `— ${RULES.threads[t].ko}`, cls: 'know' }))];
  }

  return { gain, check, onFact, onRumor, lines };
})();

if (typeof module !== 'undefined') module.exports = { Clues };

</script>
<script>/* js/play/life.js */
// 생활 선택지 모음 — 지금 이 자리에서 할 수 있는 일(품삯), 잠자리, 잠, 가게, 동행과 헤어지기.
// 탐색 화면(engine.js)이 장소의 행동 다음에 붙인다. pass(min, opt)는 시간을 흘리고 그 사이의 줄을 돌려준다.
const Life = (() => {
  const J = (w, t) => w + Text.josa(w, t);

  function options(S, pass) {
    const { W } = S;
    const opts = [];
    Work.available(S).forEach(({ id, job }) => opts.push({ label: job.label, hint: '품삯', life: true, run: () => Work.perform(S, id, pass) }));
    // 잠자리: 어느 길이 나은지 알려 주지 않는다 (값만 적는다)
    Lodging.offers(S).forEach(({ id, l }) => opts.push({
      label: Lodging.label(id), hint: l.price ? `하룻밤 ${l.price}닢` : null, life: true,
      run: () => { const lines = Lodging.take(S, id, pass); return l.work ? lines : [...lines, ...pass(5)]; },
    }));
    if (Lodging.canSleep(S)) opts.push({ label: '잠을 잔다', kw: ['잔다', '잠', '자자', '눕'], life: true, run: () => Lodging.sleep(S, pass) });
    if (Shop.open(S)) opts.push({ label: '가게를 둘러본다', kw: ['가게', '사', '팔', '물건'], life: true, scene: 'shop' });
    Companion.list(W).filter((n) => Npc.present(W, n)).forEach((n) => {
      const who = Narrative.who(S, n);
      opts.push({ label: `${J(who, '과와')} 헤어진다`, life: true, run: () => {
        Companion.leave(S, n.id, 'parted');
        return [`${who}에게 손을 들어 보인다.`, `${J(who, '은는')} 고개를 끄덕이고 제 갈 길로 간다.`, ...pass(5)];
      } });
    });
    return opts;
  }

  return { options };
})();

if (typeof module !== 'undefined') module.exports = { Life };

<script>/* js/core/world.js */
// 세계 상태 (통합 명세 3절)와 월드 틱 (5절). 세계 상태가 곧 진실이다: 모든 시스템은 여기를 바꾼다.
const World = (() => {
  // 씨앗이 늘 같다: 새로 시작하면 같은 세계, 같은 하늘이다. 달라지는 것은 플레이어의 선택뿐이다.
  const SEED = 20260929;

  function create() {
    const W = {
      v: 2, seq: 0, rng: SEED,
      time: { t: Time.START },
      weather: Weather.create(SEED ^ 0x5bd1e995),
      player: Player.create(),
      npcs: Npc.createAll(),
      creatures: Creatures.createAll(),
      locations: Places.createState(),
      regions: Regions.create(),
      factions: Factions.create(),
      politics: Factions.createPolitics(),
      relationships: {},
      events: { log: [], active: {}, scheduled: WorldEvents.initialSchedule() },
      rumors: {},
      economy: Economy.create(),
      // 장면 진행 표시: seen(한 번만 나오는 장면), counts(반복 행동 횟수), done(장소에서 해 본 일),
      // pending(곧 벌어질 장면), notes(몸의 알림), feed(곁에서 벌어진 일), end(1장의 끝)
      worldFlags: { seen: {}, counts: {}, done: {}, pending: [], notes: [], feed: [], end: null, day2Acts: 0 },
      history: [],
    };
    Rel.seed(W);
    return W;
  }

  // min분 동안 세계를 흘린다. opt: { rest, sleep, move, fight, story }
  // 결과: { spent, lines(대본 사건), body(몸의 느낌) }. 밤의 목소리처럼 대본 사건이 시간을 멈추면 spent < min
  function tick(S, min, opt = {}) {
    const { W } = S;
    const from = W.time.t;
    let to = from + Math.max(0, min);
    const story = opt.story === false ? { lines: [], stopAt: null } : Story.clock(S, from, to);
    if (story.stopAt != null) to = story.stopAt;
    Regions.updateLevels(S);
    const body = [];
    let t = from;
    while (t < to) {
      const prev = t;
      t = Math.min(to, t + Regions.STEP.active);
      W.time.t = t;
      Weather.update(S, prev);                       // updateWeather
      body.push(...Player.update(S, t - prev, opt)); // updatePlayer
      Regions.simulate(S, t);                        // updateNPCs, updateCreatures (지역마다 정밀도가 다르다)
      WorldEvents.process(S, prev);                  // processEvents
      if (Math.floor(prev / 60) !== Math.floor(t / 60)) hourly(S);
      if (Time.crossed(prev, t, 6)) daily(S);
    }
    W.time.t = to;
    return { spent: to - from, lines: story.lines, body };
  }

  // 한 시간마다: 관계의 감정이 가라앉고(processRelationships), 흔적이 사라지고(updateLocations), 마력이 돌아온다
  function hourly(S) {
    Rel.process(S);
    Places.update(S);
    Magic.regen(S);
  }

  // 하루마다 (새벽 6시): 지역의 위협, 세력(updateFactions), 경제(updateEconomy), 기억과 소문의 망각, 기록(recordHistory)
  function daily(S) {
    Regions.daily(S);
    Factions.daily(S);
    Economy.daily(S);
    Memory.decay(S);
    Rumor.daily(S);
    recordHistory(S);
  }

  function recordHistory(S) {
    const { W } = S;
    const v = W.economy.markets.village_square;
    W.history.push({
      day: Time.day(W.time.t),
      dead: Object.values(W.npcs).filter((n) => !n.alive).map((n) => n.id),
      events: W.events.log.length,
      rumors: Object.keys(W.rumors).length,
      villageThreat: Math.round(W.regions.village.threat),
      bread: v.price.bread,
      tension: Math.round(W.politics.tension),
    });
    if (W.history.length > 60) W.history.shift();
  }

  return { SEED, create, tick, hourly, daily };
})();

if (typeof module !== 'undefined') module.exports = { World };

</script>
<script>/* js/state.js */
// 플레이어가 아는 것 (P)과 저장/불러오기.
// P: 이름, 쓰러진 횟수, 기억 조각, 알아낸 사실, 발견한 장소·사람·사건·소문, 단서, 언어, 마법에 대한 이해 — 모두 쌓인다
// W: 세계 상태 (core/world.js). 둘 다 저장된다. (되감기는 폐기되었다: 스토리_재설계.md 0절)
const Persist = (() => {
  function create() {
    return {
      v: 2,
      name: null,
      collapses: 0, // 쓰러진 횟수 (엔딩 변수로 쓸 수 있다)
      memory: {
        identity: true, name: false, family: 'unknown',
        previousLocation: 'unknown', lastMoment: 'unknown', worldKnowledge: 0,
      },
      knowledge: {},              // 알아낸 사실 (수첩). world.js의 KNOW
      found: Knowledge.create(),  // 발견한 장소·사람·사건·소문 (통합 명세 19·20절)
      lang: LangStore.create(),   // 언어 지식 (언어 시스템 35절)
      magic: { understanding: {} },
      clues: {},                  // 모은 단서 { id: { t, from } } (play/clues.js)
      threads: {},                // 열린 단서 갈래 { thread: t }
    };
  }
  return { create };
})();

// 저장 (통합 명세 32절): P와 W를 통째로. 불러오면 같은 세계가 이어진다 (난수 씨앗도 W 안에 있다).
const Save = (() => {
  const KEY = 'avernia_save_v2';
  const OLD = 'avernia_save_v1';
  const plain = (o) => o && typeof o === 'object' && !Array.isArray(o);

  // 저장한 뒤에 코드가 새 칸을 더했어도 비어 있지 않게 채운다 (없는 칸만. 있는 값은 건드리지 않는다)
  function fill(target, defaults) {
    Object.keys(defaults).forEach((k) => {
      if (target[k] === undefined) target[k] = JSON.parse(JSON.stringify(defaults[k]));
      else if (plain(target[k]) && plain(defaults[k])) fill(target[k], defaults[k]);
    });
    return target;
  }

  function write(S) {
    try { localStorage.setItem(KEY, JSON.stringify({ v: 2, P: S.P, W: S.W })); } catch (e) { /* 저장할 수 없는 환경 */ }
  }

  // { P, W, migrated } 또는 null
  function read() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY));
      if (s && s.v === 2 && s.P && s.W) return load(s);
      const old = JSON.parse(localStorage.getItem(OLD));
      if (old && old.v === 1 && old.P) return fromV1(old);
    } catch (e) { /* 깨진 저장 파일은 없는 것으로 본다 */ }
    return null;
  }

  // 없는 칸만 더한다. 안으로 들어가지 않는다.
  function shallow(target, defaults) {
    if (!plain(target) || !plain(defaults)) return;
    Object.keys(defaults).forEach((k) => { if (target[k] === undefined) target[k] = JSON.parse(JSON.stringify(defaults[k])); });
  }

  // 세계는 "구조"만 채운다. 소지품·관계·소문·흔적 같은 목록은 채우지 않는다
  // (먹어 없앤 빵이나 잊힌 소문이 되살아나면 안 된다)
  function fillWorld(W) {
    const d = World.create();
    shallow(W, d);
    ['time', 'weather', 'worldFlags', 'events', 'economy', 'politics'].forEach((k) => shallow(W[k], d[k]));
    shallow(W.player, d.player);
    ['surv', 'acc', 'status', 'magic'].forEach((k) => shallow(W.player[k], d.player[k]));
    Object.keys(d.npcs).forEach((id) => {
      if (!W.npcs[id]) { W.npcs[id] = d.npcs[id]; return; } // 새로 생긴 사람
      shallow(W.npcs[id], d.npcs[id]);
      ['physical', 'mental', 'needs', 'location', 'knowledge'].forEach((k) => shallow(W.npcs[id][k], d.npcs[id][k]));
    });
    Object.keys(d.creatures).forEach((id) => { if (!W.creatures[id]) W.creatures[id] = d.creatures[id]; else shallow(W.creatures[id], d.creatures[id]); });
    Object.keys(d.regions).forEach((id) => { if (!W.regions[id]) W.regions[id] = d.regions[id]; else shallow(W.regions[id], d.regions[id]); });
    Object.keys(d.locations).forEach((id) => { if (!W.locations[id]) W.locations[id] = d.locations[id]; });
    return W;
  }

  function load(s) {
    fill(s.P, Persist.create());
    LangStore.migrate(s.P);
    fillWorld(s.W);
    return { P: s.P, W: s.W, migrated: false };
  }

  // 예전 저장 파일: 이름·지식·배운 말은 옮기고, 세계는 처음 눈을 뜬 순간부터 다시 시작한다 (구조가 달라 이어 붙일 수 없다)
  function fromV1(old) {
    const P = fill(old.P, Persist.create());
    LangStore.migrate(P);
    P.v = 2;
    return { P, W: World.create(), migrated: true };
  }

  function clear() {
    try { localStorage.removeItem(KEY); localStorage.removeItem(OLD); } catch (e) { /* 무시 */ }
  }

  return { KEY, fill, write, read, load, clear };
})();

if (typeof module !== 'undefined') module.exports = { Persist, Save };

</script>

function listenLines(g) {
  const p = g.period;
  if (g.me.loc === 'deep') return ['숲이 숨을 죽인 것 같다.', '내 숨소리가 가장 크다.'];
  if (g.dark) {

    '귀를 기울인다. 물소리. 바람에 스치는 잎. 새 소리.',
    '그 사이로 무언가 작게 움직이는 소리가 지나간다.',
    '그러다 멎는다.',
  ];
}

function bagLines(S) {
  const me = S.W.player;
  const list = Object.entries(me.inv).filter(([, n]) => n > 0);
  if (!list.length && !me.money) return ['주머니를 뒤져 본다. 비어 있다.', '아무것도 없다.'];
  const lines = ['가진 것을 확인한다.', ...list.map(([k, n]) => `· ${Player.label(k, S.P)} ${n > 1 ? '× ' + n : ''}`.trim())];
  if (me.money) lines.push(`· 동전 ${me.money}닢`);
  if (Player.weight(me) > Player.carryLimit(me)) lines.push('……짐이 무겁다. 걸을 때마다 어깨가 짓눌린다.');
  return lines;
}

// 시계가 넘어가는 순간의 사건 (저녁, 밤, 새벽). 월드 틱이 시간을 흘리기 전에 부른다.
// 첫날 밤 23시의 목소리는 무엇을 하든 그 시각에 끼어든다 (시간이 거기서 멈추고 장면이 열린다).
// 둘째 날 새벽의 리아 습격은 이야기가 아니라 세계 사건이다 (sim/events.js).
const Story = (() => {
  function clock(S, from, to) {
    const { W, P } = S;
    const seen = W.worldFlags.seen;
    const lines = [];
    const events = [];
    for (let d = Math.max(0, Time.day(from) - 2); d <= Time.day(to) - 1; d++) {
      const b = d * Time.DAY;
      events.push({ at: b + 18 * 60, id: 'evening', d });
      events.push({ at: b + 20 * 60, id: 'night', d });
      events.push({ at: b + 23 * 60, id: 'call', d });
      events.push({ at: b + Time.DAY + 6 * 60, id: 'dawn', d });
    }
    events.sort((a, b) => a.at - b.at);
    for (const e of events) {
      if (!(from < e.at && to >= e.at)) continue;
      if (e.id === 'evening') {
        lines.push(...(seen.evening
          ? ['해가 기울고 있다.']
          : ['해가 지기 시작한다.', '숲의 색이 달라진다.', '새들의 소리가 줄어든다.']));
        seen.evening = true;
      } else if (e.id === 'night') {
        if (!seen.night) {
          lines.push('완전히 어두워졌다.', '그리고……', '낮에는 듣지 못했던 소리가 들리기 시작한다.',
            '멀리서 무언가가 운다. 길고 낮은 소리다.', '짐승의 것 같기도, 사람의 것 같기도 하다.');
          P.knowledge.night_cry = true;
        } else lines.push('다시 밤이 왔다.');
        seen.night = true;
      } else if (e.id === 'call') {
        if (e.d === 0 && !seen.call) {
          seen.call = true;
          W.worldFlags.pending.push('call');
          return { lines, stopAt: e.at }; // 여기서 시간이 멈춘다
        }
      } else if (e.id === 'dawn') {
        if (!seen.dawn) {
          lines.push('새벽이 밝아 온다.', '숲은 다시 조용해졌다.', '어젯밤의 일이 꿈이었던 것처럼 느껴진다.',
            '하지만……', '손에 묻은 흙은 그대로다.');
          W.worldFlags.pending.push('status');
        } else lines.push('동이 튼다.');
        seen.dawn = true;
      }
    }
    return { lines, stopAt: null };
  }
  return { clock };
})();

if (typeof module !== 'undefined') {
  module.exports = { SKY, LOCS, KNOW, GLOBAL_ACTIONS, listenLines, bagLines, Story };
}
