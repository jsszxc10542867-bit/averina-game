      avail: (n, c) => n.personality.kindness >= 50 && !!needyHere(n, c) && (!!medicineOf(n) || Magic.canCast(n, 'life', 15)),
      score: (n, c) => {
        const who = needyHere(n, c);
        const r = Rel.peek(c.W, n.id, who.id) || { affection: 0, fear: 0 };
        return n.personality.kindness * 0.5 + r.affection * 0.3 - r.fear * 0.3 + (Goals.get(n, 'heal_people') ? 15 : 0);
      },
      start: (S, n, c) => {
        const who = needyHere(n, c);
        const k = medicineOf(n);
        if (k) useItem(n, k); else Magic.cast(S, n, 'life', { cost: 15, target: who.id });
        if (who.id === 'player') { Player.treat(S); Narrative.feedHelpPlayer(S, n, k); }
        else { who.npc.physical.bleed = 0; who.npc.physical.health = Math.min(100, who.npc.physical.health + (k ? 5 : 15)); }
        Social.help(S, n.id, who.id, 'treat');
        return { min: 20 };
      },
    },
    // 돌볼 사람(스승) 곁에서: 캐 온 약초를 건네고, 다치거나 아프면 돌본다 (목표 care_for_teacher)
    tend: {
      avail: (n, c) => {
        const g = Goals.get(n, 'care_for_teacher');
        const t = g && c.others.find((o) => o.id === g.target);
        return !!t && ((n.inventory.herb || 0) > 1 || t.physical.injured || t.needs.health > 30);
      },
      score: (n, c) => {
        const g = Goals.get(n, 'care_for_teacher');
        const t = c.others.find((o) => o.id === g.target);
        return g.priority * 0.6 + (t.physical.injured ? 30 : 0) - (n.flags.tendedAt != null && c.now - n.flags.tendedAt < 120 ? 50 : 0);
      },
      start: (S, n, c) => {
        const t = c.others.find((o) => o.id === Goals.get(n, 'care_for_teacher').target);
        const give = Math.max(0, (n.inventory.herb || 0) - 1);
        if (give) { n.inventory.herb -= give; t.inventory.herb = (t.inventory.herb || 0) + give; }
        if (t.physical.bleed > 0) { t.physical.bleed = 0; Social.help(S, n.id, t.id, 'treat'); }
        n.flags.tendedAt = c.now;
        Rel.change(S, n.id, t.id, { affection: 1 }, 'tend', true);
        return { min: 20 };
      },
    },
    // 함께 다니는 사람을 놓쳤을 때만 따라잡는다 (곁에 있을 때는 먹고 쉬는 등 제 할 일을 한다)
    follow: {
      avail: (n, c) => {
        if (!n.flags.follow || !canTravel(n)) return false;
        const tgt = n.flags.follow === 'player' ? c.W.player.loc : ((c.W.npcs[n.flags.follow] || {}).location || {}).loc;
        return !!tgt && tgt !== c.loc;
      },
      score: () => 70,
      start: (S, n, c) => {
        const tgt = n.flags.follow === 'player' ? S.W.player.loc : (S.W.npcs[n.flags.follow] || {}).location.loc;
        if (tgt && tgt !== c.loc) Npc.startMove(S, n, tgt);
        return { min: 15 };
      },
    },
    betray: {
      avail: (n, c) => !!n.flags.follow && (n.flags.follow === 'player' ? c.playerHere : c.others.some((o) => o.id === n.flags.follow)),
      score: (n, c) => {
        const r = Rel.peek(c.W, n.id, n.flags.follow) || {};
        return ((r.hostility || 0) + (r.resentment || 0)) * 0.4 + n.personality.greed * 0.2 - n.personality.honesty * 0.3 - (r.affection || 0) * 0.5 - 20;
      },
      start: (S, n, c) => { Social.betray(S, n, n.flags.follow); return { min: 5 }; },
    },
    // 어딘가로 간다: 일정의 장소, 집, 물가
    move: {
      avail: (n, c) => !!moveTarget(n, c),
      score: (n, c) => moveTarget(n, c).score,
      start: (S, n, c) => {
        const t = moveTarget(n, c);
        if (t.relocate) n.flags.relocated = true;
        Npc.startMove(S, n, t.to);
        return { min: 10 };
      },
    },
  };

  // 걸어갈 곳과 그 점수
  function moveTarget(n, c) {
    // 함께 다니는 동안에는 혼자 어디로 가지 않는다 (따라가기는 follow 행동이 맡는다)
    if (n.flags.follow) return null;
    const out = [];
    const home = Goals.get(n, 'return_home');
    if (home && home.priority > 0 && c.loc !== c.home) {
      let s = home.priority;
      // 곁에 사람이 있는데 등을 돌려 떠나지는 않는다 (적대하지 않는 한)
      if (c.playerHere && (!c.relP || c.relP.hostility < 50)) s -= 100;
      // 도와준 사람이 먼저 떠났다면 조금 기다려 준다
      const met = Memory.has(n, 'player', 'met');
      const gone = n.flags.lastSawPlayer != null ? c.now - n.flags.lastSawPlayer : Infinity;
      if (met && !c.playerHere && c.relP && c.relP.trust >= 30 && gone < waitLimit(n)) s -= 60;
      out.push({ to: c.home, score: s });
    }
    // 믿지 못할 낯선 이가 내가 있는 곳을 안다: 자리를 옮긴다 (몸이 성치 않아도 기어서라도)
    if (!c.playerHere && c.relP && Memory.has(n, 'player', 'met') && c.relP.trust < 30 && !n.flags.relocated
      && n.flags.lastSawPlayer != null && c.now - n.flags.lastSawPlayer >= 30 && c.region === 'forest') {
      const hide = Places.neighbors(c.loc).find((x) => Places.has(x, 'shelter') && x !== c.W.player.loc);
      if (hide) out.push({ to: hide, score: 85, relocate: true });
    }
    const trip = Goals.get(n, 'trade_trip');
    if (trip && trip.priority >= 50 && !n.flags.tripDone && c.loc !== trip.target && !c.dark) out.push({ to: trip.target, score: trip.priority });
    if (trip && n.flags.tripDone && c.loc !== c.home && !c.dark) out.push({ to: c.home, score: 60 });
    if (c.sched && c.sched.at && c.sched.at !== c.loc && Places.regionOf(c.sched.at) === Places.regionOf(c.home) && Npc.atHome(n)) {
      out.push({ to: c.sched.at, score: 40 + (c.sched.act === 'sleep' ? 20 : 0) });
    }
    if (n.needs.thirst >= 80 && !hasWater(n, c.loc)) {
      const w = Places.neighbors(c.loc).find((x) => Places.has(x, 'water'));
      if (w) out.push({ to: w, score: n.needs.thirst * 0.9 });
    }
    // 충격이 남은 몸으로는 피신 말고는 멀리 가지 못한다
    const mobile = canTravel(n);
    return out.filter((x) => mobile || x.relocate).sort((a, b) => b.score - a.score)[0] || null;
  }

  // lang 모듈이 S를 받으므로, 문맥에서 꺼낸다
  const S_ = (c) => c.S;

  // ---------- 판단 ----------
  function decide(S, n, c) {
    const { W } = S;
    const cands = [];
    for (const [type, a] of Object.entries(A)) {
      if (!a.avail(n, c)) continue;
      const s = a.score(n, c) + Rng.next(W) * n.personality.impulsiveness * 0.15;
      cands.push([type, s]);
    }
    cands.sort((x, y) => y[1] - x[1]);
    const [type] = cands[0] || ['wait'];
    begin(S, n, c, type);
  }

  function begin(S, n, c, type) {
    const r = A[type].start(S, n, c) || {};
    if (!n.alive) return;
    n.currentAction = { type, start: c.now, until: c.now + (r.min || 15), data: r.data || {} };
    n.location.hidden = !!(r.data && r.data.hidden);
    n.lastDecide = c.now;
    if (c.playerHere) Narrative.feedAction(S, n, type);
  }

  // 장면이 NPC에게 행동을 시킨다 (예: 위협을 받고 달아난다)
  function force(S, n, type) {
    const c = context(S, n, S.W.time.t);
    if (!A[type]) throw new Error('알 수 없는 행동: ' + type);
    begin(S, n, c, type);
  }

  // 무언가가 판단을 흔들었다 (공격, 위협, 플레이어의 등장): 다음 틱에 곧바로 다시 판단한다
  function interrupt(n) { n.lastDecide = -1e9; if (n.currentAction) n.currentAction.until = -1e9; }

  // ---------- 한 번의 계산 ----------
  function step(S, n, now, dt, level) {
    Needs.body(S, n, dt);
    if (!n.alive) return;
    Needs.update(S, n, dt);
    Goals.update(S, n);
    // 걷는 중: 도착한 구간을 처리한다
    while (n.location.transit && n.location.nextAt != null && now >= n.location.nextAt) Npc.arrive(S, n);
    if (level === 'distant') { abstract(S, n, now, dt); return; }

    const c = context(S, n, now);
    // 곁에 있는 사람: 두려움이 풀리고 조금 익숙해진다 (적대하지 않는다면)
    if (c.playerHere) {
      n.flags.lastSawPlayer = now;
      if (c.relP && c.relP.hostility < 30) {
        n.mental.fear = clamp(n.mental.fear - dt / 6);
        Rel.change(S, n.id, 'player', { suspicion: -dt / 12, familiarity: dt / 30 }, 'company', true);
      }
    }
    const act = n.currentAction;
    if (act && A[act.type] && A[act.type].tick) A[act.type].tick(S, n, c, dt);
    if (!n.alive) return;
    // 걷는 중에는 도착할 때까지 다시 판단하지 않는다 (도중에 길을 바꾸면 영영 닿지 못한다)
    // 다만 목숨이 걸리면 걸음을 멈추지 않고도 상처를 돌본다
    if (n.location.transit) {
      if (n.physical.health < 20 && A.heal.avail(n, c)) A.heal.start(S, n, c);
      return;
    }
    // 쓰러진 사람을 돌보는 중: 깨어날 때까지 곁을 떠나지 않는다
    if (n.flags.caring && now < n.flags.caring) {
      if (!act || act.type !== 'wait') n.currentAction = { type: 'wait', start: now, until: n.flags.caring, data: {} };
      return;
    }
    const done = !act || now >= act.until;
    if (done && act && A[act.type] && A[act.type].end) A[act.type].end(S, n, c);
    if (done || now - n.lastDecide >= REPLAN) decide(S, n, c);
  }

  // 먼 곳: 일정대로 움직이고 욕구는 뭉뚱그려 채운다. 먼 여행(행상)은 길을 따라 걷는다.
  function abstract(S, n, now, dt) {
    if (n.location.transit) return;
    const c = context(S, n, now);
    const mt = moveTarget(n, c);
    if (mt && mt.score >= 50 && canTravel(n)) { Npc.startMove(S, n, mt.to); return; }
    const s = c.sched;
    if (!s) return;
    if (s.at && Places.regionOf(s.at) === c.region && s.at !== c.loc) Npc.place(S, n, s.at);
    if (s.act === 'sleep') n.needs.fatigue = clamp(n.needs.fatigue - 0.3 * dt);
    if (s.act === 'eat') { n.needs.hunger = clamp(n.needs.hunger - 40); n.needs.thirst = clamp(n.needs.thirst - 40); }
    if (s.act === 'work' && n.identity.occupation === 'peddler') { n.flags.tripDone = false; }
    if (s.act === 'social') {
      const o = Npc.here(S.W, n.location.loc).find((x) => x !== n);
      if (o) { Rumor.exchange(S, n, o); n.needs.social = clamp(n.needs.social - 30); }
    }
    n.needs.thirst = clamp(n.needs.thirst - 0.03 * dt);
    n.currentAction = { type: s.act === 'social' ? 'talk' : s.act, start: now, until: now + dt, data: { abstract: true } };
  }

  function update(S, n, t, level) {
    if (!n.alive) { n.simT = t; return; }
    const max = level === 'distant' ? 180 : level === 'nearby' ? 30 : 5;
    while (n.simT < t && n.alive) {
      const dt = Math.min(max, t - n.simT);
      n.simT += dt;
      step(S, n, n.simT, dt, level);
    }
  }

  return { ACTIONS: A, context, decide, force, interrupt, update, canTravel, waitLimit };
})();

if (typeof module !== 'undefined') module.exports = { Behavior };

</script>
<script>/* js/social/relationship.js */
// 관계 (통합 명세 11절). 호감도 하나가 아니라 열 가지 축. 한쪽 방향이다 ('lia>player' ≠ 'player>lia').
// 수치는 플레이어에게 보여 주지 않는다. 행동으로만 드러난다 (narrative.js).
const Rel = (() => {
  const AXES = ['trust', 'fear', 'respect', 'affection', 'suspicion', 'hostility', 'gratitude', 'resentment', 'familiarity', 'dependence'];
  const clamp = (n) => Math.max(0, Math.min(100, n));
  const key = (a, b) => `${a}>${b}`;
  const blank = () => Object.fromEntries(AXES.map((k) => [k, 0]));

  const peek = (W, a, b) => W.relationships[key(a, b)] || null;

  // 없으면 만든다. NPC 정의의 관계, 또는 낯선 사람을 대하는 첫 태도에서 시작한다.
  function get(W, a, b) {
    const k = key(a, b);
    if (W.relationships[k]) return W.relationships[k];
    const def = NPC_DEFS[a];
    const base = def ? (b === 'player' ? (def.attitude && def.attitude.stranger) : (def.relations && def.relations[b])) : null;
    W.relationships[k] = Object.assign(blank(), base || {});
    return W.relationships[k];
  }

  // delta: { trust: +10, ... }. 두려움은 그 NPC의 마음 상태(mental.fear)도 함께 흔든다.
  function change(S, a, b, delta, cause, silent) {
    const r = get(S.W, a, b);
    let big = false;
    for (const k in delta) {
      if (!AXES.includes(k)) throw new Error('알 수 없는 관계 축: ' + k);
      r[k] = clamp(r[k] + delta[k]);
      if (Math.abs(delta[k]) >= 3) big = true;
    }
    const n = S.W.npcs[a];
    if (n && delta.fear) n.mental.fear = clamp(n.mental.fear + delta.fear);
    if (big && !silent) {
      Bus.emit(S, 'RELATIONSHIP_CHANGED', { from: a, to: b, delta, cause: cause || null });
      // 마음이 크게 흔들렸다: 하던 일을 멈추고 다시 판단한다
      if (n && n.alive) Behavior.interrupt(n);
    }
    return r;
  }

  function set(S, a, b, axis, v) { get(S.W, a, b)[axis] = clamp(v); }

  // NPC 정의에 적힌 서로의 관계로 시작한다
  function seed(W) {
    Object.entries(NPC_DEFS).forEach(([a, d]) => Object.keys(d.relations || {}).forEach((b) => get(W, a, b)));
  }

  // 한 시간마다: 두려움과 적의는 사건이 없으면 가라앉는다. 원한이 남아 있으면 적의는 잘 가라앉지 않는다.
  function process(S) {
    Object.values(S.W.relationships).forEach((r) => {
      r.fear = clamp(r.fear - 2);
      if (r.familiarity > 20) r.suspicion = clamp(r.suspicion - 0.5);
      if (r.resentment < 30) r.hostility = clamp(r.hostility - 0.5);
      r.gratitude = clamp(r.gratitude - 0.1);
    });
  }

  // ---------- 사건이 관계를 바꾼다 ----------
  // 도움: 장면이 수치를 정해 주면 그대로 (지시서 22절: 물을 주면 신뢰 +10, 경계 -5), 없으면 기본값. 감사는 늘 오른다.
  Bus.on('NPC_HELPED', (S, e) => {
    const n = S.W.npcs[e.npcId];
    if (!n || !n.alive) return;
    const d = Object.assign({ gratitude: 10 }, e.delta || { trust: 8, suspicion: -5, affection: 3 });
    change(S, e.npcId, e.helperId, d, 'helped');
  });
  Bus.on('NPC_THREATENED', (S, e) => {
    if (S.W.npcs[e.npcId] && S.W.npcs[e.npcId].alive) change(S, e.npcId, e.by, e.delta || { fear: 20, hostility: 30, trust: -20, suspicion: 15 }, 'threatened');
  });
  Bus.on('NPC_ATTACKED', (S, e) => {
    if (S.W.npcs[e.npcId] && S.W.npcs[e.npcId].alive) change(S, e.npcId, e.by, { fear: 30, hostility: 50, trust: -40, resentment: 40 }, 'attacked');
    // 곁에서 본 사람도 공격한 쪽을 두려워하고 미워한다
    Npc.here(S.W, e.loc).filter((w) => w.id !== e.npcId).forEach((w) => {
      const aff = (peek(S.W, w.id, e.npcId) || {}).affection || 0;
      change(S, w.id, e.by, { fear: 20, hostility: 10 + aff * 0.4, trust: -20 }, 'saw_attack');
    });
  });

  return { AXES, peek, get, change, set, seed, process };
})();

if (typeof module !== 'undefined') module.exports = { Rel };

</script>
<script>/* js/social/knowledge.js */
// 지식 (통합 명세 19·20절). 플레이어가 아는 것과 NPC가 아는 것을 나눈다.
// 플레이어가 보지 못한 일은 화면에 나오지 않는다. 플레이어의 지식(P.found)은 되감아도 남는다.
const Knowledge = (() => {
  // 장소를 아는 정도: 모름 → 멀리서 봄 → 가 봄 → 살펴봄 → 잘 앎
  const RANK = ['unknown', 'seen', 'visited', 'explored', 'known'];
  const KO = { seen: '멀리서 보았다', visited: '가 보았다', explored: '구석구석 살폈다', known: '잘 안다' };

  function create() { return { locations: {}, npcs: {}, events: {}, rumors: {} }; }

  const locState = (P, loc) => P.found.locations[loc] || 'unknown';

  // 한 단계라도 더 알게 되면 기록한다 (거꾸로 잊지는 않는다)
  function location(S, loc, state) {
    const f = S.P.found.locations;
    const before = f[loc] || 'unknown';
    if (RANK.indexOf(state) <= RANK.indexOf(before)) return false;
    f[loc] = state;
    Bus.emit(S, 'LOCATION_DISCOVERED', { loc, state, before });
    return true;
  }

  // 만난 사람. 이름은 알게 되었을 때만 채운다.
  function meet(S, id) {
    const f = S.P.found.npcs;
    f[id] = Object.assign(f[id] || { name: null, first: S.W.time.t }, { last: S.W.time.t });
  }
  function learnName(S, id) { meet(S, id); S.P.found.npcs[id].name = S.W.npcs[id].identity.name; }

  // 플레이어가 사건을 어떻게 알았는가: witnessed(직접 봄) | trace(흔적) | rumor(소문)
  function event(S, ev, how) {
    const f = S.P.found.events;
    if (f[ev.id] && f[ev.id].how === 'witnessed') return;
    f[ev.id] = { type: ev.type, how, t: S.W.time.t, loc: ev.loc };
  }
  function rumor(S, rumorId, level) {
    const f = S.P.found.rumors;
    f[rumorId] = { level, t: S.W.time.t };
  }

  // NPC의 지식
  const npcKnows = (n, fact) => !!n.knowledge.facts[fact];
  function npcLearn(n, fact, data = true) { n.knowledge.facts[fact] = data; }

  // 플레이어가 움직이면 그곳을 "가 봤다"
  Bus.on('PLAYER_MOVED', (S, e) => { location(S, e.to, 'visited'); });
  // 플레이어가 곁에서 본 사건은 직접 안다
  Bus.on('WORLD_EVENT_CREATED', (S, e) => {
    if (e.witnesses.includes('player')) {
      const ev = S.W.events.log.find((x) => x.id === e.eventId);
      if (ev) event(S, ev, 'witnessed');
    }
    // 곁에 있던 NPC도 안다
    e.witnesses.filter((w) => w !== 'player').forEach((w) => {
      const n = S.W.npcs[w];
      if (n) n.knowledge.events[e.eventId] = { how: 'witnessed', t: S.W.time.t };
    });
  });

  return { RANK, KO, create, locState, location, meet, learnName, event, rumor, npcKnows, npcLearn };
})();

if (typeof module !== 'undefined') module.exports = { Knowledge };

</script>
<script>/* js/social/rumor.js */
// 소문 (통합 명세 18절). 사건은 사람의 입을 거쳐 퍼지고, 거칠수록 변한다.
// W.rumors[id] = { id, type, subject, target, place, event, origin, t, importance, detail }
// 들은 사람: n.knowledge.rumors[id] = { level, from, t }
//   level 0 = 직접 겪은 사람의 이야기, 1 = 전해 들은 이야기(흐려짐), 2 = 부풀려진 이야기
const Rumor = (() => {
  const clamp = (n) => Math.max(0, Math.min(100, n));
  const IMPORTANCE = {
    died: 95, attacked: 90, missing: 75, threatened: 70, helped: 60, beast_seen: 55, theft: 50,
    stranger_seen: 40, war_tension: 45, beasts_rising: 50, anomaly: 40, trade_boom: 35,
    rescued: 55, worked: 30,
  };

  // 사건 종류 → 소문 종류
  const FROM_EVENT = {
    helped: 'helped', threatened: 'threatened', attacked: 'attacked', stranger_seen: 'stranger_seen',
    beast_attack: 'beast_seen', missing: 'missing', found_dead: 'died', death_witnessed: 'died', theft: 'theft',
    rescued_player: 'rescued', player_worked: 'worked',
  };

  function create(S, holderIds, o) {
    const { W } = S;
    const id = `r-${++W.seq}`;
    const r = {
      id, type: o.type, subject: o.subject || null, target: o.target || null, place: o.place || null,
      event: o.event || null, origin: holderIds[0] || null, t: W.time.t,
      importance: o.importance != null ? o.importance : (IMPORTANCE[o.type] || 30), detail: o.detail || {},
    };
    W.rumors[id] = r;
    holderIds.forEach((h) => {
      const n = W.npcs[h];
      if (n) n.knowledge.rumors[id] = { level: 0, from: null, t: W.time.t };
    });
    Bus.emit(S, 'RUMOR_CREATED', { rumorId: id, kind: o.type, holders: holderIds });
    return r;
  }

  const held = (n, id) => !!n.knowledge.rumors[id];
  // a가 b에게 들려줄 새 이야기가 있는가
  const hasNews = (W, a, b) => Object.keys(a.knowledge.rumors).some((id) => !b.knowledge.rumors[id] && W.rumors[id] && W.rumors[id].importance >= 20);

  // teller가 listener에게 가장 중요한 새 이야기를 하나 들려준다. 전해질 때마다 흐려지고, 가끔 부풀려진다.
  function exchange(S, teller, listener) {
    const { W } = S;
    const news = Object.entries(teller.knowledge.rumors)
      .filter(([id]) => !listener.knowledge.rumors[id] && W.rumors[id])
      .map(([id, h]) => ({ r: W.rumors[id], h }))
      .sort((a, b) => b.r.importance - a.r.importance);
    if (!news.length) return null;
    const trust = (Rel.peek(W, teller.id, listener.id) || {}).trust || 0;
    if (!Rng.chance(W, teller.personality.sociability / 100 * (0.6 + trust / 250))) return null;
    const { r, h } = news[0];
    let level = h.level === 0 ? 1 : h.level;
    const distort = 0.3 + (100 - teller.personality.honesty) / 250 + teller.personality.impulsiveness / 400;
    if (h.level >= 1 && Rng.chance(W, distort)) level++;
    level = Math.min(2, level);
    listener.knowledge.rumors[r.id] = { level, from: teller.id, t: W.time.t };
    apply(S, listener, r, level, teller);
    Bus.emit(S, 'RUMOR_SPREAD', { rumorId: r.id, from: teller.id, to: listener.id, level });
    return { rumor: r, level };
  }

  // 소문을 들은 사람이 달라진다: 이방인에 대한 인상, 누군가를 잃은 슬픔, 숲이 위험하다는 두려움
  // teller: 이야기를 들려준 사람. 겪은 당사자가 직접 한 말(증언)은, 그 사람을 믿는 만큼 무게가 실린다
  function apply(S, n, r, level, teller) {
    const { W } = S;
    const strong = level >= 2 ? 1.5 : 1;
    if (r.subject === 'player') {
      const aff = r.target ? ((Rel.peek(W, n.id, r.target) || {}).affection || 0) : 0;
      const d = {
        helped: level >= 2 ? { trust: 4, suspicion: -6, respect: 6, fear: 4 } : { trust: 6, suspicion: -8 },
        threatened: { suspicion: 15 * strong, fear: 8 * strong, hostility: 8 * strong + aff * 0.3 },
        attacked: { suspicion: 20 * strong, fear: 15 * strong, hostility: 20 * strong + aff * 0.5, resentment: aff * 0.4 },
        stranger_seen: { suspicion: level >= 2 ? 10 : 5 },
        // 쓰러졌다가 구조된 이방인: 조금 덜 경계한다 / 일을 거든 이방인: 성실하다는 인상
        rescued: { suspicion: -3 },
        worked: { trust: 3, suspicion: -4, respect: 2 },
      }[r.type];
      if (d) Rel.change(S, n.id, 'player', d, 'rumor:' + r.type, true);
      // 도움을 받은 당사자의 증언: "이 이방인이 나를 도왔다" (예: 리아가 스승에게)
      if (r.type === 'helped' && teller && teller.id === r.target) {
        const t = (Rel.peek(W, n.id, teller.id) || {}).trust || 0;
        Rel.change(S, n.id, 'player', { trust: 10 + t * 0.25, suspicion: -10 }, 'testimony', true);
      }
    }
    if (r.type === 'died' && r.target) {
      const aff = (Rel.peek(W, n.id, r.target) || {}).affection || 0;
      if (aff >= 30 && !Memory.has(n, r.target, 'lost')) {
        Memory.add(S, n, { type: 'lost', subject: r.target, detail: r.detail.cause || null });
        n.mental.mood = clamp(n.mental.mood - aff * 0.6);
        n.mental.stress = clamp(n.mental.stress + 30);
      }
      if (r.detail.by === 'player' && level <= 1) Rel.change(S, n.id, 'player', { hostility: 30 + aff * 0.5, fear: 20, resentment: aff * 0.6 }, 'rumor:died', true);
      if (Places.regionOf(n.location.loc) === 'village') Regions.raiseThreat(S, 'village', 10);
      Knowledge.npcLearn(n, 'dead:' + r.target);
    }
    if (r.type === 'missing' && r.target) {
      const aff = (Rel.peek(W, n.id, r.target) || {}).affection || 0;
      n.mental.stress = clamp(n.mental.stress + 5 + aff * 0.1);
    }
    if ((r.type === 'beast_seen' || r.type === 'beasts_rising') && Places.regionOf(n.location.loc) === 'village') {
      Regions.raiseThreat(S, 'village', r.type === 'beast_seen' ? 8 * strong : 5);
    }
    if (r.type === 'war_tension') n.mental.stress = clamp(n.mental.stress + 3);
  }

  // 말로 옮긴다 (대사 표기 그대로. 듣는 사람의 이해도에 따라 가려진다)
  function speech(W, r, level) {
    const tpl = RUMOR_SPEECH[r.type];
    if (!tpl) return null;
    const who = (id) => {
      if (!id) return '그 사람';
      if (id === 'player') return (level === 0 && r.detail.actorName) || '이방인';
      const n = W.npcs[id];
      return n ? (n.identity.name || n.identity.desc) : id;
    };
    return tpl[Math.min(level, tpl.length - 1)].replace(/\{actor\}/g, who(r.subject)).replace(/\{target\}/g, who(r.target));
  }
  // 표기를 걷어 낸 한국어 (디버그 화면과 NPC 사이의 기록용)
  const plain = (W, r, level) => { const s = speech(W, r, level); return s ? s.replace(/\[\[([^:\]|]+)(?::\d+)?(?:\|[^\]]+)?\]\]/g, '$1') : r.type; };

  // 하루마다: 오래되고 사소한 소문은 잊힌다
  function daily(S) {
    const { W } = S;
    Object.values(W.npcs).forEach((n) => {
      Object.entries(n.knowledge.rumors).forEach(([id, h]) => {
        const r = W.rumors[id];
        if (!r || (W.time.t - h.t > 10 * Time.DAY && r.importance < 50)) delete n.knowledge.rumors[id];
      });
    });
  }

  // ---------- 사건이 소문이 된다 ----------
  // 곁에서 겪거나 본 NPC가 첫 번째 이야기꾼이 된다
  Bus.on('WORLD_EVENT_CREATED', (S, e) => {
    const type = FROM_EVENT[e.kind];
    if (!type) return;
    const ev = S.W.events.log.find((x) => x.id === e.eventId);
    if (!ev) return;
    const holders = e.witnesses.filter((w) => w !== 'player' && S.W.npcs[w] && S.W.npcs[w].alive);
    if (!holders.length) return;
    // 같은 사람을 두고 "낯선 이를 봤다"는 이야기는 한 번만
    if (type === 'stranger_seen' && holders.every((h) => Object.keys(S.W.npcs[h].knowledge.rumors)
      .some((id) => S.W.rumors[id] && S.W.rumors[id].type === 'stranger_seen' && S.W.rumors[id].subject === 'player'))) return;
    const d = ev.data || {};
    const detail = { cause: d.cause || null, by: d.by || null, kind: d.kind || null };
    // 이름을 주고받았다면, 직접 겪은 사람의 이야기에는 이름이 들어간다
    const knower = holders.map((h) => S.W.npcs[h]).find((n) => n.knowledge.facts.playerName);
    if (knower) detail.actorName = S.P.name;
    create(S, holders, {
      type, subject: d.subject || (ev.actors.includes('player') ? 'player' : null), target: d.target || null,
      place: ev.loc, event: ev.id, detail,
    });
  });

  return { IMPORTANCE, create, held, hasNews, exchange, apply, speech, plain, daily };
})();

if (typeof module !== 'undefined') module.exports = { Rumor };

</script>
<script>/* js/social/social.js */
// 사람과 사람 사이에서 벌어지는 일: 돕기, 위협, 공격, 첫 만남, 배신.
// 여기서는 "무슨 일이 있었다"만 알린다. 관계·기억·소문·세계 사건은 이벤트 버스를 듣고 각자 바뀐다 (통합 명세 33절).
const Social = (() => {
  const locOf = (S, id) => (id === 'player' ? S.W.player.loc : S.W.npcs[id].location.loc);

  // kind: water | herb | treat | heal | food ...  delta: 장면이 정한 관계 변화 (없으면 기본값)
  function help(S, helperId, npcId, kind, delta) {
    Bus.emit(S, 'NPC_HELPED', { npcId, helperId, kind, delta: delta || null });
    if (helperId === 'player') Bus.emit(S, 'PLAYER_HELPED_NPC', { npcId, kind });
    WorldEvents.record(S, 'helped', { loc: locOf(S, npcId), actors: [helperId, npcId],
      data: { subject: helperId, target: npcId, kind } });
  }

  function threaten(S, byId, npcId, delta) {
    const n = S.W.npcs[npcId];
    Bus.emit(S, 'NPC_THREATENED', { npcId, by: byId, delta: delta || null });
    WorldEvents.record(S, 'threatened', { loc: n.location.loc, actors: [byId, npcId], data: { subject: byId, target: npcId } });
    Behavior.interrupt(n);
  }

  function attack(S, byId, npcId, o = {}) {
    const n = S.W.npcs[npcId];
    const loc = n.location.loc;
    if (byId === 'player') Bus.emit(S, 'PLAYER_ATTACKED', { targetId: npcId, weapon: o.weapon || null });
    Bus.emit(S, 'NPC_ATTACKED', { npcId, by: byId, weapon: o.weapon || null, damage: o.damage || 0, loc });
    WorldEvents.record(S, 'attacked', { loc, actors: [byId, npcId], data: { subject: byId, target: npcId, weapon: o.weapon || null } });
    Behavior.interrupt(n);
  }

  // 처음 마주친다. 소문으로 들은 것이 있으면 첫인상에 이미 들어가 있다.
  function meet(S, npcId) {
    const n = S.W.npcs[npcId];
    Knowledge.meet(S, npcId);
    n.flags.lastSawPlayer = S.W.time.t;
    if (Memory.has(n, 'player', 'met')) return false;
    Rel.get(S.W, npcId, 'player');
    Bus.emit(S, 'NPC_MET_PLAYER', { npcId, loc: n.location.loc });
    WorldEvents.record(S, 'stranger_seen', { loc: n.location.loc, actors: ['player', npcId], witnesses: [npcId, 'player'],
      data: { subject: 'player', target: npcId } });
    Behavior.interrupt(n);
    return true;
  }

  // 함께 가던 사람이 등을 돌린다: 가진 것을 챙겨 떠난다
  function betray(S, n, targetId) {
    const { W } = S;
    let took = null;
    if (targetId === 'player') {
      const me = W.player;
      took = Object.keys(me.inv).sort((a, b) => (ITEM_DEFS[b] ? ITEM_DEFS[b].value : 0) - (ITEM_DEFS[a] ? ITEM_DEFS[a].value : 0))[0] || null;
      if (took) { Player.take(me, took); n.inventory[took] = (n.inventory[took] || 0) + 1; }
      W.worldFlags.feed.push(`${Narrative.who(S, n)}${Text.josa(Narrative.who(S, n), '이가')} 갑자기 등을 돌린다. 주머니가 가볍다.`);
    } else {
      const t = W.npcs[targetId];
      const m = Math.floor(t.money / 2);
      t.money -= m; n.money += m; took = 'money';
      Memory.add(S, t, { type: 'betrayed_by', subject: n.id });
      Rel.change(S, targetId, n.id, { trust: -60, resentment: 60, hostility: 40 }, 'betrayed');
    }
    n.flags.follow = null;
    WorldEvents.record(S, 'betrayal', { loc: n.location.loc, actors: [n.id, targetId], data: { subject: n.id, target: targetId, took } });
    Npc.startMove(S, n, n.location.home);
  }

  return { help, threaten, attack, meet, betray };
})();

if (typeof module !== 'undefined') module.exports = { Social };

</script>
<script>/* js/lang/registry.js */
// 언어 등록부 (언어 시스템 17·21절): 언어와 단어를 ID로 찾는다. 들리는 소리를 만든다.
const LangRegistry = (() => {
  const byId = {}, byForm = {};
  WORDS.forEach((w) => { byId[w.id] = w; w.forms.forEach((f) => { byForm[f] = w; }); });

  const language = (id) => LANGUAGES[id] || null;
  const ids = () => Object.keys(LANGUAGES);
  const word = (id) => byId[id] || null;
  const wordByForm = (form) => byForm[form] || null;
  const normalize = (id) => LEGACY_LANG_IDS[id] || id;

  // 아베르어처럼 들리는 소리. 같은 뜻은 언제나 같은 소리라서, 반복되는 말을 플레이어가 알아챌 수 있다.
  const SYL = ['아', '베', '르', '칸', '이', '엘', '도', '사', '린', '테', '우', '메', '라', '시', '카', '노', '벨', '온', '타', '레'];
  function foreign(key) {
    let h = 7;
    for (const c of key) h = (h * 131 + c.charCodeAt(0)) >>> 0;
    const n = Math.min(3, [...key].length + 1);
    let s = '';
    for (let k = 0; k < n; k++) { s += SYL[h % SYL.length]; h = Math.floor(h / SYL.length) + (k + 1) * 977; }
    return s;
  }
  // 단어가 실제로 들리는 소리
  function sound(wordId, surface) {
    const w = byId[wordId];
    if (w && w.text) return w.text;
    return foreign(w ? w.meaning : (surface || wordId));
  }

  return { language, ids, word, wordByForm, normalize, foreign, sound };
})();

if (typeof module !== 'undefined') module.exports = { LangRegistry };

</script>
<script>/* js/lang/persistence.js */
// 언어 저장 데이터 (언어 시스템 35절). 플레이어의 언어 지식은 되감아도 남는다 (P.lang).
const LangStore = (() => {
  const blankSkill = () => ({ understanding: 0, speaking: 0, reading: 0, writing: 0 });

  function create() {
    return {
      languageKnowledge: Object.fromEntries(Object.keys(LANGUAGES).map((id) => [id, blankSkill()])),
      // { 언어: { 단어ID: { confidence 0~1, encounters, lastEncounter } } } (통합 명세 14절)
      knownWords: {},
      knownExpressions: [],
      knownDialects: [],
      translationAbilities: [],
      languageMilestones: [], // 이해도 구간을 넘은 순간 { language, band, t }
      understood: {},         // 처음으로 온전히 알아들은 대사
      named: {},              // 이름을 알게 된 언어
    };
  }

  // 빠진 칸을 채운다. 예전 저장 파일(P.language, P.words)은 새 구조로 옮긴다.
  function migrate(P) {
    const L = P.lang || create();
    const fresh = create();
    Object.keys(fresh).forEach((k) => { if (L[k] == null) L[k] = fresh[k]; });
    Object.keys(LANGUAGES).forEach((id) => { L.languageKnowledge[id] = Object.assign(blankSkill(), L.languageKnowledge[id]); });
    if (P.language) {
      Object.entries(P.language).forEach(([k, v]) => {
        const id = LangRegistry.normalize(k);
        if (L.languageKnowledge[id]) L.languageKnowledge[id].understanding = Math.max(L.languageKnowledge[id].understanding, v);
      });
      delete P.language;
    }
    if (P.words) {
      L.knownWords.common_aver = L.knownWords.common_aver || {};
      Object.keys(P.words).forEach((form) => {
        const w = LangRegistry.wordByForm(form);
        L.knownWords.common_aver[w ? w.id : form] = { confidence: 0.7, encounters: 1, lastEncounter: null };
      });
      delete P.words;
    }
    P.lang = L;
    return P;
  }

  return { create, migrate };
})();

if (typeof module !== 'undefined') module.exports = { LangStore };

</script>
<script>/* js/lang/knowledge.js */
// 언어 지식 (언어 시스템 18~20절). 이해·말하기·읽기·쓰기를 따로 둔다. 단어마다 확신도가 있다.
// 플레이어: S.P.lang / NPC: n.languages (NPC는 단어 하나하나가 아니라 실력으로 본다)
const LangKnowledge = (() => {
  const KNOWN = 0.6; // 이만큼 확신하면 그 단어가 들린다
  const GUESS = 0.3; // 이만큼이면 어렴풋이 짐작한다 (틀릴 수 있다)
  const blank = { understanding: 0, speaking: 0, reading: 0, writing: 0 };

  function profile(S, id) {
    if (id === 'player') return S.P.lang.languageKnowledge;
    const n = S.W.npcs[id];
    return n ? n.languages : {};
  }
  const get = (S, id, lang) => profile(S, id)[lang] || blank;

  function word(S, id, lang, wordId) {
    if (id !== 'player') return { confidence: get(S, id, lang).understanding / 100, encounters: 0, lastEncounter: null };
    const w = S.P.lang.knownWords[lang];
    return (w && w[wordId]) || { confidence: 0, encounters: 0, lastEncounter: null };
  }

  const state = (conf) => (conf >= KNOWN ? 'known' : conf >= GUESS ? 'guess' : 'unknown');
  const canSpeak = (S, id, lang, min = 30) => get(S, id, lang).speaking >= min;
  const canRead = (S, id, lang, min = 30) => get(S, id, lang).reading >= min;

  // 플레이어가 들어 본 단어들 (확신 순)
  function heardWords(S, lang) {
    const w = S.P.lang.knownWords[lang] || {};
    return Object.entries(w).map(([id, r]) => ({ id, ...r, state: state(r.confidence) }))
      .sort((a, b) => b.confidence - a.confidence || b.encounters - a.encounters);
  }
  const encountered = (S, lang) => get(S, 'player', lang).understanding > 0 || heardWords(S, lang).length > 0;

  return { KNOWN, GUESS, profile, get, word, state, canSpeak, canRead, heardWords, encountered };
})();

if (typeof module !== 'undefined') module.exports = { LangKnowledge };

</script>
<script>/* js/lang/learning.js */
// 언어 학습 (언어 시스템 26·27절, 통합 명세 14절). 경험치가 아니라, 무엇을 겪었는지에 따라 단어의 확신이 바뀐다.
// 듣기만 해서는 뜻을 알 수 없다 (확신 0.45에서 멈춘다). 상황과 연결하거나, 배우거나, 써 봐야 한다.
const LangLearning = (() => {
  const round1 = (n) => Math.round(n * 10) / 10;
  // conf: 단어 확신 변화 / cap: 이 방식만으로 오를 수 있는 한계 / und: 이해도(%) / speaking·reading: 말하기·읽기
  const TYPES = {
    heard_word: { conf: 0.05, cap: 0.45, und: 0.05 },
    repeated_word: { conf: 0.1, cap: 0.55, und: 0.3 },
    contextual_guess: { conf: 0.4, cap: 0.7, und: 3 },
    successful_conversation: { conf: 0.15, cap: 1, und: 1, speaking: 2 },
    failed_conversation: { conf: -0.05, cap: 1, und: 0.2, speaking: 0.5 },
    teacher_lesson: { conf: 0.35, cap: 0.8, und: 2 },
    reading: { conf: 0.2, cap: 0.8, und: 1, reading: 2 },
    translation: { conf: 0.3, cap: 0.8, und: 1 },
    magic_translation: { conf: 0, cap: 0, und: 0 },
    exposure: { conf: 0, cap: 0, und: 1 }, // 단어가 아닌 무언가를 느꼈을 때 (정령의 속삭임 등)
  };
  // 이해도 구간 (언어 시스템 4절)
  const BANDS = [0, 10, 30, 50, 70, 90];
  const band = (u) => BANDS.filter((b) => u >= b).pop();

  // ev: { type, language, wordId?, amount?(이해도), confidence?(확신 변화), set?(확신을 적어도 이만큼), source }
  function learn(S, ev) {
    const T = TYPES[ev.type];
    if (!T) throw new Error('알 수 없는 학습 방식: ' + ev.type);
    const L = LANGUAGES[ev.language];
    if (!L) throw new Error('알 수 없는 언어: ' + ev.language);
    const PL = S.P.lang;
    const lk = PL.languageKnowledge[ev.language];
    let newlyKnown = false, rec = null;
    if (ev.wordId) {
      const words = PL.knownWords[ev.language] = PL.knownWords[ev.language] || {};
      rec = words[ev.wordId] = words[ev.wordId] || { confidence: 0, encounters: 0, lastEncounter: null };
      const before = rec.confidence;
      rec.encounters++;
      rec.lastEncounter = S.W.time.t;
      let c = before;
      if (ev.set != null) c = Math.max(c, ev.set);
      else {
        const gain = ev.confidence != null ? ev.confidence : T.conf;
        c = gain >= 0 ? Math.max(c, Math.min(T.cap, c + gain)) : c + gain;
      }
      rec.confidence = Math.round(Math.max(0, Math.min(1, c)) * 100) / 100;
      if (before < LangKnowledge.KNOWN && rec.confidence >= LangKnowledge.KNOWN) {
        newlyKnown = true;
        Bus.emit(S, 'LANGUAGE_WORD_LEARNED', { entityId: 'player', languageId: ev.language, wordId: ev.wordId, confidence: rec.confidence, source: ev.source || null });
      }
    }
    const from = band(lk.understanding);
    let und = (ev.amount != null ? ev.amount : T.und) / L.difficulty;
    if (ev.type === 'heard_word') und *= 1 - lk.understanding / 100;
    lk.understanding = Math.min(100, round1(lk.understanding + und));
    if (T.speaking) lk.speaking = Math.min(100, round1(lk.speaking + T.speaking / L.difficulty));
    if (T.reading) lk.reading = Math.min(100, round1(lk.reading + T.reading / L.difficulty));
    const to = band(lk.understanding);
    if (to !== from) {
      PL.languageMilestones.push({ language: ev.language, band: to, t: S.W.time.t });
      Bus.emit(S, 'LANGUAGE_LEVEL_CHANGED', { entityId: 'player', languageId: ev.language, from, to, understanding: lk.understanding });
    }
    return { newlyKnown, confidence: rec ? rec.confidence : null };
  }

  return { TYPES, BANDS, band, learn };
})();

if (typeof module !== 'undefined') module.exports = { LangLearning };

</script>
<script>/* js/lang/parser.js */
// 대사 표기 해석 (lexicon.js 머리말의 표기 규칙). [[단어:임계값|오역]] → 단어 ID와 임계값
const LangParser = (() => {
  const RE = /\[\[([^:\]|]+)(?::(\d+))?(?:\|([^\]]+))?\]\]/g;

  // {target} 같은 자리표시자를 채운다
  const fill = (str, vars) => (vars ? String(str).replace(/\{(\w+)\}/g, (m, k) => (vars[k] != null ? vars[k] : m)) : String(str));

  function parse(str, vars) {
    const text = fill(str, vars);
    const tokens = [];
    text.replace(RE, (m, surface, th, alt) => {
      const w = LangRegistry.wordByForm(surface);
      tokens.push({ surface, wordId: w ? w.id : surface, th: th != null ? +th : (w ? w.difficulty * 10 : 30), alt: alt || null });
      return m;
    });
    return { text, tokens, plain: text.replace(RE, '$1') };
  }

  return { RE, fill, parse };
})();

if (typeof module !== 'undefined') module.exports = { LangParser };

</script>
<script>/* js/lang/resolver.js */
// 번역 해석기 (언어 시스템 23~25절). NPC가 전하려는 뜻은 그대로다. 달라지는 것은 듣는 사람이 받아들이는 만큼이다.
// 단어마다: 이해도가 임계값 이상이거나 확신 0.6 이상 → 들린다 / 확신 0.3~0.6 → 어렴풋이 짐작 (오역이 있으면 틀리게) / 그 밖 → 낯선 소리
// 들리지 않는 부분(어미·조사)은 지운다. 짐작한 단어가 섞이면 끝에 "……?"가 붙는다.
const LangResolver = (() => {
  const r2 = (n) => Math.round(n * 100) / 100;

  // 관계가 말투를 바꾼다 (통합 명세 17절): 호의적이면 천천히, 쉬운 말로, 되풀이하며 / 적대적이면 빠르게, 비꼬아서
  function manner(S, speakerId, listenerId) {
    if (!speakerId || speakerId === 'player') return 0;
    const r = Rel.peek(S.W, speakerId, listenerId);
    if (!r) return 0;
    if (r.hostility >= 40) return -10;
    if (r.trust >= 40 || r.affection >= 30) return 10;
    return 0;
  }

  // o: { text, lang, listenerId, speakerId, fullAt, vars, reading }
  function resolve(S, o) {
    const lang = o.lang || 'common_aver';
    const listener = o.listenerId || 'player';
    const p = LangParser.parse(o.text, o.vars);
    const skill = LangKnowledge.get(S, listener, lang);
    const u = (o.reading ? skill.reading : skill.understanding) + manner(S, o.speakerId, listener);
    const base = { language: lang, misheard: [], tokens: [], recognizedWords: [], uncertainWords: [], unknownWords: [] };
    if (!p.tokens.length) return Object.assign(base, { understanding: 1, fullyUnderstood: true, displayText: p.plain });

    const res = p.tokens.map((tk) => {
      const conf = LangKnowledge.word(S, listener, lang, tk.wordId).confidence;
      const state = u >= tk.th || conf >= LangKnowledge.KNOWN ? 'known' : conf >= LangKnowledge.GUESS ? 'guess' : 'unknown';
      return Object.assign({}, tk, { conf, state });
    });
    // 문맥 보정: 대부분 알아들었다면, 조금 어려운 나머지 말도 어렴풋이 짐작한다
    const knownN = res.filter((x) => x.state === 'known').length;
    if (res.length >= 3 && knownN / res.length >= 2 / 3) {
      res.forEach((x) => { if (x.state === 'unknown' && x.th <= u + 15) { x.state = 'guess'; x.context = true; } });
    }
    const full = o.fullAt != null ? u >= o.fullAt : res.every((x) => x.state === 'known');
    let display;
    if (full) display = p.plain;
    else {
      let i = 0;
      display = p.text
        .replace(LangParser.RE, '\u0000')
        .replace(/[가-힣]+/g, '')
        .replace(/\u0000/g, () => {
          const x = res[i++];
          if (x.state === 'known') return x.surface;
          if (x.state === 'guess') return x.alt || x.surface;
          return LangRegistry.sound(x.wordId, x.surface);
        })
        .replace(/ {2,}/g, ' ')
        .replace(/「 /, '「')
        .replace(/ 」/, '」');
      if (res.some((x) => x.state === 'guess')) display = display.replace(/[.!?…]*」\s*$/, '……?」');
    }
    const pick = (st) => res.filter((x) => x.state === st).map((x) => x.wordId);
    return Object.assign(base, {
      understanding: r2((knownN + pick('guess').length * 0.5) / res.length),
      fullyUnderstood: full,
      displayText: display,
      recognizedWords: pick('known'),
      uncertainWords: pick('guess'),
      unknownWords: pick('unknown'),
      misheard: res.filter((x) => x.state === 'guess' && x.alt).map((x) => ({ wordId: x.wordId, heard: x.alt })),
      tokens: res,
    });
  }

  return { manner, resolve };
})();

if (typeof module !== 'undefined') module.exports = { LangResolver };

</script>
<script>/* js/lang/dialogue.js */
// 대화 (언어 시스템 23·24·30·31절): 누가 어떤 언어로 말하는가, 듣는 사람이 무엇을 받아들이는가,
// 듣기만 해도 조금씩 익숙해지는 것, 플레이어가 말을 따라 해 보는 것, 가르침, 통역, 읽기.
const Dialogue = (() => {
  // 말하는 사람이 고르는 언어: 자기가 말할 수 있는 언어 가운데 듣는 사람이 가장 잘 알아듣는 것
  function speakerLanguage(S, speakerId, listenerId) {
    const sp = LangKnowledge.profile(S, speakerId);
    const cands = Object.keys(sp).filter((k) => sp[k].speaking >= 30);
    if (!cands.length) return 'common_aver';
    return cands.sort((a, b) => (LangKnowledge.get(S, listenerId, b).understanding - LangKnowledge.get(S, listenerId, a).understanding)
      || (sp[b].speaking - sp[a].speaking))[0];
  }

  // o: { speakerId, listenerId='player', dialogueId | text, vars, lang, fullAt }
  function process(S, o) {
    const listener = o.listenerId || 'player';
    const d = o.dialogueId ? DIALOGUES[o.dialogueId] : null;
    if (o.dialogueId && !d) throw new Error('없는 대사: ' + o.dialogueId);
    const lang = o.lang || (d && d.lang) || (o.speakerId ? speakerLanguage(S, o.speakerId, listener) : 'common_aver');
    if (d) Bus.emit(S, 'DIALOGUE_STARTED', { dialogueId: o.dialogueId, speakerId: o.speakerId || null, listenerId: listener });
    const r = LangResolver.resolve(S, { text: d ? d.text : o.text, lang, listenerId: listener, speakerId: o.speakerId, vars: o.vars, fullAt: o.fullAt });
    if (listener === 'player') hear(S, lang, r);
    // 거의 알아듣지 못하면, 말투와 몸짓으로 분위기만 짐작한다 (통합 명세 15절)
    r.tone = d && r.understanding < 0.5 ? d.tone : null;
    r.semantic = d ? JSON.parse(LangParser.fill(JSON.stringify(d.semantic), o.vars)) : null;
    r.misheard.forEach((m) => Bus.emit(S, 'LANGUAGE_MISUNDERSTOOD', { entityId: listener, languageId: lang, wordId: m.wordId, heard: m.heard }));
    if (r.fullyUnderstood && o.dialogueId && listener === 'player' && !S.P.lang.understood[o.dialogueId]) {
      S.P.lang.understood[o.dialogueId] = S.W.time.t;
      Bus.emit(S, 'LANGUAGE_FULLY_UNDERSTOOD', { entityId: listener, languageId: lang, dialogueId: o.dialogueId });
    }
    if (d) Bus.emit(S, 'DIALOGUE_COMPLETED', { dialogueId: o.dialogueId, speakerId: o.speakerId || null, listenerId: listener, understanding: r.understanding });
    return r;
  }

  // 반복해서 듣기: 들을 때마다 그 소리가 조금 더 귀에 익는다 (뜻은 모른 채로)
  function hear(S, lang, r) {
    r.tokens.forEach((x) => { if (x.th > 0) LangLearning.learn(S, { type: 'heard_word', language: lang, wordId: x.wordId, source: 'heard' }); });
  }

  // 플레이어가 들은 말을 NPC에게 따라 해 본다 (말하기). 통하면 확신과 말하기가 오른다.
  function playerSays(S, npcId, wordId, lang = 'common_aver') {
    const heard = LangKnowledge.get(S, npcId, lang).understanding >= 50;
    const conf = LangKnowledge.word(S, 'player', lang, wordId).confidence;
    const success = heard && conf >= LangKnowledge.GUESS;
    LangLearning.learn(S, { type: success ? 'successful_conversation' : 'failed_conversation', language: lang, wordId, source: 'spoke:' + npcId });
    if (success) Rel.change(S, npcId, 'player', { trust: 2, suspicion: -3, familiarity: 2 }, 'spoke_language');
    return { success, heard };
  }

  // ---------- 가르침 (통합 명세 17절: 호의적인 NPC는 직접 가르쳐 준다) ----------
  const POINT_AT = { water: '개울 쪽', tree: '나무', stone: '발치의 돌', sky: '하늘', hand: '자기 손', blood: '팔에 밴 피' };
  function teachable(S, n) {
    const f = (PLACE_DATA[n.location.loc] || { features: [] }).features;
    const ids = [...new Set(f.map((x) => TEACHABLE[x]).filter(Boolean).concat(TEACH_ALWAYS))];
    return ids.filter((id) => LangKnowledge.word(S, 'player', 'common_aver', id).confidence < LangKnowledge.KNOWN);
  }
  const canTeach = (S, n) => LangKnowledge.get(S, n.id, 'common_aver').speaking >= 60 && teachable(S, n).length > 0;

  function teach(S, n) {
    const id = teachable(S, n)[0];
    if (!id) return false;
    const w = LangRegistry.word(id);
    const snd = LangRegistry.sound(id);
    const who = Narrative.who(S, n);
    const lines = [`${who}${Text.josa(who, '이가')} ${POINT_AT[id]}${Text.josa(POINT_AT[id], '을를')} 가리킨다.`, `「${snd}.」`, '한 번 더, 천천히.', `「${snd}.」`];
    const r = LangLearning.learn(S, { type: 'teacher_lesson', language: 'common_aver', wordId: id, source: 'teach:' + n.id });
    lines.push(r.newlyKnown ? { t: `……"${w.meaning}". 그런 뜻인 것 같다.`, cls: 'know' } : '……무슨 뜻인지 어렴풋이 알 것 같다.');
    Memory.add(S, n, { type: 'taught', subject: 'player', detail: id });
    Rel.change(S, n.id, 'player', { familiarity: 3, affection: 2 }, 'taught', true);
    lines.forEach((l) => S.W.worldFlags.feed.push(l));
    return true;
  }

  // ---------- 통역 (언어 31절) ----------
  // 통역하는 사람이 원래 말을 알아듣는 만큼, 옮길 말을 할 줄 아는 만큼 전해진다.
  // 쉬운 핵심 단어는 살아남고 어려운 말부터 빠진다 (단순 곱셈이 아니다).
  function interpret(S, o) {
    const { W } = S;
    const ip = LangKnowledge.get(S, o.interpreterId, o.from);
    const op = LangKnowledge.get(S, o.interpreterId, o.to);
    const acc = (ip.understanding / 100) * (op.speaking / 100);
    const p = LangParser.parse(o.text, o.vars);
    const kept = p.tokens.map((tk) => ({ tk, keep: acc >= 0.95 || Rng.next(W) < acc * (1.2 - tk.th / 100) }));
    let i = 0;
    const relayed = p.text.replace(LangParser.RE, () => { const k = kept[i++]; return k.keep ? `[[${k.tk.surface}:${k.tk.th}]]` : '……'; })
      .replace(/(……\s*){2,}/g, '…… ');
    const r = LangResolver.resolve(S, { text: relayed, lang: o.to, listenerId: o.listenerId || 'player', speakerId: o.interpreterId });
    r.accuracy = Math.round(acc * 100) / 100;
    r.lost = kept.filter((k) => !k.keep).map((k) => k.tk.wordId);
    Bus.emit(S, 'TRANSLATION_PERFORMED', { interpreterId: o.interpreterId, from: o.from, to: o.to, accuracy: r.accuracy, lost: r.lost.length });
    return r;
  }

  // ---------- 읽기 (언어 30절: 말을 알아들어도 글은 못 읽을 수 있다) ----------
  function read(S, o) {
    const r = LangResolver.resolve(S, { text: o.text, lang: o.lang, listenerId: o.readerId || 'player', vars: o.vars, reading: true });
    if ((o.readerId || 'player') === 'player') {
      r.tokens.filter((x) => x.state !== 'unknown').forEach((x) => LangLearning.learn(S, { type: 'reading', language: o.lang, wordId: x.wordId, source: 'read' }));
    }
    return r;
  }

  return { speakerLanguage, process, hear, playerSays, teachable, canTeach, teach, interpret, read };
})();

if (typeof module !== 'undefined') module.exports = { Dialogue };

</script>
<script>/* js/lang/ui.js */
// 언어 화면 (언어 시스템 13절). 들어 본 말만, 알게 된 만큼만 보여 준다. 언어의 이름도 알기 전에는 "낯선 말"이다.
const LangUI = (() => {
  function wordLines(S, lang = 'common_aver') {
    const out = [];
    LangKnowledge.heardWords(S, lang).forEach((r) => {
      const w = LangRegistry.word(r.id);
      const snd = LangRegistry.sound(r.id, r.id);
      const meaning = w ? w.meaning : r.id;
      if (r.state === 'known') out.push({ t: `· 「${snd}」 ${meaning}`, cls: 'note' });
      else if (r.state === 'guess') out.push({ t: `· 「${snd}」 ${meaning}……?`, cls: 'note' });
      else if (r.encounters >= 3) out.push({ t: `· 「${snd}」 ……자주 들린다. 뜻은 모른다.`, cls: 'note dim' });
    });
    return out;
  }

  const langName = (S, id) => (S.P.lang.named[id] ? LANGUAGES[id].name : (LANG_UNNAMED[id] || '낯선 말'));

  function languageLines(S) {
    return Object.keys(LANGUAGES).filter((id) => LangKnowledge.encountered(S, id)).map((id) => {
      const u = Math.floor(LangKnowledge.get(S, 'player', id).understanding);
      return { t: `${langName(S, id).padEnd(6, '　')}  ${String(u).padStart(3, ' ')}%`, cls: 'stat' };
    });
  }

  // 들은 말을 되뇐다
  function notebook(S) {
    const words = wordLines(S);
    return ['들은 말을 입속으로 되뇐다.', '', ...(words.length ? words : ['……아직 뜻을 짐작할 수 있는 말이 없다.']), '', ...languageLines(S)];
  }

  const hasAny = (S) => wordLines(S).length > 0;

  return { wordLines, languageLines, notebook, langName, hasAny };
})();

if (typeof module !== 'undefined') module.exports = { LangUI };

</script>
<script>/* js/lang/index.js */
// 언어 시스템 입구 (언어 시스템 16·37·38절). 다른 시스템과 장면은 여기만 부른다.
//   LanguageRegistry     → LangRegistry (lang/registry.js)
//   LanguageKnowledge    → LangKnowledge (lang/knowledge.js)
//   LanguageLearning     → LangLearning (lang/learning.js)
//   LanguageParser       → LangParser (lang/parser.js)
//   TranslationResolver  → LangResolver (lang/resolver.js)
//   DialogueSystem       → Dialogue (lang/dialogue.js)
//   InterpretationSystem → Dialogue.interpret / WritingSystem → Dialogue.read
//   LanguageUI           → LangUI (lang/ui.js) / LanguagePersistence → LangStore (lang/persistence.js)
// 37절의 API는 모두 첫 인자로 게임 상태 S를 받는다.
const Lang = (() => {
  const AVER = 'common_aver';
  const idOf = (surface) => { const w = LangRegistry.wordByForm(surface); return w ? w.id : surface; };

  // ---------- 37절 API ----------
  const getLanguageKnowledge = (S, entityId, languageId) => LangKnowledge.get(S, entityId, languageId);
  const getWordKnowledge = (S, entityId, languageId, wordId) => LangKnowledge.word(S, entityId, languageId, wordId);
  const processDialogue = (S, o) => Dialogue.process(S, o);
  // 부작용 없이 얼마나 알아들을지만 계산한다
  function calculateUnderstanding(S, dialogueId, listenerId = 'player', vars) {
    const d = DIALOGUES[dialogueId];
    return LangResolver.resolve(S, { text: d.text, lang: d.lang, listenerId, vars }).understanding;
  }
  const learnWord = (S, entityId, languageId, wordId, amount) =>
    LangLearning.learn(S, { type: 'contextual_guess', language: languageId, wordId, amount, source: 'learnWord' });
  // context: { wordId | surface, source, confidence }
  const learnFromContext = (S, entityId, languageId, context) =>
    LangLearning.learn(S, { type: 'contextual_guess', language: languageId, wordId: context.wordId || idOf(context.surface),
      confidence: context.confidence, source: context.source || 'context' });
  const canSpeak = (S, entityId, languageId) => LangKnowledge.canSpeak(S, entityId, languageId);
  const canRead = (S, entityId, languageId) => LangKnowledge.canRead(S, entityId, languageId);
  const translateForPlayer = (S, dialogueId, vars) => {
    const d = DIALOGUES[dialogueId];
    return LangResolver.resolve(S, { text: d.text, lang: d.lang, listenerId: 'player', vars }).displayText;
  };

  // ---------- 장면에서 쓰는 것 ----------
  // NPC가 플레이어에게 말한다. 화면에 보일 문장을 돌려준다.
  const speak = (S, text, speakerId) => Dialogue.process(S, { speakerId, listenerId: 'player', text }).displayText;
  // 뜻을 알아냈다 (상황으로 분명히 짐작했다). 새로 알게 되었으면 true
  function learn(S, surface, o = {}) {
    const before = LangKnowledge.word(S, 'player', AVER, idOf(surface)).confidence;
    LangLearning.learn(S, { type: 'contextual_guess', language: AVER, wordId: idOf(surface),
      set: o.set != null ? o.set : 0.7, amount: o.amount != null ? o.amount : 5, source: o.source || 'scene' });
    return before < LangKnowledge.KNOWN;
  }
  // 뜻을 어렴풋이 짐작했다 (틀릴 수도 있다)
  const guess = (S, surface, source) => LangLearning.learn(S, { type: 'contextual_guess', language: AVER, wordId: idOf(surface), source: source || 'scene' });
  const knows = (S, surface) => LangKnowledge.word(S, 'player', AVER, idOf(surface)).confidence >= LangKnowledge.KNOWN;
  const canTeach = (S, n) => Dialogue.canTeach(S, n);
  const teach = (S, n) => Dialogue.teach(S, n);
  // 정령의 말처럼 단어가 아닌 무언가를 스치듯 느꼈다
  const sense = (S, languageId, amount) => LangLearning.learn(S, { type: 'exposure', language: languageId, amount, source: 'sense' });

  return {
    AVER, idOf,
    getLanguageKnowledge, getWordKnowledge, processDialogue, calculateUnderstanding, learnWord, learnFromContext,
    canSpeak, canRead, translateForPlayer,
    speak, learn, guess, knows, canTeach, teach, sense,
  };
})();

if (typeof module !== 'undefined') module.exports = { Lang };

</script>
<script>/* js/play/combat.js */
// 전투 (통합 명세 23절). 공격·방어 버튼이 아니라, 자유 행동의 성공 가능성을 상황이 정한다:
// 위치(지형), 시야(어둠·안개), 소리(비), 몸 상태(체력·피로·출혈), 장비, 상대의 성격과 두려움.
const Combat = (() => {
  const clamp01 = (p) => Math.max(0.02, Math.min(0.98, p));

  // 지금 싸우는 조건
  function mods(S, foe) {
    const { W } = S;
    const me = W.player;
    const loc = me.loc;
    const dark = Time.dark(W.time.t) ? 1 : 0;
    const fog = Weather.hazy(W) ? 1 : 0;
    const rain = Weather.wet(W) ? 1 : 0;
    const hurtR = me.hp / hpMax(me);
    return {
      agi: me.stats.agi - 3, sen: me.stats.sen - 3, str: me.stats.str - 3,
      dark, fog, rain,
      // 몸이 무겁고 다쳤으면 모든 동작이 둔해진다
      body: (me.surv.fatigue >= 85 ? -0.1 : 0) + (hurtR < 0.3 ? -0.1 : 0) + (Player.bleeding(W) ? -0.05 : 0),
      rocks: Places.has(loc, 'rocks'), water: Places.has(loc, 'water'), trees: Places.has(loc, 'trees') || Places.has(loc, 'dense'),
      slope: Places.has(loc, 'slope'),
      foeFear: foe ? (foe.fear || 0) / 100 : 0,
      foeAggro: foe ? (foe.aggression || 60) / 100 : 0.6,
    };
  }

  // 행동별 성공 가능성
  function chance(S, action, foe, extra = {}) {
    const m = mods(S, foe);
    const noticed = extra.noticed !== false;
    switch (action) {
      case 'hit': return clamp01(0.6 + m.agi * 0.05 + m.body - m.dark * 0.15 - m.fog * 0.1 + m.foeFear * 0.2);
      case 'throw': return clamp01(0.5 + m.agi * 0.05 + m.sen * 0.05 + m.body - m.dark * 0.2 - m.fog * 0.15);
      case 'climb': return clamp01(0.55 + m.agi * 0.08 + m.body - (m.rain ? 0.15 : 0));
      case 'hide': return clamp01(0.3 + m.sen * 0.07 + m.agi * 0.07 + (noticed ? 0 : 0.3) + m.dark * 0.15 + m.fog * 0.1 + m.rain * 0.1 + (m.trees ? 0.05 : 0) + m.body);
      case 'flee': return clamp01(0.4 + m.agi * 0.08 + m.body + (m.slope ? -0.05 : 0) + m.foeFear * 0.2);
      case 'sneak': return clamp01(0.8 + m.rain * 0.05 + m.fog * 0.05 + m.body);
      case 'dodge': return clamp01(0.1 + m.agi * 0.08 + m.body);
      // 상대가 반격할 가능성: 사나울수록 높고 겁먹을수록 낮다
      case 'counter': return clamp01(0.55 * (m.foeAggro / 0.7) * (1 - m.foeFear * 0.8));
      default: throw new Error('알 수 없는 전투 행동: ' + action);
    }
  }

  // 손에 쥘 무기 (가장 센 것)
  function weaponOf(me) {
    return Object.keys(me.inv).filter((k) => ITEM_DEFS[k] && ITEM_DEFS[k].properties.weapon)
      .sort((a, b) => ITEM_DEFS[b].properties.weapon.dmg - ITEM_DEFS[a].properties.weapon.dmg
        || (b === 'stone') - (a === 'stone'))[0] || null;
  }

  // 짐승이 겁을 먹는다. 두려움이 차오르면 달아난다.
  function scare(foe, n) { foe.fear = Math.min(100, (foe.fear || 0) + n); return foe.fear >= 80; }

  // 플레이어가 NPC를 공격한다. { hit, dmg, killed }
  function playerVsNpc(S, n, weapon) {
    const { W } = S;
    const m = mods(S, null);
    const dmg = (weapon ? ITEM_DEFS[weapon].properties.weapon.dmg : 0) * 12 + 6 + m.str * 3;
    // 다친 사람은 피하지 못한다
    const evade = n.physical.health >= 25 ? 0.35 + n.personality.bravery / 400 : 0.05;
    const hit = Rng.chance(W, clamp01(0.7 + m.agi * 0.05 + m.body - evade));
    if (hit) {
      if (weapon) Player.wear(W.player, weapon);
      Npc.hurt(S, n, dmg, '이방인에게 공격당했다', 'player');
    }
    return { hit, dmg: hit ? dmg : 0, killed: !n.alive };
  }

  // NPC와 짐승 (보이지 않는 곳에서는 뭉뚱그려 한 번에 계산한다)
  function npcVsCreature(S, n, c, weapon) {
    const { W } = S;
    const dmg = weapon ? ITEM_DEFS[weapon].properties.weapon.dmg : 0;
    if (Rng.chance(W, 0.45 + n.personality.bravery / 400)) {
      c.hp -= Math.max(1, Math.round(dmg / 2));
      if (scare(c, 35) || c.hp <= 0) { c.shy = true; c.loc = 'deepwood'; }
    }
    if (c.alive && !c.shy && Rng.chance(W, 0.4)) Npc.hurt(S, n, 15, '짐승에게 당했다', c.id);
    if (Npc.present(W, n)) W.worldFlags.feed.push(`${Narrative.who(S, n)}${Text.josa(Narrative.who(S, n), '이가')} 무언가와 맞붙는다. 풀숲이 요란하게 흔들린다.`);
  }

  function creatureVsNpc(S, c, n) {
    const { W } = S;
    Npc.injure(S, n, { health: n.physical.health - 20, bleed: Math.max(n.physical.bleed, 1 / 20), shock: 60, kind: 'claw', by: c.id, cause: '짐승에게 습격당했다' });
    if (!n.alive) return;
    Memory.add(S, n, { type: 'attacked_by', subject: c.id });
    Places.addTrace(W, n.location.loc, 'blood');
    WorldEvents.record(S, 'beast_attack', { loc: n.location.loc, actors: [c.id, n.id], data: { subject: c.id, target: n.id } });
    c.hunger = Math.max(0, c.hunger - 40);
    Behavior.interrupt(n);
  }

  return { mods, chance, weaponOf, scare, playerVsNpc, npcVsCreature, creatureVsNpc };
})();

if (typeof module !== 'undefined') module.exports = { Combat };

</script>
<script>/* js/play/magic.js */
// 마법 (통합 명세 25절, 세계관 10·11절). 플레이어는 처음에 마법이 있다는 것조차 모른다. 목록을 보여 주지 않는다.
// 쓸 수 있는가는 마력(mana)·이해도·숙련도·재능·지식·훈련으로 정해진다.
// NPC: n.magic = { mana, maxMana, schools: { life: { understanding, proficiency, talent } } }
// 플레이어: 이해(지식이라 되감아도 남는다) = P.magic.understanding, 마력과 재능(몸) = W.player.magic
const Magic = (() => {
  const SCHOOLS = ['fire', 'water', 'wind', 'earth', 'light', 'dark', 'space', 'time', 'mind', 'life', 'summoning', 'gravity', 'creation'];
  // 기본 속성은 1, 고위 마법은 2~3 (세계관 10절)
  const TIER = { fire: 1, water: 1, wind: 1, earth: 1, light: 1, dark: 1, mind: 2, life: 2, summoning: 2, space: 3, time: 3, gravity: 3, creation: 3 };

  function canCast(n, school, cost) {
    const m = n && n.magic;
    if (!m || m.mana < cost) return false;
    const s = m.schools && m.schools[school];
    if (!s) return false;
    const tier = TIER[school];
    return s.understanding >= 20 * tier && s.proficiency >= 10 * tier && s.talent >= 15 * tier;
  }

  // life: 상처가 아문다 (체력 +15, 출혈 절반)
  function cast(S, n, school, o) {
    const { W } = S;
    if (!canCast(n, school, o.cost)) return false;
    n.magic.mana -= o.cost;
    n.magic.schools[school].proficiency = Math.min(100, n.magic.schools[school].proficiency + 1);
    if (school === 'life') {
      const t = o.target === 'player' ? null : W.npcs[o.target];
      if (t) { t.physical.health = Math.min(t.physical.maxHealth, t.physical.health + 15); t.physical.bleed /= 2; }
      else if (o.target === 'player') Player.heal(W.player, 3);
    }
    const ev = WorldEvents.record(S, 'magic', { loc: n.location.loc, actors: [n.id], data: { subject: n.id, school, target: o.target } });
    // 곁에서 본 플레이어는 그 마법을 조금 이해하게 된다 (지식)
    if (ev.witnesses.includes('player')) observe(S, school, 5);
    return true;
  }

  function observe(S, school, n) {
    const u = S.P.magic.understanding;
    u[school] = Math.min(100, (u[school] || 0) + n);
  }

  // 한 시간마다 마력이 조금 돌아온다
  function regen(S) {
    Object.values(S.W.npcs).forEach((n) => { if (n.magic && n.alive) n.magic.mana = Math.min(n.magic.maxMana, n.magic.mana + 1); });
    const pm = S.W.player.magic;
    pm.mana = Math.min(pm.maxMana, pm.mana + 0.5);
  }

  // 플레이어가 그 계열을 쓸 수 있는 몸과 앎을 갖췄는가 (아직 쓰는 장면은 없다)
  function playerCanCast(S, school, cost) {
    const pm = S.W.player.magic;
    const tier = TIER[school];
    const u = S.P.magic.understanding[school] || 0;
    const prof = (S.W.player.magic.proficiency || {})[school] || 0;
    return pm.mana >= cost && u >= 20 * tier && prof >= 10 * tier && (pm.talent[school] || 0) >= 15 * tier;
  }

  return { SCHOOLS, TIER, canCast, cast, observe, regen, playerCanCast };
})();

if (typeof module !== 'undefined') module.exports = { Magic };

</script>
<script>/* js/play/narrative.js */
// 서술 (통합 명세 12·35절). 시스템의 수치를 문장으로 바꾼다. 숫자는 절대 보여 주지 않는다.
// feed: 플레이어 곁에서 벌어진 일. 행동이 끝난 뒤 화면에 덧붙는다 (W.worldFlags.feed).
const Narrative = (() => {
  const J = (w, t) => w + Text.josa(w, t);
  const feed = (S, line) => { if (!S.W.worldFlags.end) S.W.worldFlags.feed.push(line); };

  // 플레이어가 그 사람을 부르는 말. 이름을 알면 이름, 모르면 겉모습. 리아는 장면과 같이 '그녀'로 부른다.
  function who(S, n, first) {
    if (n.id === 'lia') return '그녀';
    const known = S.P.found.npcs[n.id];
    if (known && known.name) return known.name;
    const d = n.identity.desc;
    return first ? d : d.split(' ').pop();
  }

  // 이번 회차에 아직 마주하지 않은 사람은 만남 장면이 직접 소개한다 (먼저 적으면 등장을 망친다)
  const met = (n) => Memory.has(n, 'player', 'met');

  function feedArrive(S, n) {
    const { W } = S;
    if (!met(n)) return;
    const seen = !!S.P.found.npcs[n.id];
    if (Time.dark(W.time.t)) feed(S, '어둠 속에서 발소리가 다가온다.');
    else if (Places.regionOf(n.location.loc) === 'forest') feed(S, `${J(who(S, n, !seen), '이가')} 나무 사이에서 모습을 드러낸다.`);
    else feed(S, `${J(who(S, n, !seen), '이가')} 저쪽에서 걸어온다.`);
  }

  function feedLeave(S, n) {
    if (!met(n)) return;
    feed(S, Time.dark(S.W.time.t) ? '발소리가 멀어진다.' : `${J(who(S, n), '이가')} 자리를 뜬다.`);
  }

  // NPC가 스스로 하는 일 가운데 눈에 띄는 것만 (같은 일을 한 시간 안에 되풀이해서 적지 않는다)
  const ACT_LINE = {
    eat: (w) => `${J(w, '이가')} 품에서 무언가를 꺼내 씹는다.`,
    drink: (w) => `${J(w, '이가')} 몸을 숙여 물을 마신다.`,
    sleep: (w) => `${J(w, '이가')} 눈을 감는다. 숨소리가 길어진다.`,
    pray: (w) => `${J(w, '이가')} 무릎을 꿇고 무언가를 낮게 중얼거린다.`,
    gather: (w) => `${J(w, '이가')} 허리를 굽혀 풀을 뜯는다.`,
    hide: (w) => `${J(w, '이가')} 몸을 한껏 낮춘다.`,
    flee: (w) => `${J(w, '이가')} 뒷걸음질 치더니, 몸을 돌려 달아난다.`,
    fight: (w) => `${J(w, '이가')} 무기를 고쳐 쥔다.`,
  };
  function feedAction(S, n, type) {
    const { W } = S;
    if (type === 'search') { searchCall(S, n); return; } // 부르는 소리는 보이지 않아도 들린다
    const f = ACT_LINE[type];
    if (!f || !met(n)) return;
    const last = n.flags.narr;
    if (last && last.type === type && W.time.t - last.t < 60) return;
    n.flags.narr = { type, t: W.time.t };
    feed(S, f(who(S, n)));
  }

  // 수색하는 사람은 이름을 부른다
  function searchCall(S, n) {
    const g = Goals.get(n, 'search');
    const tgt = g && S.W.npcs[g.target];
    if (!tgt) return;
    const last = n.flags.narr;
    if (last && last.type === 'search' && S.W.time.t - last.t < 60) return;
    n.flags.narr = { type: 'search', t: S.W.time.t };
    const r = Dialogue.process(S, { speakerId: n.id, listenerId: 'player', dialogueId: 'call_name', vars: { target: tgt.identity.name } });
    feed(S, r.displayText);
    if (r.tone && !r.fullyUnderstood) feed(S, r.tone);
  }

  // 두 사람이 이야기를 나눈다. 곁에 있으면 들린다 (알아듣는 만큼만).
  function feedTalk(S, a, b, told) {
    if (!Npc.present(S.W, a)) return;
    feed(S, `${J(who(S, a), '과와')} ${J(who(S, b), '이가')} 낮은 목소리로 이야기를 나눈다.`);
    if (!told) return;
    const text = Rumor.speech(S.W, told.rumor, told.level);
    if (!text) return;
    const r = Dialogue.process(S, { speakerId: a.id, listenerId: 'player', text });
    feed(S, r.displayText);
    Knowledge.rumor(S, told.rumor.id, told.level);
    // 절반 넘게 알아들었다면 그 이야기는 단서가 된다
    if (r.understanding >= 0.5) Clues.onRumor(S, told.rumor.type);
  }

  function feedHelpPlayer(S, n, item) {
    feed(S, `${J(who(S, n), '이가')} ${item ? '천 조각을 꺼내' : '손을 얹어'} 내 상처를 감싸 준다.`);
  }

  // 관계가 행동으로 드러난다 (12절). 가장 강한 감정 두 가지만.
  function describe(S, n) {
    const r = Rel.peek(S.W, n.id, 'player');
    if (!r) return [];
    const w = who(S, n);
    const armed = Object.keys(n.inventory).some((k) => ITEM_DEFS[k] && ITEM_DEFS[k].category === 'weapon');
    const pool = [
      [r.hostility, 50, `${w}의 눈에 적의가 서려 있다.`],
      [r.fear, 50, `${J(w, '은는')} 거리를 둔 채, 언제든 달아날 수 있게 몸을 비스듬히 하고 있다.`],
      [r.suspicion, 60, armed ? `${J(w, '은는')} 나에게서 눈을 떼지 않는다. 무기를 쥔 손에 힘이 들어가 있다.` : `${J(w, '은는')} 나에게서 눈을 떼지 않는다.`],
      [r.trust, 60, `${J(w, '은는')} 경계를 풀고 가까이 와 있다.`],
      [r.trust, 40, `${J(w, '이가')} 먼저 눈을 맞춘다.`],
      [r.gratitude, 20, `나를 보는 ${w}의 눈이 조금 부드럽다.`],
    ].filter(([v, th]) => v >= th).sort((x, y) => (y[0] - y[1]) - (x[0] - x[1]));
    const out = [];
    const used = new Set();
    for (const [, , line] of pool) { if (!used.has(line.slice(0, 6))) { out.push(line); used.add(line.slice(0, 6)); } if (out.length >= 2) break; }
    return out;
  }

  // 플레이어가 보지 못한 사이에 남은 흔적 (장면 글이 이미 다루는 흔적은 quiet)
  const TRACE_LINE = {
    footprints: '여러 사람의 발자국이 어지럽게 찍혀 있다. 내 것이 아니다.',
    blood: '풀잎에 검붉은 얼룩이 튀어 있다.',
    struggle: '풀이 넓게 짓이겨져 있다. 무언가 뒤엉켜 싸운 자리다.',
    body: '풀숲 사이에 사람의 형체가 쓰러져 있다. ……움직이지 않는다.',
  };
  function traceLines(S, loc) {
    const seen = new Set();
    const out = [];
    Places.traces(S.W, loc).forEach((x) => {
      if (x.quiet || seen.has(x.kind) || !TRACE_LINE[x.kind]) return;
      seen.add(x.kind);
      out.push(TRACE_LINE[x.kind]);
    });
    return out;
  }

  return { who, feedArrive, feedLeave, feedAction, feedTalk, feedHelpPlayer, describe, traceLines };
})();

if (typeof module !== 'undefined') module.exports = { Narrative };

</script>
<script>/* js/play/intent.js */
// 자연어 행동 (통합 명세 34절). 생성형 AI 없이 규칙으로 해석한다.
// 입력 → 의도(동사·대상·방식) → 지금 고를 수 있는 선택지 중 가장 가까운 것.
// 선택지의 문구도 같은 규칙으로 해석하므로, 장면을 쓰는 사람이 따로 키워드를 달지 않아도 된다.
const Intent = (() => {
  // [의도, 어간...] 긴 어간을 먼저 본다
  const VERBS = [
    ['repeat_word', '따라 말', '다시 말', '되뇌', '되뇐', '되풀이', '따라 해'],
    ['follow', '따라가', '따라간', '뒤를 따', '따라나'],
    ['drink', '마시', '마셔', '들이켜'],
    ['eat', '먹'],
    ['give', '건네', '건넨', '주어', '줘', '준다', '주고', '주자', '줄래', '내민', '내밀', '나눠'],
    ['examine', '살펴', '살핀', '조사', '관찰', '둘러', '들여다', '본다', '보자', '볼래', '확인', '지켜'],
    ['approach', '다가'],
    ['attack', '공격', '때리', '때린', '찌르', '찌른', '덤비', '덤빈', '내리친', '내리쳐', '죽이', '죽인', '베어', '벤다'],
    ['flee', '도망', '달아나', '달아난', '뛰어가'],
    ['hide', '숨는', '숨어', '숨을래', '숨자', '숨긴', '몸을 숨'],
    ['rest', '쉬', '쉰', '앉', '눕', '잔다', '자자', '잠을'],
    ['wait', '기다'],
    ['listen', '듣', '귀 기울', '귀를'],
    ['speak', '말을 걸', '말 걸', '말해', '말한', '부르', '불러', '외치', '묻', '물어'],
    ['move', '간다', '가자', '갈래', '가 본', '이동', '올라', '내려', '돌아가', '돌아간', '향한', '들어간', '나간', '들어선'],
    ['take', '줍', '꺾', '딴다', '따자', '뜯', '챙기', '챙긴', '집어', '집는'],
    ['threaten', '위협', '겁주', '협박', '노려'],
    ['leave', '떠나', '떠난', '지나간', '지나가', '두고'],
    ['draw', '뽑', '꺼내', '쥐', '움켜'],
    ['treat', '치료', '대어', '감싸', '싸매', '짓이겨'],
    ['show', '보여', '펴 보'],
    ['stop', '멈춰', '멈춘', '멈추'],
    ['climb', '올라가', '기어오'],
    ['throw', '던지', '던진', '던져'],
  ];
  const TARGETS = {
    lia: ['그녀', '리아', '여자'], water: ['물', '개울'], tree: ['나무', '고목', '가지'], rock: ['바위', '돌'],
    herb: ['풀', '약초', '잎'], berry: ['열매'], sound: ['소리'], hands: ['손'], wound: ['상처', '다친'],
    light: ['빛'], word: ['말', '단어'], name: ['이름'], body: ['몸'],
  };
  const MANNERS = { careful: ['조심', '천천히', '살금', '살며시', '살살'], quick: ['빨리', '급히', '재빨리', '힘껏'] };
  const NEGATE = /(지 ?않|지 ?말|안 |말고|못 )/;

  // 받침 없는 어간은 활용하면 끝 글자에 ㄴ·ㄹ·ㅂ 받침이 붙는다: 마시 → 마신다, 마실래, 마십니다
  function variants(stem) {
    const last = stem.charCodeAt(stem.length - 1);
    if (last < 0xac00 || last > 0xd7a3 || (last - 0xac00) % 28 !== 0) return [stem];
    const head = stem.slice(0, -1);
    return [stem, ...[4, 8, 17].map((j) => head + String.fromCharCode(last + j))];
  }
  const STEMS = VERBS.map(([v, ...stems]) => [v, [...new Set(stems.flatMap(variants))]]);

  function parse(text) {
    const s = String(text).replace(/[.!?,]/g, ' ');
    const verbs = new Set(), negated = new Set(), targets = new Set();
    // "뽑지만 공격하지 않는다" → 절마다 따로 본다
    s.split(/지만|는데|면서|하고 |고 /).forEach((clause) => {
      const neg = NEGATE.test(clause);
      STEMS.forEach(([v, stems]) => { if (stems.some((x) => clause.includes(x))) (neg ? negated : verbs).add(v); });
    });
    if (verbs.has('repeat_word')) verbs.delete('speak');
    if (verbs.has('follow')) verbs.delete('move');
    if (verbs.has('climb')) verbs.delete('move');
    Object.entries(TARGETS).forEach(([t, words]) => { if (words.some((w) => s.includes(w))) targets.add(t); });
    const manner = Object.keys(MANNERS).find((m) => MANNERS[m].some((w) => s.includes(w))) || null;
    return { verbs, negated, targets, manner };
  }

  const cache = new Map();
  function parseLabel(label) {
    if (!cache.has(label)) cache.set(label, parse(label));
    return cache.get(label);
  }

  // 가장 가까운 선택지. { option, manner, score } 또는 null
  function match(opts, text) {
    const I = parse(text);
    let best = null;
    opts.forEach((o) => {
      if (o.disabled) return;
      const L = parseLabel(o.label);
      let score = 0;
      I.verbs.forEach((v) => { if (L.verbs.has(v)) score += 4; });
      I.negated.forEach((v) => { if (L.verbs.has(v)) score -= 6; });
      I.targets.forEach((t) => { if (L.targets.has(t)) score += 2; });
      // 장면이 달아 둔 키워드도 그대로 쓴다 (예전 방식)
      (o.kw || []).forEach((k) => { if (text.includes(k)) score += k.length * 2; });
      if (o.label.includes(text.trim()) || text.includes(o.label)) score += 3;
      if (!best || score > best.score) best = { option: o, score, manner: I.manner };
    });
    return best && best.score >= 2 ? best : null;
  }

  return { parse, match };
})();

if (typeof module !== 'undefined') module.exports = { Intent };

</script>
<script>/* js/play/explore.js */
// 탐험 (통합 명세 20절). 장소는 모름 → 멀리서 봄 → 가 봄 → 살펴봄 → 잘 앎 으로 드러난다.
// 지도는 발견한 만큼만 보여 준다.
const Explore = (() => {
  // 사실을 알면 장소도 알게 된다
  const FACT_PLACES = { girl_hollow: ['hollow', 'known'], smoke: ['edge', 'seen'], broken_branch: ['deep', 'explored'] };

  // 갈 수 있는 길이 보이면 그 끝을 "멀리서 봤다"
  function seeExits(S, exits) { exits.forEach((e) => Knowledge.location(S, e.to, 'seen')); }

  // 그 장소에서 해 본 일. 절반 넘게 해 봤으면 "살폈다"
  function didAction(S, loc, id) {
    const { W } = S;
    const done = W.worldFlags.done[loc] = W.worldFlags.done[loc] || {};
    done[id] = true;
    const total = (LOCS[loc] && LOCS[loc].actions.length) || 1;
    if (Object.keys(done).length >= Math.ceil(total / 2)) Knowledge.location(S, loc, 'explored');
  }

  function onFact(S, id) {
    const f = FACT_PLACES[id];
    if (f) Knowledge.location(S, f[0], f[1]);
  }

  // 알고 있는 장소 (숲 안, 플레이어가 갈 수 있는 곳만)
  function mapLines(S) {
    return Object.keys(LOCS).filter((k) => Knowledge.locState(S.P, k) !== 'unknown')
      .map((k) => ({ t: `· ${LOCS[k].name} — ${Knowledge.KO[Knowledge.locState(S.P, k)]}`, cls: 'note' }));
  }

  return { FACT_PLACES, seeExits, didAction, onFact, mapLines };
})();

if (typeof module !== 'undefined') module.exports = { Explore };

</script>
<script>/* js/play/encounter.js */
// 누군가와 마주친다 (리아의 첫 장면이 아닌 모든 만남). 장면 글이 따로 없는 사람도 세계 상태에 맞춰 반응한다.
// NPC의 태도는 관계(소문으로 들은 인상 포함)·성격·기억·지금 하는 일에서 나온다 (통합 명세 12·35절).
const Encounter = (() => {
  const K = (t) => ({ t, cls: 'know' });
  const J = (w, t) => w + Text.josa(w, t);
  const armed = (n) => Object.keys(n.inventory).some((k) => ITEM_DEFS[k] && ITEM_DEFS[k].category === 'weapon');
  const GIFTS = ['bread', 'dried_meat', 'waterskin', 'bandage', 'herb', 'berry'];

  // NPC의 첫마디: 무엇을 하던 중이었는지, 나를 어떻게 여기는지에 따라
  function opening(S, n) {
    const r = Rel.get(S.W, n.id, 'player');
    const search = Goals.get(n, 'search');
    if (search) return { id: 'ask_seen', vars: { target: S.W.npcs[search.target].identity.name } };
    if (r.hostility >= 50) return { id: 'go_away' };
    if (r.trust >= 40 && Player.bleeding(S.W)) return { id: 'are_you_ok' };
    if (r.trust >= 40) return { id: 'greet_warm' };
    // 지키는 사람이거나 나를 크게 의심하면 따져 묻고, 아니면 말을 건다
    if (n.identity.occupation === 'guard' || r.suspicion >= 60) return { id: 'challenge' };
    return { id: 'greet' };
  }

  function speak(S, n, d) {
    const r = Dialogue.process(S, { speakerId: n.id, listenerId: 'player', dialogueId: d.id, vars: d.vars });
    return r.tone && !r.fullyUnderstood ? [r.displayText, r.tone] : [r.displayText];
  }

  const ACTIVITY = {
    search: '무언가를 찾는 듯 사방을 두리번거린다.', gather: '허리를 굽혀 풀숲을 뒤지고 있다.', rest: '나무에 기대어 숨을 고르고 있다.',
    sleep: '웅크린 채 잠들어 있다.', flee: '무언가에 쫓기듯 서두르고 있다.', hide: '몸을 낮추고 있다.',
  };

  // 상대가 먼저 움직인다: 적의가 크고 용감하면 덤비고, 두려우면 달아난다
  function theirMove(S, n, out) {
    const r = Rel.get(S.W, n.id, 'player');
    const w = Narrative.who(S, n);
    if (r.hostility >= 60 && n.personality.bravery >= 50 && armed(n) && n.physical.health > 30) {
      Player.hurt(S, 3, `${w}에게 공격당했다`, n.id);
      Player.injure(S, 'stab', 30);
      out.push('', `${J(w, '이가')} 무기를 휘두른다. 피할 틈이 없다.`, '뜨거운 것이 옆구리를 가른다.');
      return true;
    }
    if (r.fear >= 60 && n.personality.bravery < 60) {
      Behavior.force(S, n, 'flee');
      S.W.worldFlags.feed.length = 0;
      out.push('', `${J(w, '이가')} 뒷걸음질 치더니, 몸을 돌려 달아난다.`);
      return true;
    }
    return false;
  }

  async function run(ui, id) {
    const { S, W, P, me } = ui;
    const n = W.npcs[id];
    ui.talker = id;
    const first = !Memory.has(n, 'player', 'met');
    Social.meet(S, id);
    const who = () => Narrative.who(S, n);
    const lines = [id === 'lia' ? '그녀다.' : `${J(first ? n.identity.desc : who(), '이가')} 있다.`];
    const act = n.currentAction && ACTIVITY[n.currentAction.type];
    if (act) lines.push(act);
    lines.push('', `${J(who(), '이가')} 나를 본다.`, ...speak(S, n, opening(S, n)), ...Narrative.describe(S, n));
    await ui.page(lines);

    while (true) {
      if (!n.alive || !Npc.present(W, n)) return 'ok';
      const r = Rel.get(W, id, 'player');
      const search = Goals.get(n, 'search');
      const weapon = Combat.weaponOf(me);
      const gift = GIFTS.find((k) => me.inv[k]);
      const word = LangKnowledge.heardWords(S, Lang.AVER).find((x) => x.confidence >= LangKnowledge.GUESS);
      const opts = [
        { id: 'look', label: '가만히 살펴본다' },
        { id: 'near', label: '다가간다' },
        { id: 'hands', label: '두 손을 펴 보인다' },
        { id: 'talk', label: '말을 걸어 본다' },
      ];
      if (word) opts.push({ id: 'say', label: '들은 말을 되풀이해 본다' });
      if (search && P.knowledge.girl_hollow) opts.push({ id: 'point', label: '움푹한 곳이 있는 쪽을 가리킨다', hint: '안다' });
      if (gift) opts.push({ id: 'give', label: `${J(Player.label(gift, P), '을를')} 내민다` });
      if (Companion.canAsk(S, n)) opts.push({ id: 'ask', label: '함께 가자고 손짓한다' });
      opts.push({ id: 'threat', label: '주먹을 쥐고 위협한다' });
      opts.push({ id: 'attack', label: weapon ? `${J(ITEM_DEFS[weapon].name, '을를')} 치켜들고 달려든다` : '달려든다' });
      opts.push({ id: 'leave', label: '물러선다', sep: true });
      const { idx, manner } = await ui.choose(opts);
      const a = opts[idx].id;
      const w = who();
      let out = [], min = 5;

      if (a === 'look') {
        const d = Narrative.describe(S, n);
        out = [`${J(w, '을를')} 가만히 살핀다.`, armed(n) ? '손에 무기를 쥐고 있다.' : '무기는 보이지 않는다.', ...(d.length ? d : ['무슨 생각을 하는지 알 수 없는 얼굴이다.'])];
      } else if (a === 'near') {
        if (r.suspicion >= 50 || r.fear >= 50) {
          if (n.personality.bravery >= 50 && armed(n)) {
            ui.relate(id, { suspicion: manner === 'careful' ? 2 : 6 }, 'approached');
            out = ['한 걸음 다가선다.', `${J(w, '이가')} 무기 끝을 나에게 겨눈다.`, ...speak(S, n, { id: 'challenge' })];
          } else {
            ui.relate(id, { fear: manner === 'careful' ? 3 : 8 }, 'approached');
            out = ['한 걸음 다가선다.', `${J(w, '이가')} 그만큼 물러선다.`];
          }
        } else {
          ui.relate(id, { familiarity: 3 }, 'approached');
          out = ['천천히 다가간다.', `${J(w, '은는')} 물러서지 않는다.`];
        }
      } else if (a === 'hands') {
        ui.relate(id, { suspicion: -10, fear: -5 }, 'showed_hands');
        out = ['두 손을 펴 보인다. 아무것도 들지 않았다는 것을.', r.suspicion >= 60 ? `${J(w, '은는')} 여전히 나를 노려본다. 그래도 조금은 누그러진 것 같다.` : `${J(w, '이가')} 작게 고개를 끄덕인다.`];
      } else if (a === 'talk') {
        Memory.add(S, n, { type: 'strange', subject: 'player', detail: 'unknown_language' });
        if (r.trust < 30) ui.relate(id, { suspicion: 3 }, 'strange_words');
        out = ['「저기요……」', '', `${J(w, '이가')} 얼굴을 찌푸린다.`, '「……?」', '', '말이 통하지 않는다.'];
      } else if (a === 'say') {
        const res = Dialogue.playerSays(S, id, word.id);
        const snd = LangRegistry.sound(word.id, word.id);
        out = ['들은 소리를 흉내 내어 본다.', `「${snd}.」`, ''];
        out.push(...(res.success ? [`${J(w, '이가')} 눈을 크게 뜬다.`, `「……${snd}?」`, K('……알아들었다.')] : [`${J(w, '이가')} 고개를 갸웃한다.`]));
      } else if (a === 'point') {
        // 말이 없어도 손짓은 통한다
        search.plan.splice(search.idx, 0, 'hollow');
        ui.relate(id, { trust: 8, suspicion: -8 }, 'pointed');
        out = ['숲 안쪽, 뿌리가 엉킨 움푹한 곳이 있는 쪽을 가리킨다.', `${J(w, '이가')} 내 손끝을 따라 그쪽을 본다.`, '잠시 망설이더니, 그쪽으로 발을 옮긴다.'];
        Behavior.interrupt(n);
      } else if (a === 'give') {
        if (gift === 'berry') {
          ui.relate(id, { suspicion: 5 }, 'berry');
          out = ['붉은 열매를 내민다.', `${J(w, '이가')} 질색하며 손사래를 친다.`, ui.speak('「[[독:15]]!」', id)];
          if (ui.learn('독')) out.push(K('……"독". 먹으면 안 된다는 말이다.'));
        } else {
          Player.take(me, gift);
          n.inventory[gift] = (n.inventory[gift] || 0) + 1;
          Social.help(S, 'player', id, 'gift', { trust: 6, suspicion: -6, affection: 2 });
          out = [`${J(Player.label(gift, P), '을를')} 내민다.`, `${J(w, '이가')} 머뭇거리다가 받아 든다.`, ...speak(S, n, { id: 'thanks' })];
        }
      } else if (a === 'ask') {
        out = ['나와 저편을 번갈아 가리키며, 함께 가자고 손짓한다.', ...Companion.ask(S, n)];
      } else if (a === 'threat') {
        Social.threaten(S, 'player', id);
        out = ['주먹을 쥐고 한 걸음 내딛는다.'];
        if (!theirMove(S, n, out)) out.push(`${J(w, '이가')} 무기를 고쳐 쥔다. 물러설 기색이 없다.`);
      } else if (a === 'attack') {
        ui.use('str');
        Social.attack(S, 'player', id, { weapon });
        const res = Combat.playerVsNpc(S, n, weapon);
        out = [weapon ? `${J(ITEM_DEFS[weapon].name, '을를')} 치켜들고 달려든다.` : '달려든다.', ''];
        if (!res.hit) out.push(`${J(w, '이가')} 몸을 비튼다. 허공을 가른다.`);
        else if (res.killed) out.push('……둔한 소리.', `${J(w, '이가')} 쓰러진다.`, '', '움직이지 않는다.');
        else out.push(`손에 둔한 감촉이 전해진다. ${J(w, '이가')} 비틀거린다.`);
        if (n.alive) theirMove(S, n, out);
        min = 5;
      } else if (a === 'leave') {
        n.flags.metAt = W.time.t;
        await ui.page(['눈을 피하고 물러선다.', `${J(w, '은는')} 나를 한동안 지켜보다가, 제 할 일로 돌아간다.`]);
        await ui.more();
        return 'ok';
      }

      W.worldFlags.feed.length = 0;
      out.push(...ui.pass(min, a === 'attack' ? { fight: true } : {}));
      if (me.hp <= 0) { await ui.page([...out, '', '눈앞이 어두워진다.']); await ui.more(); return 'die'; }
      if (n.alive && Npc.present(W, n)) out.push('', ...Narrative.describe(S, n));
      else if (n.alive) out.push('', `${J(w, '은는')} 이제 보이지 않는다.`);
      await ui.page(out);
      if (!n.alive || !Npc.present(W, n)) { n.flags.metAt = W.time.t; await ui.more(); return 'ok'; }
    }
  }

  return { run, opening };
})();

if (typeof module !== 'undefined') module.exports = { Encounter };

</script>
<script>/* js/play/collapse.js */
// 쓰러짐 (스토리_재설계.md 11절 A안 [임시]). 체력이 0이 되어도 죽지 않는다. 쓰러지고, 구조되거나 깨어나며, 대가가 남는다.
// 대가: 흐른 시간(그동안 세계는 움직인다), 남은 상처, 잃은 소지품, 구해 준 사람에게 진 빚.
// 수치는 data/rules.js의 RULES.collapse. 판단만 여기서 하고, 화면 연출은 engine.js가 한다.
const Collapse = (() => {
  // 곁이나 바로 이웃한 곳에 있는 사람 가운데, 나를 적대하지 않고 믿거나 착한 사람
  function findRescuer(S) {
    const { W } = S;
    const C = RULES.collapse.rescuer;
    const loc = W.player.loc;
    const near = [loc, ...Places.neighbors(loc)];
    let best = null;
    Object.values(W.npcs).forEach((n) => {
      if (!n.alive || n.location.transit || !near.includes(n.location.loc)) return;
      const r = Rel.get(W, n.id, 'player');
      if (r.hostility > C.maxHostility || r.fear >= 60) return;
      if (r.trust < C.minTrust && n.personality.kindness < C.minKindness) return;
      const score = r.trust + n.personality.kindness * 0.5 + (n.location.loc === loc ? 20 : 0);
      if (!best || score > best.score) best = { n, score };
    });
    return best ? best.n : null;
  }

  // 쓰러진다. 결과: { rescuer, minutes, lost, again, lines(그사이 지나간 이야기 시계) }
  function resolve(S, cause) {
    const { W, P } = S;
    const me = W.player;
    const C = RULES.collapse;
    P.collapses = (P.collapses || 0) + 1;
    const again = me.lastCollapse != null && W.time.t - me.lastCollapse < C.repeatWindow;
    me.lastCollapse = W.time.t;
    const loc = me.loc;
    Bus.emit(S, 'PLAYER_COLLAPSED', { cause: cause || null, loc, again });
    const n = findRescuer(S);
    let minutes, hpRatio, lost = null;
    if (n) {
      minutes = C.rescuedMin;
      hpRatio = C.rescuedHp;
      if (n.location.loc !== loc) Npc.place(S, n, loc);
      n.flags.caring = W.time.t + minutes; // 깨어날 때까지 곁을 지킨다
      Player.treat(S);
      Memory.add(S, n, { type: 'rescued', subject: 'player', detail: cause || null });
      Rel.change(S, n.id, 'player', { familiarity: 10, affection: 3 }, 'rescued', true);
      me.debts.push({ npcId: n.id, kind: 'rescue', t: W.time.t, repaid: false });
      WorldEvents.record(S, 'rescued_player', { loc, actors: [n.id, 'player'], witnesses: [n.id],
        data: { subject: 'player', target: n.id, cause: cause || null } });
      Bus.emit(S, 'PLAYER_RESCUED', { npcId: n.id, loc });
    } else {
      const [a, b] = C.aloneMin;
      minutes = Math.round(Rng.between(W, a, b));
      hpRatio = C.aloneHp;
      const items = Object.keys(me.inv).filter((k) => me.inv[k] > 0);
      if (items.length && Rng.chance(W, C.lossChanceAlone)) { lost = Rng.pick(W, items); Player.take(me, lost); }
    }
    if (again) minutes += C.repeatExtra;
    // 정신을 잃은 동안에도 세계는 흐른다. 그사이 벌어진 이야기 시계(해 질 녘 등)는 깨어난 뒤 짧게 알린다.
    const lines = [];
    let left = minutes;
    while (left > 0) {
      const r = World.tick(S, left, { sleep: true, unconscious: true });
      lines.push(...r.lines);
      left -= r.spent;
      // 정신을 잃은 사람에게는 밤의 목소리가 닿지 않는다
      const call = W.worldFlags.pending.indexOf('call');
      if (call >= 0) W.worldFlags.pending.splice(call, 1);
      if (r.spent <= 0) break;
    }
    W.worldFlags.feed.length = 0;
    me.hp = Math.max(me.hp, Math.ceil(hpMax(me) * hpRatio));
    return { rescuer: n, minutes, lost, again, lines };
  }

  return { findRescuer, resolve };
})();

if (typeof module !== 'undefined') module.exports = { Collapse };

</script>
<script>/* js/play/work.js */
